name: Original offline results
on: [push, pull_request]
jobs:
  original-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[analysis]'
      - run: python scripts/reproduce_submission_results.py --mode original
