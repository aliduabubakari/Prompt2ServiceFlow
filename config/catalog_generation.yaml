catalog:
  version: "0.1.0"
  owner: Prompt2ServiceFlow

generation:
  run_id: gpt55-catalog-v001
  run_root: runs/catalog_generation
  model: gpt-5.5
  reasoning_effort: medium
  reasoning_summary: auto
  verbosity: low
  # Includes both hidden reasoning and visible structured JSON.
  max_output_tokens: 30000
  # GPT-5.5 does not support temperature. Set a number only for a model that does.
  temperature: null
  timeout_seconds: 900
  store: false

  # Recommended research default: construct from the development corpus first.
  # Add "validation" only for an explicitly documented all-60 catalogue build.
  splits:
    - main
