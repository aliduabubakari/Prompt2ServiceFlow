    to: manual_adjudication
  - from: route_claim
    to: auto_approve_claim
  - from: manual_adjudication
    to: write_settlement_summary
  - from: auto_approve_claim
    to: write_settlement_summary
  parallel_groups: []
  branches:
  - branch_id: claim_risk_route
    decision_intent: route_claim
    decision_artifact: claim_route_decision
    cases:
    - case_id: high_risk
      condition: claim_route_decision.route == manual_adjudication
      next_intents:
      - manual_adjudication
    - case_id: low_risk
      condition: claim_route_decision.route == auto_approve_claim
      next_intents:
      - auto_approve_claim
    merge_intent: write_settlement_summary
