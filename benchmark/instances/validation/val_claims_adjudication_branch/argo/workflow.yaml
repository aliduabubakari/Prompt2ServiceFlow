apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-claims-adjudication-branch-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-claims-adjudication-branch
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-claims-adjudication-branch-scripts
  - name: fixtures
    configMap:
      name: val-claims-adjudication-branch-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-claims
        template: run-ingest-claims
      - name: score-claim-risk
        template: run-score-claim-risk
        depends: ingest-claims.Succeeded
      - name: route-claim
        template: run-route-claim
        depends: score-claim-risk.Succeeded
      - name: manual-adjudication
        template: run-manual-adjudication
        depends: route-claim.Succeeded
      - name: auto-approve-claim
        template: run-auto-approve-claim
        depends: route-claim.Succeeded
      - name: write-settlement-summary
        template: run-write-settlement-summary
        depends: manual-adjudication.Succeeded && auto-approve-claim.Succeeded
  - name: run-ingest-claims
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_claims
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_claims.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-score-claim-risk
    metadata:
      annotations:
        prompt2serviceflow/intent-id: score_claim_risk
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_score_claim_risk.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-route-claim
    metadata:
      annotations:
        prompt2serviceflow/intent-id: route_claim
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_route_claim.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-manual-adjudication
    metadata:
      annotations:
        prompt2serviceflow/intent-id: manual_adjudication
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/04_manual_adjudication.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-auto-approve-claim
    metadata:
      annotations:
        prompt2serviceflow/intent-id: auto_approve_claim
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/05_auto_approve_claim.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-write-settlement-summary
    metadata:
      annotations:
        prompt2serviceflow/intent-id: write_settlement_summary
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/06_write_settlement_summary.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
