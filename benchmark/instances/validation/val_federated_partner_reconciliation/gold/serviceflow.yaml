control_flow:
  edges:
  - from: wait_for_partner_extracts
    to: ingest_partner_a
  - from: wait_for_partner_extracts
    to: ingest_partner_b
  - from: wait_for_partner_extracts
    to: ingest_partner_c
  - from: ingest_partner_a
    to: standardize_records
  - from: ingest_partner_b
    to: standardize_records
  - from: ingest_partner_c
    to: standardize_records
  - from: standardize_records
    to: match_entities
  - from: match_entities
    to: route_discrepancies
  - from: route_discrepancies
    to: publish_clean_records
  - from: route_discrepancies
    to: open_review_cases
  - from: publish_clean_records
    to: write_reconciliation_audit
  - from: open_review_cases
    to: write_reconciliation_audit
  parallel_groups:
  - group_id: partner_ingestion
    intent_ids:
    - ingest_partner_a
    - ingest_partner_b
    - ingest_partner_c
  branches:
  - branch_id: discrepancy_route
    decision_intent: route_discrepancies
    decision_artifact: discrepancy_route
    cases:
    - case_id: matched
      condition: discrepancy_route.route == publish_clean_records
      next_intents:
      - publish_clean_records
    - case_id: unresolved
      condition: discrepancy_route.route == open_review_cases
      next_intents:
      - open_review_cases
    merge_intent: write_reconciliation_audit
  gates:
  - gate_id: partner_extract_gate
    sensor_intent: wait_for_partner_extracts
    condition: all_partner_files_arrived == true
    gated_intents:
    - ingest_partner_a
    - ingest_partner_b
    - ingest_partner_c
    - standardize_records
    - match_entities
