apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-federated-partner-reconciliation-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-federated-partner-reconciliation-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-federated-partner-reconciliation-nominal-scripts
  - name: fixtures
    configMap:
      name: val-federated-partner-reconciliation-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: wait-for-partner-extracts
        template: run-wait-for-partner-extracts
      - name: ingest-partner-a
        template: run-ingest-partner-a
        depends: wait-for-partner-extracts.Succeeded
      - name: ingest-partner-b
        template: run-ingest-partner-b
        depends: wait-for-partner-extracts.Succeeded
      - name: ingest-partner-c
        template: run-ingest-partner-c
        depends: wait-for-partner-extracts.Succeeded
      - name: standardize-records
        template: run-standardize-records
        depends: ingest-partner-a.Succeeded && ingest-partner-b.Succeeded && ingest-partner-c.Succeeded
      - name: match-entities
        template: run-match-entities
        depends: standardize-records.Succeeded
      - name: route-discrepancies
        template: run-route-discrepancies
        depends: match-entities.Succeeded
      - name: publish-clean-records
        template: run-publish-clean-records
        depends: route-discrepancies.Succeeded
      - name: open-review-cases
        template: run-open-review-cases
        depends: route-discrepancies.Succeeded
      - name: write-reconciliation-audit
        template: run-write-reconciliation-audit
        depends: publish-clean-records.Succeeded && open-review-cases.Succeeded
  - name: run-wait-for-partner-extracts
    metadata:
      annotations:
        prompt2serviceflow/intent-id: wait_for_partner_extracts
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_wait_for_partner_extracts.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-ingest-partner-a
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_partner_a
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_ingest_partner_a.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-ingest-partner-b
