---
apiVersion: v1
kind: ConfigMap
metadata:
  name: val-iot-sensor-fusion-nominal-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "id,value,status\r\nR1,100,active\r\nR2,200,pending\r\nR3,50,active\r\nR4,300,expired\r\
    \n"
  fixture-0001: "{\n  \"pipeline_id\": \"val_iot_sensor_fusion\",\n  \"inputs\": {\n    \"data_csv\":\
    \ \"data.csv\"\n  },\n  \"input_modalities\": [\n    \"jsonl\",\n    \"table\"\n  ],\n  \"systems\"\
    : [\n    \"a\",\n    \"b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-iot-sensor-fusion-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
