apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-iot-sensor-fusion-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-iot-sensor-fusion-nominal-scripts
    - name: fixtures
      configMap:
        name: val-iot-sensor-fusion-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: collect-temperature-feed
          template: run-collect-temperature-feed
        - name: collect-vibration-feed
          template: run-collect-vibration-feed
        - name: collect-pressure-feed
          template: run-collect-pressure-feed
        - name: align-sensor-windows
          template: run-align-sensor-windows
          depends: collect-temperature-feed.Succeeded && collect-vibration-feed.Succeeded && collect-pressure-feed.Succeeded
        - name: compute-anomaly-features
          template: run-compute-anomaly-features
          depends: align-sensor-windows.Succeeded
        - name: write-fused-dataset
          template: run-write-fused-dataset
          depends: compute-anomaly-features.Succeeded
    - name: run-collect-temperature-feed
      metadata:
        annotations:
          prompt2serviceflow/intent-id: collect_temperature_feed
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_collect_temperature_feed.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-collect-vibration-feed
      metadata:
        annotations:
          prompt2serviceflow/intent-id: collect_vibration_feed
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_collect_vibration_feed.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-collect-pressure-feed
      metadata:
        annotations:
          prompt2serviceflow/intent-id: collect_pressure_feed
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_collect_pressure_feed.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-align-sensor-windows
      metadata:
        annotations:
          prompt2serviceflow/intent-id: align_sensor_windows
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_align_sensor_windows.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-compute-anomaly-features
      metadata:
        annotations:
          prompt2serviceflow/intent-id: compute_anomaly_features
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/05_compute_anomaly_features.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-write-fused-dataset
      metadata:
        annotations:
          prompt2serviceflow/intent-id: write_fused_dataset
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/06_write_fused_dataset.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
