---
apiVersion: v1
kind: ConfigMap
metadata:
  name: val-customer-profile-refresh-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "id,value,status\r\nR1,100,active\r\nR2,200,pending\r\nR3,50,active\r\nR4,300,expired\r\
    \n"
  fixture-0001: "{\n  \"pipeline_id\": \"val_customer_profile_refresh\",\n  \"inputs\": {\n    \"data_csv\"\
    : \"data.csv\"\n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\n  ],\n  \"systems\"\
    : [\n    \"a\",\n    \"b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-customer-profile-refresh-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-customer-profile-refresh
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-customer-profile-refresh-scripts
  - name: fixtures
    configMap:
      name: val-customer-profile-refresh-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: extract-crm-records
        template: run-extract-crm-records
      - name: normalize-profile-fields
        template: run-normalize-profile-fields
        depends: extract-crm-records.Succeeded
      - name: deduplicate-customers
        template: run-deduplicate-customers
        depends: normalize-profile-fields.Succeeded
      - name: load-profile-table
        template: run-load-profile-table
        depends: deduplicate-customers.Succeeded
      - name: emit-refresh-summary
        template: run-emit-refresh-summary
        depends: load-profile-table.Succeeded
  - name: run-extract-crm-records
    metadata:
      annotations:
        prompt2serviceflow/intent-id: extract_crm_records
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_extract_crm_records.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-normalize-profile-fields
    metadata:
      annotations:
        prompt2serviceflow/intent-id: normalize_profile_fields
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_normalize_profile_fields.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-deduplicate-customers
    metadata:
      annotations:
        prompt2serviceflow/intent-id: deduplicate_customers
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_deduplicate_customers.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-load-profile-table
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_profile_table
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/04_load_profile_table.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
