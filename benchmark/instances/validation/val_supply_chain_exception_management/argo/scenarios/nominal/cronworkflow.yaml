apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-supply-chain-exception-management-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-supply-chain-exception-management-nominal-scripts
    - name: fixtures
      configMap:
        name: val-supply-chain-exception-management-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: wait-for-supplier-feeds
          template: run-wait-for-supplier-feeds
        - name: ingest-inventory
          template: run-ingest-inventory
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-shipments
          template: run-ingest-shipments
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-weather-alerts
          template: run-ingest-weather-alerts
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-supplier-capacity
          template: run-ingest-supplier-capacity
          depends: wait-for-supplier-feeds.Succeeded
        - name: harmonize-supply-state
          template: run-harmonize-supply-state
          depends: ingest-inventory.Succeeded && ingest-shipments.Succeeded && ingest-weather-alerts.Succeeded
            && ingest-supplier-capacity.Succeeded
        - name: detect-disruption-risk
          template: run-detect-disruption-risk
          depends: harmonize-supply-state.Succeeded
        - name: route-exception-severity
          template: run-route-exception-severity
          depends: detect-disruption-risk.Succeeded
        - name: generate-response-plan
          template: run-generate-response-plan
          depends: route-exception-severity.Succeeded
        - name: publish-operations-dashboard
          template: run-publish-operations-dashboard
          depends: route-exception-severity.Succeeded
        - name: notify-regional-teams
          template: run-notify-regional-teams
          depends: generate-response-plan.Succeeded
        - name: archive-exception-snapshot
          template: run-archive-exception-snapshot
          depends: publish-operations-dashboard.Succeeded
    - name: run-wait-for-supplier-feeds
      metadata:
        annotations:
          prompt2serviceflow/intent-id: wait_for_supplier_feeds
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_wait_for_supplier_feeds.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-ingest-inventory
      metadata:
        annotations:
          prompt2serviceflow/intent-id: ingest_inventory
      container:
        image: python:3.12-slim
