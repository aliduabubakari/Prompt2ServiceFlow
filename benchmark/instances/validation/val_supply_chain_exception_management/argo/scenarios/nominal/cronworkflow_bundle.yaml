---
apiVersion: v1
kind: ConfigMap
metadata:
  name: val-supply-chain-exception-management-nominal-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "id,value,status\r\nR1,100,active\r\nR2,200,pending\r\nR3,50,active\r\nR4,300,expired\r\
    \n"
  fixture-0001: "{\n  \"pipeline_id\": \"val_supply_chain_exception_management\",\n  \"inputs\": {\n \
    \   \"data_csv\": \"data.csv\"\n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\n  ],\n\
    \  \"systems\": [\n    \"a\",\n    \"b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-supply-chain-exception-management-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-supply-chain-exception-management-nominal-scripts
    - name: fixtures
      configMap:
        name: val-supply-chain-exception-management-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: wait-for-supplier-feeds
          template: run-wait-for-supplier-feeds
        - name: ingest-inventory
          template: run-ingest-inventory
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-shipments
          template: run-ingest-shipments
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-weather-alerts
          template: run-ingest-weather-alerts
          depends: wait-for-supplier-feeds.Succeeded
        - name: ingest-supplier-capacity
          template: run-ingest-supplier-capacity
          depends: wait-for-supplier-feeds.Succeeded
        - name: harmonize-supply-state
