control_flow:
  edges:
  - from: wait_for_supplier_feeds
    to: ingest_inventory
  - from: wait_for_supplier_feeds
    to: ingest_shipments
  - from: wait_for_supplier_feeds
    to: ingest_weather_alerts
  - from: wait_for_supplier_feeds
    to: ingest_supplier_capacity
  - from: ingest_inventory
    to: harmonize_supply_state
  - from: ingest_shipments
    to: harmonize_supply_state
  - from: ingest_weather_alerts
    to: harmonize_supply_state
  - from: ingest_supplier_capacity
    to: harmonize_supply_state
  - from: harmonize_supply_state
    to: detect_disruption_risk
  - from: detect_disruption_risk
    to: route_exception_severity
  - from: route_exception_severity
    to: generate_response_plan
  - from: route_exception_severity
    to: publish_operations_dashboard
  - from: generate_response_plan
    to: notify_regional_teams
  - from: publish_operations_dashboard
    to: archive_exception_snapshot
  parallel_groups:
  - group_id: supply_feed_ingestion
    intent_ids:
    - ingest_inventory
    - ingest_shipments
    - ingest_weather_alerts
    - ingest_supplier_capacity
  branches:
  - branch_id: exception_severity_route
    decision_intent: route_exception_severity
    decision_artifact: severity_route
    cases:
    - case_id: normal
      condition: severity_route.route == publish_operations_dashboard
      next_intents:
      - publish_operations_dashboard
    - case_id: severe
      condition: severity_route.route == generate_response_plan
      next_intents:
      - generate_response_plan
  gates:
  - gate_id: supplier_feed_gate
    sensor_intent: wait_for_supplier_feeds
    condition: minimum_feed_count_met == true
    gated_intents:
    - ingest_inventory
    - ingest_shipments
    - ingest_weather_alerts
    - ingest_supplier_capacity
