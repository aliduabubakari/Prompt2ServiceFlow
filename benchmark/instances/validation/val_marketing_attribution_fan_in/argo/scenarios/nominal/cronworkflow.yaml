apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-marketing-attribution-fan-in-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-marketing-attribution-fan-in-nominal-scripts
    - name: fixtures
      configMap:
        name: val-marketing-attribution-fan-in-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: extract-impressions
          template: run-extract-impressions
        - name: extract-clicks
          template: run-extract-clicks
        - name: extract-purchases
          template: run-extract-purchases
        - name: join-customer-events
          template: run-join-customer-events
          depends: extract-impressions.Succeeded && extract-clicks.Succeeded && extract-purchases.Succeeded
        - name: compute-attribution
          template: run-compute-attribution
          depends: join-customer-events.Succeeded
        - name: publish-attribution-table
          template: run-publish-attribution-table
          depends: compute-attribution.Succeeded
        - name: send-campaign-summary
          template: run-send-campaign-summary
          depends: publish-attribution-table.Succeeded
    - name: run-extract-impressions
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_impressions
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_extract_impressions.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-extract-clicks
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_clicks
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_extract_clicks.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-extract-purchases
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_purchases
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_extract_purchases.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-join-customer-events
      metadata:
        annotations:
          prompt2serviceflow/intent-id: join_customer_events
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_join_customer_events.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-compute-attribution
      metadata:
        annotations:
          prompt2serviceflow/intent-id: compute_attribution
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/05_compute_attribution.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-publish-attribution-table
      metadata:
        annotations:
          prompt2serviceflow/intent-id: publish_attribution_table
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/06_publish_attribution_table.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-send-campaign-summary
      metadata:
        annotations:
          prompt2serviceflow/intent-id: send_campaign_summary
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/07_send_campaign_summary.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
