  generateName: val-marketing-attribution-fan-in-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-marketing-attribution-fan-in
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-marketing-attribution-fan-in-scripts
  - name: fixtures
