control_flow:
  edges:
  - from: wait_for_stream_checkpoint
    to: load_stream_events
  - from: wait_for_stream_checkpoint
    to: load_batch_settlements
  - from: load_stream_events
    to: join_transaction_context
  - from: load_batch_settlements
    to: join_transaction_context
  - from: load_account_history
    to: join_transaction_context
  - from: join_transaction_context
    to: score_fraud_risk
  - from: score_fraud_risk
    to: route_risk_action
  - from: route_risk_action
    to: update_monitoring_table
  - from: route_risk_action
    to: open_investigation_case
  - from: update_monitoring_table
    to: publish_risk_metrics
  parallel_groups:
  - group_id: fraud_source_loads
    intent_ids:
    - load_stream_events
    - load_batch_settlements
    - load_account_history
  branches:
  - branch_id: fraud_risk_route
    decision_intent: route_risk_action
    decision_artifact: risk_action
    cases:
    - case_id: low_risk
      condition: risk_action.route == update_monitoring_table
      next_intents:
      - update_monitoring_table
    - case_id: high_risk
      condition: risk_action.route == open_investigation_case
      next_intents:
      - open_investigation_case
  gates:
  - gate_id: stream_checkpoint_gate
    sensor_intent: wait_for_stream_checkpoint
    condition: checkpoint_committed == true
    gated_intents:
    - load_stream_events
    - load_batch_settlements
