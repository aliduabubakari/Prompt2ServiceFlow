apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-stream-batch-fraud-bridge-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-stream-batch-fraud-bridge-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-stream-batch-fraud-bridge-nominal-scripts
  - name: fixtures
    configMap:
      name: val-stream-batch-fraud-bridge-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: wait-for-stream-checkpoint
        template: run-wait-for-stream-checkpoint
      - name: load-stream-events
        template: run-load-stream-events
        depends: wait-for-stream-checkpoint.Succeeded
      - name: load-batch-settlements
        template: run-load-batch-settlements
        depends: wait-for-stream-checkpoint.Succeeded
      - name: load-account-history
        template: run-load-account-history
      - name: join-transaction-context
        template: run-join-transaction-context
        depends: load-stream-events.Succeeded && load-batch-settlements.Succeeded && load-account-history.Succeeded
      - name: score-fraud-risk
        template: run-score-fraud-risk
        depends: join-transaction-context.Succeeded
      - name: route-risk-action
        template: run-route-risk-action
        depends: score-fraud-risk.Succeeded
      - name: update-monitoring-table
        template: run-update-monitoring-table
        depends: route-risk-action.Succeeded
      - name: open-investigation-case
        template: run-open-investigation-case
        depends: route-risk-action.Succeeded
      - name: publish-risk-metrics
        template: run-publish-risk-metrics
        depends: update-monitoring-table.Succeeded
  - name: run-wait-for-stream-checkpoint
    metadata:
      annotations:
        prompt2serviceflow/intent-id: wait_for_stream_checkpoint
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_wait_for_stream_checkpoint.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-load-stream-events
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_stream_events
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_load_stream_events.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-load-batch-settlements
