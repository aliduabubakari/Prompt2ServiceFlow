apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-region-sales-fanout-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-region-sales-fanout-nominal-scripts
    - name: fixtures
      configMap:
        name: val-region-sales-fanout-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: extract-global-sales
          template: run-extract-global-sales
        - name: publish-na-sales
          template: run-publish-na-sales
          depends: extract-global-sales.Succeeded
        - name: publish-eu-sales
          template: run-publish-eu-sales
          depends: extract-global-sales.Succeeded
        - name: publish-apac-sales
          template: run-publish-apac-sales
          depends: extract-global-sales.Succeeded
    - name: run-extract-global-sales
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_global_sales
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_extract_global_sales.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-publish-na-sales
      metadata:
        annotations:
          prompt2serviceflow/intent-id: publish_na_sales
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_publish_na_sales.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-publish-eu-sales
      metadata:
        annotations:
          prompt2serviceflow/intent-id: publish_eu_sales
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_publish_eu_sales.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-publish-apac-sales
      metadata:
        annotations:
          prompt2serviceflow/intent-id: publish_apac_sales
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_publish_apac_sales.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
