control_flow:
  edges:
  - from: profile_customer_extract
    to: evaluate_quality_rules
  - from: evaluate_quality_rules
    to: load_valid_records
  - from: evaluate_quality_rules
    to: quarantine_invalid_records
  - from: load_valid_records
    to: write_quality_audit
  - from: quarantine_invalid_records
    to: write_quality_audit
  parallel_groups: []
  branches:
  - branch_id: quality_route
    decision_intent: evaluate_quality_rules
    decision_artifact: quality_decision
    cases:
    - case_id: quality_pass
      condition: quality_decision.route == load_valid_records
      next_intents:
      - load_valid_records
    - case_id: quality_fail
      condition: quality_decision.route == quarantine_invalid_records
      next_intents:
      - quarantine_invalid_records
    merge_intent: write_quality_audit
  gates:
  - gate_id: quality_score_gate
    sensor_intent: evaluate_quality_rules
    condition: quality_score_available == true
    gated_intents:
    - load_valid_records
    - quarantine_invalid_records
    - write_quality_audit
