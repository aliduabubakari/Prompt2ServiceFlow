---
apiVersion: v1
kind: ConfigMap
metadata:
  name: val-data-quality-quarantine-gate-nominal-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "id,value,status\r\nR1,100,active\r\nR2,200,pending\r\nR3,50,active\r\nR4,300,expired\r\
    \n"
  fixture-0001: "{\n  \"pipeline_id\": \"val_data_quality_quarantine_gate\",\n  \"inputs\": {\n    \"\
    data_csv\": \"data.csv\"\n  },\n  \"input_modalities\": [\n    \"table\",\n    \"json\"\n  ],\n  \"\
    systems\": [\n    \"a\",\n    \"b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: val-data-quality-quarantine-gate-nominal
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: val-data-quality-quarantine-gate-nominal-scripts
    - name: fixtures
      configMap:
        name: val-data-quality-quarantine-gate-nominal-fixtures
        items:
        - key: fixture-0000
          path: data.csv
        - key: fixture-0001
          path: fixture.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: profile-customer-extract
          template: run-profile-customer-extract
        - name: evaluate-quality-rules
          template: run-evaluate-quality-rules
          depends: profile-customer-extract.Succeeded
        - name: load-valid-records
          template: run-load-valid-records
          depends: evaluate-quality-rules.Succeeded
        - name: quarantine-invalid-records
          template: run-quarantine-invalid-records
          depends: evaluate-quality-rules.Succeeded
        - name: write-quality-audit
          template: run-write-quality-audit
          depends: load-valid-records.Succeeded && quarantine-invalid-records.Succeeded
    - name: run-profile-customer-extract
      metadata:
        annotations:
          prompt2serviceflow/intent-id: profile_customer_extract
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_profile_customer_extract.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-evaluate-quality-rules
      metadata:
        annotations:
          prompt2serviceflow/intent-id: evaluate_quality_rules
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_evaluate_quality_rules.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-load-valid-records
      metadata:
        annotations:
          prompt2serviceflow/intent-id: load_valid_records
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_load_valid_records.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-quarantine-invalid-records
      metadata:
        annotations:
          prompt2serviceflow/intent-id: quarantine_invalid_records
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_quarantine_invalid_records.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/fixture.json
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
