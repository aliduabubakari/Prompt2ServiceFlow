apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-file-arrival-ingest-gate-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-file-arrival-ingest-gate
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-file-arrival-ingest-gate-scripts
  - name: fixtures
    configMap:
      name: val-file-arrival-ingest-gate-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: wait-for-partner-file
        template: run-wait-for-partner-file
      - name: validate-file-checksum
        template: run-validate-file-checksum
        depends: wait-for-partner-file.Succeeded
      - name: load-file-to-staging
        template: run-load-file-to-staging
        depends: validate-file-checksum.Succeeded
  - name: run-wait-for-partner-file
    metadata:
      annotations:
        prompt2serviceflow/intent-id: wait_for_partner_file
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_wait_for_partner_file.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-file-checksum
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_file_checksum
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_file_checksum.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-load-file-to-staging
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_file_to_staging
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_load_file_to_staging.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
