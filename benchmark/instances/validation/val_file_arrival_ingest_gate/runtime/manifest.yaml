runtime_manifest_version: 0.1.0
pipeline_id: val_file_arrival_ingest_gate
image: python:3.12-slim
workflow_parameters: []
tasks:
- intent_id: wait_for_partner_file
  script: scripts/01_wait_for_partner_file.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: validate_file_checksum
  script: scripts/02_validate_file_checksum.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  dependencies:
  - wait_for_partner_file
- intent_id: load_file_to_staging
  script: scripts/03_load_file_to_staging.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  dependencies:
  - validate_file_checksum
scenarios:
- name: nominal
  parameters: {}
  fixture_root: fixtures/scenarios/nominal
cron:
  schedule: 0 0 * * *
  timezone: UTC
