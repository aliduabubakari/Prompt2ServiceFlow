    to: route_alert_level
  - from: route_alert_level
    to: publish_dashboard
  - from: route_alert_level
    to: send_escalation_alert
  parallel_groups:
  - group_id: hospital_feed_extraction
    intent_ids:
    - extract_admissions
    - extract_bed_status
    - extract_staffing_roster
    - extract_discharge_forecast
  branches:
  - branch_id: capacity_alert_route
    decision_intent: route_alert_level
    decision_artifact: alert_route
    cases:
    - case_id: normal
      condition: alert_route.level == normal
      next_intents:
      - publish_dashboard
    - case_id: critical
      condition: alert_route.level == critical
      next_intents:
      - send_escalation_alert
  gates:
  - gate_id: census_snapshot_gate
    sensor_intent: wait_for_census_snapshot
    condition: census_snapshot_ready == true
    gated_intents:
    - extract_admissions
    - extract_bed_status
    - extract_staffing_roster
    - extract_discharge_forecast
