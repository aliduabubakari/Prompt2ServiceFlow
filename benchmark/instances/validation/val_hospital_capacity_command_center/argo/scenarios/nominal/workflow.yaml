apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-hospital-capacity-command-center-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-hospital-capacity-command-center-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-hospital-capacity-command-center-nominal-scripts
  - name: fixtures
    configMap:
      name: val-hospital-capacity-command-center-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: wait-for-census-snapshot
        template: run-wait-for-census-snapshot
      - name: extract-admissions
        template: run-extract-admissions
        depends: wait-for-census-snapshot.Succeeded
      - name: extract-bed-status
        template: run-extract-bed-status
        depends: wait-for-census-snapshot.Succeeded
      - name: extract-staffing-roster
        template: run-extract-staffing-roster
        depends: wait-for-census-snapshot.Succeeded
      - name: extract-discharge-forecast
        template: run-extract-discharge-forecast
        depends: wait-for-census-snapshot.Succeeded
      - name: merge-operational-state
        template: run-merge-operational-state
        depends: extract-admissions.Succeeded && extract-bed-status.Succeeded && extract-staffing-roster.Succeeded
          && extract-discharge-forecast.Succeeded
      - name: compute-capacity-risk
        template: run-compute-capacity-risk
        depends: merge-operational-state.Succeeded
      - name: route-alert-level
        template: run-route-alert-level
        depends: compute-capacity-risk.Succeeded
      - name: publish-dashboard
        template: run-publish-dashboard
        depends: route-alert-level.Succeeded
      - name: send-escalation-alert
        template: run-send-escalation-alert
        depends: route-alert-level.Succeeded
  - name: run-wait-for-census-snapshot
    metadata:
      annotations:
        prompt2serviceflow/intent-id: wait_for_census_snapshot
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_wait_for_census_snapshot.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-extract-admissions
    metadata:
      annotations:
        prompt2serviceflow/intent-id: extract_admissions
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_extract_admissions.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-extract-bed-status
