apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-financial-risk-stress-testing-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-financial-risk-stress-testing-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-financial-risk-stress-testing-nominal-scripts
  - name: fixtures
    configMap:
      name: val-financial-risk-stress-testing-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: load-market-scenarios
        template: run-load-market-scenarios
      - name: load-portfolio-positions
        template: run-load-portfolio-positions
      - name: run-credit-stress
        template: run-run-credit-stress
        depends: load-market-scenarios.Succeeded && load-portfolio-positions.Succeeded
      - name: run-liquidity-stress
        template: run-run-liquidity-stress
        depends: load-market-scenarios.Succeeded && load-portfolio-positions.Succeeded
      - name: run-market-stress
        template: run-run-market-stress
        depends: load-market-scenarios.Succeeded && load-portfolio-positions.Succeeded
      - name: aggregate-stress-results
        template: run-aggregate-stress-results
        depends: run-credit-stress.Succeeded && run-liquidity-stress.Succeeded && run-market-stress.Succeeded
      - name: validate-capital-thresholds
        template: run-validate-capital-thresholds
        depends: aggregate-stress-results.Succeeded
      - name: route-validation-status
        template: run-route-validation-status
        depends: validate-capital-thresholds.Succeeded
      - name: write-regulatory-report
        template: run-write-regulatory-report
        depends: route-validation-status.Succeeded
      - name: open-remediation-ticket
        template: run-open-remediation-ticket
        depends: route-validation-status.Succeeded
      - name: archive-model-inputs
        template: run-archive-model-inputs
        depends: write-regulatory-report.Succeeded
  - name: run-load-market-scenarios
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_market_scenarios
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_load_market_scenarios.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-load-portfolio-positions
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_portfolio_positions
    container:
      image: python:3.12-slim
      command:
