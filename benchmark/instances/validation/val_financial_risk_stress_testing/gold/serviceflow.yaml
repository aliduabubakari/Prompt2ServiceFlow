control_flow:
  edges:
  - from: load_market_scenarios
    to: run_credit_stress
  - from: load_market_scenarios
    to: run_liquidity_stress
  - from: load_market_scenarios
    to: run_market_stress
  - from: load_portfolio_positions
    to: run_credit_stress
  - from: load_portfolio_positions
    to: run_liquidity_stress
  - from: load_portfolio_positions
    to: run_market_stress
  - from: run_credit_stress
    to: aggregate_stress_results
  - from: run_liquidity_stress
    to: aggregate_stress_results
  - from: run_market_stress
    to: aggregate_stress_results
  - from: aggregate_stress_results
    to: validate_capital_thresholds
  - from: validate_capital_thresholds
    to: route_validation_status
  - from: route_validation_status
    to: write_regulatory_report
  - from: route_validation_status
    to: open_remediation_ticket
  - from: write_regulatory_report
    to: archive_model_inputs
  parallel_groups:
  - group_id: stress_calculations
    intent_ids:
    - run_credit_stress
    - run_liquidity_stress
    - run_market_stress
  branches:
  - branch_id: risk_validation_route
    decision_intent: route_validation_status
    decision_artifact: validation_route
    cases:
    - case_id: within_threshold
      condition: validation_route.route == write_regulatory_report
      next_intents:
      - write_regulatory_report
    - case_id: breach_detected
      condition: validation_route.route == open_remediation_ticket
      next_intents:
      - open_remediation_ticket
  gates:
  - gate_id: stress_results_gate
    sensor_intent: validate_capital_thresholds
    condition: all_stress_results_available == true
    gated_intents:
    - route_validation_status
    - write_regulatory_report
    - open_remediation_ticket
