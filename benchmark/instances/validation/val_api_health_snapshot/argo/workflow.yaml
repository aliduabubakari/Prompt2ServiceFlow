apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: val-api-health-snapshot-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: val-api-health-snapshot
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: val-api-health-snapshot-scripts
  - name: fixtures
    configMap:
      name: val-api-health-snapshot-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: poll-partner-api
        template: run-poll-partner-api
      - name: normalize-status-payload
        template: run-normalize-status-payload
        depends: poll-partner-api.Succeeded
      - name: store-health-snapshot
        template: run-store-health-snapshot
        depends: normalize-status-payload.Succeeded
  - name: run-poll-partner-api
    metadata:
      annotations:
        prompt2serviceflow/intent-id: poll_partner_api
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_poll_partner_api.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-normalize-status-payload
    metadata:
      annotations:
        prompt2serviceflow/intent-id: normalize_status_payload
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_normalize_status_payload.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-store-health-snapshot
    metadata:
      annotations:
        prompt2serviceflow/intent-id: store_health_snapshot
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_store_health_snapshot.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
