runtime_manifest_version: 0.1.0
pipeline_id: healthcare_claims_etl
image: python:3.12-slim
workflow_parameters:
- name: claims-fixture
  default: claims.csv
- name: providers-fixture
  default: providers.csv
tasks:
- intent_id: extract_claims
  script: scripts/01_extract_claims.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/{claims-fixture}'
  retries: 2
- intent_id: extract_providers
  script: scripts/02_extract_providers.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/{providers-fixture}'
  retries: 2
- intent_id: transform_join
  script: scripts/03_transform_join.py
  dependencies:
  - extract_claims
  - extract_providers
  arguments:
  - --workspace
  - '{workspace}'
  retries: 2
- intent_id: load_warehouse
  script: scripts/04_load_warehouse.py
  dependencies:
  - transform_join
  arguments:
  - --workspace
  - '{workspace}'
  retries: 2
- intent_id: refresh_bi
  script: scripts/05_refresh_bi.py
  dependencies:
  - transform_join
  arguments:
  - --workspace
  - '{workspace}'
  retries: 2
scenarios:
- name: claims_etl_pipeline
  parameters:
    claims-fixture: claims.csv
    providers-fixture: providers.csv
  fixture_root: fixtures/scenarios/nominal
cron:
  schedule: 0 0 * * *
  timezone: UTC
