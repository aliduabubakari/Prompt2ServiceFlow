apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-claims-etl-scripts
  namespace: prompt2serviceflow
data:
  01_extract_claims.py: "#!/usr/bin/env python3\n\"\"\"Load claims CSV fixture and emit structured tabular\
    \ dataset.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport json\n\
    import shutil\nfrom pathlib import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    artifacts.mkdir(parents=True, exist_ok=True)\n    dest = artifacts / \"claims.csv\"\
    \n    shutil.copyfile(args.fixture, dest)\n\n    with dest.open(encoding=\"utf-8\", newline=\"\")\
    \ as f:\n        reader = csv.DictReader(f)\n        rows = list(reader)\n        columns = reader.fieldnames\
    \ or []\n\n    dataset = {\"columns\": columns, \"rows\": rows}\n    (artifacts / \"claims_dataset.json\"\
    ).write_text(\n        json.dumps(dataset, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    status\
    \ = {\"success\": True, \"rows_loaded\": len(rows), \"errors\": []}\n    (artifacts / \"claims_load_status.json\"\
    ).write_text(\n        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__\
    \ == \"__main__\":\n    main()\n"
  02_extract_providers.py: "#!/usr/bin/env python3\n\"\"\"Load providers CSV fixture and emit structured\
    \ tabular dataset.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport\
    \ json\nimport shutil\nfrom pathlib import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    artifacts.mkdir(parents=True, exist_ok=True)\n    dest = artifacts / \"providers.csv\"\
    \n    shutil.copyfile(args.fixture, dest)\n\n    with dest.open(encoding=\"utf-8\", newline=\"\")\
    \ as f:\n        reader = csv.DictReader(f)\n        rows = list(reader)\n        columns = reader.fieldnames\
    \ or []\n\n    dataset = {\"columns\": columns, \"rows\": rows}\n    (artifacts / \"providers_dataset.json\"\
    ).write_text(\n        json.dumps(dataset, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    status\
    \ = {\"success\": True, \"rows_loaded\": len(rows), \"errors\": []}\n    (artifacts / \"providers_load_status.json\"\
    ).write_text(\n        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__\
    \ == \"__main__\":\n    main()\n"
  03_transform_join.py: "#!/usr/bin/env python3\n\"\"\"Join claims and providers, pseudonymize patient\
    \ IDs, compute risk scores.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport\
    \ hashlib\nimport json\nfrom pathlib import Path\n\n\ndef pseudonymize(value: str) -> str:\n    return\
    \ hashlib.sha256(value.encode()).hexdigest()[:12]\n\n\ndef compute_risk(amount: float, procedure:\
    \ str) -> float:\n    procedure_risk = {\"PROC_A\": 0.3, \"PROC_B\": 0.7, \"PROC_C\": 0.5}\n    pr\
    \ = procedure_risk.get(procedure, 0.5)\n    amount_norm = min(float(amount) / 5000.0, 1.0)\n    return\
    \ round(0.5 * amount_norm + 0.5 * pr, 4)\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \n    artifacts = args.workspace / \"artifacts\"\n    claims = json.loads((artifacts / \"claims_dataset.json\"\
    ).read_text(encoding=\"utf-8\"))\n    providers = json.loads((artifacts / \"providers_dataset.json\"\
    ).read_text(encoding=\"utf-8\"))\n\n    prov_map = {r[\"provider_id\"]: r for r in providers[\"rows\"\
    ]}\n    joined_rows = []\n    for claim in claims[\"rows\"]:\n        prov = prov_map.get(claim[\"\
    provider_id\"], {})\n        joined = {\n            \"claim_id\": claim[\"claim_id\"],\n        \
    \    \"patient_id\": pseudonymize(claim[\"patient_id\"]),\n            \"provider_id\": claim[\"provider_id\"\
    ],\n            \"provider_name\": prov.get(\"provider_name\", \"\"),\n            \"specialty\":\
    \ prov.get(\"specialty\", \"\"),\n            \"procedure_code\": claim[\"procedure_code\"],\n   \
    \         \"amount\": float(claim[\"amount\"]),\n            \"risk_score\": compute_risk(float(claim[\"\
    amount\"]), claim[\"procedure_code\"]),\n            \"date_of_service\": claim[\"date_of_service\"\
    ],\n        }\n        joined_rows.append(joined)\n\n    columns = [\n        \"claim_id\", \"patient_id\"\
    , \"provider_id\", \"provider_name\", \"specialty\",\n        \"procedure_code\", \"amount\", \"risk_score\"\
    , \"date_of_service\",\n    ]\n    output = {\"columns\": columns, \"rows\": joined_rows}\n    (artifacts\
    \ / \"transformed_healthcare_dataset.json\").write_text(\n        json.dumps(output, indent=2) + \"\
    \\n\", encoding=\"utf-8\"\n    )\n    status = {\n        \"success\": True,\n        \"rows_joined\"\
    : len(joined_rows),\n        \"anonymization_applied\": True,\n        \"errors\": [],\n    }\n  \
    \  (artifacts / \"transform_status.json\").write_text(\n        json.dumps(status, indent=2) + \"\\\
    n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  04_load_warehouse.py: "#!/usr/bin/env python3\n\"\"\"Mock load transformed dataset to analytics warehouse.\"\
    \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\
    \n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    transformed = json.loads(\n        (artifacts / \"transformed_healthcare_dataset.json\"\
    ).read_text(encoding=\"utf-8\")\n    )\n\n    warehouse = args.workspace / \"mock_warehouse\"\n  \
    \  warehouse.mkdir(parents=True, exist_ok=True)\n    (warehouse / \"claims_fact.json\").write_text(\n\
    \        json.dumps(transformed[\"rows\"], indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    provider_ids\
    \ = list({r[\"provider_id\"] for r in transformed[\"rows\"]})\n    (warehouse / \"providers_dim.json\"\
    ).write_text(\n        json.dumps([{\"provider_id\": pid} for pid in provider_ids], indent=2) + \"\
    \\n\",\n        encoding=\"utf-8\",\n    )\n\n    loaded_tables = {\n        \"tables\": [\n     \
    \       {\"name\": \"healthcare_analytics.claims_fact\", \"rows\": len(transformed[\"rows\"])},\n\
    \            {\"name\": \"healthcare_analytics.providers_dim\", \"rows\": len(provider_ids)},\n  \
    \      ]\n    }\n    (artifacts / \"loaded_tables.json\").write_text(\n        json.dumps(loaded_tables,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    status = {\"success\": True, \"tables_loaded\"\
    : 2, \"errors\": []}\n    (artifacts / \"warehouse_load_status.json\").write_text(\n        json.dumps(status,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  05_refresh_bi.py: "#!/usr/bin/env python3\n\"\"\"Mock BI dashboard refresh trigger.\"\"\"\n\nfrom __future__\
    \ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\n\ndef main() ->\
    \ None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\", type=Path,\
    \ required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"artifacts\"\
    \n\n    notification = {\n        \"refresh_triggered\": True,\n        \"target\": \"healthcare_claims_overview\"\
    ,\n        \"message\": \"BI dashboard refresh initiated for healthcare_claims_overview\",\n    }\n\
    \    (artifacts / \"refresh_notification.json\").write_text(\n        json.dumps(notification, indent=2)\
    \ + \"\\n\", encoding=\"utf-8\"\n    )\n    status = {\"success\": True, \"refresh_attempted\": True,\
    \ \"errors\": []}\n    (artifacts / \"refresh_status.json\").write_text(\n        json.dumps(status,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: healthcare-claims-etl-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: '{"driver":"filesystem-mock","tool":"tableau","target":"artifacts/refresh_notification.json"}'
  fixture-0001: 'claim_id,patient_id,provider_id,procedure_code,amount,date_of_service

    CLM001,PAT001,PROV001,PROC_A,1500.00,2024-01-10

    CLM002,PAT002,PROV002,PROC_B,3200.50,2024-01-11

    CLM003,PAT003,PROV001,PROC_C,875.25,2024-01-12

    '
  fixture-0002: "{\n  \"pipeline_id\": \"healthcare_claims_etl\",\n  \"inputs\": {\n    \"providers\"\
    : \"providers.csv\",\n    \"bi_service\": \"bi_service.json\",\n    \"claims\": \"claims.csv\",\n\
    \    \"warehouse_resource\": \"warehouse_resource.json\"\n  },\n  \"input_modalities\": [\n    \"\
    json\",\n    \"table\"\n  ],\n  \"systems\": [\n    \"system_a\",\n    \"system_b\"\n  ]\n}"
  fixture-0003: 'provider_id,provider_name,specialty,location

    PROV001,Dr. Smith,Cardiology,"New York, NY"

    PROV002,Dr. Jones,Orthopedics,"Boston, MA"

    PROV003,Dr. Lee,Neurology,"San Francisco, CA"

    '
  fixture-0004: '{"driver":"filesystem-mock","engine":"postgresql","target":"workspace/mock_warehouse"}'
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: healthcare-claims-etl
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters:
      - name: claims-fixture
        value: claims.csv
      - name: providers-fixture
        value: providers.csv
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: healthcare-claims-etl-scripts
    - name: fixtures
      configMap:
        name: healthcare-claims-etl-fixtures
        items:
        - key: fixture-0000
          path: bi_service.json
        - key: fixture-0001
          path: claims.csv
        - key: fixture-0002
          path: fixture.json
        - key: fixture-0003
          path: providers.csv
        - key: fixture-0004
          path: warehouse_resource.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: extract-claims
          template: run-extract-claims
        - name: extract-providers
          template: run-extract-providers
        - name: transform-join
          template: run-transform-join
          depends: extract-claims.Succeeded && extract-providers.Succeeded
        - name: load-warehouse
          template: run-load-warehouse
          depends: transform-join.Succeeded
        - name: refresh-bi
          template: run-refresh-bi
          depends: transform-join.Succeeded
    - name: run-extract-claims
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_claims
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_extract_claims.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/{{workflow.parameters.claims-fixture}}
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-extract-providers
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_providers
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_extract_providers.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/{{workflow.parameters.providers-fixture}}
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-transform-join
      metadata:
        annotations:
          prompt2serviceflow/intent-id: transform_join
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_transform_join.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-load-warehouse
      metadata:
        annotations:
          prompt2serviceflow/intent-id: load_warehouse
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_load_warehouse.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-refresh-bi
      metadata:
        annotations:
          prompt2serviceflow/intent-id: refresh_bi
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/05_refresh_bi.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
