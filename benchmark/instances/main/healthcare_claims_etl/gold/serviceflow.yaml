ir_version: 0.1.0
composition_id: healthcare_claims_etl
catalog_snapshot:
  catalog_id: serviceflow_catalog
  version: 0.1.0
  sha256: 63d07e926aeec225afd19db687e36b630a39fab5d7950a747b37ef46d2bed446
source:
  dataset_id: zenodo_pipeline_descriptions
  dataset_version: v1.0.0
  benchmark_id: main:healthcare_claims_etl
  split: main
  pipeline_id: healthcare_claims_etl
  description_path: source/zenodo_v1_0_0/descriptions/main_40/37_healthcare_claims_etl.txt
  description_sha256: 21243b89f1bf1d44d3e314bc226ecbde6f9b1c7dcc668af58216a62c11292653
  internal_spec_path: source/internal_specs/main_40/37_healthcare_claims_etl.json
  internal_spec_sha256: 06df6d25e70bb588a0325df6886c4ac0f80ec58f560832b232175d1be541415b
requirement:
  name: Healthcare Claims ETL Pipeline
  purpose: Extract patient claims and provider data, join and anonymize, compute risk scores, load to
    analytics warehouse, and trigger BI dashboard refresh.
  domain: healthcare
  execution_model: batch
  topology: staged_etl
  information_sufficiency: high
  notes:
  - Extract phase runs claims and providers in parallel.
  - Load phase runs warehouse loading and BI refresh in parallel.
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
external_systems:
- system_id: source_filesystem
  type: filesystem
  name: Source filesystem
  identifier: /data
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: analytics_warehouse
  type: database
  name: Analytics warehouse
  identifier: healthcare_analytics
  access_mode: write
  authentication: secret
  mock_strategy: fixture
- system_id: bi_platform
  type: cloud_service
  name: BI tools
  identifier: tableau
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
service_intents:
- intent_id: extract_claims
  name: Extract claims data
  category: Extractor
  capability: Parse the claims CSV with validated columns and emit a structured tabular dataset.
  source_step_refs:
  - extract_claims
  evidence:
  - source: description
    text: Extract patient claims data from CSV file.
  inputs:
  - claims_csv
  outputs:
  - claims_dataset
  - claims_load_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - A readable claims CSV with expected columns is available.
  effects:
  - A structured claims dataset and load status are emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - pii
    - confidential
  decomposition_rationale: The source step extracts claims from a delimited file.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: extract_providers
  name: Extract providers data
  category: Extractor
  capability: Parse the providers CSV with validated columns and emit a structured tabular dataset.
  source_step_refs:
  - extract_providers
  evidence:
  - source: description
    text: Extract provider data from CSV file.
  inputs:
  - providers_csv
  outputs:
  - providers_dataset
  - providers_load_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - A readable providers CSV with expected columns is available.
  effects:
  - A structured providers dataset and load status are emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step extracts providers from a delimited file.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: transform_join
  name: Join, anonymize, and score
  category: PrivacyService
  capability: Join claims and providers on provider_id, pseudonymize patient identifiers, and compute
    risk scores.
  source_step_refs:
  - transform_join
  evidence:
  - source: description
    text: Join claims and providers data, anonymize PII, calculate risk scores.
  inputs:
  - claims_dataset
  - providers_dataset
  outputs:
  - transformed_healthcare_dataset
  - transform_status
  external_system_refs: []
  preconditions:
  - Both claims and providers datasets are available.
  effects:
  - A joined, anonymized, and risk-scored dataset is emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - pii
    - confidential
    - internal
  decomposition_rationale: The source step performs a healthcare-specific join- anonymize-risk pipeline.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: load_warehouse
  name: Load to analytics warehouse
  category: Loader
  capability: Load the transformed healthcare dataset into the analytics warehouse fact and dimension
    tables.
  source_step_refs:
  - load_warehouse
  evidence:
  - source: description
    text: Load transformed data to analytics warehouse.
  inputs:
  - transformed_healthcare_dataset
  - warehouse_resource
  outputs:
  - loaded_tables
  - warehouse_load_status
  external_system_refs:
  - analytics_warehouse
  preconditions:
  - The transformed dataset and warehouse connection are available.
  effects:
  - Loaded table references and load status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: The source step loads the transformed dataset into an analytics warehouse.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: refresh_bi
  name: Trigger BI dashboard refresh
  category: Publisher
  capability: Trigger a BI dashboard refresh using the bound BI service resource.
  source_step_refs:
  - refresh_bi
  evidence:
  - source: description
    text: Trigger BI dashboard refresh.
  inputs:
  - bi_service_resource
  outputs:
  - refresh_notification
  - refresh_status
  external_system_refs:
  - bi_platform
  preconditions:
  - The BI service resource is available.
  effects:
  - A refresh notification and status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: optional
    idempotency: not_required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step triggers a BI dashboard refresh.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: extract_claims
    to: transform_join
  - from: extract_providers
    to: transform_join
  - from: transform_join
    to: load_warehouse
  - from: transform_join
    to: refresh_bi
  parallel_groups:
  - group_id: extract_phase
    intent_ids:
    - extract_claims
    - extract_providers
  - group_id: load_phase
    intent_ids:
    - load_warehouse
    - refresh_bi
  branches: []
  gates: []
