  data_type: csv
  media_type: text/csv
  role: input
  producer: null
  consumers:
  - extract_providers
  sensitivity: internal
  persistence: external
  fixture_ref: fixtures/inputs/providers.csv
  external_system_ref: source_filesystem
- artifact_id: claims_dataset
  name: Claims dataset
  kind: artifact
