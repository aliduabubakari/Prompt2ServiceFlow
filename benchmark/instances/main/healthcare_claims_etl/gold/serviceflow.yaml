bindings:
- intent_id: extract_claims
  service_id: delimited_file_tabular_dataset_loader
  service_version: 1.0.0
  input_bindings:
  - port: delimited_file
    artifact_id: claims_csv
  output_bindings:
  - port: tabular_dataset
    artifact_id: claims_dataset
  - port: load_status
    artifact_id: claims_load_status
  parameter_bindings:
    required_columns:
    - claim_id
    - patient_id
    - provider_id
    - procedure_code
    - amount
    - date_of_service
    has_header: true
    delimiter: ','
  secret_bindings: []
  rationale: The descriptor loads claims CSV with validated columns into a structured tabular dataset.
  confidence: explicit
- intent_id: extract_providers
  service_id: delimited_file_tabular_dataset_loader
  service_version: 1.0.0
  input_bindings:
  - port: delimited_file
    artifact_id: providers_csv
  output_bindings:
  - port: tabular_dataset
    artifact_id: providers_dataset
  - port: load_status
    artifact_id: providers_load_status
  parameter_bindings:
    required_columns:
    - provider_id
    - provider_name
    - specialty
    - location
    has_header: true
    delimiter: ','
  secret_bindings: []
  rationale: The descriptor loads providers CSV with validated columns into a structured tabular dataset.
  confidence: explicit
- intent_id: transform_join
  service_id: healthcare_claims_provider_join_anonymize_risk_builder
  service_version: 1.0.0
  input_bindings:
  - port: claims_dataset
    artifact_id: claims_dataset
  - port: providers_dataset
    artifact_id: providers_dataset
  output_bindings:
  - port: transformed_healthcare_dataset
    artifact_id: transformed_healthcare_dataset
  - port: transform_status
    artifact_id: transform_status
  parameter_bindings:
    provider_key_column: provider_id
    patient_id_column: patient_id
    anonymization_method: pseudonymize
    risk_scoring_rules:
      amount_weight: 0.5
      procedure_weight: 0.5
    output_path: /workspace/artifacts/transformed_healthcare_dataset.json
  secret_bindings: []
  rationale: The descriptor joins claims and providers, pseudonymizes patient identifiers, and computes
    risk scores.
  confidence: explicit
- intent_id: load_warehouse
  service_id: multi_table_analytics_warehouse_loader
  service_version: 1.0.0
  input_bindings:
  - port: transformed_dataset
    artifact_id: transformed_healthcare_dataset
  - port: warehouse_database
    artifact_id: warehouse_resource
  output_bindings:
  - port: loaded_tables
    artifact_id: loaded_tables
  - port: load_status
    artifact_id: warehouse_load_status
  parameter_bindings:
    table_mappings:
      claims_fact: healthcare_analytics.claims_fact
      providers_dim: healthcare_analytics.providers_dim
    write_mode: upsert
  secret_bindings: []
  rationale: The descriptor loads the transformed dataset into analytics warehouse fact and dimension
    tables.
  confidence: explicit
- intent_id: refresh_bi
  service_id: bi_dashboard_refresh_trigger
  service_version: 1.0.0
  input_bindings:
  - port: bi_service
    artifact_id: bi_service_resource
  output_bindings:
  - port: refresh_notification
    artifact_id: refresh_notification
  - port: refresh_status
    artifact_id: refresh_status
  parameter_bindings:
    bi_tool: tableau
    target_identifier: healthcare_claims_overview
  secret_bindings: []
  rationale: The descriptor triggers a BI dashboard refresh on the configured platform.
  confidence: explicit
policies:
  default_retries: 2
  default_retry_delay_seconds: 300
  fail_fast: true
  service_overrides:
  - intent_id: extract_claims
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 120
    network_access: forbidden
  - intent_id: load_warehouse
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 600
    network_access: required
  - intent_id: refresh_bi
    retries: 1
    timeout_seconds: 120
    network_access: required
  governance:
    allowed_sensitivities:
    - internal
    - confidential
    - pii
    network_default: forbidden
    secret_placeholders_only: true
    notes:
    - PII pseudonymization uses deterministic mock mapping.
    - Warehouse load and BI refresh use filesystem-backed mocks.
runtime:
  target: argo-workflows
  version: 4.0.6
  namespace: prompt2serviceflow
  service_account: prompt2serviceflow-runner
  artifact_repository:
    type: none
    reference: null
  execution_profile: mock
validation_expectations:
- gate: G0
  expected_status: pass
  checks:
  - Schemas
  - files
  - and pinned checksums
- gate: G1
  expected_status: pass
  checks:
  - All five source steps are accounted for
- gate: G2
  expected_status: pass
  checks:
  - Five exact catalogue bindings resolve
- gate: G3
  expected_status: pass
  checks:
  - Ports
  - parameters
  - types
  - and policies close
- gate: G4
  expected_status: pass
  checks:
  - Staged Argo DAG with parallel groups compiles
- gate: G5
  expected_status: pass
  checks:
  - Single ETL scenario executes all five steps
- gate: G6
  expected_status: pass
  checks:
  - Extract
  - transform
  - load
  - and BI refresh invariants hold
