artifact_mapping_version: 0.1.0
benchmark_id: main:healthcare_claims_etl
mappings:
- intent_id: extract_claims
  inputs:
    delimited_file: claims_csv
  outputs:
    tabular_dataset: claims_dataset
    load_status: claims_load_status
- intent_id: extract_providers
  inputs:
    delimited_file: providers_csv
  outputs:
    tabular_dataset: providers_dataset
    load_status: providers_load_status
- intent_id: transform_join
  inputs:
    claims_dataset: claims_dataset
    providers_dataset: providers_dataset
  outputs:
    transformed_healthcare_dataset: transformed_healthcare_dataset
    transform_status: transform_status
- intent_id: load_warehouse
  inputs:
    transformed_dataset: transformed_healthcare_dataset
    warehouse_database: warehouse_resource
  outputs:
    loaded_tables: loaded_tables
    load_status: warehouse_load_status
- intent_id: refresh_bi
  inputs:
    bi_service: bi_service_resource
  outputs:
    refresh_notification: refresh_notification
    refresh_status: refresh_status
