apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regulatory-report-router-scripts
  namespace: prompt2serviceflow
data:
  01_read_csv.py: "#!/usr/bin/env python3\n\"\"\"Read financial transactions CSV.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, csv, json, shutil\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"\
    --fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n\
    \    dest=art/\"transactions.csv\"; shutil.copyfile(a.fixture,dest)\n    with dest.open(encoding=\"\
    utf-8\",newline=\"\") as f:\n        r=csv.DictReader(f); rows=list(r); cols=r.fieldnames or []\n\
    \    ds={\"columns\":cols,\"rows\":rows}\n    (art/\"transaction_dataset.json\").write_text(json.dumps(ds,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    st={\"success\":True,\"errors\":[]}\n    (art/\"read_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  02_account_check.py: "#!/usr/bin/env python3\n\"\"\"Determine routing based on account type.\"\"\"\n\
    from __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"\n    ds=json.loads((art/\"transaction_dataset.json\").read_text(encoding=\"\
    utf-8\"))\n    types={r.get(\"account_type\",\"\") for r in ds[\"rows\"]}\n    is_international=\"\
    international\" in types\n    route=\"fatca\" if is_international else \"irs\"\n    dec={\"route\"\
    :route,\"matched\":True,\"reason\":f\"account_types found: {sorted(types)}\"}\n    (art/\"routing_decision.json\"\
    ).write_text(json.dumps(dec,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"route.txt\").write_text(route,encoding=\"\
    utf-8\")\nif __name__==\"__main__\": main()\n"
  03_route_to_fatca.py: "#!/usr/bin/env python3\n\"\"\"Generate FATCA regulatory report.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    ds=json.loads((art/\"transaction_dataset.json\").read_text(encoding=\"utf-8\"))\n\
    \    intl=[r for r in ds[\"rows\"] if r.get(\"account_type\")==\"international\"]\n    content=f\"\
    FATCA REPORT\\nTransactions: {len(intl)}\\n\"+\"\\n\".join(f\"  {r['transaction_id']}: {r['amount']}\
    \ {r['currency']}\" for r in intl)\n    report={\"report_content\":content,\"report_profile\":\"fatca\"\
    ,\"transaction_count\":len(intl)}\n    (art/\"fatca_report.txt\").write_text(content,encoding=\"utf-8\"\
    )\n    (art/\"fatca_report.json\").write_text(json.dumps(report,indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    st={\"success\":True,\"errors\":[]}\n    (art/\"fatca_report_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_route_to_irs.py: "#!/usr/bin/env python3\n\"\"\"Generate IRS regulatory report.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    ds=json.loads((art/\"transaction_dataset.json\").read_text(encoding=\"utf-8\"))\n\
    \    dom=[r for r in ds[\"rows\"] if r.get(\"account_type\")==\"domestic\"]\n    content=f\"IRS FORM\
    \ 1099 REPORT\\nTransactions: {len(dom)}\\n\"+\"\\n\".join(f\"  {r['transaction_id']}: {r['amount']}\
    \ {r['currency']}\" for r in dom)\n    report={\"report_content\":content,\"report_profile\":\"irs_1099\"\
    ,\"transaction_count\":len(dom)}\n    (art/\"irs_report.txt\").write_text(content,encoding=\"utf-8\"\
    )\n    (art/\"irs_report.json\").write_text(json.dumps(report,indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    st={\"success\":True,\"errors\":[]}\n    (art/\"irs_report_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  05_archive_reports.py: "#!/usr/bin/env python3\n\"\"\"Archive regulatory reports to mock storage.\"\"\
    \"\nfrom __future__ import annotations\nimport argparse, json, shutil\nfrom pathlib import Path\n\n\
    def main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ a=p.parse_args()\n    art=a.workspace/\"artifacts\"\n    archive=a.workspace/\"archive\"; archive.mkdir(parents=True,exist_ok=True)\n\
    \    reports=[]\n    if (art/\"fatca_report.txt\").is_file():\n        shutil.copy(art/\"fatca_report.txt\"\
    , archive/\"fatca_report.txt\"); reports.append(\"fatca\")\n    if (art/\"irs_report.txt\").is_file():\n\
    \        shutil.copy(art/\"irs_report.txt\", archive/\"irs_report.txt\"); reports.append(\"irs\")\n\
    \    (archive/\"archive.bin\").write_bytes(b\"MOCK_ARCHIVE_BINARY_CONTENT\\n\"*10)\n    (art/\"archive_input.bin\"\
    ).write_bytes(b\"MOCK_ARCHIVE_INPUT\\n\"*5)\n    st={\"success\":True,\"errors\":[]}\n    (art/\"\
    archive_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: regulatory-report-router-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: '{"driver":"filesystem-mock","target":"workspace/archive"}'
  fixture-0001: 'transaction_id,account_type,amount,currency

    T101,domestic,5000.00,USD

    T102,domestic,12000.00,USD

    T103,domestic,750.00,USD

    '
  fixture-0002: 'transaction_id,account_type,amount,currency

    T001,international,15000.00,USD

    T002,international,8500.00,EUR

    T003,international,22000.00,USD

    '
