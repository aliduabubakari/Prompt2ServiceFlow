requirement:
  name: Database Partition Check ETL
  purpose: Wait for partition readiness, extract incremental data, transform, and load.
  domain: data_platform
  execution_model: batch
  topology: sensor_gated
  information_sufficiency: high
  notes:
  - Sensor-gated ETL pipeline.
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
external_systems: []
service_intents:
- intent_id: wait_partition
  name: Wait for partition
  category: Sensor
  capability: Poll database for partition readiness.
  source_step_refs:
  - wait_partition
  evidence:
  - source: description
    text: Wait for partition.
  inputs:
  - db_resource
  outputs:
  - readiness_decision
  - sensor_status
  external_system_refs: []
  preconditions:
  - DB accessible.
  effects:
  - Readiness emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: not_required
    data_sensitivity:
    - internal
  decomposition_rationale: Sensor gates pipeline.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: extract_incremental
  name: Extract incremental
  category: Extractor
  capability: Extract incremental data from partition.
  source_step_refs:
  - extract_incremental
  evidence:
  - source: description
    text: Extract incremental data.
  inputs:
  - db_resource
  outputs:
  - extracted_dataset
  - extraction_status
  external_system_refs: []
  preconditions:
  - Partition ready.
  effects:
  - Dataset extracted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
  decomposition_rationale: Extracts data.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: transform
  name: Transform data
  category: Transformer
  capability: Transform extracted dataset.
  source_step_refs:
  - transform
  evidence:
  - source: description
    text: Transform data.
  inputs:
  - extracted_dataset
  outputs:
  - transformed_dataset
  - transformed_obj
  - transform_status
  external_system_refs: []
  preconditions:
  - Data extracted.
  effects:
  - Transformed data emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Transforms data.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: load
  name: Load to DB
  category: Loader
  capability: Load transformed data into target table.
  source_step_refs:
  - load
  evidence:
  - source: description
    text: Load data.
  inputs:
  - transformed_obj
  - target_db
  outputs:
  - load_status
  external_system_refs: []
  preconditions:
  - Data transformed.
  effects:
  - Data loaded.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
  decomposition_rationale: Loads to DB.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: wait_partition
    to: extract_incremental
  - from: extract_incremental
    to: transform
  - from: transform
    to: load
  parallel_groups: []
  branches: []
  gates:
  - gate_id: partition_ready
    sensor_intent: wait_partition
    condition: ready == true
    gated_intents:
    - extract_incremental
    - transform
    - load
artifacts:
- artifact_id: db_resource
  name: DB resource
  kind: external_resource
  data_type: object
  media_type: application/json
  role: config
  producer: null
  consumers:
  - wait_partition
  - extract_incremental
  sensitivity: confidential
  persistence: external
  fixture_ref: fixtures/inputs/db.json
- artifact_id: readiness_decision
  name: Readiness
  kind: artifact
  data_type: decision
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: decision
  producer: wait_partition
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: sensor_status
  name: Sensor status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: wait_partition
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: extracted_dataset
  name: Extracted dataset
  kind: artifact
  data_type: table
  media_type: application/json
  schema_ref: contracts/artifacts/obj.schema.json
  role: intermediate
  producer: extract_incremental
  consumers:
  - transform
  sensitivity: internal
  persistence: workflow
- artifact_id: extraction_status
  name: Extraction status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: extract_incremental
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: transformed_dataset
  name: Transformed dataset
  kind: artifact
  data_type: table
  media_type: application/json
  schema_ref: contracts/artifacts/obj.schema.json
  role: intermediate
  producer: transform
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: transformed_obj
  name: Transformed obj
  kind: artifact
  data_type: object
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: intermediate
  producer: transform
  consumers:
  - load
  sensitivity: internal
  persistence: workflow
- artifact_id: transform_status
  name: Transform status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: transform
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: target_db
  name: Target DB
  kind: external_resource
  data_type: object
  media_type: application/json
  role: config
  producer: null
  consumers:
  - load
  sensitivity: confidential
  persistence: external
  fixture_ref: fixtures/inputs/target_db.json
- artifact_id: load_status
  name: Load status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: output
  producer: load
  consumers: []
  sensitivity: internal
  persistence: release
bindings:
- intent_id: wait_partition
  service_id: sql_query_readiness_sensor
  service_version: 1.0.0
  input_bindings:
  - port: database
    artifact_id: db_resource
  output_bindings:
  - port: readiness_decision
    artifact_id: readiness_decision
  - port: query_status
    artifact_id: sensor_status
  parameter_bindings:
    sql_query: SELECT COUNT(*) FROM partition_info WHERE status='ready'
    success_condition: row_count > 0
  secret_bindings: []
  rationale: Polls for partition readiness.
  confidence: explicit
- intent_id: extract_incremental
  service_id: sql_incremental_table_extractor
  service_version: 1.0.0
  input_bindings:
  - port: source_database
    artifact_id: db_resource
  output_bindings:
  - port: extracted_dataset
    artifact_id: extracted_dataset
  - port: extraction_status
    artifact_id: extraction_status
  parameter_bindings:
    source_table_name: events
    incremental_select_sql: SELECT * FROM events WHERE dt = '{{ ds }}'
  secret_bindings: []
  rationale: Extracts incremental partition data.
  confidence: explicit
- intent_id: transform
  service_id: tabular_dataset_declarative_transformer
  service_version: 1.0.0
  input_bindings:
  - port: source_dataset
    artifact_id: extracted_dataset
  output_bindings:
  - port: transformed_dataset
    artifact_id: transformed_dataset
  - port: transformed_data_object
    artifact_id: transformed_obj
  - port: transform_status
    artifact_id: transform_status
  parameter_bindings:
    transformation_rules:
      clean_nulls: true
    output_path: /workspace/artifacts/transformed.json
  secret_bindings: []
  rationale: Transforms extracted data.
  confidence: explicit
- intent_id: load
  service_id: tabular_dataset_database_loader
  service_version: 1.0.0
  input_bindings:
  - port: ingested_data_object
    artifact_id: transformed_obj
  - port: target_database
    artifact_id: target_db
  output_bindings:
  - port: load_status
    artifact_id: load_status
  parameter_bindings:
    target_table: processed_events
    write_mode: upsert
  secret_bindings: []
  rationale: Loads to target DB.
  confidence: explicit
policies:
  default_retries: 0
  default_retry_delay_seconds: 0
  fail_fast: true
  service_overrides: []
  governance:
    allowed_sensitivities:
    - internal
    - confidential
    network_default: forbidden
    secret_placeholders_only: true
    notes:
    - Mock ETL.
runtime:
  target: argo-workflows
  version: 4.0.6
  namespace: prompt2serviceflow
  service_account: prompt2serviceflow-runner
  artifact_repository:
    type: none
    reference: null
  execution_profile: mock
