apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: database-partition-check-etl-etl
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: database-partition-check-etl-etl-scripts
    - name: fixtures
      configMap:
        name: database-partition-check-etl-etl-fixtures
        items:
        - key: fixture-0000
          path: db.json
        - key: fixture-0001
          path: fixture.json
        - key: fixture-0002
          path: target_db.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: wait-partition
          template: run-wait-partition
        - name: extract-incremental
          template: run-extract-incremental
          depends: wait-partition.Succeeded
        - name: transform
          template: run-transform
          depends: extract-incremental.Succeeded
        - name: load
          template: run-load
          depends: transform.Succeeded
    - name: run-wait-partition
      metadata:
        annotations:
          prompt2serviceflow/intent-id: wait_partition
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_run.py
        - --workspace
        - /workspace
        - --step
        - wait
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-extract-incremental
      metadata:
        annotations:
          prompt2serviceflow/intent-id: extract_incremental
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_run.py
        - --workspace
        - /workspace
        - --step
        - extract
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-transform
      metadata:
        annotations:
          prompt2serviceflow/intent-id: transform
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_run.py
        - --workspace
        - /workspace
        - --step
        - transform
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
    - name: run-load
      metadata:
        annotations:
          prompt2serviceflow/intent-id: load
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_run.py
        - --workspace
        - /workspace
        - --step
        - load
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
