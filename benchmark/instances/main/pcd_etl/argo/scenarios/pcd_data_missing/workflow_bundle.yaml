    \    spec:\n      restartPolicy: Never\n      containers:\n        - name: processor\n          image:\
    \ example.invalid/pcd-processor:fixture\n"
  fixture-0007: '{"driver":"filesystem-mock","location_type":"sftp","path":"/data/pcd"}

    '
