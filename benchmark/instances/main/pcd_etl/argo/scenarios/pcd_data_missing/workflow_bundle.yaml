---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pcd-etl-pcd-data-missing-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: pcd-etl-pcd-data-missing
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: pcd-data-missing
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters:
    - name: pcd-data-available
      value: 'True'
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: pcd-etl-pcd-data-missing-scripts
  - name: fixtures
    configMap:
      name: pcd-etl-pcd-data-missing-fixtures
      items:
      - key: fixture-0000
        path: api.json
      - key: fixture-0001
        path: db.json
      - key: fixture-0002
        path: email.json
      - key: fixture-0003
        path: ext.json
      - key: fixture-0004
        path: kubernetes.json
      - key: fixture-0005
        path: obj.json
      - key: fixture-0006
        path: pcd_job.yaml
      - key: fixture-0007
        path: sftp.json
      - key: fixture-0008
        path: shared_folder.json
      - key: fixture-0009
        path: table.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: check-pcd-sftp-folder
        template: run-check-pcd-sftp-folder
      - name: check-pcd-shared-folder
        template: run-check-pcd-shared-folder
        depends: check-pcd-sftp-folder.Succeeded
      - name: financial-expense
        template: run-financial-expense
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: upcc-financial-reporting
        template: run-upcc-financial-reporting
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: chc-financial-reporting
        template: run-chc-financial-reporting
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: pcn-financial-reporting
        template: run-pcn-financial-reporting
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: nppcc-financial-reporting
        template: run-nppcc-financial-reporting
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: fiscal-year-reporting-dates
        template: run-fiscal-year-reporting-dates
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: upcc-primary-care-patient-services
        template: run-upcc-primary-care-patient-services
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: chc-primary-care-patient-services
        template: run-chc-primary-care-patient-services
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: practitioner-role-mapping
        template: run-practitioner-role-mapping
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: status-tracker
        template: run-status-tracker
        depends: check-pcd-shared-folder.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: hr-records
        template: run-hr-records
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
          && chc-financial-reporting.Succeeded && pcn-financial-reporting.Succeeded && nppcc-financial-reporting.Succeeded
          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
          chc-primary-care-patient-services.Succeeded && practitioner-role-mapping.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: provincial-risk-tracking
        template: run-provincial-risk-tracking
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
          && chc-financial-reporting.Succeeded && pcn-financial-reporting.Succeeded && nppcc-financial-reporting.Succeeded
          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
          chc-primary-care-patient-services.Succeeded && practitioner-role-mapping.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: decision-log
        template: run-decision-log
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
          && chc-financial-reporting.Succeeded && pcn-financial-reporting.Succeeded && nppcc-financial-reporting.Succeeded
          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
          chc-primary-care-patient-services.Succeeded && practitioner-role-mapping.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: ha-hierarchy
        template: run-ha-hierarchy
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
          && chc-financial-reporting.Succeeded && pcn-financial-reporting.Succeeded && nppcc-financial-reporting.Succeeded
          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
          chc-primary-care-patient-services.Succeeded && practitioner-role-mapping.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: uppc-budget
        template: run-uppc-budget
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
