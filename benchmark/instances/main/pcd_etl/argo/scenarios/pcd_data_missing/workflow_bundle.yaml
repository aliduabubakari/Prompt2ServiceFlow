          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
          chc-primary-care-patient-services.Succeeded && practitioner-role-mapping.Succeeded
        when: '{{tasks.check-pcd-shared-folder.outputs.parameters.available}} == true'
      - name: pcn-budget
        template: run-pcn-budget
        depends: status-tracker.Succeeded && financial-expense.Succeeded && upcc-financial-reporting.Succeeded
          && chc-financial-reporting.Succeeded && pcn-financial-reporting.Succeeded && nppcc-financial-reporting.Succeeded
          && fiscal-year-reporting-dates.Succeeded && upcc-primary-care-patient-services.Succeeded &&
