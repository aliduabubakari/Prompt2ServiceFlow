runtime_manifest_version: 0.1.0
pipeline_id: pcd_etl
image: python:3.12-slim
workflow_parameters:
- name: pcd-data-available
  default: true
tasks:
- intent_id: check_pcd_sftp_folder
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - check_pcd_sftp_folder
  - --available
  - '{pcd_data_available}'
- intent_id: check_pcd_shared_folder
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - check_pcd_shared_folder
  - --available
  - '{pcd_data_available}'
  dependencies:
  - check_pcd_sftp_folder
  output_parameters:
  - name: available
    path: /workspace/artifacts/pcd_data_available.txt
- intent_id: financial_expense
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - financial_expense
  dependencies:
  - check_pcd_shared_folder
  when: '{{tasks.check_pcd_shared_folder.outputs.parameters.available}} == true'
  local_condition:
    path: artifacts/check_pcd_shared_folder_decision.json
    json_path: available
    equals: true
