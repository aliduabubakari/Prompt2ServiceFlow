    text: Check Pcd Sftp Folder
  inputs:
  - pcd_sftp_resource
  outputs:
  - check_pcd_sftp_folder_decision
  - check_pcd_sftp_folder_status
  external_system_refs:
  - pcd_sftp
  preconditions: []
  effects:
  - Output emitted.
  required_policy_properties:
    network_access: optional
    secret_access: optional
    idempotency: not_required
    data_sensitivity:
    - internal
  decomposition_rationale: The source Kubernetes check is represented as the reusable location sensor
    effect.
  confidence: explicit
