requirement:
  name: PCD ETL
  purpose: Healthcare ETL processing patient care data, financial reporting, and budget management.
  domain: healthcare
  execution_model: batch
  topology: fan_out_fan_in
  information_sufficiency: high
  notes:
  - Massive 24-step healthcare ETL.
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
external_systems:
- system_id: pcd_sftp
  type: sftp
  name: PCD SFTP drop zone
  identifier: /data/pcd
  access_mode: read
  authentication: secret
  mock_strategy: fixture
- system_id: pcd_shared_folder
  type: filesystem
  name: PCD shared folder
  identifier: /data/pcd
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: pcd_api
  type: http_api
  name: PCD API
  identifier: https://pcd.example.test
  access_mode: read
  authentication: secret
  mock_strategy: fixture
- system_id: kubernetes_cluster
  type: cloud_service
  name: PCD Kubernetes cluster
  identifier: pcd-jobs
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
- system_id: email_service
