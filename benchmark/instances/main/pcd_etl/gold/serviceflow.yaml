bindings:
- intent_id: check_pcd_sftp_folder
  service_id: file_location_availability_sensor
  service_version: 1.0.0
  input_bindings:
  - port: file_location_resource
    artifact_id: pcd_sftp_resource
  output_bindings:
  - port: availability_decision
    artifact_id: check_pcd_sftp_folder_decision
  - port: check_status
    artifact_id: check_pcd_sftp_folder_status
  parameter_bindings:
    location_type: sftp
    path: /data/pcd
    availability_condition: contains_matching_files
    filename_pattern: '*.csv'
  secret_bindings: []
  rationale: Checks the exact SFTP drop-zone condition before the shared-folder check.
  confidence: explicit
- intent_id: check_pcd_shared_folder
  service_id: file_location_availability_sensor
  service_version: 1.0.0
  input_bindings:
  - port: file_location_resource
    artifact_id: pcd_shared_folder_resource
  output_bindings:
