apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: procurement-supplier-validation-v1-three-suppliers-scripts
  namespace: prompt2serviceflow
data:
  01_load_suppliers.py: "#!/usr/bin/env python3\n\"\"\"Load supplier CSV and produce structured JSON.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, csv, json, shutil\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    dest=art/\"suppliers.csv\"; shutil.copyfile(a.fixture,dest)\n\
    \    with dest.open(encoding=\"utf-8\",newline=\"\") as f:\n        r=csv.DictReader(f); rows=list(r);\
    \ cols=r.fieldnames or []\n    out={\"columns\":cols,\"rows\":rows,\"row_count\":len(rows)}\n    (art/\"\
    formatted_suppliers_json.json\").write_text(json.dumps(out,indent=2)+\"\\n\",encoding=\"utf-8\")\n\
    \    (art/\"format_status.json\").write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  02_reconcile_suppliers.py: "#!/usr/bin/env python3\n\"\"\"Mock Wikidata entity reconciliation.\"\"\"\
    \nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\nWIKIDATA={\"\
    Acme Corporation\":\"Q123\",\"Global Supplies Ltd\":\"Q456\",\"TechParts GmbH\":\"Q789\"}\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"\n    src=json.loads((art/\"formatted_suppliers_json.json\").read_text(encoding=\"\
    utf-8\"))\n    for r in src[\"rows\"]:\n        r[\"wikidata_id\"]=WIKIDATA.get(r[\"supplier_name\"\
    ],\"UNKNOWN\")\n    src[\"columns\"]=src[\"columns\"]+[\"wikidata_id\"]\n    (art/\"reconciled_suppliers_json.json\"\
    ).write_text(json.dumps(src,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"reconciliation_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  03_save_suppliers.py: "#!/usr/bin/env python3\n\"\"\"Export reconciled JSON to CSV.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    src=json.loads((art/\"reconciled_suppliers_json.json\").read_text(encoding=\"utf-8\"\
    ))\n    out=art/\"enriched_suppliers.csv\"\n    with out.open(\"w\",encoding=\"utf-8\",newline=\"\"\
    ) as f:\n        w=csv.DictWriter(f,fieldnames=src[\"columns\"]); w.writeheader(); w.writerows(src[\"\
    rows\"])\n    (art/\"export_status.json\").write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
