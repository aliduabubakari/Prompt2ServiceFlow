  role: status
  producer: reconcile_supplier_entities
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: enriched_suppliers_csv
  name: Enriched CSV
  kind: artifact
  data_type: csv
  role: output
  producer: save_validated_suppliers
