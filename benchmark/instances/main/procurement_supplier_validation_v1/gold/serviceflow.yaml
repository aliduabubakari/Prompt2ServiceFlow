  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/s.schema.json
  role: status
  producer: save_validated_suppliers
  consumers: []
  sensitivity: internal
  persistence: release
bindings:
- intent_id: load_and_modify_suppliers
  service_id: csv_to_structured_json_table_formatter
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: suppliers_csv
  output_bindings:
  - port: structured_json
    artifact_id: formatted_suppliers_json
  - port: transform_status
    artifact_id: format_status
  parameter_bindings:
    output_path: /workspace/artifacts/formatted_suppliers_json.json
    dataset_id: '2'
    table_name: JOT_
    has_header: true
  secret_bindings: []
  rationale: Formats CSV to JSON.
  confidence: explicit
- intent_id: reconcile_supplier_entities
  service_id: wikidata_entity_reconciliation_transformer
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: formatted_suppliers_json
  - port: entity_reconciliation_resource
    artifact_id: wikidata_resource
  output_bindings:
  - port: reconciled_json
    artifact_id: reconciled_suppliers_json
  - port: reconciliation_status
    artifact_id: reconciliation_status
  parameter_bindings:
    column_name: supplier_name
    reconciliator_id: wikidataEntity
    dataset_id: '2'
    output_path: /workspace/artifacts/reconciled_suppliers_json.json
  secret_bindings: []
  rationale: Reconciles with Wikidata.
  confidence: explicit
- intent_id: save_validated_suppliers
  service_id: structured_json_to_csv_exporter
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: reconciled_suppliers_json
  output_bindings:
  - port: csv_file
    artifact_id: enriched_suppliers_csv
  - port: export_status
    artifact_id: export_status
  parameter_bindings:
    output_filename: enriched_suppliers.csv
    include_header: true
  secret_bindings: []
  rationale: Exports to CSV.
  confidence: explicit
policies:
  default_retries: 1
  default_retry_delay_seconds: 0
  fail_fast: true
  service_overrides: []
  governance:
    allowed_sensitivities:
