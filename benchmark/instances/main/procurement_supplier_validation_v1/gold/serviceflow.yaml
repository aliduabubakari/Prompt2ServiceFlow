requirement:
  name: Procurement Supplier Validation v1
  purpose: Standardize supplier CSV, reconcile names against Wikidata, and export enriched data.
  domain: procurement
  execution_model: batch
  topology: linear
  information_sufficiency: high
  notes:
  - Three-step linear pipeline with Wikidata entity reconciliation.
schedule:
  type: manual
  expression: null
  timezone: null
  start_date: null
  catchup: false
external_systems:
- system_id: source_filesystem
  type: filesystem
  name: Source filesystem
  identifier: /data
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: wikidata_service
  type: database
  name: Wikidata
  identifier: wikidataEntity
  access_mode: read
  authentication: secret
  mock_strategy: fixture
service_intents:
- intent_id: load_and_modify_suppliers
  name: Load and standardize suppliers
  category: Transformer
  capability: Parse supplier CSV and emit structured tabular JSON.
  source_step_refs:
  - load_and_modify_suppliers
  evidence:
  - source: description
    text: Ingest and standardize supplier CSV data.
  inputs:
  - suppliers_csv
  outputs:
  - formatted_suppliers_json
  - format_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - Readable CSV available.
  effects:
  - Structured JSON emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step formats CSV to JSON.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: reconcile_supplier_entities
  name: Reconcile suppliers with Wikidata
  category: Reconciler
  capability: Enrich supplier names with Wikidata entity reconciliation.
  source_step_refs:
  - reconcile_supplier_entities
  evidence:
  - source: description
    text: Reconcile supplier names against Wikidata entities.
  inputs:
  - formatted_suppliers_json
  - wikidata_resource
  outputs:
  - reconciled_suppliers_json
  - reconciliation_status
  external_system_refs:
  - wikidata_service
  preconditions:
  - Structured JSON available.
  effects:
  - Reconciled JSON emitted.
  required_policy_properties:
    network_access: required
    secret_access: optional
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: Source step reconciles supplier entities.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: save_validated_suppliers
  name: Export validated suppliers
  category: Transformer
  capability: Export reconciled JSON to enriched CSV.
  source_step_refs:
  - save_validated_suppliers
  evidence:
  - source: description
    text: Export enriched supplier data to CSV format.
  inputs:
  - reconciled_suppliers_json
  outputs:
  - enriched_suppliers_csv
  - export_status
  external_system_refs: []
  preconditions:
  - Reconciled JSON available.
  effects:
  - CSV exported.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step exports to CSV.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: load_and_modify_suppliers
    to: reconcile_supplier_entities
  - from: reconcile_supplier_entities
    to: save_validated_suppliers
  parallel_groups: []
  branches: []
  gates: []
