apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: executive-sales-dashboard-dashboard-gen-scripts
  namespace: prompt2serviceflow
data:
  01_wait.py: "#!/usr/bin/env python3\n\"\"\"Mock SQL readiness sensor.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, json\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    (art/\"readiness_decision.json\").write_text(json.dumps({\"\
    ready\":True,\"success\":True},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"sensor_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  02_load.py: "#!/usr/bin/env python3\n\"\"\"Mock load sales CSV.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, csv, json, shutil\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    dest=art/\"\
    sales.csv\"; shutil.copyfile(a.fixture,dest)\n    with dest.open(encoding=\"utf-8\",newline=\"\")\
    \ as f:\n        r=csv.DictReader(f); rows=list(r); cols=r.fieldnames or []\n    ds={\"columns\":cols,\"\
    rows\":rows}\n    (art/\"validated_dataset.json\").write_text(json.dumps(ds,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"validated_data.json\").write_text(json.dumps({\"rows\":len(rows),\"success\"\
    :True},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"validation_status.json\").write_text(json.dumps({\"\
    success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_dashboard.py: "#!/usr/bin/env python3\n\"\"\"Mock generate dashboard.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, json\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    (art/\"dashboard.html\").write_text(\"<html><h1>Sales Dashboard</h1><p>Executive\
    \ Summary</p></html>\",encoding=\"utf-8\")\n    (art/\"render_status.json\").write_text(json.dumps({\"\
    success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
