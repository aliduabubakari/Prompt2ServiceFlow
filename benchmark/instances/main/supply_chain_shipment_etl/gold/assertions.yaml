      - {assertion_id: vendor_c_valid, type: json_path_equals, path: artifacts/vendor_c_validation_status.json, json_path: success, expected: true}
      - {assertion_id: cleanse_succeeded, type: json_path_equals, path: artifacts/transform_status.json, json_path: success, expected: true}
      - {assertion_id: nine_rows_cleansed, type: json_path_equals, path: artifacts/transform_status.json, json_path: rows_processed, expected: 9}
      - {assertion_id: db_load_succeeded, type: json_path_equals, path: artifacts/db_load_status.json, json_path: success, expected: true}
      - {assertion_id: email_sent, type: json_path_equals, path: artifacts/notification_status.json, json_path: sent, expected: true}
