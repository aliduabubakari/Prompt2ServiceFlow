requirement:
  name: Supply Chain Shipment ETL
  purpose: 'Three-stage ETL processing shipment data from three vendors: parallel CSV ingestion, SKU normalization/date
    validation/location enrichment, database loading, and summary email notification.'
  domain: supply_chain
  execution_model: batch
  topology: staged_etl
  information_sufficiency: high
  notes:
  - 'Stage 1: three vendor CSVs ingested in parallel.'
  - 'Stage 2: cleanse, normalize SKUs, validate dates, enrich location.'
  - 'Stage 3: load to inventory database, send summary email.'
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
external_systems:
- system_id: source_filesystem
  type: filesystem
  name: Source filesystem
  identifier: /data/shipments
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: inventory_database
  type: database
  name: PostgreSQL inventory database
  identifier: inventory_db
  access_mode: write
  authentication: secret
  mock_strategy: fixture
- system_id: email_service
  type: email
  name: Email service
  identifier: supply-chain-email
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
service_intents:
