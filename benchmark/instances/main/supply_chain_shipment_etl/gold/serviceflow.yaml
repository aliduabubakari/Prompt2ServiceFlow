bindings:
- intent_id: ingest_vendor_a
  service_id: csv_tabular_schema_validating_loader
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: vendor_a_csv
  output_bindings:
  - port: validated_dataset
    artifact_id: vendor_a_dataset
  - port: validated_data_object
    artifact_id: vendor_a_data_object
  - port: validation_status
    artifact_id: vendor_a_validation_status
  parameter_bindings:
    required_columns:
    - shipment_id
    - sku
    - quantity
    - ship_date
    - destination
    has_header: true
    output_path: /workspace/artifacts/vendor_a_data_object.json
  secret_bindings: []
  rationale: Schema-validated CSV ingestion for Vendor A.
  confidence: explicit
- intent_id: ingest_vendor_b
  service_id: csv_tabular_schema_validating_loader
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: vendor_b_csv
  output_bindings:
  - port: validated_dataset
    artifact_id: vendor_b_dataset
  - port: validated_data_object
    artifact_id: vendor_b_data_object
  - port: validation_status
    artifact_id: vendor_b_validation_status
  parameter_bindings:
    required_columns:
    - shipment_id
    - sku
    - quantity
    - ship_date
    - destination
    has_header: true
    output_path: /workspace/artifacts/vendor_b_data_object.json
  secret_bindings: []
  rationale: Schema-validated CSV ingestion for Vendor B.
  confidence: explicit
- intent_id: ingest_vendor_c
  service_id: csv_tabular_schema_validating_loader
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: vendor_c_csv
  output_bindings:
  - port: validated_dataset
    artifact_id: vendor_c_dataset
  - port: validated_data_object
    artifact_id: vendor_c_data_object
  - port: validation_status
    artifact_id: vendor_c_validation_status
  parameter_bindings:
    required_columns:
    - shipment_id
    - sku
    - quantity
    - ship_date
    - destination
    has_header: true
    output_path: /workspace/artifacts/vendor_c_data_object.json
  secret_bindings: []
  rationale: Schema-validated CSV ingestion for Vendor C.
  confidence: explicit
- intent_id: cleanse_data
  service_id: shipment_data_standardization_enricher
  service_version: 1.0.0
  input_bindings:
  - port: vendor_data_objects
    artifact_id: vendor_a_data_object
  output_bindings:
  - port: cleansed_shipment_dataset
    artifact_id: cleansed_shipment_dataset
  - port: cleansed_data_object
    artifact_id: cleansed_data_object
  - port: transform_status
    artifact_id: transform_status
  parameter_bindings:
    vendor_column_mappings:
      vendor_a:
        sku: sku
        quantity: quantity
      vendor_b:
        sku: sku
        quantity: quantity
      vendor_c:
        sku: sku
        quantity: quantity
    canonical_required_columns:
    - shipment_id
    - sku
    - quantity
    - ship_date
    - destination
    sku_normalization_rules:
      case: upper
      strip_hyphen: underscore
    date_validation_rules:
      format: '%Y-%m-%d'
      not_future: true
    output_path: /workspace/artifacts/cleansed_data_object.json
  secret_bindings: []
  rationale: Standardizes and merges all three vendor shipment datasets.
  confidence: explicit
- intent_id: load_to_db
  service_id: tabular_dataset_database_loader
  service_version: 1.0.0
  input_bindings:
  - port: ingested_data_object
    artifact_id: cleansed_data_object
  - port: target_database
    artifact_id: inventory_db_resource
  output_bindings:
  - port: load_status
    artifact_id: db_load_status
  parameter_bindings:
    target_table: inventory_shipments
    write_mode: upsert
  secret_bindings: []
  rationale: Loads cleansed shipment data into inventory database.
  confidence: explicit
- intent_id: send_summary_email
  service_id: status_context_email_summary_notifier
  service_version: 1.0.0
  input_bindings:
  - port: summary_context
    artifact_id: etl_summary_context
  - port: email_service
    artifact_id: email_service_resource
  output_bindings:
  - port: notification_status
    artifact_id: notification_status
  - port: rendered_summary
    artifact_id: rendered_summary
  parameter_bindings:
    to: supply-chain-team@company.com
    subject: Daily Supply Chain Shipment ETL Summary
  secret_bindings: []
  rationale: Sends an ETL summary email to the supply chain team.
  confidence: explicit
policies:
  default_retries: 2
  default_retry_delay_seconds: 300
  fail_fast: true
  service_overrides:
  - intent_id: load_to_db
    retries: 2
    timeout_seconds: 600
    network_access: required
  - intent_id: send_summary_email
    retries: 2
    timeout_seconds: 120
    network_access: required
  governance:
    allowed_sensitivities:
    - internal
    - confidential
    network_default: forbidden
    secret_placeholders_only: true
    notes:
    - All external systems mocked with filesystem-backed fixtures.
