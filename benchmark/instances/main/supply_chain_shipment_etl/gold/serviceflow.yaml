    text: Ingest raw shipment data from Vendor A.
  inputs:
  - vendor_a_csv
  outputs:
  - vendor_a_dataset
  - vendor_a_data_object
  - vendor_a_validation_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - Readable Vendor A CSV available.
  effects:
  - Structured vendor A dataset
  - data object
  - and validation status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step ingests Vendor A shipment CSV.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
