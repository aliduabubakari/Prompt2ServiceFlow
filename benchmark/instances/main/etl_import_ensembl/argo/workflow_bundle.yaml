apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-import-ensembl-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Ensembl ETL mock.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, csv, json, shutil\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--step\",type=str,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True); st={\"\
    success\":True,\"errors\":[]}\n    if a.step==\"file\":\n        (art/\"ensembl_dataset.json\").write_text(json.dumps({\"\
    columns\":[\"gene_id\",\"gene_name\"],\"rows\":[{\"gene_id\":\"ENSG000001\",\"gene_name\":\"BRCA1\"\
    }]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"ensembl_data_obj.json\").write_text(json.dumps({\"\
    source\":\"ensembl.csv\",\"rows\":1},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"ingest_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n    elif a.step==\"table\":\n  \
    \      (art/\"load_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n\
    if __name__==\"__main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-import-ensembl-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: '{"driver":"filesystem-mock"}'
  fixture-0001: 'gene_id,gene_name,chromosome

    ENSG000001,BRCA1,17

    ENSG000002,TP53,17'
  fixture-0002: "{\n  \"pipeline_id\": \"etl_import_ensembl\",\n  \"inputs\": {\n    \"db\": \"db.json\"\
    ,\n    \"ensembl\": \"ensembl.csv\"\n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\
    \n  ],\n  \"systems\": [\n    \"system_a\",\n    \"system_b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: etl-import-ensembl-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: etl-import-ensembl
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: etl-import-ensembl-scripts
  - name: fixtures
    configMap:
      name: etl-import-ensembl-fixtures
      items:
      - key: fixture-0000
        path: db.json
      - key: fixture-0001
        path: ensembl.csv
      - key: fixture-0002
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: file
        template: run-file
      - name: table
        template: run-table
        depends: file.Succeeded
  - name: run-file
    metadata:
      annotations:
        prompt2serviceflow/intent-id: file
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - file
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-table
    metadata:
      annotations:
        prompt2serviceflow/intent-id: table
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - table
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
