apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: etl-import-ensembl-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Ensembl ETL mock.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, csv, json, shutil\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--step\",type=str,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True); st={\"\
    success\":True,\"errors\":[]}\n    if a.step==\"file\":\n        (art/\"ensembl_dataset.json\").write_text(json.dumps({\"\
    columns\":[\"gene_id\",\"gene_name\"],\"rows\":[{\"gene_id\":\"ENSG000001\",\"gene_name\":\"BRCA1\"\
    }]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"ensembl_data_obj.json\").write_text(json.dumps({\"\
    source\":\"ensembl.csv\",\"rows\":1},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"ingest_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n    elif a.step==\"table\":\n  \
    \      (art/\"load_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n\
    if __name__==\"__main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
