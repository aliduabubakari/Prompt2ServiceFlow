artifact_mapping_version: 0.1.0
benchmark_id: main:daily_sales_report
mappings:
- intent_id: query_sales_data
  inputs:
    postgres_database: postgres_resource
  outputs:
    query_result: sales_query_result
    query_status: query_status
- intent_id: transform_to_csv
  inputs:
    query_result: sales_query_result
  outputs:
    csv_file: sales_report_csv
    transform_status: transform_status
- intent_id: generate_pdf_chart
  inputs:
    csv_file: sales_report_csv
  outputs:
    pdf_report: sales_chart_pdf
    render_status: chart_render_status
- intent_id: email_sales_report
  inputs:
    email_service: email_service_resource
  outputs:
    notification_status: notification_status
