apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-sales-report-scripts
  namespace: prompt2serviceflow
data:
  01_query_sales_data.py: "#!/usr/bin/env python3\n\"\"\"Mock PostgreSQL query that returns deterministic\
    \ daily sales data.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\n\
    from pathlib import Path\n\nMOCK_SALES = [\n    {\"date\": \"2024-01-15\", \"product\": \"Widget A\"\
    , \"daily_sales\": 1500.50},\n    {\"date\": \"2024-01-15\", \"product\": \"Widget B\", \"daily_sales\"\
    : 2300.00},\n    {\"date\": \"2024-01-15\", \"product\": \"Widget C\", \"daily_sales\": 975.25},\n\
    ]\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    artifacts.mkdir(parents=True, exist_ok=True)\n\n    columns = [\"date\", \"product\"\
    , \"daily_sales\"]\n    result = {\n        \"columns\": columns,\n        \"rows\": MOCK_SALES,\n\
    \    }\n    (artifacts / \"sales_query_result.json\").write_text(\n        json.dumps(result, indent=2)\
    \ + \"\\n\", encoding=\"utf-8\"\n    )\n\n    status = {\n        \"success\": True,\n        \"rows_returned\"\
    : len(MOCK_SALES),\n        \"errors\": [],\n    }\n    (artifacts / \"query_status.json\").write_text(\n\
    \        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
  02_transform_to_csv.py: "#!/usr/bin/env python3\n\"\"\"Transform tabular query result to CSV.\"\"\"\n\
    \nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport json\nfrom pathlib import\
    \ Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace\
    \ / \"artifacts\"\n    result = json.loads((artifacts / \"sales_query_result.json\").read_text(encoding=\"\
    utf-8\"))\n\n    columns = result[\"columns\"]\n    rows = result[\"rows\"]\n\n    csv_path = artifacts\
    \ / \"sales_report.csv\"\n    with csv_path.open(\"w\", encoding=\"utf-8\", newline=\"\") as f:\n\
    \        writer = csv.DictWriter(f, fieldnames=columns)\n        writer.writeheader()\n        writer.writerows(rows)\n\
    \n    status = {\n        \"success\": True,\n        \"rows_written\": len(rows),\n        \"output_uri\"\
    : str(csv_path),\n        \"errors\": [],\n    }\n    (artifacts / \"transform_status.json\").write_text(\n\
    \        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
  03_generate_pdf_chart.py: "#!/usr/bin/env python3\n\"\"\"Generate a mock PDF chart from the sales CSV.\"\
    \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\
    \nPDF_HEADER = b\"%PDF-1.4\\n1 0 obj<</Type/Catalog/Pages 2 0 R>>endobj\\n\"\nPDF_CONTENT = b\"%%\
    \ MOCK PDF CHART - Daily Sales Report\\n\"\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \n    artifacts = args.workspace / \"artifacts\"\n    pdf_path = artifacts / \"sales_chart.pdf\"\n\
    \    # Build a minimal valid PDF stub\n    content = PDF_HEADER + PDF_CONTENT * 20\n    pdf_path.write_bytes(content)\n\
    \n    status = {\n        \"success\": True,\n        \"render_attempted\": True,\n        \"output_uri\"\
    : str(pdf_path),\n        \"errors\": [],\n    }\n    (artifacts / \"chart_render_status.json\").write_text(\n\
    \        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
  04_email_sales_report.py: "#!/usr/bin/env python3\n\"\"\"Record a deterministic mock email delivery\
    \ receipt with attachment metadata.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\n\
    import json\nfrom pathlib import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \n    artifacts = args.workspace / \"artifacts\"\n\n    # Check which attachments exist\n    attachments\
    \ = []\n    if (artifacts / \"sales_report.csv\").is_file():\n        attachments.append(\"sales_report.csv\"\
    )\n    if (artifacts / \"sales_chart.pdf\").is_file():\n        attachments.append(\"sales_chart.pdf\"\
    )\n\n    status = {\n        \"sent\": True,\n        \"recipients\": [\"management@company.com\"\
    ],\n        \"subject\": \"Daily Sales Report - 2024-01-15\",\n        \"attachments\": attachments,\n\
    \        \"errors\": [],\n    }\n    (artifacts / \"notification_status.json\").write_text(\n    \
    \    json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\"\
    :\n    main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: daily-sales-report-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "{\n  \"driver\": \"filesystem-mock\",\n  \"target\": \"artifacts/notification_status.json\"\
    \n}\n"
  fixture-0001: "{\n  \"pipeline_id\": \"daily_sales_report\",\n  \"inputs\": {\n    \"email_service\"\
    : \"email_service.json\",\n    \"postgres_resource\": \"postgres_resource.json\"\n  },\n  \"input_modalities\"\
    : [\n    \"json\",\n    \"table\"\n  ],\n  \"systems\": [\n    \"system_a\",\n    \"system_b\"\n \
    \ ]\n}"
  fixture-0002: "{\n  \"driver\": \"filesystem-mock\",\n  \"engine\": \"postgresql\",\n  \"target\": \"\
    workspace/mock_database\"\n}\n"
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: daily-sales-report
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: daily-sales-report-scripts
    - name: fixtures
      configMap:
        name: daily-sales-report-fixtures
        items:
        - key: fixture-0000
          path: email_service.json
        - key: fixture-0001
          path: fixture.json
        - key: fixture-0002
          path: postgres_resource.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: query-sales-data
          template: run-query-sales-data
        - name: transform-to-csv
          template: run-transform-to-csv
          depends: query-sales-data.Succeeded
        - name: generate-pdf-chart
          template: run-generate-pdf-chart
          depends: transform-to-csv.Succeeded
        - name: email-sales-report
          template: run-email-sales-report
          depends: generate-pdf-chart.Succeeded
    - name: run-query-sales-data
      metadata:
        annotations:
          prompt2serviceflow/intent-id: query_sales_data
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_query_sales_data.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-transform-to-csv
      metadata:
        annotations:
          prompt2serviceflow/intent-id: transform_to_csv
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_transform_to_csv.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-generate-pdf-chart
      metadata:
        annotations:
          prompt2serviceflow/intent-id: generate_pdf_chart
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_generate_pdf_chart.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-email-sales-report
      metadata:
        annotations:
          prompt2serviceflow/intent-id: email_sales_report
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_email_sales_report.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
