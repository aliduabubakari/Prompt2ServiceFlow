bindings:
- intent_id: print_configuration
  service_id: retention_cutoff_config_resolver
  service_version: 1.0.0
  input_bindings:
  - port: runtime_parameters
    artifact_id: runtime_parameters
  output_bindings:
  - port: retention_config
    artifact_id: retention_config
  - port: config_status
    artifact_id: config_status
  parameter_bindings:
    max_age_parameter_name: maxDBEntryAgeInDays
    max_age_variable_name: airflow_db_cleanup__max_db_entry_age_in_days
    default_max_age_days: 30
    enable_delete: true
    print_deletes: false
    reference_time: '2026-01-31T00:00:00Z'
  secret_bindings: []
  rationale: Resolves the reviewed cutoff and deletion flags used by metadata cleanup tasks.
  confidence: explicit
- intent_id: cleanup_dag_run
  service_id: airflow_metadata_retention_cleaner
  service_version: 1.0.0
