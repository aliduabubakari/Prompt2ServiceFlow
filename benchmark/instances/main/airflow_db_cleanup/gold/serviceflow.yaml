requirement:
  name: Airflow DB Cleanup
  purpose: Clean up 12 Airflow metadata tables in parallel, then analyze database statistics.
  domain: data_platform_maintenance
  execution_model: batch
  topology: fan_out_fan_in
  information_sufficiency: high
  notes:
  - "Massive fan-out/fan-in: 12 parallel cleanup \u2192 analyze."
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
