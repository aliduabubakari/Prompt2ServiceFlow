apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: data-transformation-pipeline-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: data-transformation-pipeline
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: dataform-run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: data-transformation-pipeline-scripts
  - name: fixtures
    configMap:
      name: data-transformation-pipeline-fixtures
      items:
      - key: fixture-0000
        path: dataform_repo.json
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: start
        template: run-start
      - name: parse-input-params
        template: run-parse-input-params
        depends: start.Succeeded
      - name: create-compilation-result
        template: run-create-compilation-result
        depends: parse-input-params.Succeeded
      - name: create-workflow-invocation
        template: run-create-workflow-invocation
        depends: create-compilation-result.Succeeded
      - name: is-workflow-invocation-done
        template: run-is-workflow-invocation-done
        depends: create-workflow-invocation.Succeeded
      - name: end
        template: run-end
        depends: is-workflow-invocation-done.Succeeded
  - name: run-start
    metadata:
      annotations:
        prompt2serviceflow/intent-id: start
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_start.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-parse-input-params
    metadata:
      annotations:
        prompt2serviceflow/intent-id: parse_input_params
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_parse_input_params.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-create-compilation-result
    metadata:
      annotations:
        prompt2serviceflow/intent-id: create_compilation_result
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_create_compilation_result.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-create-workflow-invocation
    metadata:
      annotations:
        prompt2serviceflow/intent-id: create_workflow_invocation
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/04_create_workflow_invocation.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-is-workflow-invocation-done
    metadata:
      annotations:
        prompt2serviceflow/intent-id: is_workflow_invocation_done
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/05_is_workflow_invocation_done.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-end
    metadata:
      annotations:
        prompt2serviceflow/intent-id: end
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/06_end.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
