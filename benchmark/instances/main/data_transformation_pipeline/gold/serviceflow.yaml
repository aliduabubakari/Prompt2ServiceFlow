- artifact_id: compilation_result_ref
  name: Compilation result ref
  kind: artifact
  data_type: object
  media_type: application/json
  schema_ref: contracts/artifacts/obj.schema.json
  role: intermediate
  producer: create_compilation_result
  consumers:
  - create_workflow_invocation
  sensitivity: internal
  persistence: workflow
- artifact_id: creation_status
  name: Creation status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: create_compilation_result
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: workflow_invocation_ref
  name: Workflow invocation ref
  kind: artifact
  data_type: object
