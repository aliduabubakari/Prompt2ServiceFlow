- gate: G0
  expected_status: pass
  checks:
  - Schemas
  - files
  - and pinned checksums
- gate: G1
  expected_status: pass
  checks:
  - All six source steps accounted for
- gate: G2
  expected_status: pass
  checks:
  - Six exact catalogue bindings resolve
- gate: G3
  expected_status: pass
  checks:
  - Ports
  - parameters
  - types
  - and policies close
- gate: G4
  expected_status: pass
  checks:
  - Linear Argo DAG compiles
- gate: G5
  expected_status: pass
  checks:
  - Single scenario executes all six steps
- gate: G6
  expected_status: pass
  checks:
  - All Dataform and cleanup invariants hold
