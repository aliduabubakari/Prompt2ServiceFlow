source:
  dataset_id: zenodo_pipeline_descriptions
  dataset_version: v1.0.0
  benchmark_id: main:data-transformation-pipeline
  split: main
  pipeline_id: data-transformation-pipeline
  description_path: source/zenodo_v1_0_0/descriptions/main_40/06_data_transformation_pipeline.txt
  description_sha256: 7a5a2ca0e4b204945547c0973841dac97cef9525e2e10068ee89fd4b989a1a2f
  internal_spec_path: source/internal_specs/main_40/06_data_transformation_pipeline.json
  internal_spec_sha256: 30f58c8814ecdbd7df3d03a9be1f711f066dc004843ace734dc59535c4f8228d
requirement:
  name: Data Transformation Pipeline
  purpose: 'Run a Google Cloud Dataform pipeline: parse params, compile, invoke workflow, monitor completion.'
  domain: data_platform
  execution_model: batch
  topology: linear
  information_sufficiency: high
  notes:
  - Linear six-step Dataform pipeline with bookend markers.
schedule:
  type: manual
  expression: null
  timezone: null
  start_date: null
  catchup: false
external_systems:
- system_id: dataform_platform
  type: cloud_service
  name: Google Cloud Dataform
  identifier: whejna-modelling-sandbox
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
- system_id: local_filesystem
  type: filesystem
  name: Workflow filesystem
  identifier: /workspace
  access_mode: read_write
  authentication: none
  mock_strategy: fixture
service_intents:
- intent_id: start
  name: Start pipeline
  category: Transformer
  capability: Initialize the Dataform pipeline session.
  source_step_refs:
  - start
  evidence:
  - source: description
    text: Pipeline start marker.
  inputs: []
  outputs:
  - run_id
  - gen_status
  external_system_refs:
  - local_filesystem
  preconditions: []
  effects:
  - Run ID emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: not_required
    data_sensitivity:
    - internal
  decomposition_rationale: Bookend start step.
  confidence: strongly_inferred
  ambiguity:
    status: none
    notes: []
- intent_id: parse_input_params
  name: Parse input params
  category: Transformer
  capability: Build Dataform compilation configuration from input parameters.
  source_step_refs:
  - parse_input_params
  evidence:
  - source: description
    text: Parse input parameters.
  inputs:
  - description_param_input
  - logical_date_input
  outputs:
  - compilation_config
  - build_status
  external_system_refs: []
  preconditions:
  - Params available.
  effects:
  - Compilation config emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step parses and builds config.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: create_compilation_result
  name: Create compilation result
  category: ExternalWorkflowAdapter
  capability: Create a Dataform compilation result from the configuration.
  source_step_refs:
  - create_compilation_result
  evidence:
  - source: description
    text: Create Dataform compilation result.
  inputs:
  - dataform_repo_resource
  - compilation_config
  outputs:
  - compilation_result_ref
  - creation_status
  external_system_refs:
  - dataform_platform
  preconditions:
  - Config available.
  effects:
  - Compilation result reference emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: Source step creates compilation result.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: create_workflow_invocation
  name: Create workflow invocation
  category: ExternalWorkflowAdapter
  capability: Trigger a Dataform workflow invocation from the compilation result.
  source_step_refs:
  - create_workflow_invocation
  evidence:
  - source: description
    text: Create and trigger Dataform workflow invocation.
  inputs:
  - dataform_repo_resource
  - compilation_result_ref
  outputs:
  - workflow_invocation_ref
  - invocation_status
  external_system_refs:
  - dataform_platform
  preconditions:
  - Compilation result available.
  effects:
  - Workflow invocation reference emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: not_required
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: Source step triggers workflow.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: is_workflow_invocation_done
  name: Monitor workflow invocation
  category: Sensor
  capability: Poll for Dataform workflow invocation completion status.
  source_step_refs:
  - is_workflow_invocation_done
  evidence:
  - source: description
    text: Monitor Dataform workflow invocation completion status.
  inputs:
  - dataform_repo_resource
  - workflow_invocation_ref
  outputs:
  - invocation_status_result
  external_system_refs:
  - dataform_platform
  preconditions:
  - Workflow invocation reference available.
  effects:
  - Completion status emitted.
  required_policy_properties:
    network_access: required
    secret_access: optional
    idempotency: not_required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step monitors completion.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: end
  name: End pipeline
  category: Maintenance
  capability: Finalize the pipeline by cleaning up temporary resources.
  source_step_refs:
  - end
  evidence:
  - source: description
    text: Pipeline completion marker.
  inputs: []
  outputs:
  - cleanup_status
  external_system_refs:
  - local_filesystem
  preconditions:
  - Workflow complete.
  effects:
  - Cleanup status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Bookend end step.
  confidence: strongly_inferred
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: start
    to: parse_input_params
  - from: parse_input_params
    to: create_compilation_result
  - from: create_compilation_result
    to: create_workflow_invocation
  - from: create_workflow_invocation
    to: is_workflow_invocation_done
  - from: is_workflow_invocation_done
    to: end
  parallel_groups: []
  branches: []
  gates: []
artifacts:
- artifact_id: run_id
  name: Run ID
  kind: artifact
  data_type: string
  media_type: text/plain
  role: output
  producer: start
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: gen_status
  name: Generation status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: start
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: description_param_input
  name: Description param
  kind: external_resource
  data_type: string
  media_type: text/plain
  role: config
