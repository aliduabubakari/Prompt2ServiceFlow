  consumers: []
  sensitivity: internal
  persistence: release
bindings:
- intent_id: start
  service_id: workflow_load_id_generator
  service_version: 1.0.0
  input_bindings: []
  output_bindings:
  - port: load_id
    artifact_id: run_id
  - port: generation_status
    artifact_id: gen_status
  parameter_bindings:
    generation_strategy: uuid
    prefix: dataform-run-
  secret_bindings: []
  rationale: Generates a session ID.
  confidence: strongly_inferred
- intent_id: parse_input_params
  service_id: dataform_compilation_config_builder
  service_version: 1.0.0
  input_bindings:
  - port: description_param
    artifact_id: description_param_input
  - port: logical_date
    artifact_id: logical_date_input
  output_bindings:
  - port: compilation_config
    artifact_id: compilation_config
  - port: build_status
    artifact_id: build_status
  parameter_bindings:
    git_commitish: full-version
  secret_bindings: []
  rationale: Builds Dataform compilation config.
  confidence: explicit
- intent_id: create_compilation_result
  service_id: google_dataform_compilation_result_creator
  service_version: 1.0.0
  input_bindings:
  - port: dataform_repository
    artifact_id: dataform_repo_resource
  - port: compilation_config
    artifact_id: compilation_config
  output_bindings:
  - port: compilation_result_reference
    artifact_id: compilation_result_ref
  - port: creation_status
    artifact_id: creation_status
  parameter_bindings:
    project_id: whejna-modelling-sandbox
    region: europe-west3
    repository_id: training-repo
  secret_bindings: []
  rationale: Creates Dataform compilation result.
  confidence: explicit
- intent_id: create_workflow_invocation
  service_id: google_dataform_workflow_invocation_creator
  service_version: 1.0.0
  input_bindings:
  - port: dataform_repository
    artifact_id: dataform_repo_resource
  - port: compilation_result_reference
    artifact_id: compilation_result_ref
  output_bindings:
  - port: workflow_invocation_reference
    artifact_id: workflow_invocation_ref
  - port: invocation_creation_status
    artifact_id: invocation_status
  parameter_bindings:
    project_id: whejna-modelling-sandbox
    region: europe-west3
    repository_id: training-repo
    asynchronous: true
  secret_bindings: []
  rationale: Triggers Dataform workflow invocation.
  confidence: explicit
- intent_id: is_workflow_invocation_done
  service_id: google_dataform_workflow_invocation_sensor
  service_version: 1.0.0
  input_bindings:
  - port: dataform_repository
    artifact_id: dataform_repo_resource
  - port: workflow_invocation_reference
    artifact_id: workflow_invocation_ref
  output_bindings:
  - port: invocation_status
    artifact_id: invocation_status_result
  parameter_bindings:
    project_id: whejna-modelling-sandbox
    region: europe-west3
    repository_id: training-repo
    expected_statuses:
    - SUCCEEDED
    - FAILED
  secret_bindings: []
  rationale: Monitors Dataform invocation completion.
  confidence: explicit
- intent_id: end
  service_id: temporary_resource_cleanup
  service_version: 1.0.0
  input_bindings: []
  output_bindings:
  - port: cleanup_status
    artifact_id: cleanup_status
  parameter_bindings:
    targets:
    - /workspace/tmp
    ignore_missing: true
  secret_bindings: []
  rationale: Cleans up at end.
  confidence: strongly_inferred
policies:
  default_retries: 0
  default_retry_delay_seconds: 0
  fail_fast: true
  service_overrides: []
  governance:
    allowed_sensitivities:
    - internal
    - confidential
    network_default: forbidden
    secret_placeholders_only: true
    notes:
    - All Dataform API calls are mocked.
runtime:
  target: argo-workflows
  version: 4.0.6
  namespace: prompt2serviceflow
  service_account: prompt2serviceflow-runner
  artifact_repository:
    type: none
    reference: null
  execution_profile: mock
