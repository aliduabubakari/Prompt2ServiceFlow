- artifact_id: invocation_status
  name: Invocation status
  kind: artifact
  data_type: status
  media_type: application/json
  schema_ref: contracts/artifacts/st.schema.json
  role: status
  producer: create_workflow_invocation
  consumers: []
  sensitivity: internal
  persistence: workflow
- artifact_id: invocation_status_result
  name: Completion result
  kind: artifact
  data_type: decision
  media_type: application/json
