bindings:
- intent_id: params_validate
  service_id: runtime_parameter_allowed_values_validator
  service_version: 1.0.0
  input_bindings:
  - port: runtime_parameters
    artifact_id: param_source
  output_bindings:
  - port: validation_decision
    artifact_id: validation_decision
  parameter_bindings:
    validation_rules:
      required:
      - color
      allowed_values:
        color:
        - blue
        - green
  secret_bindings: []
  rationale: Validates the publication color before any remote work.
  confidence: explicit
- intent_id: download_mondo_terms
  service_id: github_release_asset_object_storage_sync
  service_version: 1.0.0
  input_bindings:
  - port: github_release_repository
    artifact_id: github_repository
  - port: object_storage_destination
    artifact_id: object_storage_destination
  output_bindings:
  - port: downloaded_asset
    artifact_id: mondo_asset
  - port: asset_metadata
    artifact_id: mondo_asset_metadata
  - port: sync_status
    artifact_id: download_status
  parameter_bindings:
    repository_owner: monarch-initiative
    repository_name: mondo
    release_selector: latest
    asset_name_pattern: mondo-base.obo
    destination_prefix: raw/landing/mondo
    skip_if_current: true
  secret_bindings: []
  rationale: Synchronizes the latest reviewed Mondo OBO release asset into the data lake.
  confidence: explicit
- intent_id: normalized_mondo_terms
  service_id: spark_class_object_storage_dataset_transformer
  service_version: 1.0.0
  input_bindings:
  - port: source_objects
    artifact_id: mondo_source_objects
  - port: version_metadata
    artifact_id: mondo_asset_metadata
  - port: object_storage
    artifact_id: object_storage_destination
  - port: spark_execution_context
    artifact_id: spark_execution_context
  output_bindings:
  - port: output_dataset
    artifact_id: normalized_dataset
  - port: transform_status
    artifact_id: normalize_status
  parameter_bindings:
    spark_class: bio.ferlab.HPOMain
    spark_config: config-etl-medium
    output_uri: public/mondo_terms
    app_name: mondo-normalization
    application_args:
      exclude_root: MONDO:0700096
  secret_bindings: []
  rationale: Runs the source Spark normalization class with the reviewed exclusion rule.
  confidence: explicit
- intent_id: index_mondo_terms
  service_id: spark_elasticsearch_index_loader
  service_version: 1.0.0
  input_bindings:
  - port: source_dataset
    artifact_id: normalized_dataset
  - port: index_template
    artifact_id: mondo_index_template
  - port: version_metadata
    artifact_id: mondo_asset_metadata
  - port: elasticsearch_cluster
    artifact_id: elasticsearch_cluster
  - port: spark_execution_context
    artifact_id: spark_execution_context
  output_bindings:
  - port: index_reference
    artifact_id: mondo_index_reference
  - port: index_load_status
    artifact_id: load_status
  parameter_bindings:
    spark_class: bio.ferlab.clin.etl.es.Indexer
    spark_config: config-etl-singleton
    index_name: mondo
    index_type: mondo_terms
    config_file: config/test.conf
    write_mode: replace
  secret_bindings: []
  rationale: Loads the normalized directory through the reviewed Spark Elasticsearch indexer.
  confidence: explicit
- intent_id: publish_mondo
  service_id: elasticsearch_index_publisher
  service_version: 1.0.0
  input_bindings:
  - port: index_reference
    artifact_id: mondo_index_reference
  - port: version_metadata
    artifact_id: mondo_asset_metadata
  - port: elasticsearch_cluster
    artifact_id: elasticsearch_cluster
  output_bindings:
  - port: published_index
    artifact_id: published_mondo_index
  - port: publish_status
    artifact_id: publish_status
  parameter_bindings:
    publication_mode: color_slot
    alias_name: mondo
    color: blue
  secret_bindings: []
  rationale: Promotes the loaded index through the requested blue/green publication slot.
  confidence: explicit
- intent_id: slack
  service_id: slack_notification_sender
  service_version: 1.0.0
  input_bindings:
  - port: slack_service
    artifact_id: slack_resource
  - port: message_context
    artifact_id: published_mondo_index
  output_bindings:
  - port: notification_status
    artifact_id: slack_notification_status
  parameter_bindings:
    channel: '#mondo-etl'
    message_template: Mondo index {index_name} version {version} published.
    username: prompt2serviceflow
  secret_bindings: []
  rationale: Sends a completion message grounded in the published index artifact.
  confidence: explicit
policies:
