  - Data loaded to DB.
  required_policy_properties:
    network_access: required
    secret_access: optional
    idempotency: preferred
    data_sensitivity:
    - internal
  decomposition_rationale: The source explicitly runs a Spark Elasticsearch indexing class.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: publish_mondo
  name: Notify via email
  category: Publisher
