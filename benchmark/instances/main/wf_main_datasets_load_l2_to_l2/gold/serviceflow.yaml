  parameter_bindings:
    workflow_id: WF_MAIN_DATASETS_LOAD_L2_TO_L2
    operation: finalize
    session_status: success
    metadata_target: workflow_sessions
  secret_bindings: []
  rationale: Finalizes the registered workflow session after both downstream branches complete.
  confidence: explicit
