bindings:
- intent_id: wait_for_l2_full_load
  service_id: sql_query_readiness_sensor
  service_version: 1.0.0
  input_bindings:
  - port: database
    artifact_id: dwh_database_resource
  output_bindings:
  - port: readiness_decision
    artifact_id: l2_decision
  - port: query_status
    artifact_id: l2_status
  parameter_bindings:
    sql_query: select * from md.dwh_flag where flag_cd = 'l1_to_l2_load_successfull' and bussines_date
      = current_date - 1
    success_condition: row_exists
    expected_row_count: 1
  secret_bindings: []
  rationale: Evaluates the exact DWH readiness flag query from the source.
  confidence: explicit
- intent_id: get_load_id
  service_id: workflow_load_id_generator
  service_version: 1.0.0
  input_bindings: []
  output_bindings:
  - port: load_id
    artifact_id: load_id
  - port: generation_status
    artifact_id: gen_status
  parameter_bindings:
    generation_strategy: runtime_context
    prefix: wf-l2-
  secret_bindings: []
  rationale: Generates a deterministic load identifier from the supplied run label.
  confidence: explicit
- intent_id: workflow_registration
  service_id: workflow_session_metadata_recorder
  service_version: 1.0.0
  input_bindings:
  - port: metadata_database
    artifact_id: metadata_db
  - port: load_id
    artifact_id: load_id
  output_bindings:
  - port: session_record_reference
    artifact_id: session_ref
  - port: metadata_write_status
    artifact_id: reg_status
  parameter_bindings:
    workflow_id: WF_MAIN_DATASETS_LOAD_L2_TO_L2
    operation: register
    session_status: running
    metadata_target: workflow_sessions
  secret_bindings: []
  rationale: Registers the generated load ID before downstream workflow execution.
  confidence: explicit
- intent_id: wait_for_success_end
  service_id: external_workflow_task_completion_sensor
  service_version: 1.0.0
  input_bindings:
  - port: workflow_orchestrator
    artifact_id: ext_wf_resource
  output_bindings:
  - port: completion_decision
    artifact_id: success_decision
  parameter_bindings:
    external_workflow_id: WF_MAIN_DATASETS_LOAD_L2_TO_L2
    external_step_id: end
    execution_selector:
      logical_date_offset_days: -1
    terminal_states:
    - success
    - failed
    success_states:
    - success
  secret_bindings: []
  rationale: Checks the previous logical execution's end task, as required by the source.
  confidence: explicit
- intent_id: run_sys_kill_all_session_pg
  service_id: external_workflow_run_trigger
  service_version: 1.0.0
  input_bindings:
  - port: workflow_orchestrator
    artifact_id: ext_wf_resource
  output_bindings:
  - port: run_reference
    artifact_id: kill_result
  - port: trigger_status
    artifact_id: kill_status
  parameter_bindings:
    target_workflow_id: sys_kill_all_session_pg
    wait_for_completion: true
    run_config: {}
    success_states:
    - success
  secret_bindings: []
  rationale: Triggers and waits for external workflow sys_kill_all_session_pg.
  confidence: explicit
- intent_id: run_wf_data_preparation_for_reports
  service_id: external_workflow_run_trigger
  service_version: 1.0.0
  input_bindings:
  - port: workflow_orchestrator
    artifact_id: ext_wf_resource
  output_bindings:
  - port: run_reference
    artifact_id: dataprep_result
  - port: trigger_status
    artifact_id: dataprep_status
  parameter_bindings:
    target_workflow_id: wf_data_preparation_for_reports
    wait_for_completion: true
    run_config: {}
    success_states:
    - success
  secret_bindings: []
  rationale: Triggers and waits for external workflow wf_data_preparation_for_reports.
