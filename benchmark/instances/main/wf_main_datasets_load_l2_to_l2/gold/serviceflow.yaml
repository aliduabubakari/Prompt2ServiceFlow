  service_version: 1.0.0
  input_bindings:
  - port: workflow_orchestrator
    artifact_id: ext_wf_resource
  output_bindings:
  - port: run_reference
    artifact_id: segment_result
  - port: trigger_status
    artifact_id: segment_status
  parameter_bindings:
    target_workflow_id: l1_to_l2_p_load_data_ds_client_segmentation_full
    wait_for_completion: true
    run_config: {}
    success_states:
    - success
  secret_bindings: []
  rationale: Triggers and waits for external workflow l1_to_l2_p_load_data_ds_client_segmentation_full.
  confidence: explicit
- intent_id: send_flg_to_sap
  service_id: database_table_http_flag_publisher
  service_version: 1.0.0
  input_bindings:
  - port: source_database
    artifact_id: dwh_database_resource
  - port: source_table
    artifact_id: segmentation_source_table
  - port: http_api_resource
    artifact_id: sap_resource
  output_bindings:
