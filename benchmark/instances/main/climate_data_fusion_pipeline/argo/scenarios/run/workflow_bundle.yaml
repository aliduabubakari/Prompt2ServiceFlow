apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: climate-data-fusion-pipeline-run-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Climate data fusion mock.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, json\nfrom pathlib import Path\nAGENCIES=[\"noaa\",\"ecmwf\",\"jma\",\"metoffice\"\
    ,\"bom\"]\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--step\",type=str,required=True)\n    a=p.parse_args(); art=a.workspace/\"artifacts\"\
    ; art.mkdir(parents=True,exist_ok=True)\n    st={\"success\":True,\"errors\":[]}\n    parts=a.step.split(\"\
    _\",1)\n    if len(parts)==2:\n        agency,action=parts\n        if action==\"dl\":\n         \
    \   (art/f\"{agency}_data.json\").write_text('{\"station_id\":\"S1\",\"temperature\":22.5,\"timestamp\"\
    :\"2024-01-15\"}\\n',encoding=\"utf-8\")\n            (art/f\"{agency}_csv.csv\").write_text(\"station_id,temperature,timestamp\\\
    nS1,22.5,2024-01-15\\n\",encoding=\"utf-8\")\n            (art/f\"{agency}_dl_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n        elif action==\"norm\":\n            (art/f\"norm_{agency}_csv.csv\"\
    ).write_text(\"station_id,temperature,timestamp\\nS1,22.5,2024-01-15\\n\",encoding=\"utf-8\")\n  \
    \          (art/f\"norm_{agency}_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    elif a.step==\"merge\":\n        (art/\"merged_dataset.parquet\").write_text('{\"columns\"\
    :[\"station_id\",\"temperature\"],\"rows\":[]}',encoding=\"utf-8\")\n        (art/\"merge_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: climate-data-fusion-pipeline-run-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "{\n  \"pipeline_id\": \"climate_data_fusion_pipeline\",\n  \"inputs\": {\n    \"http\"\
    : \"http.json\"\n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\n  ],\n  \"systems\"\
    : [\n    \"system_a\",\n    \"system_b\"\n  ]\n}"
  fixture-0001: '{"driver":"filesystem-mock"}'
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: climate-data-fusion-pipeline-run-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: climate-data-fusion-pipeline-run
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: climate-data-fusion-pipeline-run-scripts
  - name: fixtures
    configMap:
      name: climate-data-fusion-pipeline-run-fixtures
      items:
      - key: fixture-0000
        path: fixture.json
      - key: fixture-0001
        path: http.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: download-noaa
        template: run-download-noaa
      - name: download-ecmwf
        template: run-download-ecmwf
      - name: download-jma
        template: run-download-jma
      - name: download-metoffice
        template: run-download-metoffice
      - name: download-bom
        template: run-download-bom
      - name: normalize-noaa
        template: run-normalize-noaa
        depends: download-noaa.Succeeded
      - name: normalize-ecmwf
        template: run-normalize-ecmwf
        depends: download-ecmwf.Succeeded
      - name: normalize-jma
        template: run-normalize-jma
        depends: download-jma.Succeeded
      - name: normalize-metoffice
        template: run-normalize-metoffice
        depends: download-metoffice.Succeeded
      - name: normalize-bom
        template: run-normalize-bom
        depends: download-bom.Succeeded
      - name: merge-climate-data
        template: run-merge-climate-data
        depends: normalize-noaa.Succeeded && normalize-ecmwf.Succeeded && normalize-jma.Succeeded && normalize-metoffice.Succeeded
          && normalize-bom.Succeeded
  - name: run-download-noaa
    metadata:
      annotations:
        prompt2serviceflow/intent-id: download_noaa
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - noaa_dl
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-download-ecmwf
    metadata:
      annotations:
        prompt2serviceflow/intent-id: download_ecmwf
    container:
      image: python:3.12-slim
