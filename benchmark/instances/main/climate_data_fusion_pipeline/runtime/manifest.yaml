- intent_id: download_jma
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - jma_dl
- intent_id: download_metoffice
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - metoffice_dl
- intent_id: download_bom
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - bom_dl
