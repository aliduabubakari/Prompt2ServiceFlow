  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - metoffice_norm
- intent_id: normalize_bom
  script: scripts/01_run.py
  dependencies:
  - download_bom
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - bom_norm
- intent_id: merge_climate_data
  script: scripts/01_run.py
  dependencies:
  - normalize_noaa
  - normalize_ecmwf
  - normalize_jma
  - normalize_metoffice
  - normalize_bom
