- source_step_ref: scan_csv
  disposition: service
  intent_ids:
  - scan_csv
  rationale: The source step is represented by the reviewed, contract-compatible bound service.
- source_step_ref: toxicity_check
  disposition: service
  intent_ids:
  - toxicity_check
  rationale: The source step is represented by the reviewed, contract-compatible bound service.
- source_step_ref: remove_and_flag_content
  disposition: service
  intent_ids:
  - remove_and_flag_content
  rationale: The source step is represented by the reviewed, contract-compatible bound service.
- source_step_ref: publish_content
  disposition: service
  intent_ids:
  - publish_content
  rationale: The source step is represented by the reviewed, contract-compatible bound service.
- source_step_ref: audit_log
  disposition: service
  intent_ids:
  - audit_log
  rationale: The source step is represented by the reviewed, contract-compatible bound service.
