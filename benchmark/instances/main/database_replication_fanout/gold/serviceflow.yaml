requirement:
  name: Database Replication Fanout
  purpose: Dump production DB CSV and fan-out to Dev, Staging, and QA environments in parallel.
  domain: data_platform
  execution_model: batch
  topology: fan_out
  information_sufficiency: high
  notes:
  - 'Fan-out pattern: one export, three parallel imports.'
schedule:
  type: manual
  expression: null
  timezone: null
  start_date: null
  catchup: false
external_systems:
- system_id: production_database
  type: database
  name: Production database
  identifier: production
  access_mode: read
  authentication: secret
  mock_strategy: fixture
- system_id: dev_database
  type: database
  name: Dev database
  identifier: dev
  access_mode: write
  authentication: secret
  mock_strategy: fixture
- system_id: staging_database
  type: database
  name: Staging database
  identifier: staging
  access_mode: write
  authentication: secret
  mock_strategy: fixture
- system_id: qa_database
  type: database
  name: Qa database
  identifier: qa
  access_mode: write
  authentication: secret
  mock_strategy: fixture
service_intents:
- intent_id: dump_prod_csv
  name: Dump production CSV
  category: Extractor
  capability: Export the production database snapshot as a deterministic CSV artifact.
  source_step_refs:
  - dump_prod_csv
  evidence:
  - source: description
    text: Dump production database snapshot.
  inputs:
  - prod_db_resource
  outputs:
  - csv_snapshot
  - export_status
  external_system_refs:
  - production_database
  preconditions:
  - Prod DB accessible.
  effects:
  - CSV snapshot emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - confidential
  decomposition_rationale: The source explicitly exports production data before the fan-out copies.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: copy_dev
  name: Copy to Dev
  category: Loader
  capability: Replace the dev database table from the production CSV snapshot.
  source_step_refs:
  - copy_dev
  evidence:
  - source: description
    text: Copy to Dev environment.
  inputs:
  - csv_snapshot
  - dev_db_resource
  outputs:
  - dev_ref
  - dev_load_status
  external_system_refs:
  - dev_database
  preconditions:
  - CSV snapshot available.
  effects:
  - Dev data loaded.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - confidential
  decomposition_rationale: The source executes this database import as one branch of the copy fan-out.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: copy_staging
  name: Copy to Staging
  category: Loader
  capability: Replace the staging database table from the production CSV snapshot.
  source_step_refs:
  - copy_staging
  evidence:
  - source: description
    text: Copy to Staging environment.
  inputs:
  - csv_snapshot
  - staging_db_resource
  outputs:
  - staging_ref
  - staging_load_status
  external_system_refs:
  - staging_database
  preconditions:
  - CSV snapshot available.
  effects:
  - Staging data loaded.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - confidential
  decomposition_rationale: The source executes this database import as one branch of the copy fan-out.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: copy_qa
  name: Copy to QA
  category: Loader
  capability: Replace the qa database table from the production CSV snapshot.
  source_step_refs:
  - copy_qa
  evidence:
  - source: description
    text: Copy to QA environment.
  inputs:
  - csv_snapshot
  - qa_db_resource
  outputs:
  - qa_ref
  - qa_load_status
  external_system_refs:
  - qa_database
  preconditions:
  - CSV snapshot available.
  effects:
  - QA data loaded.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - confidential
  decomposition_rationale: The source executes this database import as one branch of the copy fan-out.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: dump_prod_csv
    to: copy_dev
  - from: dump_prod_csv
    to: copy_staging
  - from: dump_prod_csv
    to: copy_qa
  parallel_groups:
  - group_id: env_copies
    intent_ids:
    - copy_dev
    - copy_staging
    - copy_qa
  branches: []
  gates: []
