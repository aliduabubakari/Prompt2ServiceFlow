bindings:
- intent_id: dump_prod_csv
  service_id: database_csv_snapshot_exporter
  service_version: 1.0.0
  input_bindings:
  - port: source_database
    artifact_id: prod_db_resource
  output_bindings:
  - port: csv_snapshot
    artifact_id: csv_snapshot
  - port: export_status
    artifact_id: export_status
  parameter_bindings:
    export_spec:
      table: data
      query: SELECT * FROM data
    output_path: /workspace/artifacts/snapshot.csv
    include_header: true
    overwrite_output: true
  secret_bindings: []
  rationale: Exports the production source table once before parallel imports.
  confidence: explicit
- intent_id: copy_dev
  service_id: database_csv_snapshot_importer
  service_version: 1.0.0
  input_bindings:
  - port: csv_snapshot
    artifact_id: csv_snapshot
  - port: target_database
    artifact_id: dev_db_resource
  output_bindings:
  - port: target_database_reference
    artifact_id: dev_ref
  - port: load_status
    artifact_id: dev_load_status
  parameter_bindings:
    import_spec:
      table: data
    load_mode: replace
    target_label: dev
    has_header: true
  secret_bindings: []
  rationale: Imports the shared production snapshot into the dev database branch.
  confidence: explicit
- intent_id: copy_staging
  service_id: database_csv_snapshot_importer
  service_version: 1.0.0
  input_bindings:
  - port: csv_snapshot
    artifact_id: csv_snapshot
  - port: target_database
    artifact_id: staging_db_resource
  output_bindings:
  - port: target_database_reference
    artifact_id: staging_ref
  - port: load_status
    artifact_id: staging_load_status
  parameter_bindings:
    import_spec:
      table: data
    load_mode: replace
    target_label: staging
    has_header: true
  secret_bindings: []
  rationale: Imports the shared production snapshot into the staging database branch.
  confidence: explicit
- intent_id: copy_qa
  service_id: database_csv_snapshot_importer
  service_version: 1.0.0
  input_bindings:
  - port: csv_snapshot
    artifact_id: csv_snapshot
  - port: target_database
    artifact_id: qa_db_resource
  output_bindings:
  - port: target_database_reference
    artifact_id: qa_ref
  - port: load_status
    artifact_id: qa_load_status
  parameter_bindings:
    import_spec:
      table: data
    load_mode: replace
    target_label: qa
    has_header: true
  secret_bindings: []
  rationale: Imports the shared production snapshot into the qa database branch.
  confidence: explicit
policies:
  default_retries: 2
  default_retry_delay_seconds: 300
  fail_fast: true
  service_overrides:
  - intent_id: dump_prod_csv
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 600
    network_access: required
  - intent_id: copy_dev
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 600
    network_access: required
  - intent_id: copy_staging
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 600
    network_access: required
  - intent_id: copy_qa
    retries: 2
    retry_delay_seconds: 300
    timeout_seconds: 600
    network_access: required
  governance:
    allowed_sensitivities:
    - internal
    - confidential
    network_default: required
    secret_placeholders_only: true
    notes:
    - All DB operations mocked.
runtime:
