runtime_manifest_version: 0.1.0
pipeline_id: database_replication_fanout
image: python:3.12-slim
workflow_parameters: []
tasks:
- intent_id: dump_prod_csv
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - export
  - --database-resource
  - '{fixtures}/prod_db.json'
  - --source-fixture
  - '{fixtures}/prod_snapshot.csv'
  retries: 2
- intent_id: copy_dev
  script: scripts/01_run.py
  dependencies:
  - dump_prod_csv
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - import
  - --target-label
  - dev
  - --database-resource
  - '{fixtures}/dev_db.json'
  retries: 2
- intent_id: copy_staging
  script: scripts/01_run.py
  dependencies:
  - dump_prod_csv
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - import
  - --target-label
  - staging
  - --database-resource
  - '{fixtures}/staging_db.json'
  retries: 2
- intent_id: copy_qa
  script: scripts/01_run.py
  dependencies:
  - dump_prod_csv
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - import
  - --target-label
  - qa
  - --database-resource
  - '{fixtures}/qa_db.json'
  retries: 2
scenarios:
- name: replication
  parameters: {}
  fixture_root: fixtures/scenarios/nominal
