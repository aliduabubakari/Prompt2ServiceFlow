apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: hive-script-run-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: hive-script-run
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: hive-script-run-scripts
  - name: fixtures
    configMap:
      name: hive-script-run-fixtures
      items:
      - key: fixture-0000
        path: fixture.json
      - key: fixture-0001
        path: hive.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: run-after-loop
        template: run-run-after-loop
      - name: hive-script-task
        template: run-hive-script-task
        depends: run-after-loop.Succeeded
  - name: run-run-after-loop
    metadata:
      annotations:
        prompt2serviceflow/intent-id: run_after_loop
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - loop
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-hive-script-task
    metadata:
      annotations:
        prompt2serviceflow/intent-id: hive_script_task
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - hive
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
