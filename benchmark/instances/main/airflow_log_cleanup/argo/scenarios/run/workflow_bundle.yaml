apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-log-cleanup-run-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Airflow log cleanup mock.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, json\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--step\",type=str,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True); st={\"success\":True,\"errors\"\
    :[]}\n    if a.step==\"start\":(art/\"start_status.json\").write_text(json.dumps(st,indent=2)+\"\\\
    n\",encoding=\"utf-8\")\n    elif a.step==\"clean\":(art/\"cleanup_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: airflow-log-cleanup-run-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: 'id,value

    1,100

    '
  fixture-0001: "{\n  \"pipeline_id\": \"airflow_log_cleanup\",\n  \"inputs\": {\n    \"placeholder\"\
    : \"data.csv\"\n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\n  ],\n  \"systems\"\
    : [\n    \"system_a\",\n    \"system_b\"\n  ]\n}"
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: airflow-log-cleanup-run-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: airflow-log-cleanup-run
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: airflow-log-cleanup-run-scripts
  - name: fixtures
    configMap:
      name: airflow-log-cleanup-run-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: start
        template: run-start
      - name: log-cleanup-worker-num-1-dir-0
        template: run-log-cleanup-worker-num-1-dir-0
        depends: start.Succeeded
  - name: run-start
    metadata:
      annotations:
        prompt2serviceflow/intent-id: start
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - start
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-log-cleanup-worker-num-1-dir-0
    metadata:
      annotations:
        prompt2serviceflow/intent-id: log_cleanup_worker_num_1_dir_0
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - clean
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
