apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: airflow-log-cleanup-run-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: airflow-log-cleanup-run
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: airflow-log-cleanup-run-scripts
  - name: fixtures
    configMap:
      name: airflow-log-cleanup-run-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: start
        template: run-start
      - name: log-cleanup-worker-num-1-dir-0
        template: run-log-cleanup-worker-num-1-dir-0
        depends: start.Succeeded
  - name: run-start
    metadata:
      annotations:
        prompt2serviceflow/intent-id: start
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - start
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-log-cleanup-worker-num-1-dir-0
    metadata:
      annotations:
        prompt2serviceflow/intent-id: log_cleanup_worker_num_1_dir_0
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - clean
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
