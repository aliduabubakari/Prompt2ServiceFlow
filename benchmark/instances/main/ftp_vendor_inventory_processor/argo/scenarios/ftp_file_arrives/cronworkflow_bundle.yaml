apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ftp-vendor-inventory-processor-ftp-file-arrives-scripts
  namespace: prompt2serviceflow
data:
  01_wait_ftp.py: "#!/usr/bin/env python3\n\"\"\"Mock FTP sensor \u2014 immediately reports file available.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    (art/\"availability_decision.json\"\
    ).write_text(json.dumps({\"available\":True},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"check_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  02_download.py: "#!/usr/bin/env python3\n\"\"\"Mock FTP download \u2014 writes placeholder vendor CSV.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    (art/\"vendor_inventory.csv\"\
    ).write_text(\"sku,quantity,price\\nSKU-A,100,12.50\\nSKU-B,50,8.00\\n\",encoding=\"utf-8\")\n   \
    \ (art/\"downloaded_file.bin\").write_bytes(b\"vendor_inventory.csv\\n\")\n    (art/\"transfer_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  03_cleanse.py: "#!/usr/bin/env python3\n\"\"\"Mock cleanse vendor data.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    with (art/\"vendor_inventory.csv\").open(encoding=\"utf-8\",newline=\"\") as f:\n\
    \        r=csv.DictReader(f); rows=list(r); cols=r.fieldnames or []\n    ds={\"columns\":cols,\"rows\"\
    :rows}\n    (art/\"cleansed_dataset.json\").write_text(json.dumps(ds,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"cleansed_data_obj.json\").write_text(json.dumps({\"source\":str(art/\"vendor_inventory.csv\"\
    ),\"rows\":len(rows)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"cleanse_status.json\").write_text(json.dumps({\"\
    success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_merge.py: "#!/usr/bin/env python3\n\"\"\"Mock merge into inventory DB.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    db=a.workspace/\"mock_db\"; db.mkdir(parents=True,exist_ok=True)\n    (db/\"inventory.json\"\
    ).write_text('{\"status\":\"merged\"}\\n',encoding=\"utf-8\")\n    (art/\"load_status.json\").write_text(json.dumps({\"\
    success\":True,\"rows_written\":2,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ftp-vendor-inventory-processor-ftp-file-arrives-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: '{"driver":"filesystem-mock","engine":"postgresql","target":"workspace/mock_db"}'
  fixture-0001: "{\n  \"pipeline_id\": \"ftp_vendor_inventory_processor\",\n  \"inputs\": {\n    \"ftp_server\"\
    : \"ftp_server.json\",\n    \"db_resource\": \"db_resource.json\"\n  },\n  \"input_modalities\": [\n\
    \    \"json\",\n    \"table\"\n  ],\n  \"systems\": [\n    \"system_a\",\n    \"system_b\"\n  ]\n}"
  fixture-0002: '{"driver":"filesystem-mock","host":"ftp.example.com","path":"/incoming"}'
---
apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: ftp-vendor-inventory-processor-ftp-file-arrives
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters: []
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: ftp-vendor-inventory-processor-ftp-file-arrives-scripts
    - name: fixtures
      configMap:
        name: ftp-vendor-inventory-processor-ftp-file-arrives-fixtures
        items:
        - key: fixture-0000
          path: db_resource.json
        - key: fixture-0001
          path: fixture.json
        - key: fixture-0002
          path: ftp_server.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: wait-for-ftp-file
          template: run-wait-for-ftp-file
        - name: download-vendor-file
          template: run-download-vendor-file
          depends: wait-for-ftp-file.Succeeded
        - name: cleanse-vendor-data
          template: run-cleanse-vendor-data
          depends: download-vendor-file.Succeeded
        - name: merge-with-internal-inventory
          template: run-merge-with-internal-inventory
          depends: cleanse-vendor-data.Succeeded
    - name: run-wait-for-ftp-file
      metadata:
        annotations:
          prompt2serviceflow/intent-id: wait_for_ftp_file
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_wait_ftp.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-download-vendor-file
      metadata:
        annotations:
          prompt2serviceflow/intent-id: download_vendor_file
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/02_download.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-cleanse-vendor-data
      metadata:
        annotations:
          prompt2serviceflow/intent-id: cleanse_vendor_data
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/03_cleanse.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-merge-with-internal-inventory
      metadata:
        annotations:
          prompt2serviceflow/intent-id: merge_with_internal_inventory
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/04_merge.py
        - --workspace
        - /workspace
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
