apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ftp-vendor-inventory-processor-ftp-file-arrives-scripts
  namespace: prompt2serviceflow
data:
  01_wait_ftp.py: "#!/usr/bin/env python3\n\"\"\"Mock FTP sensor \u2014 immediately reports file available.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    (art/\"availability_decision.json\"\
    ).write_text(json.dumps({\"available\":True},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"check_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  02_download.py: "#!/usr/bin/env python3\n\"\"\"Mock FTP download \u2014 writes placeholder vendor CSV.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    (art/\"vendor_inventory.csv\"\
    ).write_text(\"sku,quantity,price\\nSKU-A,100,12.50\\nSKU-B,50,8.00\\n\",encoding=\"utf-8\")\n   \
    \ (art/\"downloaded_file.bin\").write_bytes(b\"vendor_inventory.csv\\n\")\n    (art/\"transfer_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  03_cleanse.py: "#!/usr/bin/env python3\n\"\"\"Mock cleanse vendor data.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    with (art/\"vendor_inventory.csv\").open(encoding=\"utf-8\",newline=\"\") as f:\n\
    \        r=csv.DictReader(f); rows=list(r); cols=r.fieldnames or []\n    ds={\"columns\":cols,\"rows\"\
    :rows}\n    (art/\"cleansed_dataset.json\").write_text(json.dumps(ds,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"cleansed_data_obj.json\").write_text(json.dumps({\"source\":str(art/\"vendor_inventory.csv\"\
    ),\"rows\":len(rows)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"cleanse_status.json\").write_text(json.dumps({\"\
    success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_merge.py: "#!/usr/bin/env python3\n\"\"\"Mock merge into inventory DB.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    db=a.workspace/\"mock_db\"; db.mkdir(parents=True,exist_ok=True)\n    (db/\"inventory.json\"\
    ).write_text('{\"status\":\"merged\"}\\n',encoding=\"utf-8\")\n    (art/\"load_status.json\").write_text(json.dumps({\"\
    success\":True,\"rows_written\":2,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
---
apiVersion: v1
