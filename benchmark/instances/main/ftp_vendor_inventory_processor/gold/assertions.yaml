assertions_version: 0.1.0
pipeline_id: ftp_vendor_inventory_processor
scenarios:
  - scenario: ftp_file_arrives
    assertions:
      - {assertion_id: file_available, type: json_path_equals, path: artifacts/availability_decision.json, json_path: available, expected: true}
      - {assertion_id: downloaded, type: json_path_equals, path: artifacts/transfer_status.json, json_path: success, expected: true}
      - {assertion_id: cleansed, type: json_path_equals, path: artifacts/cleanse_status.json, json_path: success, expected: true}
      - {assertion_id: merged_to_db, type: json_path_equals, path: artifacts/load_status.json, json_path: success, expected: true}
