artifact_mapping_version: 0.1.0
benchmark_id: main:data_quality_gate
mappings:
- intent_id: ingest_customer_csv
  inputs:
    csv_file: raw_customer_csv
  outputs:
    ingested_data_object: ingested_data_object
- intent_id: assess_customer_quality
  inputs:
    ingested_data_object: ingested_data_object
  outputs:
    quality_decision: quality_decision
- intent_id: load_production_data
  inputs:
    ingested_data_object: ingested_data_object
    target_database: production_database_resource
  outputs:
    load_status: production_load_status
- intent_id: quarantine_customer_data
  inputs:
    ingested_data_object: ingested_data_object
    quarantine_destination: quarantine_destination_resource
  outputs:
    quarantine_status: quarantine_status
- intent_id: notify_data_stewards
  inputs:
    email_service: email_service_resource
  outputs:
    notification_status: notification_status
- intent_id: cleanup_temporary_resources
  inputs: {}
  outputs:
    cleanup_status: cleanup_status
