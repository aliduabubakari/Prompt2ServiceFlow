metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assignment-solution-run-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Assignment solution pipeline mock.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, json\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--step\",type=str,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    st={\"\
    success\":True,\"errors\":[]}\n    if a.step==\"get\":\n        (art/\"user_response.json\").write_text('{\"\
    data\":{\"id\":1,\"name\":\"test\"}}',encoding=\"utf-8\")\n        (art/\"user_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    elif a.step==\"process\":\n        (art/\"processed_data.json\").write_text(json.dumps({\"\
    columns\":[\"id\"],\"rows\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"processed_obj.json\"\
    ).write_text(json.dumps({\"ok\":True},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"process_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n    elif a.step==\"create\":\n \
    \       (art/\"create_result.json\").write_text(json.dumps({\"tables\":[{\"name\":\"users\"}]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n        (art/\"create_tbl_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    elif a.step==\"insert\":\n        (art/\"insert_result.json\").write_text(json.dumps({\"\
    tables\":[{\"name\":\"users\",\"rows\":1}]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"\
    insert_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
---
