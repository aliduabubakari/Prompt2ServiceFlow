bindings:
- intent_id: generate_documents
  service_id: synthetic_document_parquet_generator
  service_version: 1.0.0
  input_bindings: []
  output_bindings:
  - port: document_parquet
    artifact_id: doc_parquet
  - port: generation_status
    artifact_id: gen_status
  parameter_bindings:
    output_path: /workspace/artifacts/documents.parquet
    record_count: 5
  secret_bindings: []
  rationale: Generates synthetic documents.
  confidence: explicit
- intent_id: explore_data
  service_id: parquet_document_data_profiler
  service_version: 1.0.0
  input_bindings:
  - port: document_parquet
    artifact_id: doc_parquet
  output_bindings:
  - port: profile_report
    artifact_id: profile_report
  - port: profile_status
    artifact_id: profile_status
  parameter_bindings: {}
  secret_bindings: []
  rationale: Profiles documents.
  confidence: explicit
- intent_id: clean_data
  service_id: parquet_document_clean_standardizer
  service_version: 1.0.0
  input_bindings:
  - port: raw_document_parquet
    artifact_id: doc_parquet
  output_bindings:
  - port: cleaned_document_parquet
    artifact_id: cleaned_parquet
  - port: transform_status
    artifact_id: clean_status
  parameter_bindings:
    text_column: content
    output_path: /workspace/artifacts/cleaned.parquet
  secret_bindings: []
  rationale: Cleans documents.
  confidence: explicit
- intent_id: extract_features
  service_id: document_keyword_feature_extractor
  service_version: 1.0.0
  input_bindings:
  - port: cleaned_document_parquet
    artifact_id: cleaned_parquet
  output_bindings:
  - port: processed_document_parquet
    artifact_id: featured_parquet
  - port: feature_status
    artifact_id: feature_status
  parameter_bindings:
    text_column: content
    output_path: /workspace/artifacts/featured.parquet
  secret_bindings: []
  rationale: Extracts keywords.
  confidence: explicit
- intent_id: validate_data
  service_id: document_feature_validation_quality_check
  service_version: 1.0.0
  input_bindings:
  - port: processed_document_parquet
    artifact_id: featured_parquet
  output_bindings:
  - port: validation_results
    artifact_id: validation_result
  - port: validation_status
    artifact_id: validation_status
  parameter_bindings:
    validation_rules:
      min_keywords: 1
  secret_bindings: []
  rationale: Validates keywords.
  confidence: explicit
- intent_id: save_and_report
  service_id: structured_json_to_csv_exporter
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: featured_json
  output_bindings:
  - port: csv_file
    artifact_id: report_csv
  - port: export_status
    artifact_id: report_status
  parameter_bindings:
    output_filename: keyword_report.csv
    include_header: true
  secret_bindings: []
  rationale: Exports CSV report.
  confidence: explicit
policies:
  default_retries: 1
  default_retry_delay_seconds: 0
  fail_fast: true
  service_overrides: []
  governance:
    allowed_sensitivities:
    - internal
    network_default: forbidden
    secret_placeholders_only: true
    notes:
    - All data is synthetically generated and mocked.
