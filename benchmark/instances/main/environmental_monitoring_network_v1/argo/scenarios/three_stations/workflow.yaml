      - /opt/p2sf/scripts/04_classify_land_use.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    retryStrategy:
      limit: '1'
      retryPolicy: OnError
  - name: run-fetch-population-density
    metadata:
      annotations:
        prompt2serviceflow/intent-id: fetch_population_density
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/05_fetch_population_density.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    retryStrategy:
      limit: '1'
      retryPolicy: OnError
  - name: run-calculate-risk-score
    metadata:
      annotations:
        prompt2serviceflow/intent-id: calculate_risk_score
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/06_calculate_risk_score.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    retryStrategy:
      limit: '1'
      retryPolicy: OnError
  - name: run-save-environmental-dataset
    metadata:
      annotations:
        prompt2serviceflow/intent-id: save_environmental_dataset
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/07_save_environmental_dataset.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    retryStrategy:
      limit: '1'
      retryPolicy: OnError
