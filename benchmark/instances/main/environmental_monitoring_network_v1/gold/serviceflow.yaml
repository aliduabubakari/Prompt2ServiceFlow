requirement:
  name: Environmental Monitoring Network v1
  purpose: Integrate station locations with weather, land use, and demographic data to calculate environmental
    risk scores and export an enriched dataset.
  domain: environmental_monitoring
  execution_model: batch
  topology: linear
  information_sufficiency: high
  notes:
  - 'Chains seven enrichment steps: format, geocode, weather, land use, population, risk score, and CSV
    export.'
  - External APIs are mocked with deterministic fixtures.
schedule:
  type: manual
  expression: null
  timezone: null
  start_date: null
  catchup: false
external_systems:
- system_id: source_filesystem
  type: filesystem
  name: Source filesystem
  identifier: /data/stations
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: geocoding_api
  type: http_api
  name: HERE Geocoding API
  identifier: geocodingHere
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
- system_id: weather_api
  type: http_api
  name: OpenMeteo API
  identifier: openmeteo
  access_mode: invoke
  authentication: none
  mock_strategy: fixture
- system_id: land_use_api
  type: http_api
  name: Geoapify API
  identifier: geoapify
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
- system_id: population_api
  type: http_api
  name: WorldPop API
  identifier: worldpop
  access_mode: invoke
  authentication: none
  mock_strategy: fixture
service_intents:
- intent_id: load_and_modify_stations
  name: Ingest and format station data
  category: Transformer
  capability: Parse the station CSV, attach dataset/table/date-column metadata, and emit structured tabular
    JSON with format status.
  source_step_refs:
  - load_and_modify_stations
  evidence:
  - source: description
    text: Ingest and format station data from CSV to JSON.
  inputs:
  - stations_csv
  outputs:
  - formatted_stations_json
  - format_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - A readable station CSV with expected columns is available.
  effects:
  - Structured tabular JSON and format status are emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step maps directly to a CSV-to-JSON formatting capability with dataset
    and date-column metadata.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: geocode_stations
  name: Geocode station locations
  category: Reconciler
  capability: Enrich structured station JSON with latitude and longitude by geocoding address values through
    a bound geocoding API.
  source_step_refs:
  - geocode_stations
  evidence:
  - source: description
    text: Geocode station locations using HERE API.
  inputs:
  - formatted_stations_json
  - geocoding_api_resource
  outputs:
  - geocoded_stations_json
  - geocoding_status
  external_system_refs:
  - geocoding_api
  preconditions:
  - Structured station JSON has an address column.
  effects:
  - Geocoded tabular JSON with coordinate columns and geocoding status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: The source step requires a geocoding reconciliation capability specific to
    HERE-compatible APIs.
  confidence: explicit
  ambiguity:
    status: resolved
    notes:
    - Mock geocoding returns deterministic coordinates for fixture addresses.
- intent_id: fetch_historical_weather
  name: Fetch historical weather
  category: DomainAdapter
  capability: Enrich geocoded station JSON with historical weather variables from a bound OpenMeteo-compatible
    API using coordinate and date parameters.
  source_step_refs:
  - fetch_historical_weather
  evidence:
  - source: description
    text: Fetch historical weather data for station locations.
  inputs:
  - geocoded_stations_json
  - weather_api_resource
  outputs:
  - weather_enriched_json
  - weather_enrichment_status
  external_system_refs:
  - weather_api
  preconditions:
  - Geocoded station JSON has latitude, longitude, and date columns.
  effects:
  - Weather-enriched tabular JSON and enrichment status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: forbidden
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: The source requires an explicit OpenMeteo-compatible historical weather enrichment
    step.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: classify_land_use
  name: Classify land use
  category: ScoringService
  capability: Classify land-use type for station coordinates using a bound Geoapify- compatible land-use
    classification API.
  source_step_refs:
  - classify_land_use
  evidence:
  - source: description
    text: Classify land use type for station locations.
  inputs:
  - weather_enriched_json
  - land_use_api_resource
  outputs:
  - land_use_enriched_json
  - land_use_classification_status
  external_system_refs:
  - land_use_api
  preconditions:
  - Weather-enriched JSON has latitude and longitude columns.
  effects:
  - Land-use-enriched tabular JSON and classification status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: optional
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: The source step requires a coordinate-based land-use classification capability
    specific to Geoapify-compatible APIs.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: fetch_population_density
  name: Fetch population density
  category: DomainAdapter
  capability: Enrich land-use-enriched station JSON with population density from a bound WorldPop-compatible
    API using coordinates and radius.
  source_step_refs:
  - fetch_population_density
  evidence:
  - source: description
    text: Fetch population density data for station locations.
  inputs:
  - land_use_enriched_json
  - population_api_resource
  outputs:
  - population_enriched_json
  - population_enrichment_status
  external_system_refs:
  - population_api
  preconditions:
  - Land-use-enriched JSON has latitude and longitude columns.
  effects:
  - Population-density-enriched tabular JSON and enrichment status are emitted.
  required_policy_properties:
    network_access: required
    secret_access: forbidden
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: The source step requires a WorldPop-compatible population density enrichment
    capability.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: calculate_risk_score
  name: Calculate environmental risk score
  category: ScoringService
  capability: Compute a composite environmental risk score from configured risk factor columns and append
    it to the tabular JSON.
  source_step_refs:
  - calculate_risk_score
  evidence:
  - source: description
    text: Calculate environmental risk score based on multiple factors.
  inputs:
  - population_enriched_json
  outputs:
  - risk_scored_json
  - risk_scoring_status
  external_system_refs: []
  preconditions:
  - Population-enriched JSON contains all required risk-factor columns.
  effects:
  - Risk-scored tabular JSON and scoring status are emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step requires an explicit environmental risk scoring/column-extension
    capability.
  confidence: explicit
  ambiguity:
    status: resolved
    notes:
    - Mock uses a deterministic weighted formula on configured input columns.
- intent_id: save_environmental_dataset
  name: Save enriched environmental dataset
  category: Transformer
  capability: Export the risk-scored tabular JSON to a deterministic CSV artifact and emit export status.
  source_step_refs:
  - save_environmental_dataset
  evidence:
  - source: description
    text: Save final enriched dataset to CSV format.
  inputs:
  - risk_scored_json
  outputs:
  - enriched_dataset_csv
  - export_status
  external_system_refs: []
  preconditions:
  - Risk-scored JSON has rows and columns ready for CSV serialization.
  effects:
  - An enriched CSV artifact and export status are emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: The source step exports the final enriched dataset to CSV.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: load_and_modify_stations
    to: geocode_stations
  - from: geocode_stations
    to: fetch_historical_weather
  - from: fetch_historical_weather
    to: classify_land_use
  - from: classify_land_use
    to: fetch_population_density
  - from: fetch_population_density
    to: calculate_risk_score
  - from: calculate_risk_score
    to: save_environmental_dataset
  parallel_groups: []
  branches: []
  gates: []
