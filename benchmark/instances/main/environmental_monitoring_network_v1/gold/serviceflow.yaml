bindings:
- intent_id: load_and_modify_stations
  service_id: csv_to_structured_json_table_formatter
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: stations_csv
  output_bindings:
  - port: structured_json
    artifact_id: formatted_stations_json
  - port: transform_status
    artifact_id: format_status
  parameter_bindings:
    output_path: /workspace/artifacts/formatted_stations_json.json
    dataset_id: '2'
    table_name: JOT_
    date_column: installation_date
    has_header: true
    delimiter: ','
  secret_bindings: []
  rationale: The descriptor formats CSV into structured tabular JSON with dataset, table, and date-column
    metadata as required by the source step.
  confidence: strongly_inferred
- intent_id: geocode_stations
  service_id: tabular_address_geocoding_enricher
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: formatted_stations_json
  - port: geocoding_api_resource
    artifact_id: geocoding_api_resource
  output_bindings:
  - port: geocoded_json
    artifact_id: geocoded_stations_json
  - port: geocoding_status
    artifact_id: geocoding_status
  parameter_bindings:
    address_column: location
    latitude_column: latitude
    longitude_column: longitude
    geocoder_id: geocodingHere
    dataset_id: '2'
    output_path: /workspace/artifacts/geocoded_stations_json.json
  secret_bindings:
  - secret: geocoding_api_token
    kubernetes_secret: here-api
    key: api-token
  rationale: The descriptor geocodes address values using a HERE-compatible geocoding API and appends
    latitude/longitude columns.
  confidence: strongly_inferred
- intent_id: fetch_historical_weather
  service_id: openmeteo_historical_weather_tabular_enricher
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: geocoded_stations_json
  - port: weather_api_resource
    artifact_id: weather_api_resource
  output_bindings:
  - port: weather_enriched_json
    artifact_id: weather_enriched_json
  - port: enrichment_status
    artifact_id: weather_enrichment_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    date_column: installation_date
    variables:
    - apparent_temperature_max
    - apparent_temperature_min
    - precipitation_sum
    - precipitation_hours
    date_format: '%Y%m%d'
    output_path: /workspace/artifacts/weather_enriched_json.json
  secret_bindings: []
  rationale: The descriptor enriches station rows with historical weather variables from an OpenMeteo-compatible
    API using coordinate and date inputs.
  confidence: explicit
- intent_id: classify_land_use
  service_id: coordinate_land_use_classification_enricher
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: weather_enriched_json
  - port: land_use_api_resource
    artifact_id: land_use_api_resource
  output_bindings:
  - port: land_use_enriched_json
    artifact_id: land_use_enriched_json
  - port: classification_status
    artifact_id: land_use_classification_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    output_column: land_use_type
    output_path: /workspace/artifacts/land_use_enriched_json.json
  secret_bindings: []
  rationale: The descriptor classifies land-use type for each station coordinate using a Geoapify-compatible
    land-use API.
  confidence: explicit
- intent_id: fetch_population_density
  service_id: worldpop_population_density_tabular_enricher
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: land_use_enriched_json
  - port: population_api_resource
    artifact_id: population_api_resource
  output_bindings:
  - port: population_enriched_json
    artifact_id: population_enriched_json
  - port: enrichment_status
    artifact_id: population_enrichment_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    radius: 5000
    output_column: population_density
    output_path: /workspace/artifacts/population_enriched_json.json
  secret_bindings: []
  rationale: The descriptor enriches station rows with population density from a WorldPop-compatible API
    using coordinates and a search radius.
  confidence: explicit
- intent_id: calculate_risk_score
  service_id: environmental_risk_score_column_calculator
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: population_enriched_json
  output_bindings:
  - port: risk_scored_json
    artifact_id: risk_scored_json
  - port: scoring_status
    artifact_id: risk_scoring_status
  parameter_bindings:
    extender_id: environmentalRiskCalculator
    input_columns:
    - precipitation_sum
    - population_density
    - land_use_type
    output_column: risk_score
    output_path: /workspace/artifacts/risk_scored_json.json
  secret_bindings: []
  rationale: The descriptor computes a composite environmental risk score from configured input risk-factor
    columns.
  confidence: explicit
- intent_id: save_environmental_dataset
  service_id: structured_json_to_csv_exporter
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: risk_scored_json
  output_bindings:
  - port: csv_file
    artifact_id: enriched_dataset_csv
  - port: export_status
    artifact_id: export_status
  parameter_bindings:
    output_filename: enriched_stations.csv
    dataset_id: '2'
    include_header: true
    delimiter: ','
  secret_bindings: []
  rationale: The descriptor exports the final risk-scored tabular JSON to a deterministic CSV file.
  confidence: explicit
