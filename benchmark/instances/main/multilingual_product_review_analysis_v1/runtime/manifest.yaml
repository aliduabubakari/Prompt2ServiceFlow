runtime_manifest_version: 0.1.0
pipeline_id: multilingual_product_review_analysis_v1
image: python:3.12-slim
workflow_parameters:
- name: fixture-file
  default: reviews.csv
tasks:
- intent_id: load_and_modify_reviews
  script: scripts/01_load_reviews.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/{fixture-file}'
  retries: 1
- intent_id: detect_language
  script: scripts/02_detect_language.py
  dependencies:
  - load_and_modify_reviews
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: analyze_sentiment
  script: scripts/03_analyze_sentiment.py
  dependencies:
  - detect_language
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: extract_features
  script: scripts/04_extract_features.py
  dependencies:
  - analyze_sentiment
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: save_enriched_reviews
  script: scripts/05_save_reviews.py
  dependencies:
  - extract_features
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
scenarios:
- name: three_reviews
  parameters:
    fixture-file: reviews.csv
  fixture_root: fixtures/scenarios/nominal
cron:
  schedule: 0 0 * * *
  timezone: UTC
