bindings:
- intent_id: load_and_modify
  service_id: csv_to_structured_json_table_formatter
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: input_csv
  output_bindings:
  - port: structured_json
    artifact_id: formatted_json
  - port: transform_status
    artifact_id: format_status
  parameter_bindings:
    output_path: /workspace/artifacts/formatted.json
    has_header: true
  secret_bindings: []
  rationale: Formats CSV.
  confidence: explicit
- intent_id: reconciliation
  service_id: tabular_entity_reconciliation_enricher
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: formatted_json
  - port: entity_reconciliation_resource
    artifact_id: reconciliation_resource
  output_bindings:
  - port: reconciled_json
    artifact_id: reconciled_json
  - port: reconciliation_status
    artifact_id: reconciliation_status
  parameter_bindings:
    reconciliator_id: wikidata
    column_name: name
    output_path: /workspace/artifacts/reconciled.json
  secret_bindings: []
  rationale: Reconciles entities.
  confidence: explicit
- intent_id: openmeteo_extension
  service_id: openmeteo_historical_weather_tabular_enricher
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: reconciled_json
  - port: weather_api_resource
    artifact_id: weather_api_resource
  output_bindings:
  - port: weather_enriched_json
    artifact_id: weather_json
  - port: enrichment_status
    artifact_id: weather_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    date_column: date
    variables:
    - temperature
    output_path: /workspace/artifacts/weather.json
  secret_bindings: []
  rationale: Adds OpenMeteo weather.
  confidence: explicit
- intent_id: column_extension
  service_id: environmental_risk_score_column_calculator
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: weather_json
  output_bindings:
  - port: risk_scored_json
    artifact_id: extended_json
  - port: scoring_status
    artifact_id: extension_status
  parameter_bindings:
    input_columns:
    - temperature
    output_column: risk_score
    output_path: /workspace/artifacts/extended.json
  secret_bindings: []
  rationale: Extends columns.
  confidence: explicit
- intent_id: save
  service_id: structured_json_to_csv_exporter
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: extended_json
  output_bindings:
  - port: csv_file
    artifact_id: output_csv
  - port: export_status
    artifact_id: export_status
  parameter_bindings:
    output_filename: output.csv
    include_header: true
  secret_bindings: []
  rationale: Exports CSV.
  confidence: explicit
policies:
