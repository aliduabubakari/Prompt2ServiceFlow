apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-execution-dag-run-scripts
  namespace: prompt2serviceflow
data:
  01_run.py: "#!/usr/bin/env python3\n\"\"\"Pipeline execution DAG mock.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, csv, json, shutil\nfrom pathlib import Path\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--step\",type=str,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    st={\"\
    success\":True,\"errors\":[]}\n    if a.step==\"load\":\n        fixture=Path(a.workspace)/\"../fixtures/data.csv\"\
    \n        dest=art/\"data.csv\"; shutil.copyfile(fixture,dest) if fixture.is_file() else dest.write_text(\"\
    id\\n1\\n2\\n3\\n\",encoding=\"utf-8\")\n        with dest.open(encoding=\"utf-8\",newline=\"\") as\
    \ f: r=csv.DictReader(f); rows=list(r); cols=r.fieldnames or []\n        (art/\"formatted_json.json\"\
    ).write_text(json.dumps({\"columns\":cols,\"rows\":rows},indent=2)+\"\\n\",encoding=\"utf-8\")\n \
    \       (art/\"format_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    elif a.step==\"reconcile\":\n        (art/\"reconciled_json.json\").write_text(json.dumps({\"\
    columns\":[\"id\",\"name\"],\"rows\":[{\"id\":1,\"name\":\"A\"}]},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n        (art/\"reconciliation_status.json\").write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    elif a.step==\"weather\":\n        (art/\"weather_json.json\").write_text(json.dumps({\"\
    columns\":[\"id\",\"temp\"],\"rows\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"weather_status.json\"\
    ).write_text(json.dumps(st,indent=2)+\"\\n\",encoding=\"utf-8\")\n    elif a.step==\"extend\":\n \
    \       (art/\"extended_json.json\").write_text(json.dumps({\"columns\":[\"id\",\"risk\"],\"rows\"\
    :[]},indent=2)+\"\\n\",encoding=\"utf-8\")\n        (art/\"extension_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    elif a.step==\"save\":\n        (art/\"output.csv\").write_text(\"\
    id,risk\\n\",encoding=\"utf-8\")\n        (art/\"export_status.json\").write_text(json.dumps(st,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-execution-dag-run-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: 'id,name,latitude,longitude,date

    1,Station A,40.7128,-74.0060,2024-01-15

    2,Station B,37.7749,-122.4194,2024-01-15

    3,Station C,39.7392,-104.9903,2024-01-15'
  fixture-0001: "{\n  \"pipeline_id\": \"pipeline_execution_dag\",\n  \"inputs\": {\n    \"reconciliation\"\
    : \"reconciliation.json\",\n    \"weather_api\": \"weather_api.json\",\n    \"data\": \"data.csv\"\
    \n  },\n  \"input_modalities\": [\n    \"json\",\n    \"table\"\n  ],\n  \"systems\": [\n    \"system_a\"\
    ,\n    \"system_b\"\n  ]\n}"
  fixture-0002: '{"driver":"filesystem-mock"}'
  fixture-0003: '{"driver":"filesystem-mock"}'
---
apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-execution-dag-run-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: pipeline-execution-dag-run
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: pipeline-execution-dag-run-scripts
  - name: fixtures
    configMap:
      name: pipeline-execution-dag-run-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: reconciliation.json
      - key: fixture-0003
        path: weather_api.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: load-and-modify
        template: run-load-and-modify
      - name: reconciliation
        template: run-reconciliation
        depends: load-and-modify.Succeeded
      - name: openmeteo-extension
        template: run-openmeteo-extension
        depends: reconciliation.Succeeded
      - name: column-extension
        template: run-column-extension
        depends: openmeteo-extension.Succeeded
      - name: save
        template: run-save
        depends: column-extension.Succeeded
  - name: run-load-and-modify
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_and_modify
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - load
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-reconciliation
    metadata:
      annotations:
        prompt2serviceflow/intent-id: reconciliation
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - reconcile
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-openmeteo-extension
    metadata:
      annotations:
        prompt2serviceflow/intent-id: openmeteo_extension
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - weather
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-column-extension
    metadata:
      annotations:
        prompt2serviceflow/intent-id: column_extension
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - extend
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-save
    metadata:
      annotations:
        prompt2serviceflow/intent-id: save
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - save
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
