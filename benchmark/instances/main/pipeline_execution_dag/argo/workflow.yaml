apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pipeline-execution-dag-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: pipeline-execution-dag
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: pipeline-execution-dag-scripts
  - name: fixtures
    configMap:
      name: pipeline-execution-dag-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: reconciliation.json
      - key: fixture-0003
        path: weather_api.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: load-and-modify
        template: run-load-and-modify
      - name: reconciliation
        template: run-reconciliation
        depends: load-and-modify.Succeeded
      - name: openmeteo-extension
        template: run-openmeteo-extension
        depends: reconciliation.Succeeded
      - name: column-extension
        template: run-column-extension
        depends: openmeteo-extension.Succeeded
      - name: save
        template: run-save
        depends: column-extension.Succeeded
  - name: run-load-and-modify
    metadata:
      annotations:
        prompt2serviceflow/intent-id: load_and_modify
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - load
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-reconciliation
    metadata:
      annotations:
        prompt2serviceflow/intent-id: reconciliation
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - reconcile
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-openmeteo-extension
    metadata:
      annotations:
        prompt2serviceflow/intent-id: openmeteo_extension
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - weather
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-column-extension
    metadata:
      annotations:
        prompt2serviceflow/intent-id: column_extension
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - extend
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-save
    metadata:
      annotations:
        prompt2serviceflow/intent-id: save
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - save
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
