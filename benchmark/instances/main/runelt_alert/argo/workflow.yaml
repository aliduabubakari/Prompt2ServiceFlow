apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: runelt-alert-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: runelt-alert
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: runelt-alert-scripts
  - name: fixtures
    configMap:
      name: runelt-alert-fixtures
      items:
      - key: fixture-0000
        path: fixture.json
      - key: fixture-0001
        path: snowflake.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: run-ctas-mau-summary
        template: run-run-ctas-mau-summary
  - name: run-run-ctas-mau-summary
    metadata:
      annotations:
        prompt2serviceflow/intent-id: run_ctas_mau_summary
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
