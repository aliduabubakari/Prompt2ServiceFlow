artifact_mapping_version: 0.1.0
benchmark_id: main:fraud_detection_triage
mappings:
- intent_id: analyze_transactions
  inputs:
    transaction_csv: transaction_csv
  outputs:
    risk_score: risk_score
    scored_transactions: scored_transactions
    scoring_status: scoring_status
- intent_id: route_transaction
  inputs:
    risk_score: risk_score
  outputs:
    routing_decision: routing_decision
- intent_id: route_to_manual_review
  inputs:
    routing_decision: routing_decision
    scored_transactions: scored_transactions
  outputs:
    manual_review_status: manual_review_status
- intent_id: route_to_auto_approve
  inputs:
    routing_decision: routing_decision
    scored_transactions: scored_transactions
  outputs:
    auto_approval_status: auto_approval_status
- intent_id: send_notification
  inputs:
    email_service: email_service_resource
  outputs:
    notification_status: notification_status
