apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fraud-detection-triage-high-risk-manual-review-scripts
  namespace: prompt2serviceflow
data:
  01_analyze_transactions.py: "#!/usr/bin/env python3\n\"\"\"Mock fraud risk analyzer for daily transaction\
    \ CSV batches.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport\
    \ json\nimport shutil\nfrom pathlib import Path\n\n# Merchant categories with elevated risk weights\n\
    HIGH_RISK_CATEGORIES = {\"crypto_exchange\", \"money_transfer\", \"gambling\", \"prepaid_card\"}\n\
    HIGH_AMOUNT_THRESHOLD = 5000.0\n\n\ndef compute_row_score(amount: float, category: str) -> float:\n\
    \    score = 0.0\n    if amount > HIGH_AMOUNT_THRESHOLD:\n        score += min(0.6, amount / 20000.0)\n\
    \    if category.lower() in HIGH_RISK_CATEGORIES:\n        score += 0.4\n    return min(round(score,\
    \ 4), 1.0)\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    parser.add_argument(\"--execution-time\", type=str, default=None)\n    args = parser.parse_args()\n\
    \n    artifacts = args.workspace / \"artifacts\"\n    artifacts.mkdir(parents=True, exist_ok=True)\n\
    \    dataset_path = artifacts / \"transactions.csv\"\n    shutil.copyfile(args.fixture, dataset_path)\n\
    \n    with dataset_path.open(encoding=\"utf-8\", newline=\"\") as handle:\n        reader = csv.DictReader(handle)\n\
    \        rows = list(reader)\n\n    scored_transactions: list[dict] = []\n    for row in rows:\n \
    \       amount = float(row[\"amount\"])\n        category = row[\"merchant_category\"]\n        score\
    \ = compute_row_score(amount, category)\n        scored_transactions.append(\n            {\n    \
    \            \"transaction_id\": row[\"transaction_id\"],\n                \"score\": score,\n   \
    \             \"features\": {\n                    \"amount\": amount,\n                    \"merchant_category\"\
    : category,\n                    \"customer_id\": row[\"customer_id\"],\n                },\n    \
    \        }\n        )\n\n    max_score = max((txn[\"score\"] for txn in scored_transactions), default=0.0)\n\
    \n    risk_score = {\n        \"score\": round(max_score, 4),\n        \"score_range\": \"0_to_1\"\
    ,\n        \"transactions_scored\": len(scored_transactions),\n        \"aggregate_score_method\"\
    : \"max\",\n        \"risk_model_profile\": \"deterministic_rule_based_v1\",\n    }\n    (artifacts\
    \ / \"risk_score.json\").write_text(\n        json.dumps(risk_score, indent=2) + \"\\n\", encoding=\"\
    utf-8\"\n    )\n\n    scored_doc = {\"transactions\": scored_transactions}\n    (artifacts / \"scored_transactions.json\"\
    ).write_text(\n        json.dumps(scored_doc, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n \
    \   scoring_status = {\n        \"success\": True,\n        \"rows_read\": len(rows),\n        \"\
    rows_scored\": len(scored_transactions),\n        \"risk_model_profile\": \"deterministic_rule_based_v1\"\
    ,\n        \"execution_time\": args.execution_time,\n        \"errors\": [],\n    }\n    (artifacts\
    \ / \"scoring_status.json\").write_text(\n        json.dumps(scoring_status, indent=2) + \"\\n\",\
    \ encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  02_route_transaction.py: "#!/usr/bin/env python3\n\"\"\"Apply risk threshold and emit deterministic\
    \ routing decision.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\n\
    from pathlib import Path\n\n\nTHRESHOLD = 0.8\nMANUAL_REVIEW_LABEL = \"manual_review\"\nAUTO_APPROVE_LABEL\
    \ = \"auto_approve\"\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace\
    \ / \"artifacts\"\n    risk_score = json.loads((artifacts / \"risk_score.json\").read_text(encoding=\"\
    utf-8\"))\n    score = risk_score[\"score\"]\n    manual_review = score > THRESHOLD\n    auto_approve\
    \ = score <= THRESHOLD\n    route = MANUAL_REVIEW_LABEL if manual_review else AUTO_APPROVE_LABEL\n\
    \n    decision = {\n        \"score\": score,\n        \"risk_threshold\": THRESHOLD,\n        \"\
    route\": route,\n        \"manual_review\": manual_review,\n        \"auto_approve\": auto_approve,\n\
    \        \"reason\": f\"Score {score} {'>' if manual_review else '<='} threshold {THRESHOLD}\",\n\
    \    }\n    (artifacts / \"routing_decision.json\").write_text(\n        json.dumps(decision, indent=2)\
    \ + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"route.txt\").write_text(route, encoding=\"\
    utf-8\")\n\n\nif __name__ == \"__main__\":\n    main()\n"
  03_route_to_manual_review.py: "#!/usr/bin/env python3\n\"\"\"Record manual-review branch processing\
    \ status.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib\
    \ import Path\n\nTHRESHOLD = 0.8\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \n    artifacts = args.workspace / \"artifacts\"\n    routing = json.loads((artifacts / \"routing_decision.json\"\
    ).read_text(encoding=\"utf-8\"))\n    scored = json.loads((artifacts / \"scored_transactions.json\"\
    ).read_text(encoding=\"utf-8\"))\n\n    # Validate that manual review route was selected\n    if not\
    \ routing[\"manual_review\"]:\n        raise SystemExit(\"Manual review route not selected in routing\
    \ decision\")\n\n    transactions = scored[\"transactions\"]\n    bounded_refs = [\n        txn[\"\
    transaction_id\"] for txn in transactions if txn[\"score\"] > THRESHOLD\n    ][:100]\n\n    status\
    \ = {\n        \"success\": True,\n        \"route\": routing[\"route\"],\n        \"manual_review_requested\"\
    : routing[\"manual_review\"],\n        \"transactions_marked_for_review\": len(transactions),\n  \
    \      \"bounded_transaction_refs\": bounded_refs,\n        \"errors\": [],\n    }\n    (artifacts\
    \ / \"manual_review_status.json\").write_text(\n        json.dumps(status, indent=2) + \"\\n\", encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  04_route_to_auto_approve.py: "#!/usr/bin/env python3\n\"\"\"Record auto-approval branch processing status.\"\
    \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\
    \n\nTHRESHOLD = 0.8\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace\
    \ / \"artifacts\"\n    routing = json.loads((artifacts / \"routing_decision.json\").read_text(encoding=\"\
    utf-8\"))\n    scored = json.loads((artifacts / \"scored_transactions.json\").read_text(encoding=\"\
    utf-8\"))\n\n    # Validate that auto-approval route was selected\n    if not routing[\"auto_approve\"\
    ]:\n        raise SystemExit(\"Auto-approval route not selected in routing decision\")\n\n    transactions\
    \ = scored[\"transactions\"]\n    bounded_refs = [\n        txn[\"transaction_id\"] for txn in transactions\
    \ if txn[\"score\"] <= THRESHOLD\n    ][:100]\n\n    status = {\n        \"success\": True,\n    \
    \    \"route\": routing[\"route\"],\n        \"auto_approval_recorded\": routing[\"auto_approve\"\
    ],\n        \"transactions_auto_approved\": len(transactions),\n        \"bounded_transaction_refs\"\
    : bounded_refs,\n        \"errors\": [],\n    }\n    (artifacts / \"auto_approval_status.json\").write_text(\n\
    \        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
  05_send_notification.py: "#!/usr/bin/env python3\n\"\"\"Record a deterministic mock email delivery receipt\
    \ at the merge point.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\n\
    from pathlib import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--execution-time\", type=str,\
    \ default=None)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"artifacts\"\n\
    \    exec_ts = args.execution_time or \"unknown\"\n\n    # Check which branch completed\n    manual_path\
    \ = artifacts / \"manual_review_status.json\"\n    auto_path = artifacts / \"auto_approval_status.json\"\
    \n    branch_info = []\n    if manual_path.is_file():\n        branch_info.append(\"manual_review\"\
    )\n    if auto_path.is_file():\n        branch_info.append(\"auto_approve\")\n\n    status = {\n \
    \       \"sent\": True,\n        \"recipients\": [\"fraud-team@company.com\"],\n        \"subject\"\
    : \"Fraud Detection Triage Complete\",\n        \"message_id\": f\"mock-fraud-triage-{'-'.join(branch_info)}-{exec_ts[:10]}\"\
    ,\n        \"execution_time\": exec_ts,\n        \"errors\": [],\n    }\n    (artifacts / \"notification_status.json\"\
    ).write_text(\n        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__\
    \ == \"__main__\":\n    main()\n"
---
