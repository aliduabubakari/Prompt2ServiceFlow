requirement:
  name: Medical Facility Accessibility v1
  purpose: Process medical facility locations, geocode addresses, calculate spatial proximity to public
    transport and residential zones, and export enriched dataset.
  domain: urban_planning
  execution_model: batch
  topology: linear
  information_sufficiency: high
  notes:
  - Five-step linear geospatial enrichment pipeline with HERE geocoding and spatial distance calculations.
schedule:
  type: manual
  expression: null
  timezone: null
  start_date: null
  catchup: false
external_systems:
- system_id: source_filesystem
  type: filesystem
  name: Source filesystem
  identifier: /tmp/medical/data
  access_mode: read
  authentication: none
  mock_strategy: fixture
- system_id: geocoding_api
  type: http_api
  name: HERE Geocoding API
  identifier: geocodingHere
  access_mode: invoke
  authentication: secret
  mock_strategy: fixture
service_intents:
- intent_id: load_and_modify_facilities
  name: Load and format facility data
  category: Transformer
  capability: Parse facility CSV and emit structured tabular JSON with metadata.
  source_step_refs:
  - load_and_modify_facilities
  evidence:
  - source: description
    text: Ingest and format medical facility data from CSV to structured JSON.
  inputs:
  - facilities_csv
  outputs:
  - formatted_facilities_json
  - format_status
  external_system_refs:
  - source_filesystem
  preconditions:
  - Readable facilities CSV available.
  effects:
  - Structured tabular JSON and format status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step formats CSV into structured JSON with metadata.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: geocode_facilities
  name: Geocode facility addresses
  category: Reconciler
  capability: Enrich facility JSON with latitude/longitude via HERE-compatible geocoding API.
  source_step_refs:
  - geocode_facilities
  evidence:
  - source: description
    text: Geocode facility addresses to latitude/longitude coordinates using HERE Maps API.
  inputs:
  - formatted_facilities_json
  - geocoding_api_resource
  outputs:
  - geocoded_facilities_json
  - geocoding_status
  external_system_refs:
  - geocoding_api
  preconditions:
  - Structured facility JSON with address column available.
  effects:
  - Geocoded JSON with lat/lon and geocoding status emitted.
  required_policy_properties:
    network_access: required
    secret_access: required
    idempotency: preferred
    data_sensitivity:
    - internal
    - confidential
  decomposition_rationale: Source step geocodes addresses via HERE-compatible API.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: calc_distance_public_transport
  name: Calculate public transport distance
  category: Reconciler
  capability: Compute nearest distance from each facility to public transport stops.
  source_step_refs:
  - calc_distance_public_transport
  evidence:
  - source: description
    text: Calculate spatial distance from facilities to nearest public transport stops.
  inputs:
  - geocoded_facilities_json
  - transport_stops_geojson
  outputs:
  - pt_distance_json
  - pt_distance_status
  external_system_refs: []
  preconditions:
  - Geocoded facility JSON with lat/lon available
  - transport stops GeoJSON available.
  effects:
  - Distance-to-transport column appended and status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step computes nearest distance to public transport.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: calc_distance_residential
  name: Calculate residential area distance
  category: Reconciler
  capability: Compute nearest distance from each facility to residential zones.
  source_step_refs:
  - calc_distance_residential
  evidence:
  - source: description
    text: Calculate spatial distance from facilities to nearest residential areas.
  inputs:
  - pt_distance_json
  - residential_areas_geojson
  outputs:
  - residential_distance_json
  - residential_distance_status
  external_system_refs: []
  preconditions:
  - Facility JSON with transport distances available
  - residential GeoJSON available.
  effects:
  - Distance-to-residential column appended and status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step computes nearest distance to residential zones.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
- intent_id: save_accessibility_data
  name: Export enriched accessibility data
  category: Transformer
  capability: Export the fully enriched facility JSON to a deterministic CSV file.
  source_step_refs:
  - save_accessibility_data
  evidence:
  - source: description
    text: Save final enriched accessibility data to CSV format.
  inputs:
  - residential_distance_json
  outputs:
  - enriched_facilities_csv
  - export_status
  external_system_refs: []
  preconditions:
  - Fully enriched facility JSON available.
  effects:
  - CSV artifact and export status emitted.
  required_policy_properties:
    network_access: forbidden
    secret_access: forbidden
    idempotency: required
    data_sensitivity:
    - internal
  decomposition_rationale: Source step exports final enriched data to CSV.
  confidence: explicit
  ambiguity:
    status: none
    notes: []
control_flow:
  edges:
  - from: load_and_modify_facilities
    to: geocode_facilities
  - from: geocode_facilities
    to: calc_distance_public_transport
  - from: calc_distance_public_transport
    to: calc_distance_residential
  - from: calc_distance_residential
    to: save_accessibility_data
  parallel_groups: []
  branches: []
  gates: []
