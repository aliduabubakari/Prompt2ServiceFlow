bindings:
- intent_id: load_and_modify_facilities
  service_id: csv_to_structured_json_table_formatter
  service_version: 1.0.0
  input_bindings:
  - port: csv_file
    artifact_id: facilities_csv
  output_bindings:
  - port: structured_json
    artifact_id: formatted_facilities_json
  - port: transform_status
    artifact_id: format_status
  parameter_bindings:
    output_path: /workspace/artifacts/formatted_facilities_json.json
    dataset_id: '2'
    table_name: JOT_
    has_header: true
  secret_bindings: []
  rationale: Formats CSV into structured tabular JSON with metadata.
  confidence: explicit
- intent_id: geocode_facilities
  service_id: tabular_address_geocoding_enricher
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: formatted_facilities_json
  - port: geocoding_api_resource
    artifact_id: geocoding_api_resource
  output_bindings:
  - port: geocoded_json
    artifact_id: geocoded_facilities_json
  - port: geocoding_status
    artifact_id: geocoding_status
  parameter_bindings:
    address_column: address
    latitude_column: latitude
    longitude_column: longitude
    geocoder_id: geocodingHere
    dataset_id: '2'
    output_path: /workspace/artifacts/geocoded_facilities_json.json
  secret_bindings:
  - secret: geocoding_api_token
    kubernetes_secret: here-api
    key: api-token
  rationale: Geocodes facility addresses via HERE-compatible API.
  confidence: explicit
- intent_id: calc_distance_public_transport
  service_id: geospatial_nearest_distance_column_extender
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: geocoded_facilities_json
  - port: target_layer_geojson
    artifact_id: transport_stops_geojson
  output_bindings:
  - port: extended_tabular_json
    artifact_id: pt_distance_json
  - port: distance_status
    artifact_id: pt_distance_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    target_layer: public_transport
    output_column: distance_to_pt
    output_path: /workspace/artifacts/pt_distance_json.json
  secret_bindings: []
  rationale: Computes nearest distance to public transport stops.
  confidence: explicit
- intent_id: calc_distance_residential
  service_id: geospatial_nearest_distance_column_extender
  service_version: 1.0.0
  input_bindings:
  - port: source_tabular_json
    artifact_id: pt_distance_json
  - port: target_layer_geojson
    artifact_id: residential_areas_geojson
  output_bindings:
  - port: extended_tabular_json
    artifact_id: residential_distance_json
  - port: distance_status
    artifact_id: residential_distance_status
  parameter_bindings:
    lat_column: latitude
    lon_column: longitude
    target_layer: residential_areas
    output_column: distance_to_residential
    output_path: /workspace/artifacts/residential_distance_json.json
  secret_bindings: []
  rationale: Computes nearest distance to residential zones.
  confidence: explicit
- intent_id: save_accessibility_data
  service_id: structured_json_to_csv_exporter
  service_version: 1.0.0
  input_bindings:
  - port: structured_json
    artifact_id: residential_distance_json
  output_bindings:
  - port: csv_file
    artifact_id: enriched_facilities_csv
  - port: export_status
    artifact_id: export_status
  parameter_bindings:
    output_filename: enriched_facilities.csv
    include_header: true
    delimiter: ','
  secret_bindings: []
  rationale: Exports final enriched JSON to CSV.
  confidence: explicit
