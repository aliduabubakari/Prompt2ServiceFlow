runtime_manifest_version: 0.1.0
pipeline_id: global_dag
image: python:3.12-slim
workflow_parameters:
- name: death-records-available
  default: true
tasks:
- intent_id: ingest_get_city_code_geo
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_city_code_geo
- intent_id: ingest_get_nuclear_json
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_nuclear_json
- intent_id: ingest_get_nuclear_data
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_nuclear_data
  dependencies:
  - ingest_get_nuclear_json
- intent_id: ingest_get_death_resource_list
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_death_resource_list
- intent_id: ingest_get_death_resources
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_death_resources
  dependencies:
  - ingest_get_death_resource_list
- intent_id: ingest_get_thermal_json
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_thermal_json
- intent_id: ingest_get_thermal_data
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - ingest_get_thermal_data
  dependencies:
  - ingest_get_thermal_json
- intent_id: stage_import_nuclear_clean_data
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_import_nuclear_clean_data
  dependencies: &id001
  - ingest_get_city_code_geo
  - ingest_get_nuclear_data
  - ingest_get_death_resources
  - ingest_get_thermal_data
- intent_id: stage_import_thermal_clean_data
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_import_thermal_clean_data
  dependencies:
  - ingest_get_city_code_geo
  - ingest_get_nuclear_data
  - ingest_get_death_resources
  - ingest_get_thermal_data
  - stage_import_nuclear_clean_data
- intent_id: stage_create_power_plants_table
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_create_power_plants_table
  dependencies:
  - ingest_get_city_code_geo
  - ingest_get_nuclear_data
  - ingest_get_death_resources
  - ingest_get_thermal_data
  - stage_import_thermal_clean_data
- intent_id: stage_create_death_table
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_create_death_table
  dependencies: *id001
- intent_id: stage_load_data_from_ingestion
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_load_data_from_ingestion
  dependencies:
  - stage_create_death_table
- intent_id: stage_cleanse_death_data
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_cleanse_death_data
  dependencies:
  - stage_load_data_from_ingestion
- intent_id: stage_death_emptiness_check
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_death_emptiness_check
  - --death-records-available
  - '{death_records_available}'
  dependencies:
  - stage_cleanse_death_data
  output_parameters:
  - name: has-content
    path: /workspace/artifacts/death_sql_has_content.txt
- intent_id: stage_store_deaths_in_postgres
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_store_deaths_in_postgres
  dependencies:
  - stage_death_emptiness_check
  when: '{{tasks.stage_death_emptiness_check.outputs.parameters.has-content}} == true'
  local_condition:
    path: artifacts/stage_death_emptiness_check_decision.json
    json_path: has_content
    equals: true
- intent_id: stage_clean_tmp_death_files
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_clean_tmp_death_files
  dependencies:
  - stage_store_deaths_in_postgres
  when: '{{tasks.stage_death_emptiness_check.outputs.parameters.has-content}} == true'
  local_condition:
    path: artifacts/stage_death_emptiness_check_decision.json
    json_path: has_content
    equals: true
- intent_id: stage_create_plant_persist_sql_query
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_create_plant_persist_sql_query
  dependencies:
  - stage_create_power_plants_table
- intent_id: stage_store_plants_in_postgres
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_store_plants_in_postgres
  dependencies:
  - stage_create_plant_persist_sql_query
- intent_id: stage_clean_tmp_death_redis
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - stage_clean_tmp_death_redis
  dependencies:
  - stage_store_deaths_in_postgres
  when: '{{tasks.stage_death_emptiness_check.outputs.parameters.has-content}} == true'
  local_condition:
    path: artifacts/stage_death_emptiness_check_decision.json
    json_path: has_content
    equals: true
scenarios:
- name: death_records_present
  parameters:
    death_records_available: true
  fixture_root: fixtures/inputs
- name: death_records_empty
  parameters:
    death_records_available: false
  fixture_root: fixtures/inputs
