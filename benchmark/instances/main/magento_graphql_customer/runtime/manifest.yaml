runtime_manifest_version: 0.1.0
pipeline_id: magento_graphql_customer
image: python:3.12-slim
workflow_parameters: []
tasks:
- intent_id: create_customer
  script: scripts/01_graphql.py
  arguments:
  - --workspace
  - '{workspace}'
  - --op
  - create
  retries: 1
- intent_id: generate_customer_token
  script: scripts/01_graphql.py
  dependencies:
  - create_customer
  arguments:
  - --workspace
  - '{workspace}'
  - --op
  - token
  retries: 1
- intent_id: get_customer_info
  script: scripts/01_graphql.py
  dependencies:
  - generate_customer_token
  arguments:
  - --workspace
  - '{workspace}'
  - --op
  - get
  retries: 1
scenarios:
- name: magento_customer_flow
  parameters: {}
  fixture_root: fixtures/scenarios/nominal
