data:
  01_load_customer_segment_csv.py: "#!/usr/bin/env python3\n\"\"\"Load customer segment CSV and emit structured\
    \ dataset.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport csv\nimport json\n\
    import shutil\nfrom pathlib import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    artifacts.mkdir(parents=True, exist_ok=True)\n    dest = artifacts / \"customer_segments.csv\"\
    \n    shutil.copyfile(args.fixture, dest)\n\n    with dest.open(encoding=\"utf-8\", newline=\"\")\
    \ as f:\n        reader = csv.DictReader(f)\n        rows = list(reader)\n        columns = reader.fieldnames\
    \ or []\n\n    dataset = {\"columns\": columns, \"rows\": rows}\n    (artifacts / \"customer_segments.json\"\
    ).write_text(\n        json.dumps(dataset, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    status\
    \ = {\"success\": True, \"rows_loaded\": len(rows), \"errors\": []}\n    (artifacts / \"load_status.json\"\
    ).write_text(\n        json.dumps(status, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__\
    \ == \"__main__\":\n    main()\n"
  02_send_email_campaign.py: "#!/usr/bin/env python3\n\"\"\"Send mock email campaign to premium segment.\"\
    \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\
    \n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    segs = json.loads((artifacts / \"customer_segments.json\").read_text(encoding=\"\
    utf-8\"))\n\n    premium = [r for r in segs[\"rows\"] if r.get(\"segment\") == \"premium\" and r.get(\"\
    email\", \"\").strip()]\n\n    results = {\n        \"campaign_sent\": True,\n        \"recipients_targeted\"\
    : len(premium),\n        \"segment\": \"premium\",\n        \"channel\": \"email\",\n        \"errors\"\
    : [],\n    }\n    (artifacts / \"email_campaign_results.json\").write_text(\n        json.dumps(results,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  03_send_sms_campaign.py: "#!/usr/bin/env python3\n\"\"\"Send mock SMS campaign to regular segment.\"\
    \"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib import Path\n\
    \n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace / \"\
    artifacts\"\n    segs = json.loads((artifacts / \"customer_segments.json\").read_text(encoding=\"\
    utf-8\"))\n\n    regular = [r for r in segs[\"rows\"] if r.get(\"segment\") == \"regular\" and r.get(\"\
    phone\", \"\").strip()]\n\n    results = {\n        \"campaign_sent\": True,\n        \"recipients_targeted\"\
    : len(regular),\n        \"segment\": \"regular\",\n        \"channel\": \"sms\",\n        \"errors\"\
    : [],\n    }\n    (artifacts / \"sms_campaign_results.json\").write_text(\n        json.dumps(results,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  04_send_push_notification.py: "#!/usr/bin/env python3\n\"\"\"Send mock push notification campaign to\
    \ new segment.\"\"\"\n\nfrom __future__ import annotations\n\nimport argparse\nimport json\nfrom pathlib\
    \ import Path\n\n\ndef main() -> None:\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    args = parser.parse_args()\n\n    artifacts = args.workspace\
    \ / \"artifacts\"\n    segs = json.loads((artifacts / \"customer_segments.json\").read_text(encoding=\"\
    utf-8\"))\n\n    new = [r for r in segs[\"rows\"] if r.get(\"segment\") == \"new\" and r.get(\"device_token\"\
    , \"\").strip()]\n\n    results = {\n        \"campaign_sent\": True,\n        \"recipients_targeted\"\
    : len(new),\n        \"segment\": \"new\",\n        \"channel\": \"push_notification\",\n        \"\
    errors\": [],\n    }\n    (artifacts / \"push_notification_campaign_results.json\").write_text(\n\
    \        json.dumps(results, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
---
