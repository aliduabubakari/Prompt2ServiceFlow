apiVersion: argoproj.io/v1alpha1
kind: CronWorkflow
metadata:
  name: retail-inventory-reconciliation
  namespace: prompt2serviceflow
spec:
  schedules:
  - 0 0 * * *
  timezone: UTC
  concurrencyPolicy: Forbid
  workflowSpec:
    entrypoint: pipeline
    serviceAccountName: prompt2serviceflow-runner
    arguments:
      parameters:
      - name: north-fixture
        value: warehouse_north.csv
      - name: south-fixture
        value: warehouse_south.csv
      - name: east-fixture
        value: warehouse_east.csv
      - name: west-fixture
        value: warehouse_west.csv
    podGC:
      strategy: OnWorkflowCompletion
    volumeClaimTemplates:
    - metadata:
        name: workspace
      spec:
        accessModes:
        - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
    volumes:
    - name: scripts
      configMap:
        name: retail-inventory-reconciliation-scripts
    - name: fixtures
      configMap:
        name: retail-inventory-reconciliation-fixtures
        items:
        - key: fixture-0000
          path: fixture.json
        - key: fixture-0001
          path: warehouse_east.csv
        - key: fixture-0002
          path: warehouse_north.csv
        - key: fixture-0003
          path: warehouse_south.csv
        - key: fixture-0004
          path: warehouse_west.csv
        - key: fixture-0005
          path: warehouse_wms.json
    templates:
    - name: pipeline
      dag:
        tasks:
        - name: fetch-north-warehouse-csv
          template: run-fetch-north-warehouse-csv
        - name: fetch-south-warehouse-csv
          template: run-fetch-south-warehouse-csv
        - name: fetch-east-warehouse-csv
          template: run-fetch-east-warehouse-csv
        - name: fetch-west-warehouse-csv
          template: run-fetch-west-warehouse-csv
        - name: normalize-north-skus
          template: run-normalize-north-skus
          depends: fetch-north-warehouse-csv.Succeeded
        - name: normalize-south-skus
          template: run-normalize-south-skus
          depends: fetch-south-warehouse-csv.Succeeded
        - name: normalize-east-skus
          template: run-normalize-east-skus
          depends: fetch-east-warehouse-csv.Succeeded
        - name: normalize-west-skus
          template: run-normalize-west-skus
          depends: fetch-west-warehouse-csv.Succeeded
        - name: reconcile-all-inventories
          template: run-reconcile-all-inventories
          depends: normalize-north-skus.Succeeded && normalize-south-skus.Succeeded && normalize-east-skus.Succeeded
            && normalize-west-skus.Succeeded
        - name: generate-final-report
          template: run-generate-final-report
          depends: reconcile-all-inventories.Succeeded
    - name: run-fetch-north-warehouse-csv
      metadata:
        annotations:
          prompt2serviceflow/intent-id: fetch_north_warehouse_csv
      container:
        image: python:3.12-slim
        command:
        - python
        args:
        - /opt/p2sf/scripts/01_fetch_warehouse_csv.py
        - --workspace
        - /workspace
        - --fixture
        - /opt/p2sf/fixtures/{{workflow.parameters.north-fixture}}
        - --warehouse
        - north
        volumeMounts:
        - name: scripts
          mountPath: /opt/p2sf/scripts
        - name: fixtures
          mountPath: /opt/p2sf/fixtures
        - name: workspace
          mountPath: /workspace
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
      retryStrategy:
        limit: '2'
        retryPolicy: OnError
    - name: run-fetch-south-warehouse-csv
      metadata:
        annotations:
          prompt2serviceflow/intent-id: fetch_south_warehouse_csv
      container:
        image: python:3.12-slim
        command:
