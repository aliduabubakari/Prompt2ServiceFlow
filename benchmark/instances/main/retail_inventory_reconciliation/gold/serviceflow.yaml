requirement:
  name: Retail Inventory Reconciliation
  purpose: Fetch inventory CSVs from 4 warehouses, normalize SKU formats, reconcile discrepancies, and
    generate a final PDF report.
  domain: retail
  execution_model: batch
  topology: fan_out_fan_in
  information_sufficiency: high
  notes:
  - 'Two parallel phases: fetch (4x) and normalize (4x).'
  - Reconcile and report steps merge the fan-out paths.
schedule:
  type: cron
  expression: '@daily'
  timezone: UTC
  start_date: '2024-01-01'
  catchup: false
external_systems:
- system_id: warehouse_wms
  type: other
  name: Warehouse Management System
  identifier: warehouse-wms
  access_mode: read
  authentication: secret
  mock_strategy: fixture
