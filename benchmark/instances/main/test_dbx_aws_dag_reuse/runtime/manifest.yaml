runtime_manifest_version: 0.1.0
pipeline_id: test_dbx_aws_dag_reuse
image: python:3.12-slim
workflow_parameters: []
tasks:
- intent_id: start_task
  script: scripts/01_run.py
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - start
- intent_id: spark_jar_task
  script: scripts/01_run.py
  dependencies:
  - start_task
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - nb1
- intent_id: dummy_task_1
  script: scripts/01_run.py
  dependencies:
  - spark_jar_task
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - d1
- intent_id: branch_task
  script: scripts/01_run.py
  dependencies:
  - dummy_task_1
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - branch
  output_parameters:
  - name: route
    path: /workspace/artifacts/route.txt
- intent_id: spark_jar_task_2
  script: scripts/01_run.py
  dependencies:
  - branch_task
  when: '{{tasks.branch_task.outputs.parameters.route}} == execute'
  local_condition:
    path: artifacts/branch_decision.json
    json_path: branch_label
    equals: execute
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - nb2
- intent_id: dummy_task_3
  script: scripts/01_run.py
  dependencies:
  - branch_task
  when: '{{tasks.branch_task.outputs.parameters.route}} == skip'
  local_condition:
    path: artifacts/branch_decision.json
    json_path: branch_label
    equals: skip
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - d3
- intent_id: dummy_task_2
  script: scripts/01_run.py
  dependencies:
  - spark_jar_task_2
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - d2
- intent_id: end_task
  script: scripts/01_run.py
  depends: (dummy_task_2.Succeeded || dummy_task_3.Succeeded)
  arguments:
  - --workspace
  - '{workspace}'
  - --step
  - end
scenarios:
- name: dbx_run
  parameters: {}
  fixture_root: fixtures/scenarios/nominal
