  - from: branch_task
    to: dummy_task_3
    condition: branch_decision.route == skip
  - from: branch_task
    to: spark_jar_task_2
    condition: branch_decision.route == execute
  - from: spark_jar_task_2
    to: dummy_task_2
  - from: dummy_task_2
    to: end_task
  - from: dummy_task_3
    to: end_task
  parallel_groups: []
  branches:
