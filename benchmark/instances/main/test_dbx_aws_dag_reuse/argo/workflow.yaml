apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: test-dbx-aws-dag-reuse-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: test-dbx-aws-dag-reuse
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: dbx-run
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: test-dbx-aws-dag-reuse-scripts
  - name: fixtures
    configMap:
      name: test-dbx-aws-dag-reuse-fixtures
      items:
      - key: fixture-0000
        path: dbx.json
      - key: fixture-0001
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: start-task
        template: run-start-task
      - name: spark-jar-task
        template: run-spark-jar-task
        depends: start-task.Succeeded
      - name: dummy-task-1
        template: run-dummy-task-1
        depends: spark-jar-task.Succeeded
      - name: branch-task
        template: run-branch-task
        depends: dummy-task-1.Succeeded
      - name: spark-jar-task-2
        template: run-spark-jar-task-2
        depends: branch-task.Succeeded
        when: '{{tasks.branch-task.outputs.parameters.route}} == execute'
      - name: dummy-task-3
        template: run-dummy-task-3
        depends: branch-task.Succeeded
        when: '{{tasks.branch-task.outputs.parameters.route}} == skip'
      - name: dummy-task-2
        template: run-dummy-task-2
        depends: spark-jar-task-2.Succeeded
      - name: end-task
        template: run-end-task
        depends: (dummy-task-2.Succeeded || dummy-task-3.Succeeded)
  - name: run-start-task
    metadata:
      annotations:
        prompt2serviceflow/intent-id: start_task
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - start
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-spark-jar-task
    metadata:
      annotations:
        prompt2serviceflow/intent-id: spark_jar_task
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - nb1
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-dummy-task-1
    metadata:
      annotations:
        prompt2serviceflow/intent-id: dummy_task_1
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - d1
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-branch-task
    metadata:
      annotations:
        prompt2serviceflow/intent-id: branch_task
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - branch
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
    outputs:
      parameters:
      - name: route
        valueFrom:
          path: /workspace/artifacts/route.txt
  - name: run-spark-jar-task-2
    metadata:
      annotations:
        prompt2serviceflow/intent-id: spark_jar_task_2
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - nb2
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-dummy-task-3
    metadata:
      annotations:
        prompt2serviceflow/intent-id: dummy_task_3
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - d3
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-dummy-task-2
    metadata:
      annotations:
        prompt2serviceflow/intent-id: dummy_task_2
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - d2
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-end-task
    metadata:
      annotations:
        prompt2serviceflow/intent-id: end_task
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_run.py
      - --workspace
      - /workspace
      - --step
      - end
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
