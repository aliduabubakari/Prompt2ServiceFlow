runtime_manifest_version: 0.1.0
pipeline_id: customer_dq_scoring_pipeline
image: python:3.12-slim
workflow_parameters: []
tasks:
- intent_id: generate_synthetic_data
  script: scripts/01_generate_synthetic_data.py
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: explore_raw_data
  script: scripts/02_explore_raw_data.py
  dependencies:
  - generate_synthetic_data
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: clean_data
  script: scripts/03_clean_data.py
  dependencies:
  - generate_synthetic_data
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: calculate_quality_score
  script: scripts/04_calculate_quality_score.py
  dependencies:
  - clean_data
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: feature_engineering
  script: scripts/05_feature_engineering.py
  dependencies:
  - clean_data
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
- intent_id: save_and_report
  script: scripts/06_save_and_report.py
  dependencies:
  - calculate_quality_score
  - feature_engineering
  arguments:
  - --workspace
  - '{workspace}'
  retries: 1
scenarios:
- name: synthetic_customer_dq
  parameters: {}
  fixture_root: fixtures/scenarios/nominal
cron:
  schedule: 0 0 * * *
  timezone: UTC
