apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-dq-scoring-pipeline-scripts
  namespace: prompt2serviceflow
data:
  01_generate_synthetic_data.py: "#!/usr/bin/env python3\n\"\"\"Generate mock synthetic customer parquet\
    \ data (as JSON for simplicity).\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n\
    \    rows=[{\"customer_id\":f\"C{i:03d}\",\"name\":f\"Customer {i}\",\"age\":20+(i*7)%60,\"email\"\
    :f\"cust{i}@example.com\",\"purchases\":i*3} for i in range(1,11)]\n    ds={\"columns\":[\"customer_id\"\
    ,\"name\",\"age\",\"email\",\"purchases\"],\"rows\":rows}\n    (art/\"raw_customers.parquet\").write_text(json.dumps(ds,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"generation_status.json\").write_text(json.dumps({\"success\"\
    :True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  02_explore_raw_data.py: "#!/usr/bin/env python3\n\"\"\"Mock profile report on raw data.\"\"\"\nfrom\
    \ __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"\n    ds=json.loads((art/\"raw_customers.parquet\").read_text(encoding=\"\
    utf-8\"))\n    report={\"row_count\":len(ds[\"rows\"]),\"columns\":ds[\"columns\"],\"null_counts\"\
    :{}}\n    (art/\"profile_report.json\").write_text(json.dumps(report,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"profile_status.json\").write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_clean_data.py: "#!/usr/bin/env python3\n\"\"\"Mock clean customer data.\"\"\"\nfrom __future__ import\
    \ annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    ds=json.loads((art/\"raw_customers.parquet\").read_text(encoding=\"utf-8\"))\n  \
    \  cleaned=[r for r in ds[\"rows\"] if r[\"customer_id\"]]\n    out={\"columns\":ds[\"columns\"],\"\
    rows\":cleaned}\n    (art/\"cleaned_customers.parquet\").write_text(json.dumps(out,indent=2)+\"\\\
    n\",encoding=\"utf-8\")\n    (art/\"cleaning_status.json\").write_text(json.dumps({\"success\":True,\"\
    errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_calculate_quality_score.py: "#!/usr/bin/env python3\n\"\"\"Mock DQ scoring.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    ds=json.loads((art/\"cleaned_customers.parquet\").read_text(encoding=\"utf-8\"))\n\
    \    scores={\"completeness\":0.95,\"validity\":0.92,\"consistency\":0.88,\"overall\":0.92}\n    (art/\"\
    dq_scores.json\").write_text(json.dumps(scores,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"\
    scoring_status.json\").write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\nif __name__==\"__main__\": main()\n"
  05_feature_engineering.py: "#!/usr/bin/env python3\n\"\"\"Mock feature engineering.\"\"\"\nfrom __future__\
    \ import annotations\nimport argparse, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n    art=a.workspace/\"\
    artifacts\"\n    ds=json.loads((art/\"cleaned_customers.parquet\").read_text(encoding=\"utf-8\"))\n\
    \    for r in ds[\"rows\"]:\n        age=r.get(\"age\",0)\n        r[\"age_group\"]=\"young\" if age<30\
    \ else (\"middle\" if age<50 else \"senior\")\n    ds[\"columns\"]=ds[\"columns\"]+[\"age_group\"\
    ]\n    (art/\"final_customers.parquet\").write_text(json.dumps(ds,indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"feature_status.json\").write_text(json.dumps({\"success\":True,\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  06_save_and_report.py: "#!/usr/bin/env python3\n\"\"\"Mock export final CSV and DQ report.\"\"\"\nfrom\
    \ __future__ import annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\ndef main():\n\
    \    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True); a=p.parse_args()\n\
    \    art=a.workspace/\"artifacts\"\n    ds=json.loads((art/\"final_customers.parquet\").read_text(encoding=\"\
    utf-8\"))\n    out=art/\"cleaned_customers.csv\"\n    with out.open(\"w\",encoding=\"utf-8\",newline=\"\
    \") as f:\n        w=csv.DictWriter(f,fieldnames=ds[\"columns\"]); w.writeheader(); w.writerows(ds[\"\
    rows\"])\n    scores=json.loads((art/\"dq_scores.json\").read_text(encoding=\"utf-8\"))\n    report={\"\
    scores\":scores,\"rows_exported\":len(ds[\"rows\"])}\n    (art/\"dq_report_json.json\").write_text(json.dumps(report,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"report_status.json\").write_text(json.dumps({\"success\":True,\"\
    errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
