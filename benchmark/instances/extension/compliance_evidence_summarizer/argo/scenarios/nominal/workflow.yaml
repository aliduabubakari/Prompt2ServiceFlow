apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: compliance-evidence-summarizer-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: compliance-evidence-summarizer-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: compliance-evidence-summarizer-nominal-scripts
  - name: fixtures
    configMap:
      name: compliance-evidence-summarizer-nominal-fixtures
      items:
      - key: fixture-0000
        path: evidence_packets.json
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: sample_document.pdf
      - key: fixture-0003
        path: supplier_profiles.csv
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-primary-source
        template: run-ingest-primary-source
      - name: ingest-secondary-source
        template: run-ingest-secondary-source
      - name: ingest-reference-source
        template: run-ingest-reference-source
      - name: validate-source-contracts
        template: run-validate-source-contracts
        depends: ingest-primary-source.Succeeded && ingest-secondary-source.Succeeded && ingest-reference-source.Succeeded
      - name: normalize-sources
        template: run-normalize-sources
        depends: validate-source-contracts.Succeeded
      - name: fuse-sources
        template: run-fuse-sources
        depends: normalize-sources.Succeeded
      - name: extract-or-parse-text
        template: run-extract-or-parse-text
        depends: fuse-sources.Succeeded
      - name: chunk-documents
        template: run-chunk-documents
        depends: extract-or-parse-text.Succeeded
      - name: generate-embeddings
        template: run-generate-embeddings
        depends: chunk-documents.Succeeded
      - name: write-vector-index
        template: run-write-vector-index
        depends: generate-embeddings.Succeeded
      - name: retrieve-grounding-context
        template: run-retrieve-grounding-context
        depends: write-vector-index.Succeeded
      - name: run-structured-extraction
        template: run-run-structured-extraction
        depends: retrieve-grounding-context.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: run-structured-extraction.Succeeded
  - name: run-ingest-primary-source
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_primary_source
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_primary_source.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-ingest-secondary-source
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_secondary_source
    container:
      image: python:3.12-slim
