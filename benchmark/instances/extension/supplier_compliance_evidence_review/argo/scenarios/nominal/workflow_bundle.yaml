data:
  01_ingest_primary_source.py: "#!/usr/bin/env python3\n\"\"\"Ingest supplier certificate data (primary\
    \ source \u2014 extracted from PDFs).\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    parser.add_argument(\"--execution-time\", type=str, default=None)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n    artifacts.mkdir(parents=True,\
    \ exist_ok=True)\n\n    fixture = json.loads(args.fixture.read_text(encoding=\"utf-8\"))\n    fixtures_dir\
    \ = args.fixture.parent\n\n    certs_path = fixtures_dir / fixture[\"inputs\"][\"certificates\"]\n\
    \    certificates = json.loads(certs_path.read_text(encoding=\"utf-8\"))\n\n    result = {\n     \
    \   \"source\": \"primary\",\n        \"certificates\": certificates,\n        \"total_certs\": len(certificates),\n\
    \        \"suppliers_with_certs\": sorted(set(c[\"supplier_id\"] for c in certificates)),\n      \
    \  \"ingested_at\": args.execution_time,\n    }\n    (artifacts / \"ingest_primary_source_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"ingest_primary_source_status.json\").write_text(\n        json.dumps({\"success\": True, \"\
    certs_loaded\": len(certificates), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\
    \n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  02_ingest_secondary_source.py: "#!/usr/bin/env python3\n\"\"\"Ingest supplier master data (secondary\
    \ source \u2014 CSV table).\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    parser.add_argument(\"--execution-time\", type=str, default=None)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n    artifacts.mkdir(parents=True,\
    \ exist_ok=True)\n\n    fixture = json.loads(args.fixture.read_text(encoding=\"utf-8\"))\n    fixtures_dir\
    \ = args.fixture.parent\n\n    master_path = fixtures_dir / fixture[\"inputs\"][\"master\"]\n    suppliers\
    \ = []\n    with master_path.open(encoding=\"utf-8\", newline=\"\") as f:\n        reader = csv.DictReader(f)\n\
    \        for row in reader:\n            suppliers.append(row)\n\n    result = {\n        \"source\"\
    : \"secondary\",\n        \"suppliers\": suppliers,\n        \"total_suppliers\": len(suppliers),\n\
    \        \"supplier_ids\": sorted(s[\"supplier_id\"] for s in suppliers),\n        \"ingested_at\"\
    : args.execution_time,\n    }\n    (artifacts / \"ingest_secondary_source_artifact.json\").write_text(\n\
    \        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"ingest_secondary_source_status.json\"\
    ).write_text(\n        json.dumps({\"success\": True, \"suppliers_loaded\": len(suppliers), \"errors\"\
    : []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n\
    \    main()\n"
  03_ingest_reference_source.py: "#!/usr/bin/env python3\n\"\"\"Ingest compliance policy (reference source\
