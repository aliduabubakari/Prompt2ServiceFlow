  04_validate_source_contracts.py: "#!/usr/bin/env python3\n\"\"\"Validate source contracts: cross-reference\
    \ suppliers, check cert freshness, identify gaps.\"\"\"\nfrom __future__ import annotations\nimport\
    \ argparse, json\nfrom datetime import datetime, timedelta\nfrom pathlib import Path\n\n\ndef parse_date(d:\
    \ str) -> datetime:\n    return datetime.strptime(d, \"%Y-%m-%d\")\n\n\ndef main():\n    parser =\
    \ argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\", type=Path, required=True)\n\
    \    parser.add_argument(\"--fixture\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n\n    primary = json.loads((artifacts\
    \ / \"ingest_primary_source_artifact.json\").read_text(encoding=\"utf-8\"))\n    secondary = json.loads((artifacts\
    \ / \"ingest_secondary_source_artifact.json\").read_text(encoding=\"utf-8\"))\n    reference = json.loads((artifacts\
    \ / \"ingest_reference_source_artifact.json\").read_text(encoding=\"utf-8\"))\n\n    certificates\
    \ = primary[\"certificates\"]\n    suppliers = {s[\"supplier_id\"]: s for s in secondary[\"suppliers\"\
    ]}\n    policy = reference[\"policy\"]\n    expiry_grace = timedelta(days=policy[\"expiry_grace_days\"\
    ])\n    today = datetime(2026, 7, 20)  # fixed reference date\n\n    issues = []\n    validated_certs\
    \ = []\n    cert_supplier_ids = set()\n\n    for cert in certificates:\n        sid = cert[\"supplier_id\"\
    ]\n        cert_supplier_ids.add(sid)\n        cert_issues = []\n\n        # Check supplier exists\
    \ in master\n        if sid not in suppliers:\n            cert_issues.append(f\"orphan_cert: supplier\
    \ {sid} not in master\")\n\n        # Check expiry\n        if cert[\"status\"] == \"expired\":\n\
    \            cert_issues.append(\"cert_expired\")\n        else:\n            expiry = parse_date(cert[\"\
    expiry_date\"])\n            if today + expiry_grace >= expiry:\n                cert_issues.append(\"\
    cert_near_expiry\")\n\n        # Check cert type is required\n        if cert[\"cert_type\"] not in\
    \ policy[\"required_cert_types\"]:\n            cert_issues.append(f\"non_required_cert_type: {cert['cert_type']}\"\
    )\n\n        if cert_issues:\n            issues.append({\n                \"cert_id\": cert[\"cert_id\"\
    ],\n                \"supplier_id\": sid,\n                \"issues\": cert_issues,\n            })\n\
    \n        validated_certs.append({**cert, \"validation_issues\": cert_issues})\n\n    # Check suppliers\
    \ without any certs\n    master_supplier_ids = set(suppliers.keys())\n    missing_cert_suppliers =\
    \ master_supplier_ids - cert_supplier_ids\n    for sid in missing_cert_suppliers:\n        issues.append({\n\
    \            \"supplier_id\": sid,\n            \"issues\": [\"missing_certificates\"],\n        })\n\
    \n    result = {\n        \"validated_certs\": validated_certs,\n        \"suppliers\": {sid: {**s,\
    \ \"has_certs\": sid in cert_supplier_ids} for sid, s in suppliers.items()},\n        \"missing_cert_suppliers\"\
    : sorted(missing_cert_suppliers),\n        \"orphan_cert_suppliers\": sorted(cert_supplier_ids - master_supplier_ids),\n\
    \        \"total_issues\": len(issues),\n        \"issues\": issues,\n        \"reference_date\":\
    \ today.isoformat(),\n    }\n    (artifacts / \"validate_source_contracts_artifact.json\").write_text(\n\
    \        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"validate_source_contracts_status.json\"\
    ).write_text(\n        json.dumps({\"success\": True, \"issues_found\": len(issues), \"errors\": issues},\
    \ indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  05_normalize_sources.py: "#!/usr/bin/env python3\n\"\"\"Normalize sources: combine cert and supplier\
    \ data into unified per-supplier records.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    args = parser.parse_args()\n    root = args.workspace\n    artifacts = root / \"artifacts\"\n\
    \n    validated = json.loads((artifacts / \"validate_source_contracts_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    validated_certs = validated[\"validated_certs\"]\n    suppliers = validated[\"suppliers\"\
    ]\n\n    # Normalize: build per-supplier unified records\n    normalized = []\n    for sid, supplier\
    \ in suppliers.items():\n        supplier_certs = [c for c in validated_certs if c[\"supplier_id\"\
    ] == sid]\n        active_certs = [c for c in supplier_certs if c[\"status\"] == \"active\"]\n   \
    \     expired_certs = [c for c in supplier_certs if c[\"status\"] == \"expired\"]\n\n        record\
    \ = {\n            \"supplier_id\": sid,\n            \"supplier_name\": supplier[\"supplier_name\"\
    ],\n            \"tax_id\": supplier.get(\"tax_id\", \"\"),\n            \"bank_account\": supplier.get(\"\
    bank_account\", \"\"),\n            \"contact_email\": supplier.get(\"contact_email\", \"\"),\n  \
    \          \"country\": supplier.get(\"country\", \"\"),\n            \"risk_tier\": supplier.get(\"\
    risk_tier\", \"unknown\"),\n            \"total_certs\": len(supplier_certs),\n            \"active_certs\"\
    : len(active_certs),\n            \"expired_certs\": len(expired_certs),\n            \"cert_types\"\
    : [c[\"cert_type\"] for c in supplier_certs],\n            \"has_min_active\": len(active_certs) >=\
    \ 1,\n            \"cert_issues\": [c.get(\"validation_issues\", []) for c in supplier_certs],\n \
    \       }\n        normalized.append(record)\n\n    result = {\n        \"normalized_suppliers\":\
    \ normalized,\n        \"total_suppliers\": len(normalized),\n        \"suppliers_with_certs\": sum(1\
    \ for s in normalized if s[\"total_certs\"] > 0),\n        \"suppliers_without_certs\": sum(1 for\
    \ s in normalized if s[\"total_certs\"] == 0),\n    }\n    (artifacts / \"normalize_sources_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"normalize_sources_status.json\").write_text(\n        json.dumps({\"success\": True, \"normalized\"\
    : len(normalized), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\n\
    if __name__ == \"__main__\":\n    main()\n"
  06_fuse_sources.py: "#!/usr/bin/env python3\n\"\"\"Fuse sources: merge normalized records with policy\
    \ rules to produce compliance status per supplier.\"\"\"\nfrom __future__ import annotations\nimport\
    \ argparse, json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n    root = args.workspace\n    artifacts\
    \ = root / \"artifacts\"\n\n    normalized_data = json.loads((artifacts / \"normalize_sources_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    reference = json.loads((artifacts / \"ingest_reference_source_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    policy = reference[\"policy\"]\n\n    risk_rules = policy[\"\
    risk_tier_thresholds\"]\n    cert_min = policy[\"certificate_requirements\"][\"min_active_certs\"\
    ]\n\n    fused = []\n    for s in normalized_data[\"normalized_suppliers\"]:\n        # Determine\
    \ compliance status\n        if s[\"total_certs\"] == 0:\n            compliance = \"non_compliant\"\
    \n            reason = \"no_certificates\"\n        elif s[\"active_certs\"] < cert_min:\n       \
    \     compliance = \"non_compliant\"\n            reason = \"no_active_certificates\"\n        elif\
    \ s[\"expired_certs\"] > 0:\n            compliance = \"at_risk\"\n            reason = \"has_expired_certificates\"\
    \n        else:\n            compliance = \"compliant\"\n            reason = \"all_requirements_met\"\
    \n\n        # Risk-tier escalation\n        risk_action = risk_rules.get(s[\"risk_tier\"], \"flag_for_review\"\
    )\n        escalated = risk_action == \"auto_escalate\" or compliance == \"non_compliant\"\n\n   \
    \     fused.append({\n            **s,\n            \"compliance_status\": compliance,\n         \
    \   \"compliance_reason\": reason,\n            \"risk_action\": risk_action,\n            \"escalated_for_review\"\
    : escalated,\n        })\n\n    result = {\n        \"fused_suppliers\": fused,\n        \"summary\"\
    : {\n            \"total\": len(fused),\n            \"compliant\": sum(1 for f in fused if f[\"compliance_status\"\
    ] == \"compliant\"),\n            \"at_risk\": sum(1 for f in fused if f[\"compliance_status\"] ==\
    \ \"at_risk\"),\n            \"non_compliant\": sum(1 for f in fused if f[\"compliance_status\"] ==\
    \ \"non_compliant\"),\n            \"escalated\": sum(1 for f in fused if f[\"escalated_for_review\"\
    ]),\n        },\n    }\n    (artifacts / \"fuse_sources_artifact.json\").write_text(\n        json.dumps(result,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"fuse_sources_status.json\").write_text(\n\
    \        json.dumps({\"success\": True, \"fused\": len(fused), \"errors\": []}, indent=2) + \"\\n\"\
    ,\n        encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  07_detect_sensitive_fields.py: "#!/usr/bin/env python3\n\"\"\"Detect sensitive fields: identify PII/regulated\
    \ data in fused supplier records.\"\"\"\nfrom __future__ import annotations\nimport argparse, json,\
    \ re\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    args = parser.parse_args()\n    root = args.workspace\n    artifacts = root / \"artifacts\"\n\
    \n    fused_data = json.loads((artifacts / \"fuse_sources_artifact.json\").read_text(encoding=\"utf-8\"\
    ))\n    reference = json.loads((artifacts / \"ingest_reference_source_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    patterns = reference[\"policy\"][\"sensitive_field_patterns\"]\n\n    detected = []\n\
    \    for s in fused_data[\"fused_suppliers\"]:\n        sensitive = {}\n        for field, config\
    \ in patterns.items():\n            value = s.get(field, \"\")\n            if value and re.match(config[\"\
    regex\"], value):\n                sensitive[field] = {\n                    \"value\": value,\n \
    \                   \"redaction\": config[\"redaction\"],\n                    \"keep_chars\": config.get(\"\
    keep_chars\", 0),\n                }\n        if sensitive:\n            detected.append({\n     \
    \           \"supplier_id\": s[\"supplier_id\"],\n                \"supplier_name\": s[\"supplier_name\"\
    ],\n                \"sensitive_fields\": sensitive,\n            })\n\n    result = {\n        \"\
    detected_records\": detected,\n        \"total_detected\": len(detected),\n        \"supplier_ids_affected\"\
    : [d[\"supplier_id\"] for d in detected],\n    }\n    (artifacts / \"detect_sensitive_fields_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"detect_sensitive_fields_status.json\").write_text(\n        json.dumps({\"success\": True, \"\
    sensitive_records_found\": len(detected), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  08_apply_redaction_or_suppression.py: "#!/usr/bin/env python3\n\"\"\"Apply redaction: partially redact\
    \ tax_ids, fully suppress bank_accounts.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\n\ndef redact_partial(value: str, keep: int) -> str:\n    if len(value)\
    \ <= keep:\n        return value\n    return value[:keep] + \"*\" * (len(value) - keep)\n\n\ndef main():\n\
    \    parser = argparse.ArgumentParser()\n    parser.add_argument(\"--workspace\", type=Path, required=True)\n\
    \    parser.add_argument(\"--fixture\", type=Path, required=True)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n\n    fused_data = json.loads((artifacts\
    \ / \"fuse_sources_artifact.json\").read_text(encoding=\"utf-8\"))\n    sensitive_data = json.loads((artifacts\
    \ / \"detect_sensitive_fields_artifact.json\").read_text(encoding=\"utf-8\"))\n    reference = json.loads((artifacts\
    \ / \"ingest_reference_source_artifact.json\").read_text(encoding=\"utf-8\"))\n    patterns = reference[\"\
    policy\"][\"sensitive_field_patterns\"]\n\n    # Build set of supplier_ids with sensitive data\n \
    \   affected = {d[\"supplier_id\"]: d[\"sensitive_fields\"] for d in sensitive_data[\"detected_records\"\
    ]}\n\n    redacted = []\n    for s in fused_data[\"fused_suppliers\"]:\n        record = {**s}\n \
    \       if s[\"supplier_id\"] in affected:\n            for field, config in affected[s[\"supplier_id\"\
    ]].items():\n                if config[\"redaction\"] == \"full\":\n                    record[field]\
    \ = \"[REDACTED]\"\n                elif config[\"redaction\"] == \"partial\":\n                 \
    \   record[field] = redact_partial(s[field], config[\"keep_chars\"])\n        redacted.append(record)\n\
    \n    result = {\n        \"redacted_suppliers\": redacted,\n        \"total_redacted\": len(affected),\n\
    \        \"redacted_fields\": list(patterns.keys()),\n    }\n    (artifacts / \"apply_redaction_or_suppression_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"apply_redaction_or_suppression_status.json\").write_text(\n        json.dumps({\"success\":\
    \ True, \"records_redacted\": len(affected), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  09_create_human_review_packet.py: "#!/usr/bin/env python3\n\"\"\"Create human review packet: bundle\
    \ escalated/non-compliant suppliers for manual review.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n    root = args.workspace\n    artifacts\
    \ = root / \"artifacts\"\n\n    redacted_data = json.loads(\n        (artifacts / \"apply_redaction_or_suppression_artifact.json\"\
    ).read_text(encoding=\"utf-8\")\n    )\n\n    # Select suppliers that need human review\n    review_candidates\
    \ = [\n        s for s in redacted_data[\"redacted_suppliers\"]\n        if s[\"escalated_for_review\"\
    ]\n    ]\n\n    packet = {\n        \"packet_id\": \"HRP-2026-07-20-001\",\n        \"generated_at\"\
    : \"2026-07-20T09:00:00Z\",\n        \"total_suppliers_for_review\": len(review_candidates),\n   \
    \     \"review_items\": [\n            {\n                \"supplier_id\": s[\"supplier_id\"],\n \
    \               \"supplier_name\": s[\"supplier_name\"],\n                \"compliance_status\": s[\"\
    compliance_status\"],\n                \"compliance_reason\": s[\"compliance_reason\"],\n        \
    \        \"risk_tier\": s[\"risk_tier\"],\n                \"risk_action\": s[\"risk_action\"],\n\
    \                \"cert_summary\": f\"{s['active_certs']} active, {s['expired_certs']} expired\",\n\
    \            }\n            for s in review_candidates\n        ],\n    }\n    (artifacts / \"create_human_review_packet_artifact.json\"\
    ).write_text(\n        json.dumps(packet, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"create_human_review_packet_status.json\").write_text(\n        json.dumps({\"success\": True,\
    \ \"review_items\": len(review_candidates), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  10_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish outputs: export redacted compliance report\
    \ CSV, review packet, and audit manifest.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ csv, json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n \
    \   parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    parser.add_argument(\"--execution-time\", type=str, default=None)\n\
    \    args = parser.parse_args()\n    root = args.workspace\n    artifacts = root / \"artifacts\"\n\
    \n    execution_time = args.execution_time or \"2026-07-20T09:00:00Z\"\n    fixture = json.loads(args.fixture.read_text(encoding=\"\
    utf-8\"))\n\n    redacted_data = json.loads(\n        (artifacts / \"apply_redaction_or_suppression_artifact.json\"\
    ).read_text(encoding=\"utf-8\")\n    )\n    fused_data = json.loads(\n        (artifacts / \"fuse_sources_artifact.json\"\
    ).read_text(encoding=\"utf-8\")\n    )\n    review_packet = json.loads(\n        (artifacts / \"create_human_review_packet_artifact.json\"\
    ).read_text(encoding=\"utf-8\")\n    )\n\n    # Build checkpoint manifest\n    manifest = {\n    \
    \    \"checkpoint_id\": f\"ckpt_supplier_compliance_{execution_time[:10].replace('-', '_')}\",\n \
    \       \"checkpoint_time\": execution_time,\n        \"pipeline_id\": fixture[\"pipeline_id\"],\n\
    \        \"compliance_summary\": fused_data[\"summary\"],\n        \"review_items\": review_packet[\"\
    total_suppliers_for_review\"],\n        \"output_files\": [\"compliance_report.csv\", \"review_packet.json\"\
    , \"audit_manifest.json\"],\n        \"status\": \"completed\",\n    }\n    (artifacts / \"audit_manifest.json\"\
    ).write_text(\n        json.dumps(manifest, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n   \
    \ # Export redacted compliance CSV\n    csv_rel = \"compliance_report.csv\"\n    csv_path = artifacts\
    \ / csv_rel\n    fieldnames = [\n        \"supplier_id\", \"supplier_name\", \"tax_id\", \"bank_account\"\
    ,\n        \"country\", \"risk_tier\", \"compliance_status\", \"compliance_reason\",\n        \"active_certs\"\
    , \"expired_certs\", \"escalated_for_review\",\n    ]\n    with csv_path.open(\"w\", encoding=\"utf-8\"\
    , newline=\"\") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction=\"ignore\"\
    )\n        writer.writeheader()\n        for s in redacted_data[\"redacted_suppliers\"]:\n       \
    \     s[\"escalated_for_review\"] = str(s[\"escalated_for_review\"])\n            writer.writerow(s)\n\
    \n    # Save review packet\n    (artifacts / \"review_packet.json\").write_text(\n        json.dumps(review_packet,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n\n    publish_result = {\n        \"audit_manifest\"\
    : manifest,\n        \"compliance_csv\": csv_rel,\n        \"review_packet\": \"review_packet.json\"\
    ,\n    }\n    (artifacts / \"publish_outputs_artifact.json\").write_text(\n        json.dumps(publish_result,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"publish_outputs_status.json\"\
    ).write_text(\n        json.dumps({\"success\": True, \"csv_exported\": csv_rel, \"review_items\"\
    : review_packet[\"total_suppliers_for_review\"], \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
