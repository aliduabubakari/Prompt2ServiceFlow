apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: crop-disease-image-triage-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: crop-disease-image-triage
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters:
    - name: execution-time
      value: '2026-07-20T12:00:00Z'
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: crop-disease-image-triage-scripts
  - name: fixtures
    configMap:
      name: crop-disease-image-triage-fixtures
      items:
      - key: fixture-0000
        path: crop_images.json
      - key: fixture-0001
        path: crop_master.csv
      - key: fixture-0002
        path: disease_policy.json
      - key: fixture-0003
        path: fixture.json
      - key: fixture-0004
        path: sample_image.png
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: evaluate-policy-or-risk
        template: run-evaluate-policy-or-risk
        depends: validate-source-contract.Succeeded
      - name: route-approved-records
        template: run-route-approved-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: route-exception-records
        template: run-route-exception-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: merge-route-outcomes
        template: run-merge-route-outcomes
        depends: route-approved-records.Succeeded && route-exception-records.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: merge-route-outcomes.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      - --execution-time
      - '{{workflow.parameters.execution-time}}'
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-evaluate-policy-or-risk
    metadata:
      annotations:
        prompt2serviceflow/intent-id: evaluate_policy_or_risk
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_evaluate_policy_or_risk.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-route-approved-records
    metadata:
      annotations:
        prompt2serviceflow/intent-id: route_approved_records
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/04_route_approved_records.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-route-exception-records
    metadata:
      annotations:
        prompt2serviceflow/intent-id: route_exception_records
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/05_route_exception_records.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-merge-route-outcomes
    metadata:
      annotations:
        prompt2serviceflow/intent-id: merge_route_outcomes
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/06_merge_route_outcomes.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-publish-outputs
    metadata:
      annotations:
        prompt2serviceflow/intent-id: publish_outputs
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/07_publish_outputs.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      - --execution-time
      - '{{workflow.parameters.execution-time}}'
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
