assertions_version: 0.1.0
pipeline_id: crop_disease_image_triage
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: images
    expected: 8
  - assertion_id: validate_all_valid
    type: json_path_equals
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    expected: 0
  - assertion_id: evaluate_scored
    type: json_path_gte
    path: artifacts/evaluate_policy_or_risk_status.json
    json_path: scored
    minimum: 8
  - assertion_id: has_exceptions
    type: json_path_gte
    path: artifacts/evaluate_policy_or_risk_status.json
    json_path: exceptions
    minimum: 2
  - assertion_id: has_approved
    type: json_path_gte
    path: artifacts/evaluate_policy_or_risk_status.json
    json_path: approved
    minimum: 2
  - assertion_id: merge_total
    type: json_path_gte
    path: artifacts/merge_route_outcomes_status.json
    json_path: merged
    minimum: 8
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/crop_triage_report.csv
  - assertion_id: exception_alert_exists
    type: file_exists
    path: artifacts/exception_alert.json
  - assertion_id: manifest_completed
    type: json_path_equals
    path: artifacts/audit_manifest.json
    json_path: status
    expected: completed
