apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: weather-sales-feature-builder-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest weather API snapshot, store sales CSV,\
    \ and store location table.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    parser.add_argument(\"--execution-time\", type=str, default=None)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n    artifacts.mkdir(parents=True,\
    \ exist_ok=True)\n\n    fixture = json.loads(args.fixture.read_text(encoding=\"utf-8\"))\n    fixtures_dir\
    \ = args.fixture.parent\n    execution_time = args.execution_time or \"2026-07-20T09:00:00Z\"\n\n\
    \    # Weather JSON\n    weather = json.loads((fixtures_dir / fixture[\"inputs\"][\"weather\"]).read_text(encoding=\"\
    utf-8\"))\n\n    # Store sales CSV\n    sales = []\n    with (fixtures_dir / fixture[\"inputs\"][\"\
    sales\"]).open(encoding=\"utf-8\", newline=\"\") as f:\n        for row in csv.DictReader(f):\n  \
    \          row[\"revenue\"] = float(row[\"revenue\"])\n            row[\"transactions\"] = int(row[\"\
    transactions\"])\n            sales.append(row)\n\n    # Store locations CSV\n    locations = {}\n\
    \    with (fixtures_dir / fixture[\"inputs\"][\"locations\"]).open(encoding=\"utf-8\", newline=\"\"\
    ) as f:\n        for row in csv.DictReader(f):\n            row[\"size_sqm\"] = int(row[\"size_sqm\"\
    ])\n            locations[row[\"store_id\"]] = row\n\n    result = {\n        \"weather\": weather,\n\
    \        \"sales\": sales,\n        \"locations\": locations,\n        \"total_weather_obs\": len(weather[\"\
    observations\"]),\n        \"total_sales_rows\": len(sales),\n        \"total_locations\": len(locations),\n\
    \        \"ingested_at\": execution_time,\n    }\n    (artifacts / \"ingest_source_batch_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"ingest_source_batch_status.json\").write_text(\n        json.dumps({\"success\": True, \"weather_obs\"\
    : len(weather[\"observations\"]),\n                     \"sales_rows\": len(sales), \"locations\"\
    : len(locations), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif\
    \ __name__ == \"__main__\":\n    main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate source contracts: check schemas,\
    \ cross-reference stores/locations, weather coverage.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, json\nfrom pathlib import Path\n\nREQUIRED_WEATHER_FIELDS = {\"city\", \"date\",\
    \ \"temp_c\", \"weather_condition\"}\nREQUIRED_SALES_FIELDS = {\"store_id\", \"city\", \"date\", \"\
    revenue\", \"transactions\"}\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    args = parser.parse_args()\n    root = args.workspace\n    artifacts = root / \"artifacts\"\n\
    \n    ingested = json.loads((artifacts / \"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    weather_obs = ingested[\"weather\"][\"observations\"]\n    sales = ingested[\"sales\"\
    ]\n    locations = ingested[\"locations\"]\n\n    errors = []\n\n    # Validate weather observations\n\
    \    valid_weather = []\n    for obs in weather_obs:\n        missing = REQUIRED_WEATHER_FIELDS -\
    \ set(obs.keys())\n        if missing:\n            errors.append({\"record\": obs, \"issues\": [f\"\
    missing_fields: {missing}\"]})\n        else:\n            valid_weather.append(obs)\n\n    # Validate\
    \ sales rows\n    valid_sales = []\n    orphan_stores = set()\n    weather_index = {(w[\"city\"],\
    \ w[\"date\"]): w for w in valid_weather}\n    for row in sales:\n        issues = []\n        missing\
    \ = REQUIRED_SALES_FIELDS - set(row.keys())\n        if missing:\n            issues.append(f\"missing_fields:\
    \ {missing}\")\n\n        sid = row.get(\"store_id\", \"\")\n        if sid not in locations:\n  \
    \          issues.append(f\"store_not_in_locations: {sid}\")\n            orphan_stores.add(sid)\n\
    \n        city_date = (row.get(\"city\", \"\"), row.get(\"date\", \"\"))\n        if city_date not\
    \ in weather_index:\n            issues.append(f\"no_weather_data_for: {city_date}\")\n\n        if\
    \ issues:\n            errors.append({\"record\": row, \"issues\": issues})\n        else:\n     \
    \       valid_sales.append(row)\n\n    result = {\n        \"valid_weather\": valid_weather,\n   \
    \     \"valid_sales\": valid_sales,\n        \"total_errors\": len(errors),\n        \"errors\": errors,\n\
    \        \"orphan_stores\": sorted(orphan_stores),\n        \"weather_coverage\": len(weather_index),\n\
    \    }\n    (artifacts / \"validate_source_contract_artifact.json\").write_text(\n        json.dumps(result,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"validate_source_contract_status.json\"\
    ).write_text(\n        json.dumps({\"success\": True, \"errors_found\": len(errors), \"errors\": errors},\
    \ indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
  03_stage_raw_artifacts.py: "#!/usr/bin/env python3\n\"\"\"Stage raw artifacts: join sales with weather\
    \ and locations into auditable staging records.\"\"\"\nfrom __future__ import annotations\nimport\
    \ argparse, json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n\
    \    parser.add_argument(\"--workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\"\
    , type=Path, required=True)\n    args = parser.parse_args()\n    root = args.workspace\n    artifacts\
    \ = root / \"artifacts\"\n\n    validated = json.loads((artifacts / \"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    ingested = json.loads((artifacts / \"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    locations = ingested[\"locations\"]\n\n    weather_index = {(w[\"\
    city\"], w[\"date\"]): w for w in validated[\"valid_weather\"]}\n    staged = []\n\n    for sale in\
    \ validated[\"valid_sales\"]:\n        city_date = (sale[\"city\"], sale[\"date\"])\n        weather\
    \ = weather_index.get(city_date, {})\n        store = locations.get(sale[\"store_id\"], {})\n\n  \
    \      staged.append({\n            \"store_id\": sale[\"store_id\"],\n            \"city\": sale[\"\
    city\"],\n            \"date\": sale[\"date\"],\n            \"revenue\": sale[\"revenue\"],\n   \
    \         \"transactions\": sale[\"transactions\"],\n            \"top_category\": sale.get(\"top_category\"\
    , \"\"),\n            \"temp_c\": weather.get(\"temp_c\"),\n            \"humidity_pct\": weather.get(\"\
    humidity_pct\"),\n            \"precipitation_mm\": weather.get(\"precipitation_mm\", 0),\n      \
    \      \"weather_condition\": weather.get(\"weather_condition\", \"unknown\"),\n            \"store_size_sqm\"\
    : store.get(\"size_sqm\"),\n            \"store_type\": store.get(\"store_type\", \"\"),\n       \
    \     \"latitude\": store.get(\"latitude\"),\n            \"longitude\": store.get(\"longitude\"),\n\
    \        })\n\n    result = {\n        \"staged_records\": staged,\n        \"total_staged\": len(staged),\n\
    \        \"staging_timestamp\": \"2026-07-20T09:00:00Z\",\n    }\n    (artifacts / \"stage_raw_artifacts_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"stage_raw_artifacts_status.json\").write_text(\n        json.dumps({\"success\": True, \"records_staged\"\
    : len(staged), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif __name__\
    \ == \"__main__\":\n    main()\n"
  04_normalize_records.py: "#!/usr/bin/env python3\n\"\"\"Normalize records: derive weather-impact features,\
    \ revenue-per-sqm, and anomaly flags.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    args = parser.parse_args()\n    root = args.workspace\n    artifacts = root / \"artifacts\"\n\
    \n    fixture = json.loads(args.fixture.read_text(encoding=\"utf-8\"))\n    config = fixture.get(\"\
    feature_config\", {})\n    temp_high = config.get(\"temp_high_threshold\", 28.0)\n    temp_low = config.get(\"\
    temp_low_threshold\", 10.0)\n    rain_heavy = config.get(\"rain_heavy_threshold_mm\", 8.0)\n    rev_benchmark\
    \ = config.get(\"revenue_per_sqm_benchmark\", 12.0)\n\n    staged_data = json.loads((artifacts / \"\
    stage_raw_artifacts_artifact.json\").read_text(encoding=\"utf-8\"))\n\n    normalized = []\n    for\
    \ r in staged_data[\"staged_records\"]:\n        temp = r.get(\"temp_c\") or 0\n        precip = r.get(\"\
    precipitation_mm\") or 0\n        size = r.get(\"store_size_sqm\") or 1\n\n        # Weather impact\
    \ features\n        temp_impact = \"high\" if temp >= temp_high else (\"low\" if temp <= temp_low\
    \ else \"normal\")\n        rain_impact = \"heavy\" if precip >= rain_heavy else (\"light\" if precip\
    \ > 0 else \"none\")\n\n        # Revenue per sqm\n        rev_per_sqm = round(r[\"revenue\"] / size,\
    \ 2)\n\n        # Anomaly flag: high temp + ice_cream sales surge, or rain + low revenue\n       \
    \ anomaly = False\n        if temp_impact == \"high\" and r.get(\"top_category\") == \"ice_cream\"\
    \ and rev_per_sqm > rev_benchmark * 1.5:\n            anomaly = True\n        if rain_impact == \"\
    heavy\" and rev_per_sqm < rev_benchmark * 0.5:\n            anomaly = True\n\n        normalized.append({\n\
    \            \"store_id\": r[\"store_id\"],\n            \"city\": r[\"city\"],\n            \"date\"\
    : r[\"date\"],\n            \"revenue\": r[\"revenue\"],\n            \"transactions\": r[\"transactions\"\
    ],\n            \"top_category\": r.get(\"top_category\", \"\"),\n            \"temp_c\": temp,\n\
    \            \"weather_condition\": r.get(\"weather_condition\", \"\"),\n            \"temp_impact\"\
    : temp_impact,\n            \"precipitation_mm\": precip,\n            \"rain_impact\": rain_impact,\n\
    \            \"store_size_sqm\": size,\n            \"store_type\": r.get(\"store_type\", \"\"),\n\
    \            \"revenue_per_sqm\": rev_per_sqm,\n            \"weather_anomaly\": anomaly,\n      \
    \  })\n\n    result = {\n        \"normalized_features\": normalized,\n        \"feature_count\":\
    \ len(normalized),\n        \"anomalies_detected\": sum(1 for n in normalized if n[\"weather_anomaly\"\
    ]),\n        \"config_used\": config,\n    }\n    (artifacts / \"normalize_records_artifact.json\"\
    ).write_text(\n        json.dumps(result, indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts\
    \ / \"normalize_records_status.json\").write_text(\n        json.dumps({\"success\": True, \"records_normalized\"\
    : len(normalized),\n                     \"anomalies\": sum(1 for n in normalized if n[\"weather_anomaly\"\
    ]), \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"utf-8\"\n    )\n\n\nif __name__ == \"\
    __main__\":\n    main()\n"
  05_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish outputs: feature CSV, anomaly report,\
    \ and checkpoint manifest.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\n\ndef main():\n    parser = argparse.ArgumentParser()\n    parser.add_argument(\"\
    --workspace\", type=Path, required=True)\n    parser.add_argument(\"--fixture\", type=Path, required=True)\n\
    \    parser.add_argument(\"--execution-time\", type=str, default=None)\n    args = parser.parse_args()\n\
    \    root = args.workspace\n    artifacts = root / \"artifacts\"\n\n    execution_time = args.execution_time\
    \ or \"2026-07-20T09:00:00Z\"\n    fixture = json.loads(args.fixture.read_text(encoding=\"utf-8\"\
    ))\n\n    normalized_data = json.loads((artifacts / \"normalize_records_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n\n    manifest = {\n        \"checkpoint_id\": f\"ckpt_weather_sales_{execution_time[:10].replace('-',\
    \ '_')}\",\n        \"checkpoint_time\": execution_time,\n        \"pipeline_id\": fixture[\"pipeline_id\"\
    ],\n        \"feature_summary\": {\n            \"total_features\": normalized_data[\"feature_count\"\
    ],\n            \"anomalies_detected\": normalized_data[\"anomalies_detected\"],\n        },\n   \
    \     \"output_files\": [\"weather_sales_features.csv\", \"feature_manifest.json\"],\n        \"status\"\
    : \"completed\",\n    }\n    (artifacts / \"feature_manifest.json\").write_text(json.dumps(manifest,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\")\n\n    # Export features CSV\n    csv_rel = \"weather_sales_features.csv\"\
    \n    csv_path = artifacts / csv_rel\n    fieldnames = [\n        \"store_id\", \"city\", \"date\"\
    , \"revenue\", \"transactions\", \"top_category\",\n        \"temp_c\", \"weather_condition\", \"\
    temp_impact\",\n        \"precipitation_mm\", \"rain_impact\",\n        \"store_size_sqm\", \"store_type\"\
    , \"revenue_per_sqm\", \"weather_anomaly\",\n    ]\n    with csv_path.open(\"w\", encoding=\"utf-8\"\
    , newline=\"\") as f:\n        writer = csv.DictWriter(f, fieldnames=fieldnames, extrasaction=\"ignore\"\
    )\n        writer.writeheader()\n        for r in normalized_data[\"normalized_features\"]:\n    \
    \        r[\"weather_anomaly\"] = str(r[\"weather_anomaly\"])\n            writer.writerow(r)\n\n\
    \    publish_result = {\n        \"feature_manifest\": manifest,\n        \"features_csv\": csv_rel,\n\
    \    }\n    (artifacts / \"publish_outputs_artifact.json\").write_text(\n        json.dumps(publish_result,\
    \ indent=2) + \"\\n\", encoding=\"utf-8\"\n    )\n    (artifacts / \"publish_outputs_status.json\"\
    ).write_text(\n        json.dumps({\"success\": True, \"csv_exported\": csv_rel, \"features\": normalized_data[\"\
    feature_count\"],\n                     \"errors\": []}, indent=2) + \"\\n\",\n        encoding=\"\
    utf-8\"\n    )\n\n\nif __name__ == \"__main__\":\n    main()\n"
---
