apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: iot-device-snapshot-transition-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: iot-device-snapshot-transition-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: iot-device-snapshot-transition-nominal-scripts
  - name: fixtures
    configMap:
      name: iot-device-snapshot-transition-nominal-fixtures
