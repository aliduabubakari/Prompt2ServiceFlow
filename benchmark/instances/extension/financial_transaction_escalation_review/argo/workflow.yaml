apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: financial-transaction-escalation-review-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: financial-transaction-escalation-review
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: financial-transaction-escalation-review-scripts
  - name: fixtures
    configMap:
      name: financial-transaction-escalation-review-fixtures
      items:
      - key: fixture-0000
        path: account_profiles.csv
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: transactions.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: detect-sensitive-fields
        template: run-detect-sensitive-fields
        depends: validate-source-contract.Succeeded
      - name: apply-redaction-or-suppression
        template: run-apply-redaction-or-suppression
        depends: detect-sensitive-fields.Succeeded
      - name: create-human-review-packet
        template: run-create-human-review-packet
        depends: apply-redaction-or-suppression.Succeeded
      - name: evaluate-policy-or-risk
        template: run-evaluate-policy-or-risk
        depends: create-human-review-packet.Succeeded
      - name: route-approved-records
        template: run-route-approved-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: route-exception-records
        template: run-route-exception-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: merge-route-outcomes
        template: run-merge-route-outcomes
        depends: route-approved-records.Succeeded && route-exception-records.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: merge-route-outcomes.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-detect-sensitive-fields
    metadata:
      annotations:
        prompt2serviceflow/intent-id: detect_sensitive_fields
    container:
      image: python:3.12-slim
      command:
      - python
