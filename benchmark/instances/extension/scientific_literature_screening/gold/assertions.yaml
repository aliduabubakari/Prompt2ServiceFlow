assertions_version: 0.1.0
pipeline_id: scientific_literature_screening
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: articles
    expected: 5
  - assertion_id: validate_rejected
    type: json_path_gte
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    minimum: 1
  - assertion_id: has_included
    type: json_path_gte
    path: artifacts/generate_embeddings_status.json
    json_path: include
    minimum: 1
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/screening_report.csv
