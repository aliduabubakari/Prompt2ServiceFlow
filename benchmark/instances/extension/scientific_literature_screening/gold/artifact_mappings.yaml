artifact_mapping_version: 0.1.0
benchmark_id: extension:scientific_literature_screening
mappings:
- intent_id: ingest_source_batch
  inputs:
    input_artifacts: source_bundle
  outputs:
    output_artifacts: ingest_source_batch_artifact
    execution_report: ingest_source_batch_status
- intent_id: validate_source_contract
  inputs:
    input_artifacts: ingest_source_batch_artifact
  outputs:
    output_artifacts: validate_source_contract_artifact
    execution_report: validate_source_contract_status
- intent_id: normalize_partition_a
  inputs:
    input_artifacts: validate_source_contract_artifact
  outputs:
    output_artifacts: normalize_partition_a_artifact
    execution_report: normalize_partition_a_status
- intent_id: normalize_partition_b
  inputs:
    input_artifacts: validate_source_contract_artifact
  outputs:
    output_artifacts: normalize_partition_b_artifact
    execution_report: normalize_partition_b_status
- intent_id: normalize_partition_c
  inputs:
    input_artifacts: validate_source_contract_artifact
  outputs:
    output_artifacts: normalize_partition_c_artifact
    execution_report: normalize_partition_c_status
- intent_id: fuse_partitions
  inputs:
    input_artifacts:
    - normalize_partition_a_artifact
    - normalize_partition_b_artifact
    - normalize_partition_c_artifact
  outputs:
    output_artifacts: fuse_partitions_artifact
    execution_report: fuse_partitions_status
- intent_id: extract_or_parse_text
  inputs:
    input_artifacts: fuse_partitions_artifact
  outputs:
    output_artifacts: extract_or_parse_text_artifact
    execution_report: extract_or_parse_text_status
- intent_id: chunk_documents
  inputs:
    input_artifacts: extract_or_parse_text_artifact
  outputs:
    output_artifacts: chunk_documents_artifact
    execution_report: chunk_documents_status
- intent_id: generate_embeddings
  inputs:
    input_artifacts: chunk_documents_artifact
  outputs:
    output_artifacts: generate_embeddings_artifact
    execution_report: generate_embeddings_status
- intent_id: publish_outputs
  inputs:
    input_artifacts: generate_embeddings_artifact
  outputs:
    output_artifacts: publish_outputs_artifact
    execution_report: publish_outputs_status
