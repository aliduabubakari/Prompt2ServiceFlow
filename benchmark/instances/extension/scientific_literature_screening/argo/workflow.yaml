apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: scientific-literature-screening-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: scientific-literature-screening
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters:
    - name: execution-time
      value: '2026-07-20T12:00:00Z'
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: scientific-literature-screening-scripts
  - name: fixtures
    configMap:
      name: scientific-literature-screening-fixtures
      items:
      - key: fixture-0000
        path: articles.json
      - key: fixture-0001
        path: eligibility_criteria.json
      - key: fixture-0002
        path: fixture.json
      - key: fixture-0003
        path: reviewer_profiles.csv
      - key: fixture-0004
        path: sample_document.pdf
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: normalize-partition-a
        template: run-normalize-partition-a
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-b
        template: run-normalize-partition-b
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-c
        template: run-normalize-partition-c
        depends: validate-source-contract.Succeeded
      - name: fuse-partitions
        template: run-fuse-partitions
        depends: normalize-partition-a.Succeeded && normalize-partition-b.Succeeded && normalize-partition-c.Succeeded
      - name: extract-or-parse-text
        template: run-extract-or-parse-text
        depends: fuse-partitions.Succeeded
      - name: chunk-documents
        template: run-chunk-documents
        depends: extract-or-parse-text.Succeeded
      - name: generate-embeddings
        template: run-generate-embeddings
        depends: chunk-documents.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: generate-embeddings.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      - --execution-time
      - '{{workflow.parameters.execution-time}}'
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-normalize-partition-a
    metadata:
      annotations:
        prompt2serviceflow/intent-id: normalize_partition_a
