assertions_version: 0.1.0
pipeline_id: scanned_claim_packet_extraction
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_claims
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: claims
    expected: 5
  - assertion_id: validate_rejected
    type: json_path_gte
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    minimum: 1
  - assertion_id: features_extracted
    type: json_path_gte
    path: artifacts/extract_branch_features_status.json
    json_path: features_extracted
    minimum: 3
  - assertion_id: enriched_count
    type: json_path_gte
    path: artifacts/enrich_branch_context_status.json
    json_path: enriched
    minimum: 3
  - assertion_id: merge_success
    type: json_path_equals
    path: artifacts/merge_branch_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/claim_assessment.csv
  - assertion_id: manifest_completed
    type: json_path_equals
    path: artifacts/audit_manifest.json
    json_path: status
    expected: completed
