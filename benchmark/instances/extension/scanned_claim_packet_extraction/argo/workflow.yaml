apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: scanned-claim-packet-extraction-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: scanned-claim-packet-extraction
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters:
    - name: execution-time
      value: '2026-07-20T12:00:00Z'
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: scanned-claim-packet-extraction-scripts
  - name: fixtures
    configMap:
      name: scanned-claim-packet-extraction-fixtures
      items:
      - key: fixture-0000
        path: claim_packets.json
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: policy_reference.csv
      - key: fixture-0003
        path: quality_thresholds.json
      - key: fixture-0004
        path: sample_document.pdf
      - key: fixture-0005
        path: sample_image.png
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: extract-branch-features
        template: run-extract-branch-features
        depends: validate-source-contract.Succeeded
      - name: enrich-branch-context
        template: run-enrich-branch-context
        depends: validate-source-contract.Succeeded
      - name: score-branch-quality
        template: run-score-branch-quality
        depends: validate-source-contract.Succeeded
      - name: merge-branch-outputs
        template: run-merge-branch-outputs
        depends: extract-branch-features.Succeeded && enrich-branch-context.Succeeded && score-branch-quality.Succeeded
      - name: extract-visual-text-features
        template: run-extract-visual-text-features
        depends: merge-branch-outputs.Succeeded
      - name: join-reference-metadata
        template: run-join-reference-metadata
        depends: extract-visual-text-features.Succeeded
      - name: assess-multimodal-quality
        template: run-assess-multimodal-quality
        depends: join-reference-metadata.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: assess-multimodal-quality.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      - --execution-time
      - '{{workflow.parameters.execution-time}}'
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-extract-branch-features
