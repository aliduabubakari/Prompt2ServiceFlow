apiVersion: v1
kind: ConfigMap
metadata:
  name: scanned-claim-packet-extraction-nominal-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest scanned claim packets (JSON metadata\
    \ proxy for PDF/images), policy CSV, and quality thresholds.\"\"\"\nfrom __future__ import annotations\n\
    import argparse, csv, json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True)\n    p.add_argument(\"--fixture\",type=Path,required=True);\
    \ p.add_argument(\"--execution-time\",type=str,default=None)\n    a=p.parse_args(); r=a.workspace;\
    \ art=r/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n    fx=json.loads(a.fixture.read_text(encoding=\"\
    utf-8\")); fd=a.fixture.parent\n    claims=json.loads((fd/fx[\"inputs\"][\"claims\"]).read_text(encoding=\"\
    utf-8\"))\n    policies={}\n    with (fd/fx[\"inputs\"][\"policies\"]).open(encoding=\"utf-8\",newline=\"\
    \") as f:\n        for row in csv.DictReader(f): policies[row[\"policy_number\"]]=row\n    thresholds=json.loads((fd/fx[\"\
    inputs\"][\"thresholds\"]).read_text(encoding=\"utf-8\"))\n    result={\"claims\":claims,\"policies\"\
    :policies,\"thresholds\":thresholds,\"total_claims\":len(claims),\"total_policies\":len(policies),\"\
    ingested_at\":a.execution_time}\n    (art/\"ingest_source_batch_artifact.json\").write_text(json.dumps(result,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"ingest_source_batch_status.json\").write_text(json.dumps({\"\
    success\":True,\"claims\":len(claims),\"policies\":len(policies),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate: required fields, policy existence,\
    \ signature presence, scan quality minimum.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    claims,policies,thresholds=ingested[\"claims\"],ingested[\"\
    policies\"],ingested[\"thresholds\"]\n    required=set(thresholds[\"required_fields\"]); sq_min=thresholds[\"\
    scan_quality_minimum\"]\n    errors=[]; valid=[]\n    for c in claims:\n        issues=[]\n      \
    \  if required-set(c.keys()): issues.append(f\"missing_fields: {required-set(c.keys())}\")\n     \
    \   if c.get(\"policy_number\") not in policies: issues.append(f\"unknown_policy: {c.get('policy_number')}\"\
    )\n        if c.get(\"scan_quality\",0)<sq_min: issues.append(f\"low_scan_quality: {c.get('scan_quality')}<{sq_min}\"\
    )\n        if thresholds.get(\"signature_required\") and not c.get(\"has_signature\"): issues.append(\"\
    missing_signature\")\n        if issues: errors.append({\"claim_id\":c.get(\"claim_id\",\"?\"),\"\
    issues\":issues})\n        else: valid.append(c)\n    result={\"valid_claims\":valid,\"errors\":errors,\"\
    total_valid\":len(valid),\"total_rejected\":len(errors)}\n    (art/\"validate_source_contract_artifact.json\"\
    ).write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"validate_source_contract_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"valid\":len(valid),\"rejected\":len(errors),\"errors\"\
    :errors},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_extract_branch_features.py: "#!/usr/bin/env python3\n\"\"\"Extract branch features: compute claim-level\
    \ features (amount category, day delta, page count).\"\"\"\nfrom __future__ import annotations\nimport\
    \ argparse, json\nfrom datetime import datetime\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    today=datetime(2026,7,20)\n    features=[]\n    for c in validated[\"\
    valid_claims\"]:\n        days_since=(today-datetime.strptime(c[\"date_of_loss\"],\"%Y-%m-%d\")).days\n\
    \        features.append({\"claim_id\":c[\"claim_id\"],\"amount\":c[\"claim_amount\"],\"claim_type\"\
    :c[\"claim_type\"],\n                         \"days_since_loss\":days_since,\"pages\":c[\"pages\"\
    ],\n                         \"amount_category\":\"high\" if c[\"claim_amount\"]>10000 else (\"medium\"\
    \ if c[\"claim_amount\"]>1000 else \"low\")})\n    (art/\"extract_branch_features_artifact.json\"\
    ).write_text(json.dumps({\"features\":features,\"total\":len(features)},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"extract_branch_features_status.json\").write_text(json.dumps({\"success\":True,\"\
    features_extracted\":len(features),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
  04_enrich_branch_context.py: "#!/usr/bin/env python3\n\"\"\"Enrich branch context: match claims against\
    \ policy reference data.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib\
    \ import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    policies=ingested[\"policies\"]\n    enriched=[]\n    for c in validated[\"valid_claims\"\
    ]:\n        pol=policies.get(c[\"policy_number\"],{})\n        claimant_match=c.get(\"claimant_name\"\
    )==pol.get(\"policyholder_name\",\"\")\n        enriched.append({\"claim_id\":c[\"claim_id\"],\"policy_number\"\
    :c[\"policy_number\"],\n                         \"claimant\":c[\"claimant_name\"],\"policyholder\"\
    :pol.get(\"policyholder_name\",\"?\"),\n                         \"claimant_match\":claimant_match,\"\
    coverage_limit\":float(pol.get(\"coverage_limit\",0)),\n                         \"policy_status\"\
    :pol.get(\"status\",\"unknown\"),\"deductible\":float(pol.get(\"deductible\",0))})\n    (art/\"enrich_branch_context_artifact.json\"\
    ).write_text(json.dumps({\"enriched\":enriched,\"total\":len(enriched)},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"enrich_branch_context_status.json\").write_text(json.dumps({\"success\":True,\"\
    enriched\":len(enriched),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\"\
    : main()\n"
  05_score_branch_quality.py: "#!/usr/bin/env python3\n\"\"\"Score branch quality: compute OCR, scan,\
    \ and overall quality grades per claim.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    grades=ingested[\"thresholds\"][\"quality_grades\"]\n    scored=[]\n\
    \    for c in validated[\"valid_claims\"]:\n        sq=c[\"scan_quality\"]; ocr=c[\"ocr_confidence\"\
    ]\n        if sq>=grades[\"excellent\"][\"scan_quality_min\"] and ocr>=grades[\"excellent\"][\"ocr_confidence_min\"\
    ]: grade=\"excellent\"\n        elif sq>=grades[\"acceptable\"][\"scan_quality_min\"] and ocr>=grades[\"\
    acceptable\"][\"ocr_confidence_min\"]: grade=\"acceptable\"\n        else: grade=\"poor\"\n      \
    \  scored.append({\"claim_id\":c[\"claim_id\"],\"scan_quality\":sq,\"ocr_confidence\":ocr,\"quality_grade\"\
    :grade})\n    (art/\"score_branch_quality_artifact.json\").write_text(json.dumps({\"scores\":scored,\"\
    total\":len(scored)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"score_branch_quality_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"scored\":len(scored),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  06_merge_branch_outputs.py: "#!/usr/bin/env python3\n\"\"\"Merge branch outputs: combine features, enrichment,\
    \ and quality scores per claim.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    features=json.loads((art/\"extract_branch_features_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    enriched=json.loads((art/\"enrich_branch_context_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    scores=json.loads((art/\"score_branch_quality_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    fmap={f[\"claim_id\"]:f for f in features[\"features\"]}\n \
    \   emap={e[\"claim_id\"]:e for e in enriched[\"enriched\"]}\n    smap={s[\"claim_id\"]:s for s in\
    \ scores[\"scores\"]}\n    merged=[]\n    for cid in fmap:\n        merged.append({**fmap[cid],**{f\"\
    enrich_{k}\":v for k,v in emap.get(cid,{}).items() if k!=\"claim_id\"},\n                       **{f\"\
    quality_{k}\":v for k,v in smap.get(cid,{}).items() if k!=\"claim_id\"}})\n    (art/\"merge_branch_outputs_artifact.json\"\
    ).write_text(json.dumps({\"merged\":merged,\"total\":len(merged)},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"merge_branch_outputs_status.json\").write_text(json.dumps({\"success\":True,\"merged\"\
    :len(merged),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  07_extract_visual_text_features.py: "#!/usr/bin/env python3\n\"\"\"Extract visual/text features: derive\
    \ OCR summary and completeness flags.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    merged=json.loads((art/\"merge_branch_outputs_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    ocr_min=0.70; visual=[]\n    for m in merged[\"merged\"]:\n\
    \        ocr_ok=m.get(\"quality_ocr_confidence\",0)>=ocr_min\n        visual.append({\"claim_id\"\
    :m[\"claim_id\"],\"ocr_passed\":ocr_ok,\n                       \"text_completeness\": \"complete\"\
    \ if ocr_ok else \"incomplete\",\n                       \"pages_digitized\":m.get(\"pages\",0)})\n\
    \    (art/\"extract_visual_text_features_artifact.json\").write_text(json.dumps({\"visual\":visual,\"\
    total\":len(visual)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"extract_visual_text_features_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"visual_extracted\":len(visual),\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  08_join_reference_metadata.py: "#!/usr/bin/env python3\n\"\"\"Join reference metadata: flag coverage\
    \ exceedances and policy status issues.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    merged=json.loads((art/\"merge_branch_outputs_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    joined=[]\n    for m in merged[\"merged\"]:\n        over_limit=m[\"\
    amount\"]>m.get(\"enrich_coverage_limit\",0)\n        policy_issue=m.get(\"enrich_policy_status\"\
    )!=\"active\"\n        claimant_issue=not m.get(\"enrich_claimant_match\",True)\n        joined.append({**m,\"\
    coverage_exceeded\":over_limit,\"policy_not_active\":policy_issue,\n                       \"claimant_mismatch\"\
    :claimant_issue,\"flags\":sum([over_limit,policy_issue,claimant_issue])})\n    (art/\"join_reference_metadata_artifact.json\"\
    ).write_text(json.dumps({\"joined\":joined,\"total\":len(joined)},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"join_reference_metadata_status.json\").write_text(json.dumps({\"success\":True,\"joined\"\
    :len(joined),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  09_assess_multimodal_quality.py: "#!/usr/bin/env python3\n\"\"\"Assess multimodal quality: final quality\
    \ grade combining all signals.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    joined=json.loads((art/\"join_reference_metadata_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    visual=json.loads((art/\"extract_visual_text_features_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    vmap={v[\"claim_id\"]:v for v in visual[\"visual\"]}\n    assessed=[]\n\
    \    for j in joined[\"joined\"]:\n        v=vmap.get(j[\"claim_id\"],{})\n        # Final disposition\n\
    \        if j[\"flags\"]>=2 or j[\"quality_quality_grade\"]==\"poor\" or not v.get(\"ocr_passed\"\
    ,True):\n            disposition=\"manual_review\"\n        elif j[\"flags\"]==1 or j[\"quality_quality_grade\"\
    ]==\"acceptable\":\n            disposition=\"flagged\"\n        else:\n            disposition=\"\
    auto_approve\"\n        assessed.append({**j,\"ocr_passed\":v.get(\"ocr_passed\",False),\"text_completeness\"\
    :v.get(\"text_completeness\",\"?\"),\"final_disposition\":disposition})\n    (art/\"assess_multimodal_quality_artifact.json\"\
    ).write_text(json.dumps({\"assessed\":assessed,\"total\":len(assessed)},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"assess_multimodal_quality_status.json\").write_text(json.dumps({\"success\":True,\"\
    assessed\":len(assessed),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\"\
    : main()\n"
  10_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish: CSV report + flags summary + audit manifest.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\n\
    def main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    p.add_argument(\"--execution-time\",type=str,default=None);\
    \ a=p.parse_args(); art=a.workspace/\"artifacts\"\n    et=a.execution_time or \"2026-07-20T12:00:00Z\"\
    ; fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"))\n    assessed=json.loads((art/\"assess_multimodal_quality_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    summary={\"total_claims\":assessed[\"total\"]+validated[\"total_rejected\"\
    ],\n             \"valid\":assessed[\"total\"],\"rejected\":validated[\"total_rejected\"],\n     \
    \        \"auto_approve\":sum(1 for a in assessed[\"assessed\"] if a[\"final_disposition\"]==\"auto_approve\"\
    ),\n             \"flagged\":sum(1 for a in assessed[\"assessed\"] if a[\"final_disposition\"]==\"\
    flagged\"),\n             \"manual_review\":sum(1 for a in assessed[\"assessed\"] if a[\"final_disposition\"\
    ]==\"manual_review\")}\n    manifest={\"checkpoint_id\":f\"ckpt_claim_extract_{et[:10].replace('-','_')}\"\
    ,\"checkpoint_time\":et,\n              \"pipeline_id\":fx[\"pipeline_id\"],\"summary\":summary,\"\
    output_files\":[\"claim_assessment.csv\",\"audit_manifest.json\"],\"status\":\"completed\"}\n    (art/\"\
    audit_manifest.json\").write_text(json.dumps(manifest,indent=2)+\"\\n\",encoding=\"utf-8\")\n    csv_rel=\"\
    claim_assessment.csv\"\n    with (art/csv_rel).open(\"w\",encoding=\"utf-8\",newline=\"\") as f:\n\
    \        w=csv.DictWriter(f,fieldnames=[\"claim_id\",\"amount\",\"claim_type\",\"quality_grade\",\"\
    flags\",\"final_disposition\"])\n        w.writeheader()\n        for a in assessed[\"assessed\"]:\
    \ w.writerow({\"claim_id\":a[\"claim_id\"],\"amount\":a[\"amount\"],\"claim_type\":a[\"claim_type\"\
    ],\"quality_grade\":a.get(\"quality_quality_grade\",\"?\"),\"flags\":a[\"flags\"],\"final_disposition\"\
    :a[\"final_disposition\"]})\n    (art/\"publish_outputs_artifact.json\").write_text(json.dumps({\"\
    manifest\":manifest,\"csv\":csv_rel},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"publish_outputs_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"csv_exported\":csv_rel,\"summary\":summary,\"errors\"\
    :[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
