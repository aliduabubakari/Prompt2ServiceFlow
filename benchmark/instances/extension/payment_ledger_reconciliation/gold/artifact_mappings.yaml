- intent_id: validate_source_contract
  inputs:
    input_artifacts: ingest_source_batch_artifact
  outputs:
    output_artifacts: validate_source_contract_artifact
    execution_report: validate_source_contract_status
- intent_id: flatten_nested_payloads
  inputs:
    input_artifacts: validate_source_contract_artifact
  outputs:
    output_artifacts: flatten_nested_payloads_artifact
    execution_report: flatten_nested_payloads_status
- intent_id: join_tabular_reference_data
  inputs:
    input_artifacts: flatten_nested_payloads_artifact
  outputs:
    output_artifacts: join_tabular_reference_data_artifact
    execution_report: join_tabular_reference_data_status
- intent_id: reconcile_conflicting_values
  inputs:
    input_artifacts: join_tabular_reference_data_artifact
