    output_artifacts: reconcile_conflicting_values_artifact
    execution_report: reconcile_conflicting_values_status
- intent_id: evaluate_policy_or_risk
  inputs:
    input_artifacts: reconcile_conflicting_values_artifact
  outputs:
    output_artifacts: evaluate_policy_or_risk_artifact
