apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: research-data-lake-publication-gate-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: research-data-lake-publication-gate-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: research-data-lake-publication-gate-nominal-scripts
  - name: fixtures
    configMap:
      name: research-data-lake-publication-gate-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: data.json
      - key: fixture-0002
        path: fixture.json
      - key: fixture-0003
        path: sample_document.pdf
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: standardize-cross-domain-entities
        template: run-standardize-cross-domain-entities
        depends: validate-source-contract.Succeeded
      - name: resolve-entity-conflicts
        template: run-resolve-entity-conflicts
        depends: standardize-cross-domain-entities.Succeeded
      - name: score-operational-priority
        template: run-score-operational-priority
        depends: resolve-entity-conflicts.Succeeded
      - name: apply-publication-or-routing-gate
        template: run-apply-publication-or-routing-gate
        depends: score-operational-priority.Succeeded
      - name: create-stakeholder-packet
        template: run-create-stakeholder-packet
        depends: apply-publication-or-routing-gate.Succeeded
      - name: publish-notifications
        template: run-publish-notifications
        depends: create-stakeholder-packet.Succeeded
      - name: evaluate-policy-or-risk
        template: run-evaluate-policy-or-risk
        depends: publish-notifications.Succeeded
      - name: route-approved-records
        template: run-route-approved-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: route-exception-records
        template: run-route-exception-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: merge-route-outcomes
        template: run-merge-route-outcomes
        depends: route-approved-records.Succeeded && route-exception-records.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: merge-route-outcomes.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
