apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manufacturing-telemetry-quality-scoring-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest machine telemetry JSONL, machine master\
    \ CSV, and quality thresholds.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True)\n    p.add_argument(\"--fixture\",type=Path,required=True); p.add_argument(\"\
    --execution-time\",type=str,default=None)\n    a=p.parse_args(); r=a.workspace; art=r/\"artifacts\"\
    ; art.mkdir(parents=True,exist_ok=True)\n    fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"\
    )); fd=a.fixture.parent\n    telemetry=[]\n    with (fd/fx[\"inputs\"][\"telemetry\"]).open(encoding=\"\
    utf-8\") as f:\n        for line in f:\n            line=line.strip()\n            if line: telemetry.append(json.loads(line))\n\
    \    machines={}\n    with (fd/fx[\"inputs\"][\"machines\"]).open(encoding=\"utf-8\",newline=\"\"\
    ) as f:\n        for row in csv.DictReader(f): machines[row[\"machine_id\"]]=row\n    thresholds=json.loads((fd/fx[\"\
    inputs\"][\"thresholds\"]).read_text(encoding=\"utf-8\"))\n    result={\"telemetry\":telemetry,\"\
    machines\":machines,\"thresholds\":thresholds,\"total\":len(telemetry),\"ingested_at\":a.execution_time}\n\
    \    (art/\"ingest_source_batch_artifact.json\").write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"\
    utf-8\")\n    (art/\"ingest_source_batch_status.json\").write_text(json.dumps({\"success\":True,\"\
    records\":len(telemetry),\"machines\":len(machines),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\nif __name__==\"__main__\": main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate: required fields, machine existence,\
    \ numeric ranges.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    telemetry,machines,thresholds=ingested[\"telemetry\"],ingested[\"machines\"],ingested[\"\
    thresholds\"]\n    required=set(thresholds[\"required_fields\"]); errors=[]; valid=[]\n    for t in\
    \ telemetry:\n        issues=[]\n        if required-set(t.keys()): issues.append(f\"missing_fields:\
    \ {required-set(t.keys())}\")\n        if t.get(\"machine_id\") not in machines: issues.append(f\"\
    unknown_machine: {t.get('machine_id')}\")\n        if issues: errors.append({\"record\":t.get(\"machine_id\"\
    ,\"?\"),\"issues\":issues})\n        else: valid.append(t)\n    result={\"valid_records\":valid,\"\
    errors\":errors,\"total_valid\":len(valid),\"total_rejected\":len(errors)}\n    (art/\"validate_source_contract_artifact.json\"\
    ).write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"validate_source_contract_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"valid\":len(valid),\"rejected\":len(errors),\"errors\"\
    :errors},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_extract_branch_features.py: "#!/usr/bin/env python3\n\"\"\"Extract features: compute per-shift metrics\
    \ (defect rate, utilization, cycles vs rated).\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\nSHIFT_MINUTES=480\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    machines=ingested[\"machines\"]; features=[]\n    for t in validated[\"\
    valid_records\"]:\n        m=machines.get(t[\"machine_id\"],{})\n        rated=int(m.get(\"rated_cycles_per_shift\"\
    ,1))\n        dr=round(t[\"defect_count\"]/max(t[\"cycle_count\"],1)*100,2)\n        util=round(t[\"\
    uptime_min\"]/SHIFT_MINUTES*100,1)\n        features.append({\"machine_id\":t[\"machine_id\"],\"shift\"\
    :t[\"shift\"],\"date\":t[\"date\"],\n                         \"defect_rate_pct\":dr,\"utilization_pct\"\
    :util,\n                         \"cycle_efficiency_pct\":round(t[\"cycle_count\"]/rated*100,1)})\n\
    \    (art/\"extract_branch_features_artifact.json\").write_text(json.dumps({\"features\":features,\"\
    total\":len(features)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"extract_branch_features_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"extracted\":len(features),\"errors\":[]},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_enrich_branch_context.py: "#!/usr/bin/env python3\n\"\"\"Enrich context: join with machine master\
    \ data (type, line, age).\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom datetime\
    \ import datetime\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    machines=ingested[\"machines\"]; current_year=2026; enriched=[]\n\
    \    for t in validated[\"valid_records\"]:\n        m=machines.get(t[\"machine_id\"],{})\n      \
    \  age=current_year-int(m.get(\"install_year\",current_year))\n        enriched.append({\"machine_id\"\
    :t[\"machine_id\"],\"shift\":t[\"shift\"],\n                         \"machine_type\":m.get(\"machine_type\"\
    ,\"?\"),\"production_line\":m.get(\"production_line\",\"?\"),\"machine_age_years\":age})\n    (art/\"\
    enrich_branch_context_artifact.json\").write_text(json.dumps({\"enriched\":enriched,\"total\":len(enriched)},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"enrich_branch_context_status.json\").write_text(json.dumps({\"\
    success\":True,\"enriched\":len(enriched),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif\
    \ __name__==\"__main__\": main()\n"
  05_score_branch_quality.py: "#!/usr/bin/env python3\n\"\"\"Score quality: check telemetry against machine-specific\
    \ thresholds.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    machines=ingested[\"machines\"]; scores=[]\n    for t in validated[\"valid_records\"\
    ]:\n        m=machines.get(t[\"machine_id\"],{})\n        issues=[]\n        max_temp=float(m.get(\"\
    max_temp_c\",100))\n        max_vib=float(m.get(\"max_vibration_rms\",100))\n        if t.get(\"avg_temp_c\"\
    ,0)>max_temp: issues.append(f\"temp_high: {t['avg_temp_c']}>{max_temp}\")\n        if t.get(\"vibration_rms\"\
    ,0)>max_vib: issues.append(f\"vibration_high: {t['vibration_rms']}>{max_vib}\")\n        scores.append({\"\
    machine_id\":t[\"machine_id\"],\"shift\":t[\"shift\"],\"temp_c\":t.get(\"avg_temp_c\"),\n        \
    \                \"vibration_rms\":t.get(\"vibration_rms\"),\"threshold_issues\":len(issues),\"issues\"\
    :issues})\n    (art/\"score_branch_quality_artifact.json\").write_text(json.dumps({\"scores\":scores,\"\
    total\":len(scores)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"score_branch_quality_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"scored\":len(scores),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  06_merge_branch_outputs.py: "#!/usr/bin/env python3\n\"\"\"Merge branches: combine features, enrichment,\
    \ and quality scores.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib\
    \ import Path\n\ndef key(r): return (r[\"machine_id\"],r[\"shift\"])\ndef main():\n    p=argparse.ArgumentParser();\
    \ p.add_argument(\"--workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n\
    \    a=p.parse_args(); art=a.workspace/\"artifacts\"\n    feats=json.loads((art/\"extract_branch_features_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    enr=json.loads((art/\"enrich_branch_context_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    scor=json.loads((art/\"score_branch_quality_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    fm={key(f):f for f in feats[\"features\"]}; em={key(e):e for\
    \ e in enr[\"enriched\"]}; sm={key(s):s for s in scor[\"scores\"]}\n    merged=[]\n    for k in fm:\n\
    \        m={**fm[k]}\n        if k in em: m.update({kk:vv for kk,vv in em[k].items() if kk not in\
    \ (\"machine_id\",\"shift\")})\n        if k in sm: m.update({kk:vv for kk,vv in sm[k].items() if\
    \ kk not in (\"machine_id\",\"shift\")})\n        merged.append(m)\n    (art/\"merge_branch_outputs_artifact.json\"\
    ).write_text(json.dumps({\"merged\":merged,\"total\":len(merged)},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"merge_branch_outputs_status.json\").write_text(json.dumps({\"success\":True,\"merged\"\
    :len(merged),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  07_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish: compute final quality grade, export CSV,\
    \ write manifest.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib\
    \ import Path\n\nSHIFT_MINUTES=480\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  p.add_argument(\"--execution-time\",type=str,default=None); a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    et=a.execution_time or \"2026-07-20T12:00:00Z\"; fx=json.loads(a.fixture.read_text(encoding=\"\
    utf-8\"))\n    merged=json.loads((art/\"merge_branch_outputs_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    grades=ingested[\"thresholds\"][\"quality_grades\"]; uptime_min=ingested[\"thresholds\"\
    ][\"uptime_pct_min\"]\n    assessed=[]\n    for m in merged[\"merged\"]:\n        issues=0\n     \
    \   if m.get(\"defect_rate_pct\",0)>ingested[\"thresholds\"][\"defect_rate_max\"]: issues+=1\n   \
    \     if m.get(\"utilization_pct\",100)<uptime_min: issues+=1\n        issues+=m.get(\"threshold_issues\"\
    ,0)\n        if issues<=grades[\"excellent\"][\"max_issues\"]: grade=\"excellent\"\n        elif issues<=grades[\"\
    acceptable\"][\"max_issues\"]: grade=\"acceptable\"\n        elif issues<=grades[\"attention\"][\"\
    max_issues\"]: grade=\"attention\"\n        else: grade=\"critical\"\n        assessed.append({**m,\"\
    quality_grade\":grade,\"total_issues\":issues})\n    summary={\"total\":len(assessed),\n         \
    \    \"excellent\":sum(1 for a in assessed if a[\"quality_grade\"]==\"excellent\"),\n            \
    \ \"acceptable\":sum(1 for a in assessed if a[\"quality_grade\"]==\"acceptable\"),\n             \"\
    attention\":sum(1 for a in assessed if a[\"quality_grade\"]==\"attention\"),\n             \"critical\"\
    :sum(1 for a in assessed if a[\"quality_grade\"]==\"critical\")}\n    manifest={\"checkpoint_id\"\
    :f\"ckpt_mfg_quality_{et[:10].replace('-','_')}\",\"checkpoint_time\":et,\n              \"pipeline_id\"\
    :fx[\"pipeline_id\"],\"summary\":summary,\"output_files\":[\"mfg_quality_report.csv\",\"audit_manifest.json\"\
    ],\"status\":\"completed\"}\n    (art/\"audit_manifest.json\").write_text(json.dumps(manifest,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    csv_rel=\"mfg_quality_report.csv\"\n    with (art/csv_rel).open(\"\
    w\",encoding=\"utf-8\",newline=\"\") as f:\n        fields=[\"machine_id\",\"shift\",\"machine_type\"\
    ,\"production_line\",\"defect_rate_pct\",\"utilization_pct\",\"cycle_efficiency_pct\",\"quality_grade\"\
    ,\"total_issues\"]\n        w=csv.DictWriter(f,fieldnames=fields)\n        w.writeheader()\n     \
    \   for a in assessed: w.writerow({f:a.get(f,\"\") for f in fields})\n    (art/\"publish_outputs_artifact.json\"\
    ).write_text(json.dumps({\"manifest\":manifest,\"csv\":csv_rel},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"publish_outputs_status.json\").write_text(json.dumps({\"success\":True,\"csv_exported\"\
    :csv_rel,\"summary\":summary,\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: manufacturing-telemetry-quality-scoring-fixtures
  namespace: prompt2serviceflow
data:
  fixture-0000: "{\n  \"pipeline_id\": \"manufacturing_telemetry_quality_scoring\",\n  \"inputs\": {\n\
