apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: clinical-note-deidentification-summary-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: clinical-note-deidentification-summary
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: clinical-note-deidentification-summary-scripts
  - name: fixtures
    configMap:
      name: clinical-note-deidentification-summary-fixtures
      items:
      - key: fixture-0000
        path: clinical_notes.json
      - key: fixture-0001
        path: deid_policy.json
      - key: fixture-0002
        path: fixture.json
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: extract-or-parse-text
        template: run-extract-or-parse-text
        depends: validate-source-contract.Succeeded
      - name: chunk-documents
        template: run-chunk-documents
        depends: extract-or-parse-text.Succeeded
      - name: generate-embeddings
        template: run-generate-embeddings
        depends: chunk-documents.Succeeded
      - name: write-vector-index
        template: run-write-vector-index
        depends: generate-embeddings.Succeeded
      - name: retrieve-grounding-context
        template: run-retrieve-grounding-context
        depends: write-vector-index.Succeeded
      - name: run-structured-extraction
        template: run-run-structured-extraction
        depends: retrieve-grounding-context.Succeeded
      - name: evaluate-policy-or-risk
        template: run-evaluate-policy-or-risk
        depends: run-structured-extraction.Succeeded
      - name: route-approved-records
        template: run-route-approved-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: route-exception-records
        template: run-route-exception-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: merge-route-outcomes
        template: run-merge-route-outcomes
        depends: route-approved-records.Succeeded && route-exception-records.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: merge-route-outcomes.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
