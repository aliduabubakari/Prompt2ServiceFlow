assertions_version: 0.1.0
pipeline_id: medical_image_metadata_quality_check
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: studies
    expected: 6
  - assertion_id: validate_has_rejections
    type: json_path_gte
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    minimum: 1
  - assertion_id: normalize_has_grades
    type: json_path_gte
    path: artifacts/normalize_records_status.json
    json_path: normalized
    minimum: 4
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/dicom_quality_report.csv
  - assertion_id: manifest_completed
    type: json_path_equals
    path: artifacts/audit_manifest.json
    json_path: status
    expected: completed
