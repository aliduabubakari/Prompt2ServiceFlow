assertions_version: 0.1.0
pipeline_id: document_image_compliance_packet
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: documents
    expected: 5
  - assertion_id: validate_rejected
    type: json_path_gte
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    minimum: 1
  - assertion_id: partitions_normalized
    type: json_path_gte
    path: artifacts/normalize_partition_a_status.json
    json_path: normalized
    minimum: 3
  - assertion_id: fuse_count
    type: json_path_gte
    path: artifacts/fuse_partitions_status.json
    json_path: fused
    minimum: 3
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/compliance_packet.csv
  - assertion_id: manifest_completed
    type: json_path_equals
    path: artifacts/audit_manifest.json
    json_path: status
    expected: completed
