apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: identity-document-redaction-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: identity-document-redaction-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: identity-document-redaction-nominal-scripts
  - name: fixtures
    configMap:
      name: identity-document-redaction-nominal-fixtures
      items:
      - key: fixture-0000
        path: fixture.json
      - key: fixture-0001
        path: identity_docs.json
      - key: fixture-0002
        path: redaction_policy.json
      - key: fixture-0003
        path: sample_document.pdf
      - key: fixture-0004
        path: sample_image.png
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: extract-visual-text-features
        template: run-extract-visual-text-features
        depends: validate-source-contract.Succeeded
      - name: join-reference-metadata
        template: run-join-reference-metadata
        depends: extract-visual-text-features.Succeeded
      - name: assess-multimodal-quality
        template: run-assess-multimodal-quality
        depends: join-reference-metadata.Succeeded
      - name: evaluate-policy-or-risk
        template: run-evaluate-policy-or-risk
        depends: assess-multimodal-quality.Succeeded
      - name: route-approved-records
        template: run-route-approved-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: route-exception-records
        template: run-route-exception-records
        depends: evaluate-policy-or-risk.Succeeded
      - name: merge-route-outcomes
        template: run-merge-route-outcomes
        depends: route-approved-records.Succeeded && route-exception-records.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: merge-route-outcomes.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-extract-visual-text-features
    metadata:
      annotations:
        prompt2serviceflow/intent-id: extract_visual_text_features
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/03_extract_visual_text_features.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-join-reference-metadata
    metadata:
      annotations:
        prompt2serviceflow/intent-id: join_reference_metadata
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/04_join_reference_metadata.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-assess-multimodal-quality
    metadata:
