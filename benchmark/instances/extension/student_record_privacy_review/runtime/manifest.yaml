runtime_manifest_version: 0.1.0
pipeline_id: student_record_privacy_review
image: python:3.12-slim
workflow_parameters:
- name: execution-time
  default: '2026-07-20T12:00:00Z'
tasks:
- intent_id: ingest_source_batch
  script: scripts/01_ingest_source_batch.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  - --execution-time
  - '{execution-time}'
- intent_id: validate_source_contract
  script: scripts/02_validate_source_contract.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  dependencies:
  - ingest_source_batch
- intent_id: evaluate_policy_or_risk
  script: scripts/03_evaluate_policy_or_risk.py
  dependencies:
  - validate_source_contract
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: route_approved_records
  script: scripts/04_route_approved_records.py
  dependencies:
  - evaluate_policy_or_risk
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: route_exception_records
  script: scripts/05_route_exception_records.py
  dependencies:
  - evaluate_policy_or_risk
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: merge_route_outcomes
  script: scripts/06_merge_route_outcomes.py
  dependencies:
  - route_approved_records
  - route_exception_records
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: publish_outputs
  script: scripts/07_publish_outputs.py
  dependencies:
  - merge_route_outcomes
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  - --execution-time
  - '{execution-time}'
scenarios:
- name: nominal
  parameters:
    execution-time: '2026-07-20T12:00:00Z'
  fixture_root: fixtures/scenarios/nominal
