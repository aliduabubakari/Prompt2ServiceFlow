apiVersion: v1
kind: ServiceAccount
metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: student-record-privacy-review-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest student records CSV, consent forms\
    \ JSON, and privacy policy.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True)\n    p.add_argument(\"--fixture\",type=Path,required=True); p.add_argument(\"\
    --execution-time\",type=str,default=None)\n    a=p.parse_args(); r=a.workspace; art=r/\"artifacts\"\
    ; art.mkdir(parents=True,exist_ok=True)\n    fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"\
    )); fd=a.fixture.parent\n    records=[]\n    with (fd/fx[\"inputs\"][\"records\"]).open(encoding=\"\
    utf-8\",newline=\"\") as f:\n        for row in csv.DictReader(f): records.append(row)\n    consent_data=json.loads((fd/fx[\"\
    inputs\"][\"consent\"]).read_text(encoding=\"utf-8\"))\n    consents={c[\"student_id\"]:c for c in\
    \ consent_data[\"consents\"]}\n    policy=json.loads((fd/fx[\"inputs\"][\"policy\"]).read_text(encoding=\"\
    utf-8\"))\n    result={\"records\":records,\"consents\":consents,\"policy\":policy,\"total\":len(records),\"\
    ingested_at\":a.execution_time}\n    (art/\"ingest_source_batch_artifact.json\").write_text(json.dumps(result,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"ingest_source_batch_status.json\").write_text(json.dumps({\"\
    success\":True,\"records\":len(records),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate: required fields, consent existence,\
    \ GPA range, enrollment year sanity.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    records,consents,policy=ingested[\"records\"],ingested[\"consents\"\
    ],ingested[\"policy\"]\n    max_age=policy[\"max_enrollment_age_years\"]; cur_year=policy[\"current_academic_year\"\
    ]\n    required={\"student_id\",\"student_name\",\"email\",\"grade\",\"program\",\"gpa\",\"consent_status\"\
    }\n    errors=[]; valid=[]\n    for r in records:\n        issues=[]\n        if required-set(r.keys()):\
    \ issues.append(f\"missing_fields: {required-set(r.keys())}\")\n        if r.get(\"student_id\") not\
    \ in consents: issues.append(\"missing_consent_record\")\n        try:\n            gpa=float(r.get(\"\
    gpa\",0))\n            if gpa<0 or gpa>4.0: issues.append(f\"invalid_gpa: {gpa}\")\n        except:\
    \ issues.append(\"invalid_gpa\")\n        try:\n            ey=int(r.get(\"enrollment_year\",cur_year))\n\
    \            if cur_year-ey>max_age: issues.append(f\"stale_enrollment: {cur_year-ey}>{max_age}\"\
    )\n        except: pass\n        if issues: errors.append({\"student_id\":r.get(\"student_id\",\"\
    ?\"),\"issues\":issues})\n        else: valid.append(r)\n    result={\"valid\":valid,\"errors\":errors,\"\
    total_valid\":len(valid),\"total_rejected\":len(errors)}\n    (art/\"validate_source_contract_artifact.json\"\
    ).write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"validate_source_contract_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"valid\":len(valid),\"rejected\":len(errors),\"errors\"\
    :errors},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_evaluate_policy_or_risk.py: "#!/usr/bin/env python3\n\"\"\"Evaluate risk: check consent validity,\
    \ sensitive data, sharing permissions.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    consents,policy=ingested[\"consents\"],ingested[\"policy\"]\n\
    \    req_ver=policy[\"required_consent_version\"]; rules=policy[\"risk_rules\"]; scored=[]\n    for\
    \ r in validated[\"valid\"]:\n        sid=r[\"student_id\"]; c=consents.get(sid,{})\n        issues=[];\
    \ cs=r.get(\"consent_status\",\"\")\n        if cs==\"revoked\": issues.append(rules[\"revoked_consent\"\
    ])\n        elif cs==\"pending\": issues.append(rules[\"pending_consent\"])\n        elif not c.get(\"\
    data_sharing_consent\"): issues.append(\"no_data_sharing_consent\")\n        if c.get(\"consent_version\"\
    )!=req_ver: issues.append(f\"outdated_consent_version: {c.get('consent_version')}!={req_ver}\")\n\
    \        if r.get(\"has_sensitive_data\")==\"true\" and not c.get(\"data_sharing_consent\"): issues.append(rules[\"\
    sensitive_data_no_consent\"])\n        route=\"exception\" if issues else \"approved\"\n        scored.append({\"\
    student_id\":sid,\"student_name\":r[\"student_name\"],\"consent_status\":cs,\n                   \
    \    \"has_sensitive\":r.get(\"has_sensitive_data\"),\"risk_issues\":issues,\"route\":route,\"issue_count\"\
    :len(issues)})\n    approved=[s for s in scored if s[\"route\"]==\"approved\"]; exceptions=[s for\
    \ s in scored if s[\"route\"]==\"exception\"]\n    result={\"scored\":scored,\"approved\":approved,\"\
    exceptions\":exceptions,\"total\":len(scored),\"approved_count\":len(approved),\"exception_count\"\
    :len(exceptions)}\n    (art/\"evaluate_policy_or_risk_artifact.json\").write_text(json.dumps(result,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"evaluate_policy_or_risk_status.json\").write_text(json.dumps({\"\
    success\":True,\"scored\":len(scored),\"approved\":len(approved),\"exceptions\":len(exceptions),\"\
    errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_route_approved_records.py: "#!/usr/bin/env python3\n\"\"\"Route approved records: prepare for research\
    \ release with redaction.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib\
    \ import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    evaluated=json.loads((art/\"evaluate_policy_or_risk_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    approved=evaluated[\"approved\"]\n    result={\"route\":\"approved\",\"records\":approved,\"\
    total\":len(approved),\"action\":\"release_with_redaction\"}\n    (art/\"route_approved_records_artifact.json\"\
    ).write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"route_approved_records_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"routed\":len(approved),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  05_route_exception_records.py: "#!/usr/bin/env python3\n\"\"\"Route exception records: escalate to data\
    \ steward for manual review.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom\
    \ pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    evaluated=json.loads((art/\"evaluate_policy_or_risk_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    exceptions=evaluated[\"exceptions\"]\n    result={\"route\"\
    :\"exception\",\"records\":exceptions,\"total\":len(exceptions),\"action\":\"escalate_to_steward\"\
    }\n    (art/\"route_exception_records_artifact.json\").write_text(json.dumps(result,indent=2)+\"\\\
    n\",encoding=\"utf-8\")\n    (art/\"route_exception_records_status.json\").write_text(json.dumps({\"\
    success\":True,\"escalated\":len(exceptions),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\n\
    if __name__==\"__main__\": main()\n"
  06_merge_route_outcomes.py: "#!/usr/bin/env python3\n\"\"\"Merge: combine approved and exception records\
    \ into final disposition.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib\
    \ import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    app=json.loads((art/\"route_approved_records_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    exc=json.loads((art/\"route_exception_records_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    merged={\"disposition\":\"complete\",\"summary\":{\"total\":app[\"total\"]+exc[\"total\"\
    ],\"approved\":app[\"total\"],\"exceptions\":exc[\"total\"]},\n            \"approved\":app[\"records\"\
    ],\"exceptions\":exc[\"records\"]}\n    (art/\"merge_route_outcomes_artifact.json\").write_text(json.dumps(merged,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"merge_route_outcomes_status.json\").write_text(json.dumps({\"\
    success\":True,\"merged\":merged[\"summary\"][\"total\"],\"errors\":[]},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\nif __name__==\"__main__\": main()\n"
  07_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish: redacted CSV for research release + exception\
    \ report + audit manifest.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    p.add_argument(\"\
    --execution-time\",type=str,default=None); a=p.parse_args(); art=a.workspace/\"artifacts\"\n    et=a.execution_time\
    \ or \"2026-07-20T12:00:00Z\"; fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"))\n    merged=json.loads((art/\"\
    merge_route_outcomes_artifact.json\").read_text(encoding=\"utf-8\"))\n    val=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    summary={\"total\":merged[\"summary\"][\"total\"]+val[\"total_rejected\"\
    ],\"valid\":merged[\"summary\"][\"total\"],\n             \"rejected\":val[\"total_rejected\"],\"\
    approved\":merged[\"summary\"][\"approved\"],\"exceptions\":merged[\"summary\"][\"exceptions\"]}\n\
    \    manifest={\"checkpoint_id\":f\"ckpt_student_privacy_{et[:10].replace('-','_')}\",\"checkpoint_time\"\
    :et,\n              \"pipeline_id\":fx[\"pipeline_id\"],\"summary\":summary,\"output_files\":[\"privacy_review_report.csv\"\
    ,\"audit_manifest.json\"],\"status\":\"completed\"}\n    (art/\"audit_manifest.json\").write_text(json.dumps(manifest,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    csv_rel=\"privacy_review_report.csv\"\n    with (art/csv_rel).open(\"\
    w\",encoding=\"utf-8\",newline=\"\") as f:\n        w=csv.DictWriter(f,fieldnames=[\"student_id\"\
    ,\"student_name\",\"consent_status\",\"has_sensitive\",\"route\",\"risk_issues\"])\n        w.writeheader()\n\
    \        for g in [merged[\"approved\"],merged[\"exceptions\"]]:\n            for r in g: w.writerow({\"\
    student_id\":r[\"student_id\"],\"student_name\":r[\"student_name\"],\n                           \
    \          \"consent_status\":r[\"consent_status\"],\"has_sensitive\":r[\"has_sensitive\"],\n    \
    \                                 \"route\":r[\"route\"],\"risk_issues\":\"; \".join(r[\"risk_issues\"\
    ])})\n    (art/\"publish_outputs_artifact.json\").write_text(json.dumps({\"manifest\":manifest,\"\
    csv\":csv_rel},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"publish_outputs_status.json\").write_text(json.dumps({\"\
    success\":True,\"csv_exported\":csv_rel,\"summary\":summary,\"errors\":[]},indent=2)+\"\\n\",encoding=\"\
    utf-8\")\nif __name__==\"__main__\": main()\n"
---
