apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: pdf-policy-corpus-ingestion-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: pdf-policy-corpus-ingestion-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: pdf-policy-corpus-ingestion-nominal-scripts
  - name: fixtures
    configMap:
      name: pdf-policy-corpus-ingestion-nominal-fixtures
      items:
      - key: fixture-0000
        path: data.csv
      - key: fixture-0001
        path: data.json
      - key: fixture-0002
        path: fixture.json
      - key: fixture-0003
        path: sample_document.pdf
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: stage-raw-artifacts
        template: run-stage-raw-artifacts
        depends: validate-source-contract.Succeeded
      - name: normalize-records
        template: run-normalize-records
        depends: stage-raw-artifacts.Succeeded
      - name: extract-or-parse-text
        template: run-extract-or-parse-text
        depends: normalize-records.Succeeded
      - name: chunk-documents
        template: run-chunk-documents
        depends: extract-or-parse-text.Succeeded
      - name: generate-embeddings
        template: run-generate-embeddings
        depends: chunk-documents.Succeeded
      - name: write-vector-index
        template: run-write-vector-index
        depends: generate-embeddings.Succeeded
      - name: retrieve-grounding-context
        template: run-retrieve-grounding-context
        depends: write-vector-index.Succeeded
      - name: run-structured-extraction
        template: run-run-structured-extraction
        depends: retrieve-grounding-context.Succeeded
      - name: score-confidence-and-policy
        template: run-score-confidence-and-policy
        depends: run-structured-extraction.Succeeded
      - name: create-human-review-packet
        template: run-create-human-review-packet
        depends: score-confidence-and-policy.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: create-human-review-packet.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
