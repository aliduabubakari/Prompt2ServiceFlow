assertions_version: 0.1.0
pipeline_id: queue_backlog_snapshot_analysis
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_bounded_events_status.json
    json_path: messages
    expected: 8
  - assertion_id: dedup_removed
    type: json_path_gte
    path: artifacts/sort_and_deduplicate_records_status.json
    json_path: dups
    minimum: 1
  - assertion_id: windows_built
    type: json_path_gte
    path: artifacts/build_analysis_windows_status.json
    json_path: windows
    minimum: 2
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/queue_backlog_report.csv
