artifact_mapping_version: 0.1.0
benchmark_id: extension:support_ticket_semantic_routing
mappings:
- intent_id: ingest_source_batch
  inputs:
    input_artifacts: source_bundle
  outputs:
    output_artifacts: ingest_source_batch_artifact
    execution_report: ingest_source_batch_status
- intent_id: validate_source_contract
  inputs:
    input_artifacts: ingest_source_batch_artifact
  outputs:
    output_artifacts: validate_source_contract_artifact
    execution_report: validate_source_contract_status
- intent_id: extract_or_parse_text
  inputs:
    input_artifacts: validate_source_contract_artifact
  outputs:
    output_artifacts: extract_or_parse_text_artifact
    execution_report: extract_or_parse_text_status
- intent_id: chunk_documents
  inputs:
    input_artifacts: extract_or_parse_text_artifact
  outputs:
    output_artifacts: chunk_documents_artifact
    execution_report: chunk_documents_status
- intent_id: generate_embeddings
  inputs:
    input_artifacts: chunk_documents_artifact
  outputs:
    output_artifacts: generate_embeddings_artifact
    execution_report: generate_embeddings_status
- intent_id: write_vector_index
  inputs:
    input_artifacts: generate_embeddings_artifact
  outputs:
    output_artifacts: write_vector_index_artifact
    execution_report: write_vector_index_status
- intent_id: retrieve_grounding_context
  inputs:
    input_artifacts: write_vector_index_artifact
  outputs:
    output_artifacts: retrieve_grounding_context_artifact
    execution_report: retrieve_grounding_context_status
- intent_id: run_structured_extraction
  inputs:
    input_artifacts: retrieve_grounding_context_artifact
  outputs:
    output_artifacts: run_structured_extraction_artifact
    execution_report: run_structured_extraction_status
- intent_id: evaluate_policy_or_risk
  inputs:
    input_artifacts: run_structured_extraction_artifact
  outputs:
    output_artifacts: evaluate_policy_or_risk_artifact
    execution_report: evaluate_policy_or_risk_status
- intent_id: route_approved_records
  inputs:
    input_artifacts: evaluate_policy_or_risk_artifact
  outputs:
    output_artifacts: route_approved_records_artifact
    execution_report: route_approved_records_status
- intent_id: route_exception_records
  inputs:
    input_artifacts: evaluate_policy_or_risk_artifact
  outputs:
    output_artifacts: route_exception_records_artifact
    execution_report: route_exception_records_status
- intent_id: merge_route_outcomes
  inputs:
    input_artifacts:
    - route_approved_records_artifact
    - route_exception_records_artifact
  outputs:
    output_artifacts: merge_route_outcomes_artifact
    execution_report: merge_route_outcomes_status
- intent_id: publish_outputs
  inputs:
    input_artifacts: merge_route_outcomes_artifact
  outputs:
    output_artifacts: publish_outputs_artifact
    execution_report: publish_outputs_status
