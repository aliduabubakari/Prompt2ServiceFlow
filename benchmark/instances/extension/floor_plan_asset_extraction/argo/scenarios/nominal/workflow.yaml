apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: floor-plan-asset-extraction-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: floor-plan-asset-extraction-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters: []
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: floor-plan-asset-extraction-nominal-scripts
  - name: fixtures
    configMap:
      name: floor-plan-asset-extraction-nominal-fixtures
      items:
      - key: fixture-0000
        path: building_registry.csv
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: floor_plans.json
      - key: fixture-0003
        path: sample_document.pdf
      - key: fixture-0004
        path: sample_image.png
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: normalize-partition-a
        template: run-normalize-partition-a
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-b
        template: run-normalize-partition-b
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-c
        template: run-normalize-partition-c
        depends: validate-source-contract.Succeeded
      - name: fuse-partitions
        template: run-fuse-partitions
        depends: normalize-partition-a.Succeeded && normalize-partition-b.Succeeded && normalize-partition-c.Succeeded
      - name: extract-visual-text-features
        template: run-extract-visual-text-features
        depends: fuse-partitions.Succeeded
      - name: join-reference-metadata
        template: run-join-reference-metadata
        depends: extract-visual-text-features.Succeeded
      - name: assess-multimodal-quality
        template: run-assess-multimodal-quality
        depends: join-reference-metadata.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: assess-multimodal-quality.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-normalize-partition-a
