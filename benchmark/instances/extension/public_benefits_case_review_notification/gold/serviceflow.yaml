  - from: route_approved_records
    to: merge_route_outcomes
  - from: route_exception_records
    to: merge_route_outcomes
  - from: merge_route_outcomes
    to: publish_outputs
  parallel_groups: []
  branches:
  - branch_id: evaluate_policy_or_risk_branch
    decision_intent: evaluate_policy_or_risk
    cases:
    - case_id: approved
      condition: decision.approved == true
      next_intents:
      - route_approved_records
    - case_id: exception
      condition: decision.exception == true
      next_intents:
      - route_exception_records
    merge_intent: merge_route_outcomes
  gates:
  - gate_id: evaluate_policy_or_risk_gate
    sensor_intent: evaluate_policy_or_risk
    condition: policy, risk, confidence, or quality decision
    gated_intents:
    - route_approved_records
    - route_exception_records
