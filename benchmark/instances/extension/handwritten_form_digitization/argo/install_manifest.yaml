metadata:
  name: prompt2serviceflow-runner
  namespace: prompt2serviceflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: handwritten-form-digitization-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest form submissions JSON and form templates\
    \ CSV.\"\"\"  \nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True)\n\
    \    p.add_argument(\"--fixture\",type=Path,required=True); p.add_argument(\"--execution-time\",type=str,default=None)\n\
    \    a=p.parse_args(); r=a.workspace; art=r/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n\
    \    fx=json.loads(a.fixture.read_text(encoding=\"utf-8\")); fd=a.fixture.parent\n    forms=json.loads((fd/fx[\"\
    inputs\"][\"forms\"]).read_text(encoding=\"utf-8\"))\n    templates={}\n    with (fd/fx[\"inputs\"\
    ][\"templates\"]).open(encoding=\"utf-8\",newline=\"\") as f:\n        for row in csv.DictReader(f):\
    \ templates[row[\"form_type\"]]=row\n    (art/\"ingest_source_batch_artifact.json\").write_text(json.dumps({\"\
    forms\":forms,\"templates\":templates,\"total\":len(forms),\"ingested_at\":a.execution_time},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"ingest_source_batch_status.json\").write_text(json.dumps({\"\
    success\":True,\"forms\":len(forms),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate: required fields, form type\
    \ existence, OCR & scan quality minimums.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    forms,templates=ingested[\"forms\"],ingested[\"templates\"];\
    \ required={\"form_id\",\"form_type\",\"ocr_confidence\",\"scan_quality\"}\n    errors=[]; valid=[]\n\
    \    for f in forms:\n        issues=[]\n        if required-set(f.keys()): issues.append(f\"missing_fields:\
    \ {required-set(f.keys())}\")\n        tmpl=templates.get(f.get(\"form_type\",\"\"),{})\n        if\
    \ not tmpl: issues.append(f\"unknown_form_type: {f.get('form_type')}\")\n        else:\n         \
    \   min_ocr=float(tmpl.get(\"min_ocr_confidence\",0.6))\n            if f.get(\"ocr_confidence\",0)<min_ocr:\
    \ issues.append(f\"low_ocr: {f.get('ocr_confidence')}<{min_ocr}\")\n            min_rec=float(tmpl.get(\"\
    min_field_recognition_pct\",70))\n            rec_pct=f.get(\"fields_recognized\",0)/max(f.get(\"\
    field_count\",1),1)*100\n            if rec_pct<min_rec: issues.append(f\"low_recognition: {rec_pct:.0f}%<{min_rec}%\"\
    )\n        if issues: errors.append({\"form_id\":f.get(\"form_id\",\"?\"),\"issues\":issues})\n  \
    \      else: valid.append(f)\n    result={\"valid\":valid,\"errors\":errors,\"total_valid\":len(valid),\"\
    total_rejected\":len(errors)}\n    (art/\"validate_source_contract_artifact.json\").write_text(json.dumps(result,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"validate_source_contract_status.json\").write_text(json.dumps({\"\
    success\":True,\"valid\":len(valid),\"rejected\":len(errors),\"errors\":errors},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_stage_raw_artifacts.py: "#!/usr/bin/env python3\n\"\"\"Stage: join validated forms with template\
    \ metadata.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    templates=ingested[\"templates\"]; staged=[]\n    for f in validated[\"valid\"]:\n\
    \        t=templates.get(f[\"form_type\"],{})\n        staged.append({**f,\"department\":t.get(\"\
    department\",\"?\"),\"routing_queue\":t.get(\"routing_queue\",\"auto_process\"),\n               \
    \        \"requires_sig\":t.get(\"requires_signature\")==\"true\"})\n    (art/\"stage_raw_artifacts_artifact.json\"\
    ).write_text(json.dumps({\"staged\":staged,\"total\":len(staged)},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"stage_raw_artifacts_status.json\").write_text(json.dumps({\"success\":True,\"staged\"\
    :len(staged),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  04_normalize_records.py: "#!/usr/bin/env python3\n\"\"\"Normalize: compute recognition rate and signature\
    \ compliance.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import\
    \ Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    staged=json.loads((art/\"stage_raw_artifacts_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    norm=[]\n    for s in staged[\"staged\"]:\n        rec_rate=round(s[\"fields_recognized\"\
    ]/max(s[\"field_count\"],1)*100,1)\n        sig_ok=not s.get(\"requires_sig\") or s.get(\"has_signature\"\
    )\n        issues=sum([not sig_ok])\n        norm.append({**s,\"recognition_rate\":rec_rate,\"signature_ok\"\
    :sig_ok,\"issue_count\":issues})\n    (art/\"normalize_records_artifact.json\").write_text(json.dumps({\"\
    normalized\":norm,\"total\":len(norm)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"normalize_records_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"normalized\":len(norm),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  05_extract_visual_text_features.py: "#!/usr/bin/env python3\n\"\"\"Extract visual/text features: classify\
    \ quality and assign confidence tier.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    norm=json.loads((art/\"normalize_records_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    visual=[]\n    for n in norm[\"normalized\"]:\n        ocr=n[\"\
    ocr_confidence\"]\n        tier=\"high\" if ocr>=0.85 else (\"medium\" if ocr>=0.65 else \"low\")\n\
    \        visual.append({**n,\"confidence_tier\":tier,\"needs_manual\":n[\"issue_count\"]>0 or tier==\"\
    low\"})\n    (art/\"extract_visual_text_features_artifact.json\").write_text(json.dumps({\"visual\"\
    :visual,\"total\":len(visual)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"extract_visual_text_features_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"extracted\":len(visual),\"errors\":[]},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  06_join_reference_metadata.py: "#!/usr/bin/env python3\n\"\"\"Join reference: route to department queue\
    \ based on confidence and issues.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    visual=json.loads((art/\"extract_visual_text_features_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    joined=[]\n    for v in visual[\"visual\"]:\n        queue=v.get(\"\
    routing_queue\",\"auto_process\")\n        if v.get(\"needs_manual\"): queue=\"manual_review\"\n \
    \       joined.append({**v,\"final_queue\":queue})\n    (art/\"join_reference_metadata_artifact.json\"\
    ).write_text(json.dumps({\"joined\":joined,\"total\":len(joined)},indent=2)+\"\\n\",encoding=\"utf-8\"\
    )\n    (art/\"join_reference_metadata_status.json\").write_text(json.dumps({\"success\":True,\"joined\"\
    :len(joined),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  07_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish: digitization report CSV + audit manifest.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\n\
    def main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    p.add_argument(\"--execution-time\",type=str,default=None);\
    \ a=p.parse_args(); art=a.workspace/\"artifacts\"\n    et=a.execution_time or \"2026-07-20T12:00:00Z\"\
    ; fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"))\n    joined=json.loads((art/\"join_reference_metadata_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    val=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    summary={\"total\":joined[\"total\"]+val[\"total_rejected\"\
    ],\"valid\":joined[\"total\"],\"rejected\":val[\"total_rejected\"],\n             \"auto_process\"\
    :sum(1 for j in joined[\"joined\"] if j[\"final_queue\"]==\"auto_process\"),\n             \"manual_review\"\
    :sum(1 for j in joined[\"joined\"] if j[\"final_queue\"]==\"manual_review\")}\n    manifest={\"checkpoint_id\"\
    :f\"ckpt_form_{et[:10].replace('-','_')}\",\"checkpoint_time\":et,\n              \"pipeline_id\"\
    :fx[\"pipeline_id\"],\"summary\":summary,\"output_files\":[\"form_digitization.csv\",\"audit_manifest.json\"\
    ],\"status\":\"completed\"}\n    (art/\"audit_manifest.json\").write_text(json.dumps(manifest,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    csv_rel=\"form_digitization.csv\"\n    with (art/csv_rel).open(\"w\"\
    ,encoding=\"utf-8\",newline=\"\") as f:\n        w=csv.DictWriter(f,fieldnames=[\"form_id\",\"form_type\"\
    ,\"submitter_name\",\"ocr_confidence\",\"recognition_rate\",\"confidence_tier\",\"signature_ok\",\"\
    final_queue\",\"department\"],extrasaction='ignore')\n        w.writeheader()\n        for j in joined[\"\
    joined\"]: w.writerow(j)\n    (art/\"publish_outputs_artifact.json\").write_text(json.dumps({\"manifest\"\
    :manifest,\"csv\":csv_rel},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"publish_outputs_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"csv\":csv_rel,\"summary\":summary,\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
---
