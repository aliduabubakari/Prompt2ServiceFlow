runtime_manifest_version: 0.1.0
pipeline_id: handwritten_form_digitization
image: python:3.12-slim
workflow_parameters:
- name: execution-time
  default: '2026-07-20T12:00:00Z'
tasks:
- intent_id: ingest_source_batch
  script: scripts/01_ingest_source_batch.py
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  - --execution-time
  - '{execution-time}'
- intent_id: validate_source_contract
  script: scripts/02_validate_source_contract.py
  dependencies:
  - ingest_source_batch
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: stage_raw_artifacts
  script: scripts/03_stage_raw_artifacts.py
  dependencies:
  - validate_source_contract
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: normalize_records
  script: scripts/04_normalize_records.py
  dependencies:
  - stage_raw_artifacts
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: extract_visual_text_features
  script: scripts/05_extract_visual_text_features.py
  dependencies:
  - normalize_records
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: join_reference_metadata
  script: scripts/06_join_reference_metadata.py
  dependencies:
  - extract_visual_text_features
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
- intent_id: publish_outputs
  script: scripts/07_publish_outputs.py
  dependencies:
  - join_reference_metadata
  arguments:
  - --workspace
  - '{workspace}'
  - --fixture
  - '{fixtures}/fixture.json'
  - --execution-time
  - '{execution-time}'
scenarios:
- name: nominal
  parameters:
    execution-time: '2026-07-20T12:00:00Z'
  fixture_root: fixtures/scenarios/nominal
