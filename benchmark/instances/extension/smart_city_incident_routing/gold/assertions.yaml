assertions_version: 0.1.0
pipeline_id: smart_city_incident_routing
scenarios:
- scenario: nominal
  assertions:
  - assertion_id: ingest_count
    type: json_path_equals
    path: artifacts/ingest_source_batch_status.json
    json_path: incidents
    expected: 5
  - assertion_id: validate_rejected_zero
    type: json_path_equals
    path: artifacts/validate_source_contract_status.json
    json_path: rejected
    expected: 0
  - assertion_id: fuse_count
    type: json_path_gte
    path: artifacts/fuse_partitions_status.json
    json_path: fused
    minimum: 5
  - assertion_id: has_auto_dispatch
    type: json_path_gte
    path: artifacts/score_operational_priority_status.json
    json_path: auto
    minimum: 1
  - assertion_id: publish_succeeds
    type: json_path_equals
    path: artifacts/publish_outputs_status.json
    json_path: success
    expected: true
  - assertion_id: csv_exists
    type: file_exists
    path: artifacts/dispatch_report.csv
  - assertion_id: manifest_completed
    type: json_path_equals
    path: artifacts/audit_manifest.json
    json_path: status
    expected: completed
