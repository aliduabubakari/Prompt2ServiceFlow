apiVersion: argoproj.io/v1alpha1
kind: Workflow
metadata:
  generateName: smart-city-incident-routing-nominal-
  namespace: prompt2serviceflow
  labels:
    prompt2serviceflow/pipeline: smart-city-incident-routing-nominal
    prompt2serviceflow/profile: mock
    prompt2serviceflow/scenario: nominal
spec:
  entrypoint: pipeline
  serviceAccountName: prompt2serviceflow-runner
  arguments:
    parameters:
    - name: execution-time
      value: '2026-07-20T12:00:00Z'
  podGC:
    strategy: OnWorkflowCompletion
  volumeClaimTemplates:
  - metadata:
      name: workspace
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  volumes:
  - name: scripts
    configMap:
      name: smart-city-incident-routing-nominal-scripts
  - name: fixtures
    configMap:
      name: smart-city-incident-routing-nominal-fixtures
      items:
      - key: fixture-0000
        path: asset_registry.csv
      - key: fixture-0001
        path: fixture.json
      - key: fixture-0002
        path: incident_reports.json
      - key: fixture-0003
        path: routing_policy.json
      - key: fixture-0004
        path: sample_image.png
  templates:
  - name: pipeline
    dag:
      tasks:
      - name: ingest-source-batch
        template: run-ingest-source-batch
      - name: validate-source-contract
        template: run-validate-source-contract
        depends: ingest-source-batch.Succeeded
      - name: normalize-partition-a
        template: run-normalize-partition-a
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-b
        template: run-normalize-partition-b
        depends: validate-source-contract.Succeeded
      - name: normalize-partition-c
        template: run-normalize-partition-c
        depends: validate-source-contract.Succeeded
      - name: fuse-partitions
        template: run-fuse-partitions
        depends: normalize-partition-a.Succeeded && normalize-partition-b.Succeeded && normalize-partition-c.Succeeded
      - name: standardize-cross-domain-entities
        template: run-standardize-cross-domain-entities
        depends: fuse-partitions.Succeeded
      - name: resolve-entity-conflicts
        template: run-resolve-entity-conflicts
        depends: standardize-cross-domain-entities.Succeeded
      - name: score-operational-priority
        template: run-score-operational-priority
        depends: resolve-entity-conflicts.Succeeded
      - name: publish-outputs
        template: run-publish-outputs
        depends: score-operational-priority.Succeeded
  - name: run-ingest-source-batch
    metadata:
      annotations:
        prompt2serviceflow/intent-id: ingest_source_batch
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/01_ingest_source_batch.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      - --execution-time
      - '{{workflow.parameters.execution-time}}'
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-validate-source-contract
    metadata:
      annotations:
        prompt2serviceflow/intent-id: validate_source_contract
    container:
      image: python:3.12-slim
      command:
      - python
      args:
      - /opt/p2sf/scripts/02_validate_source_contract.py
      - --workspace
      - /workspace
      - --fixture
      - /opt/p2sf/fixtures/fixture.json
      volumeMounts:
      - name: scripts
        mountPath: /opt/p2sf/scripts
      - name: fixtures
        mountPath: /opt/p2sf/fixtures
      - name: workspace
        mountPath: /workspace
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 500m
          memory: 512Mi
  - name: run-normalize-partition-a
