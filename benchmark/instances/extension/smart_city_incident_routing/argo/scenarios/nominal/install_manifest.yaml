apiVersion: v1
kind: ConfigMap
metadata:
  name: smart-city-incident-routing-nominal-scripts
  namespace: prompt2serviceflow
data:
  01_ingest_source_batch.py: "#!/usr/bin/env python3\n\"\"\"Ingest incident reports, asset registry, and\
    \ routing policy.\"\"\"\nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib\
    \ import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True)\n\
    \    p.add_argument(\"--fixture\",type=Path,required=True); p.add_argument(\"--execution-time\",type=str,default=None)\n\
    \    a=p.parse_args(); r=a.workspace; art=r/\"artifacts\"; art.mkdir(parents=True,exist_ok=True)\n\
    \    fx=json.loads(a.fixture.read_text(encoding=\"utf-8\")); fd=a.fixture.parent\n    incidents=json.loads((fd/fx[\"\
    inputs\"][\"incidents\"]).read_text(encoding=\"utf-8\"))\n    assets={}\n    with (fd/fx[\"inputs\"\
    ][\"assets\"]).open(encoding=\"utf-8\",newline=\"\") as f:\n        for row in csv.DictReader(f):\
    \ assets[row[\"asset_id\"]]=row\n    policy=json.loads((fd/fx[\"inputs\"][\"policy\"]).read_text(encoding=\"\
    utf-8\"))\n    result={\"incidents\":incidents,\"assets\":assets,\"policy\":policy,\"total\":len(incidents),\"\
    ingested_at\":a.execution_time}\n    (art/\"ingest_source_batch_artifact.json\").write_text(json.dumps(result,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"ingest_source_batch_status.json\").write_text(json.dumps({\"\
    success\":True,\"incidents\":len(incidents),\"assets\":len(assets),\"errors\":[]},indent=2)+\"\\n\"\
    ,encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  02_validate_source_contract.py: "#!/usr/bin/env python3\n\"\"\"Validate: required incident fields, priority\
    \ validity, coordinate presence.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    incidents=ingested[\"incidents\"]; valid_p={\"critical\",\"\
    high\",\"medium\",\"low\"}; required={\"incident_id\",\"type\",\"location\",\"priority\"}\n    errors=[];\
    \ valid=[]\n    for inc in incidents:\n        issues=[]\n        if required-set(inc.keys()): issues.append(f\"\
    missing_fields: {required-set(inc.keys())}\")\n        if inc.get(\"priority\") not in valid_p: issues.append(f\"\
    invalid_priority: {inc.get('priority')}\")\n        if issues: errors.append({\"incident_id\":inc.get(\"\
    incident_id\",\"?\"),\"issues\":issues})\n        else: valid.append(inc)\n    result={\"valid\":valid,\"\
    errors\":errors,\"total_valid\":len(valid),\"total_rejected\":len(errors)}\n    (art/\"validate_source_contract_artifact.json\"\
    ).write_text(json.dumps(result,indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"validate_source_contract_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"valid\":len(valid),\"rejected\":len(errors),\"errors\"\
    :errors},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  03_normalize_partition_a.py: "#!/usr/bin/env python3\n\"\"\"Normalize A: incident metadata \u2014 type,\
    \ priority, source, age.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom datetime\
    \ import datetime\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    now=datetime(2026,7,20,12,0,0)\n    norm=[]\n    for inc in\
    \ validated[\"valid\"]:\n        age_h=(now-datetime.fromisoformat(inc[\"reported_at\"].replace(\"\
    Z\",\"+00:00\")).replace(tzinfo=None)).total_seconds()/3600\n        norm.append({\"incident_id\"\
    :inc[\"incident_id\"],\"type\":inc[\"type\"],\"priority\":inc[\"priority\"],\n                   \
    \  \"source\":inc.get(\"reported_by\",\"?\"),\"age_hours\":round(age_h,1)})\n    (art/\"normalize_partition_a_artifact.json\"\
    ).write_text(json.dumps({\"partition\":\"A\",\"records\":norm,\"total\":len(norm)},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\n    (art/\"normalize_partition_a_status.json\").write_text(json.dumps({\"\
    success\":True,\"normalized\":len(norm),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
  04_normalize_partition_b.py: "#!/usr/bin/env python3\n\"\"\"Normalize B: asset proximity \u2014 match\
    \ incidents to nearest registered assets.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    assets=ingested[\"assets\"]\n    # Simple location-based matching\
    \ (substring)\n    norm=[]\n    for inc in validated[\"valid\"]:\n        matched=[aid for aid,ast\
    \ in assets.items() if any(w in inc.get(\"location\",\"\") for w in ast.get(\"location\",\"\").replace(\"\
    &\",\"\").split())]\n        norm.append({\"incident_id\":inc[\"incident_id\"],\"nearby_assets\":matched,\"\
    asset_count\":len(matched)})\n    (art/\"normalize_partition_b_artifact.json\").write_text(json.dumps({\"\
    partition\":\"B\",\"records\":norm,\"total\":len(norm)},indent=2)+\"\\n\",encoding=\"utf-8\")\n  \
    \  (art/\"normalize_partition_b_status.json\").write_text(json.dumps({\"success\":True,\"normalized\"\
    :len(norm),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  05_normalize_partition_c.py: "#!/usr/bin/env python3\n\"\"\"Normalize C: policy matching \u2014 compute\
    \ priority score and SLA targets.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    validated=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    policy=ingested[\"policy\"]; pweights=policy[\"priority_weights\"\
    ]; sla=policy[\"response_sla_minutes\"]\n    norm=[]\n    for inc in validated[\"valid\"]:\n     \
    \   score=pweights.get(inc[\"priority\"],0)\n        norm.append({\"incident_id\":inc[\"incident_id\"\
    ],\"priority_score\":score,\"sla_minutes\":sla.get(inc[\"priority\"],480),\n                     \"\
    auto_dispatch\":inc[\"type\"] in policy[\"auto_dispatch_types\"]})\n    (art/\"normalize_partition_c_artifact.json\"\
    ).write_text(json.dumps({\"partition\":\"C\",\"records\":norm,\"total\":len(norm)},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\n    (art/\"normalize_partition_c_status.json\").write_text(json.dumps({\"\
    success\":True,\"normalized\":len(norm),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"\
    __main__\": main()\n"
  06_fuse_partitions.py: "#!/usr/bin/env python3\n\"\"\"Fuse partitions: combine A+B+C into unified incident\
    \ records.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\nfrom pathlib import Path\n\
    \ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args(); art=a.workspace/\"\
    artifacts\"\n    pa=json.loads((art/\"normalize_partition_a_artifact.json\").read_text(encoding=\"\
    utf-8\"))\n    pb=json.loads((art/\"normalize_partition_b_artifact.json\").read_text(encoding=\"utf-8\"\
    ))\n    pc=json.loads((art/\"normalize_partition_c_artifact.json\").read_text(encoding=\"utf-8\"))\n\
    \    am={r[\"incident_id\"]:r for r in pa[\"records\"]}; bm={r[\"incident_id\"]:r for r in pb[\"records\"\
    ]}\n    cm={r[\"incident_id\"]:r for r in pc[\"records\"]}; fused=[]\n    for iid in am: fused.append({**am[iid],**bm.get(iid,{}),**cm.get(iid,{})})\n\
    \    (art/\"fuse_partitions_artifact.json\").write_text(json.dumps({\"fused\":fused,\"total\":len(fused)},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"fuse_partitions_status.json\").write_text(json.dumps({\"success\"\
    :True,\"fused\":len(fused),\"errors\":[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\"\
    : main()\n"
  07_standardize_cross_domain_entities.py: "#!/usr/bin/env python3\n\"\"\"Standardize cross-domain entities:\
    \ map incident types to departments and asset types.\"\"\"\nfrom __future__ import annotations\nimport\
    \ argparse, json\nfrom pathlib import Path\n\nDEPT_MAP={\"pothole\":\"Transportation\",\"power_outage\"\
    :\"Utilities\",\"graffiti\":\"Parks & Recreation\",\n          \"flooding\":\"Water Management\",\"\
    noise_complaint\":\"Code Enforcement\"}\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    fused=json.loads((art/\"fuse_partitions_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    std=[]\n    for f in fused[\"fused\"]:\n        dept=DEPT_MAP.get(f[\"\
    type\"],\"General\")\n        std.append({**f,\"responsible_dept\":dept,\"has_nearby_asset\":len(f.get(\"\
    nearby_assets\",[]))>0})\n    (art/\"standardize_cross_domain_entities_artifact.json\").write_text(json.dumps({\"\
    standardized\":std,\"total\":len(std)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"standardize_cross_domain_entities_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"standardized\":len(std),\"errors\":[]},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  08_resolve_entity_conflicts.py: "#!/usr/bin/env python3\n\"\"\"Resolve entity conflicts: flag duplicate-like\
    \ incidents, conflicting priorities.\"\"\"\nfrom __future__ import annotations\nimport argparse, json\n\
    from pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\"\
    ,type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n    a=p.parse_args();\
    \ art=a.workspace/\"artifacts\"\n    std=json.loads((art/\"standardize_cross_domain_entities_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    resolved=[]; seen_types={}\n    for s in std[\"standardized\"\
    ]:\n        conflict=seen_types.get(s[\"type\"])\n        seen_types[s[\"type\"]]=s[\"incident_id\"\
    ]\n        resolved.append({**s,\"potential_duplicate\":bool(conflict),\"conflict_with\":conflict\
    \ or \"\"})\n    (art/\"resolve_entity_conflicts_artifact.json\").write_text(json.dumps({\"resolved\"\
    :resolved,\"total\":len(resolved)},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"resolve_entity_conflicts_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"resolved\":len(resolved),\"errors\":[]},indent=2)+\"\\\
    n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  09_score_operational_priority.py: "#!/usr/bin/env python3\n\"\"\"Score operational priority: final routing\
    \ decision based on score, SLA, auto-dispatch.\"\"\"\nfrom __future__ import annotations\nimport argparse,\
    \ json\nfrom pathlib import Path\n\ndef main():\n    p=argparse.ArgumentParser(); p.add_argument(\"\
    --workspace\",type=Path,required=True); p.add_argument(\"--fixture\",type=Path,required=True)\n  \
    \  a=p.parse_args(); art=a.workspace/\"artifacts\"\n    ingested=json.loads((art/\"ingest_source_batch_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    resolved=json.loads((art/\"resolve_entity_conflicts_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    policy=ingested[\"policy\"]; threshold=policy[\"escalation_threshold\"\
    ]; scored=[]\n    for r in resolved[\"resolved\"]:\n        dispatch=\"auto\" if r.get(\"auto_dispatch\"\
    ) else (\"escalate\" if r[\"priority_score\"]>=threshold else \"queue\")\n        scored.append({**r,\"\
    dispatch_action\":dispatch,\"routing_decision\":f\"{dispatch}:{r['responsible_dept']}\"})\n    (art/\"\
    score_operational_priority_artifact.json\").write_text(json.dumps({\"scored\":scored,\"total\":len(scored)},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    (art/\"score_operational_priority_status.json\").write_text(json.dumps({\"\
    success\":True,\"scored\":len(scored),\n        \"auto\":sum(1 for s in scored if s[\"dispatch_action\"\
    ]==\"auto\"),\n        \"escalate\":sum(1 for s in scored if s[\"dispatch_action\"]==\"escalate\"\
    ),\n        \"queue\":sum(1 for s in scored if s[\"dispatch_action\"]==\"queue\"),\"errors\":[]},indent=2)+\"\
    \\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
  10_publish_outputs.py: "#!/usr/bin/env python3\n\"\"\"Publish: routing dispatch CSV + audit manifest.\"\
    \"\"\nfrom __future__ import annotations\nimport argparse, csv, json\nfrom pathlib import Path\n\n\
    def main():\n    p=argparse.ArgumentParser(); p.add_argument(\"--workspace\",type=Path,required=True);\
    \ p.add_argument(\"--fixture\",type=Path,required=True)\n    p.add_argument(\"--execution-time\",type=str,default=None);\
    \ a=p.parse_args(); art=a.workspace/\"artifacts\"\n    et=a.execution_time or \"2026-07-20T12:00:00Z\"\
    ; fx=json.loads(a.fixture.read_text(encoding=\"utf-8\"))\n    scored=json.loads((art/\"score_operational_priority_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    val=json.loads((art/\"validate_source_contract_artifact.json\"\
    ).read_text(encoding=\"utf-8\"))\n    summary={\"total\":scored[\"total\"]+val[\"total_rejected\"\
    ],\"valid\":scored[\"total\"],\"rejected\":val[\"total_rejected\"],\n             \"auto_dispatched\"\
    :sum(1 for s in scored[\"scored\"] if s[\"dispatch_action\"]==\"auto\"),\n             \"escalated\"\
    :sum(1 for s in scored[\"scored\"] if s[\"dispatch_action\"]==\"escalate\"),\n             \"queued\"\
    :sum(1 for s in scored[\"scored\"] if s[\"dispatch_action\"]==\"queue\")}\n    manifest={\"checkpoint_id\"\
    :f\"ckpt_city_incident_{et[:10].replace('-','_')}\",\"checkpoint_time\":et,\n              \"pipeline_id\"\
    :fx[\"pipeline_id\"],\"summary\":summary,\"output_files\":[\"dispatch_report.csv\",\"audit_manifest.json\"\
    ],\"status\":\"completed\"}\n    (art/\"audit_manifest.json\").write_text(json.dumps(manifest,indent=2)+\"\
    \\n\",encoding=\"utf-8\")\n    csv_rel=\"dispatch_report.csv\"\n    with (art/csv_rel).open(\"w\"\
    ,encoding=\"utf-8\",newline=\"\") as f:\n        w=csv.DictWriter(f,fieldnames=[\"incident_id\",\"\
    type\",\"priority\",\"source\",\"age_hours\",\"priority_score\",\"responsible_dept\",\"dispatch_action\"\
    ,\"routing_decision\"],extrasaction='ignore')\n        w.writeheader()\n        for s in scored[\"\
    scored\"]: w.writerow(s)\n    (art/\"publish_outputs_artifact.json\").write_text(json.dumps({\"manifest\"\
    :manifest,\"csv\":csv_rel},indent=2)+\"\\n\",encoding=\"utf-8\")\n    (art/\"publish_outputs_status.json\"\
    ).write_text(json.dumps({\"success\":True,\"csv_exported\":csv_rel,\"summary\":summary,\"errors\"\
    :[]},indent=2)+\"\\n\",encoding=\"utf-8\")\nif __name__==\"__main__\": main()\n"
