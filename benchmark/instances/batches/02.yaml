batch_version: 0.1.0
batch_id: batch_02
target_size: 5
strategy: Cover remaining topologies (branch_merge, linear, staged_etl, fan_out_only)
  with progressively broader domain and integration patterns.
pipelines:
  - benchmark_id: main:content_moderation_pipeline
    status: local_complete
    rationale: Second branch-merge composition with toxicity scoring, moderation
      audit logging, and safe-publication routing.
  - benchmark_id: main:daily_sales_report
    status: local_complete
    rationale: Linear report-generation flow with SQL extraction, currency conversion,
      chart rendering, and email delivery.
  - benchmark_id: main:healthcare_claims_etl
    status: local_complete
    rationale: Staged ETL in healthcare domain with provider join, anonymization,
      and analytics warehouse loading.
  - benchmark_id: main:multi_channel_marketing_campaign
    status: local_complete
    rationale: Fan-out pattern dispatching customer segments to email, SMS, and
      push-notification channels.
  - benchmark_id: main:supply_chain_shipment_etl
    status: local_complete
    rationale: Staged ETL for supply-chain shipment enrichment, standardization,
      database loading, and status notification.
