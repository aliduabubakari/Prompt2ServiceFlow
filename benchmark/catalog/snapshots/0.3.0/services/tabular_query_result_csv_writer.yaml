schema_version: 0.1.0
service_id: tabular_query_result_csv_writer
version: 1.0.0
display_name: Tabular Query Result CSV Writer
category: Transformer
capability:
  summary: Writes a tabular query result artifact to a deterministic CSV file with
    configurable delimiter and header behavior.
  operations:
  - Read a tabular query result artifact.
  - Validate column metadata and row records.
  - Serialize rows to CSV using configured delimiter/header parameters.
  - Emit the CSV artifact and transform status.
  keywords:
  - csv
  - tabular result
  - serialization
  - report data
  - transformer
  limitations:
  - Does not query databases.
  - Does not generate charts or PDFs.
  - Does not validate sales-specific business rules.
lifecycle:
  status: active
interface:
  inputs:
  - name: query_result
    description: Tabular result artifact to serialize as CSV.
    channel: artifact
    data_type: table
    media_type: application/json
    schema_ref: schema://tabular_query_result/v1
    required: true
    cardinality: one
    sensitivity: financial
  outputs:
  - name: csv_file
    description: CSV artifact containing serialized query results.
    channel: artifact
    data_type: csv
    media_type: text/csv
    schema_ref: schema://csv_file_artifact/v1
    required: true
    cardinality: one
    sensitivity: financial
  - name: transform_status
    description: Observable status with rows written, output URI, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://csv_write_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: output_path
    description: Deterministic output artifact path or name for the CSV file.
    type: string
    required: true
  - name: include_header
    description: Whether to include a header row with column names.
    type: boolean
    required: false
  - name: delimiter
    description: CSV delimiter.
    type: string
    required: false
    enum:
    - ','
    - ;
    - \t
    - '|'
  secrets: []
contracts:
- contract_id: csv_writer_input_schema
  type: json_schema
  applies_to: input
  target: query_result
  description: Input tabular result must include column names and row records.
  schema_ref: schema://tabular_query_result/v1
  expression: '{"type":"object","required":["columns","rows","row_count"],"properties":{"columns":{"type":"array","minItems":1,"items":{"type":"string"}},"rows":{"type":"array","items":{"type":"object"}},"row_count":{"type":"integer","minimum":0}}}'
- contract_id: csv_write_status_schema
  type: json_schema
  applies_to: output
  target: transform_status
  description: Status exposes CSV write outcome.
  schema_ref: schema://csv_write_status/v1
  expression: '{"type":"object","required":["success","rows_written","output_uri"],"properties":{"success":{"type":"boolean"},"rows_written":{"type":"integer","minimum":0},"output_uri":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: csv_writer_effect
  type: effect
  applies_to: service
  target: tabular_query_result_csv_writer
  description: On success, the CSV artifact exists and row count written matches the
    input row count.
  expression: transform_status.success == true implies exists(csv_file) and transform_status.rows_written
    == query_result.row_count
invocation:
  type: argo_workflow_template
  template_name: tabular-query-result-csv-writer-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.tabular_query_result_csv_writer
  implementation_ref: services/implementations/tabular_query_result_csv_writer
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  - financial
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log raw financial rows; emit counts and bounded diagnostics.
  idempotency_notes: Same input result and serialization parameters produce the same
    CSV bytes.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: generated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: candidate
  source_refs:
  - main:daily_sales_report#transform_to_csv
  notes:
