  implementation_ref: services/implementations/brokerage_account_holdings_extractor
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - https://*
  - http://*
  secret_access: optional
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - financial
  - confidential
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit brokerage credentials or authorization headers in outputs or logs.
  - Holdings and account identifiers are financial data.
  - Retries and retry delay remain workflow-level configuration.
  idempotency_notes: Retry-safe for read-only holdings endpoints with stable account
