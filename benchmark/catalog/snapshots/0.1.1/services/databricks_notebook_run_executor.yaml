schema_version: 0.1.0
service_id: databricks_notebook_run_executor
version: 1.0.0
display_name: Databricks Notebook Run Executor
category: ExternalWorkflowAdapter
capability:
  summary: Submits and optionally waits for a Databricks notebook run on an explicitly
    bound Databricks workspace and existing cluster, then emits a run reference and
    execution status.
  operations:
  - Resolve a bound Databricks workspace connection and authentication context.
  - Submit a Databricks notebook task using a configured notebook path and existing
    cluster identifier.
  - Pass optional notebook parameters when supplied by the workflow.
  - Optionally wait for the Databricks run to reach a terminal state within the invocation
    timeout.
  keywords:
  - databricks
  - notebook
  - external workflow
  - existing cluster
  - job run
  - cloud service
  limitations:
  - Targets Databricks-compatible workspace APIs only.
  - Does not create or manage Databricks clusters; an existing cluster identifier
    must be supplied for this contract.
  - Does not implement workflow branching, dependency ordering, scheduling, or retry
    policy.
  - Does not validate notebook code or guarantee notebook-level idempotency.
lifecycle:
  status: active
interface:
  inputs:
  - name: databricks_workspace
    description: Databricks workspace resource/connection used to submit notebook
      runs.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://databricks_workspace_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: run_reference
    description: Reference to the submitted Databricks run, including run identifier
      and notebook path.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://databricks_run_reference/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: execution_status
    description: Observable Databricks run status containing success flag, lifecycle/result
      states, cluster id, notebook path, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://databricks_notebook_execution_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: notebook_path
    description: Workspace path of the Databricks notebook to execute.
    type: string
    required: true
    pattern: ^/.+
  - name: existing_cluster_id
    description: Identifier of the existing Databricks cluster on which the notebook
      run should execute.
    type: string
    required: true
  - name: notebook_parameters
    description: Optional key/value parameters to pass to the Databricks notebook
      task.
    type: object
    required: false
  - name: wait_for_completion
    description: Whether the service should wait for a terminal run state before returning
      status.
    type: boolean
    required: false
  secrets:
  - name: databricks_auth
    description: Authentication material for the bound Databricks workspace connection.
    required: true
contracts:
- contract_id: databricks_notebook_path_contract
  type: precondition
  applies_to: parameter
  target: notebook_path
  description: Notebook path must be a non-empty Databricks workspace path.
  expression: length(trim(notebook_path)) > 0 and notebook_path matches '^/.+'
- contract_id: databricks_existing_cluster_contract
  type: precondition
  applies_to: parameter
  target: existing_cluster_id
  description: Existing cluster identifier must be supplied by the workflow binding.
  expression: length(trim(existing_cluster_id)) > 0
- contract_id: databricks_run_reference_schema
  type: json_schema
  applies_to: output
  target: run_reference
  description: Run reference identifies the submitted Databricks run.
  schema_ref: schema://databricks_run_reference/v1
  expression: '{"type":"object","required":["run_id","notebook_path","existing_cluster_id"],"properties":{"run_id":{"type":["string","integer"]},"run_page_url":{"type":["string","null"]},"notebook_path":{"type":"string"},"existing_cluster_id":{"type":"string"}}}'
- contract_id: databricks_notebook_execution_status_schema
  type: json_schema
  applies_to: output
  target: execution_status
  description: Execution status exposes the run outcome for workflow validation.
  schema_ref: schema://databricks_notebook_execution_status/v1
  expression: '{"type":"object","required":["success","submitted","notebook_path","existing_cluster_id","terminal"],"properties":{"success":{"type":"boolean"},"submitted":{"type":"boolean"},"notebook_path":{"type":"string"},"existing_cluster_id":{"type":"string"},"terminal":{"type":"boolean"},"life_cycle_state":{"type":["string","null"]},"result_state":{"type":["string","null"]},"run_id":{"type":["string","integer","null"]},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: databricks_notebook_run_effect
  type: effect
  applies_to: service
  target: databricks_notebook_run_executor
  description: On successful completion, the service has submitted a Databricks notebook
    run, observed a successful terminal state when waiting is enabled, and emitted
    run status.
  expression: execution_status.success == true implies execution_status.submitted
    == true and exists(run_reference.run_id)
invocation:
  type: argo_workflow_template
  template_name: databricks-notebook-run-executor-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.databricks_notebook_run_executor
  implementation_ref: services/implementations/databricks_notebook_run_executor
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - https://*.databricks.com/*
  - databricks://*
  secret_access: required
  retry_safe: false
  idempotency: unknown
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Databricks credentials and secrets must not be emitted in logs or status artifacts.
  - Bind only approved Databricks workspaces and cluster identifiers.
  - Workflow retry delay and branch routing remain outside the service catalogue.
  idempotency_notes: Repeated invocations can execute the notebook multiple times.
    Retry safety depends on the notebook's own side effects and idempotency controls.
  default_timeout_seconds: 1800
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
