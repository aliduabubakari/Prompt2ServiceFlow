schema_version: 0.1.0
service_id: csv_artifact_profile_ingestor
version: 1.0.0
display_name: CSV Artifact Profile Ingestor
category: Extractor
capability:
  summary: Reads a CSV file artifact from a bound path or URI and emits a structured
    data object containing its artifact reference, row count, columns, and basic parse
    metadata.
  operations:
  - Read a configured CSV artifact.
  - Parse the header and count records.
  - Infer basic column names and file metadata.
  - Emit a data object suitable for downstream quality checks and loaders.
  keywords:
  - csv
  - ingestion
  - file metadata
  - record count
  - tabular data
  limitations:
  - Does not validate business-specific quality rules.
  - Does not mutate external systems.
  - Assumes the input is a single delimited text file.
lifecycle:
  status: active
interface:
  inputs:
  - name: csv_file
    description: Raw CSV file artifact to ingest.
    channel: artifact
    data_type: csv
    media_type: text/csv
    schema_ref: schema://csv_file_artifact/v1
    required: true
    cardinality: one
    sensitivity: pii
  outputs:
  - name: ingested_data_object
    description: Data object containing source URI/path, record count, column names,
      and parse status.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://tabular_ingest_metadata/v1
    required: true
    cardinality: one
    sensitivity: pii
  parameters:
  - name: has_header
    description: Whether the CSV is expected to contain a header row.
    type: boolean
    required: false
  - name: delimiter
    description: Field delimiter to use when parsing the CSV.
    type: string
    required: false
    enum:
    - ','
    - ;
    - \t
    - '|'
  secrets: []
contracts:
- contract_id: csv_ingestor_input_readable
  type: precondition
  applies_to: input
  target: csv_file
  description: Input CSV artifact must be readable by the service.
  expression: readable(csv_file)
- contract_id: tabular_ingest_metadata_schema
  type: json_schema
  applies_to: output
  target: ingested_data_object
  description: Output metadata exposes file reference, record count, columns, and
    parse status.
  schema_ref: schema://tabular_ingest_metadata/v1
  expression: '{"type":"object","required":["source_uri","record_count","columns","parse_success"],"properties":{"source_uri":{"type":"string"},"record_count":{"type":"integer","minimum":0},"columns":{"type":"array","items":{"type":"string"}},"parse_success":{"type":"boolean"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: csv_ingestor_no_external_mutation
  type: effect
  applies_to: service
  target: csv_artifact_profile_ingestor
  description: Service only reads the input artifact and writes metadata output.
  expression: no_external_mutation
invocation:
  type: argo_workflow_template
  template_name: csv-artifact-profile-ingestor-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.csv_artifact_profile_ingestor
  implementation_ref: services/implementations/csv_artifact_profile_ingestor
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - pii
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log raw customer rows; emit only bounded metadata unless explicitly configured.
  idempotency_notes: Same input artifact and parameters produce the same metadata
    unless the source file changes.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: generated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: candidate
