schema_version: 0.1.0
service_id: environmental_risk_score_column_calculator
version: 1.0.0
display_name: Environmental Risk Score Column Calculator
category: ScoringService
capability:
  summary: Computes a composite environmental risk score for each row of a tabular
    JSON dataset from configured input columns such as precipitation, population density,
    and land-use type, appending a configured risk-score column.
  operations:
  - Read population/weather/land-use-enriched tabular JSON rows.
  - Validate configured input columns and output score column.
  - Apply a configured environmental risk calculation profile or declarative scoring
    rules.
  - Emit scored JSON and scoring status with row counts and score diagnostics.
  keywords:
  - environmental risk
  - risk score
  - column extension
  - scoring
  - tabular json
  - environmental monitoring
  limitations:
  - Does not fetch external weather, land-use, or population data.
  - Risk semantics depend on caller-supplied profile or rules; the catalogue does
    not assert a universal environmental risk formula.
  - Does not export CSV.
lifecycle:
  status: active
interface:
  inputs:
  - name: source_tabular_json
    description: Population-density-enriched tabular JSON containing required risk-factor
      columns.
    channel: artifact
    data_type: json
    media_type: application/json
    schema_ref: schema://population_density_enriched_tabular_json/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: risk_scored_json
    description: Structured tabular JSON with environmental risk score column appended.
    channel: artifact
    data_type: json
    media_type: application/json
    schema_ref: schema://environmental_risk_scored_tabular_json/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: scoring_status
    description: Observable scoring status with rows processed/scored, output column,
      profile id, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://environmental_risk_scoring_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: extender_id
    description: Logical risk calculation implementation/profile identifier, such
      as environmentalRiskCalculator.
    type: string
    required: false
  - name: input_columns
    description: Columns used as risk factors.
    type: array
    required: true
  - name: output_column
    description: Output column for the computed risk score.
    type: string
    required: true
    pattern: ^[A-Za-z_][A-Za-z0-9_]*$
  - name: scoring_rules
    description: Optional declarative scoring rules or weights for deterministic scoring.
    type: object
    required: false
  - name: output_path
    description: Deterministic output artifact path or name.
    type: string
    required: true
  secrets: []
contracts:
- contract_id: environmental_risk_input_schema
  type: json_schema
  applies_to: input
  target: source_tabular_json
  description: Input must contain tabular rows and all configured risk-factor columns.
  schema_ref: schema://population_density_enriched_tabular_json/v1
  expression: '{"type":"object","required":["columns","rows"],"properties":{"columns":{"type":"array","items":{"type":"string"}},"rows":{"type":"array","items":{"type":"object"}}}}
    and all(c in source_tabular_json.columns for c in input_columns)'
- contract_id: environmental_risk_output_column_contract
  type: precondition
  applies_to: parameter
  target: output_column
  description: Risk score output column must be identifier-like.
  expression: output_column matches '^[A-Za-z_][A-Za-z0-9_]*$'
- contract_id: environmental_risk_status_schema
  type: json_schema
  applies_to: output
  target: scoring_status
  description: Status exposes risk-score calculation outcome.
  schema_ref: schema://environmental_risk_scoring_status/v1
  expression: '{"type":"object","required":["success","rows_processed","rows_scored","output_column","output_uri"],"properties":{"success":{"type":"boolean"},"rows_processed":{"type":"integer","minimum":0},"rows_scored":{"type":"integer","minimum":0},"output_column":{"type":"string"},"profile_id":{"type":["string","null"]},"output_uri":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: environmental_risk_scoring_effect
  type: effect
  applies_to: service
  target: environmental_risk_score_column_calculator
  description: On success, a risk-scored JSON artifact exists and includes the configured
    score output column.
  expression: scoring_status.success == true implies exists(risk_scored_json) and
    output_column in risk_scored_json.columns
invocation:
  type: argo_workflow_template
  template_name: environmental-risk-score-column-calculator-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
