schema_version: 0.1.0
service_id: feature_table_drift_validator
version: 1.0.0
display_name: Feature Table Drift Validator
category: QualityCheck
capability:
  summary: Validates a refreshed feature table against drift statistics.
  operations:
  - Validates a refreshed feature table against drift statistics.
  keywords:
  - feature
  - table
  - drift
  - validator
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: feature_table
    description: Reviewed feature table value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  - name: drift_report
    description: Reviewed drift report value.
    channel: artifact
    data_type: json
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: validated_feature_table
    description: Reviewed validated feature table value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  - name: validation_status
    description: Reviewed validation status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: drift_thresholds
    description: Configuration for drift thresholds.
    type: object
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: feature-table-drift-validator
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.2
  command:
  - python
  - -m
  - prompt2serviceflow_services.feature_table_drift_validator
  implementation_ref: services/implementations/feature_table_drift_validator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
  - validation-batch-03:curated-extension
  notes:
  - Curated from sparse Validation-20 batch 03 descriptions; bindings retain inference confidence.
