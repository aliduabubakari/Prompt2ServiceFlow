schema_version: 0.1.0
service_id: customer_profile_deduplicator
version: 1.0.0
display_name: Customer Profile Deduplicator
category: Reconciler
capability:
  summary: Deduplicates normalized customer profiles with configured identity keys.
  operations:
  - Deduplicates normalized customer profiles with configured identity keys.
  keywords:
  - customer
  - profile
  - deduplicator
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: normalized_profiles
    description: Reviewed normalized profiles value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: deduplicated_profiles
    description: Reviewed deduplicated profiles value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  - name: dedup_status
    description: Reviewed dedup status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: identity_keys
    description: Configuration for identity keys.
    type: array
    required: true
  - name: survivorship_policy
    description: Configuration for survivorship policy.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: customer-profile-deduplicator
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.1
  command:
  - python
  - -m
  - prompt2serviceflow_services.customer_profile_deduplicator
  implementation_ref: services/implementations/customer_profile_deduplicator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
