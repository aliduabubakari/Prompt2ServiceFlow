schema_version: 0.1.0
service_id: redis_key_cleanup
version: 1.0.0
display_name: Redis Key Cleanup
category: Maintenance
capability:
  summary: Deletes or expires explicitly configured Redis keys and emits cleanup status
    with counts and diagnostics.
  operations:
  - Resolve a bound Redis resource.
  - Delete configured keys or set expiration according to action parameter.
  - Treat missing keys according to ignore_missing behavior.
  - Emit observable cleanup status.
  keywords:
  - redis
  - cleanup
  - temporary keys
  - maintenance
  - delete key
  limitations:
  - Only acts on explicitly configured keys.
  - Does not clean filesystem artifacts.
  - Does not infer Redis key names from workflow state unless bound by the caller.
lifecycle:
  status: active
interface:
  inputs:
  - name: redis_resource
    description: Redis resource containing temporary keys.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://redis_connection_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: redis_cleanup_status
    description: Observable status showing keys requested, deleted, missing, and errors.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://redis_key_cleanup_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: keys
    description: Explicit Redis keys to delete or expire.
    type: array
    required: true
  - name: action
    description: Cleanup action to apply.
    type: string
    required: false
    enum:
    - delete
    - expire
  - name: ttl_seconds
    description: TTL to set when action is expire.
    type: integer
    required: false
    minimum: 0.0
  - name: ignore_missing
    description: Whether missing keys are successful no-ops.
    type: boolean
    required: false
  secrets: []
contracts:
- contract_id: redis_cleanup_keys_non_empty
  type: precondition
  applies_to: parameter
  target: keys
  description: At least one explicit Redis key must be supplied.
  expression: length(keys) > 0 and all(length(trim(k)) > 0 for k in keys)
- contract_id: redis_key_cleanup_status_schema
  type: json_schema
  applies_to: output
  target: redis_cleanup_status
  description: Status exposes Redis cleanup effect.
  schema_ref: schema://redis_key_cleanup_status/v1
  expression: '{"type":"object","required":["success","keys_requested","keys_deleted","keys_missing"],"properties":{"success":{"type":"boolean"},"keys_requested":{"type":"integer","minimum":0},"keys_deleted":{"type":"integer","minimum":0},"keys_missing":{"type":"integer","minimum":0},"action":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: redis_key_cleanup_effect
  type: effect
  applies_to: service
  target: redis_key_cleanup
  description: On success, all configured keys were deleted, expired, or acknowledged
    as missing according to ignore_missing.
  expression: redis_cleanup_status.success == true implies redis_cleanup_status.keys_requested
    >= redis_cleanup_status.keys_deleted
invocation:
  type: argo_workflow_template
  template_name: redis-key-cleanup-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.redis_key_cleanup
  implementation_ref: services/implementations/redis_key_cleanup
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - redis://*
  secret_access: optional
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit Redis credentials or key values in status.
  - Only explicitly configured temporary keys should be deleted.
  idempotency_notes: Idempotent when ignore_missing is true; reruns after deletion
    report keys missing rather than failing.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
