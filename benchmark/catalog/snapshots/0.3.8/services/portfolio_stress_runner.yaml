schema_version: 0.1.0
service_id: portfolio_stress_runner
version: 1.0.0
display_name: Portfolio Stress Runner
category: ScoringService
capability:
  summary: Runs one configured portfolio stress calculation using scenarios and positions.
  operations:
  - Runs one configured portfolio stress calculation using scenarios and positions.
  keywords:
  - portfolio
  - stress
  - runner
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
