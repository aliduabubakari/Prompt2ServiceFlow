schema_version: 0.1.0
service_id: capital_threshold_validator
version: 1.0.0
display_name: Capital Threshold Validator
category: QualityCheck
capability:
  summary: Validates aggregated stress results against capital thresholds.
  operations:
  - Validates aggregated stress results against capital thresholds.
  keywords:
  - capital
  - threshold
  - validator
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
