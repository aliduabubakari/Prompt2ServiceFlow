  - name: stress_results
    description: Reviewed stress results value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: capital_validation
    description: Reviewed capital validation value.
    channel: artifact
    data_type: json
    required: true
    cardinality: one
    sensitivity: internal
  - name: validation_status
    description: Reviewed validation status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: threshold_profile
    description: Configuration for threshold profile.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: capital-threshold-validator
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.3
  command:
  - python
  - -m
  - prompt2serviceflow_services.capital_threshold_validator
  implementation_ref: services/implementations/capital_threshold_validator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
  - validation-batch-04:curated-extension
  notes:
  - Curated from sparse Validation-20 batch 04 descriptions; bindings retain inference confidence.
