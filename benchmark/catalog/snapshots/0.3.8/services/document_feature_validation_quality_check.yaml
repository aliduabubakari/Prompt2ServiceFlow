schema_version: 0.1.0
service_id: document_feature_validation_quality_check
version: 1.0.0
display_name: Document Feature Validation Quality Check
category: QualityCheck
capability:
  summary: Validates processed document-feature datasets against configurable integrity
    and business rules, emitting a validation decision dictionary.
  operations:
  - Read a processed document feature Parquet artifact.
  - Evaluate configured row-count, required-column, null-rate, metric-range, and business
    integrity rules.
  - Produce a validation results object with pass/fail, rule outcomes, and diagnostics.
  - Emit a validation status suitable for downstream gating or reporting.
  keywords:
  - data validation
  - quality check
  - document features
  - business rules
  - parquet
  limitations:
  - Does not branch workflow execution.
  - Does not repair invalid data.
  - Exact business rules must be supplied by caller configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: processed_document_parquet
    description: Processed document feature dataset in Parquet format.
    channel: artifact
    data_type: parquet
    media_type: application/vnd.apache.parquet
    schema_ref: schema://processed_document_features_parquet/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: validation_results
    description: Validation decision dictionary with overall validity and per-rule
      outcomes.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://document_feature_validation_results/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: validation_status
    description: Observable validation execution status.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://document_feature_validation_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: validation_rules
    description: Declarative validation rules for required columns, metric ranges,
      null handling, and row-count constraints.
    type: object
    required: true
  - name: fail_on_empty_dataset
    description: Whether an empty processed dataset should fail validation.
    type: boolean
    required: false
  secrets: []
contracts:
- contract_id: document_validation_input_readable
  type: precondition
  applies_to: input
  target: processed_document_parquet
  description: Input must be readable and parseable as Parquet.
  expression: readable(processed_document_parquet) and parquet_parseable(processed_document_parquet)
- contract_id: document_validation_results_schema
  type: json_schema
  applies_to: output
  target: validation_results
  description: Validation results expose overall pass/fail and rule-level diagnostics.
  schema_ref: schema://document_feature_validation_results/v1
  expression: '{"type":"object","required":["valid","rules_checked","rules_failed","errors"],"properties":{"valid":{"type":"boolean"},"rules_checked":{"type":"integer","minimum":0},"rules_failed":{"type":"integer","minimum":0},"rule_results":{"type":"array","items":{"type":"object"}},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: document_validation_effect
  type: effect
  applies_to: service
  target: document_feature_validation_quality_check
  description: Service emits valid=true only when no configured validation rules fail.
  expression: validation_results.valid == true iff validation_results.rules_failed
    == 0
invocation:
  type: argo_workflow_template
  template_name: document-feature-validation-quality-check-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.document_feature_validation_quality_check
  implementation_ref: services/implementations/document_feature_validation_quality_check
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Validation diagnostics should avoid raw document text values.
  idempotency_notes: Same processed dataset and validation rules produce the same
    decision.
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
