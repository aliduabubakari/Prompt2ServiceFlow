schema_version: 0.1.0
service_id: unrestricted_email_notification_sender
version: 1.0.0
display_name: Unrestricted Email Notification Sender
category: Notifier
capability:
  summary: Sends email to caller-provided recipients without recipient-domain restrictions.
  operations:
  - Render an email subject and body from parameters and optional context.
  - Send the email via the configured email service.
  - Emit a notification status including recipient list, subject, send success, and
    provider message reference when available.
  keywords:
  - email
  - notification
  - alert
  - data stewards
  - delivery status
  limitations:
  - Does not enforce approved recipient domains.
  - Does not provide idempotency or duplicate-delivery protection.
lifecycle:
  status: experimental
interface:
  inputs:
  - name: email_service
    description: External email service resource used to send notifications.
    channel: external_resource
    data_type: object
    schema_ref: schema://email_service_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: notification_status
    description: Email send confirmation or failure status.
    channel: artifact
    data_type: notification
    media_type: application/json
    schema_ref: schema://email_notification_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: to
    description: Comma-separated or array-compatible recipient address list.
    type: string
    required: true
  - name: subject
    description: Email subject line.
    type: string
    required: true
  - name: body
    description: Email body or body template.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: email_recipient_contract
  type: precondition
  applies_to: parameter
  target: to
  description: At least one recipient address must be provided.
  expression: length(to) > 0
- contract_id: email_notification_status_schema
  type: json_schema
  applies_to: output
  target: notification_status
  description: Notification output exposes delivery attempt status.
  schema_ref: schema://email_notification_status/v1
  expression: '{"type":"object","required":["sent","recipients","subject"],"properties":{"sent":{"type":"boolean"},"recipients":{"type":"array","items":{"type":"string"}},"subject":{"type":"string"},"message_id":{"type":["string","null"]},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: email_sender_effect_contract
  type: effect
  applies_to: service
  target: unrestricted_email_notification_sender
  description: On successful delivery attempt, notification_status.sent is true and
    recipients/subject match the request parameters.
  expression: notification_status.sent == true implies notification_status.subject
    == subject
invocation:
  type: argo_workflow_template
  template_name: unrestricted-email-notification-sender-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.unrestricted_email_notification_sender
  implementation_ref: services/implementations/unrestricted_email_notification_sender
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - email://*
  - smtp://*
  - https://*
  secret_access: optional
  retry_safe: false
  idempotency: non_idempotent
  data_sensitivity:
  - public
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Recipient domains are not restricted.
  - Use with PII, PHI, financial, confidential, or restricted content is prohibited.
  idempotency_notes: Retries can create duplicate email notifications unless the bound
    provider supports idempotency keys.
  default_timeout_seconds: 60
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: reviewed
  source_refs:
  - catalog-curation:0.1.0
  notes:
  - Curated supplementary service derived from email_notification_sender.
  - Lifecycle and policy metadata reflect catalogue governance constraints.
