  implementation_ref: services/implementations/workflow_session_metadata_recorder
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - database://*
  - postgresql://*
  secret_access: required
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Database credentials must not be emitted in outputs or logs.
  - Metadata status should expose identifiers and counts, not raw database credentials
    or sensitive session payloads.
  idempotency_notes: Retry safety depends on stable load_id/workflow_id keys and metadata
    store upsert/update semantics.
  default_timeout_seconds: 300
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
