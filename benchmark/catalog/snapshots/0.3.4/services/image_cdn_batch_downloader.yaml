schema_version: 0.1.0
service_id: image_cdn_batch_downloader
version: 1.0.0
display_name: Image Cdn Batch Downloader
category: Extractor
capability:
  summary: Downloads a bounded batch of product images from an image CDN.
  operations:
  - Downloads a bounded batch of product images from an image CDN.
  keywords:
  - image
  - cdn
  - batch
  - downloader
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: image_cdn
    description: Reviewed image cdn value.
    channel: external_resource
    data_type: object
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: raw_product_images
    description: Reviewed raw product images value.
    channel: artifact
    data_type: array
    required: true
    cardinality: one
    sensitivity: internal
  - name: download_status
    description: Reviewed download status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: prefix
    description: Configuration for prefix.
    type: string
    required: true
  - name: max_images
    description: Configuration for max images.
    type: integer
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: image-cdn-batch-downloader
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.1
  command:
  - python
  - -m
  - prompt2serviceflow_services.image_cdn_batch_downloader
  implementation_ref: services/implementations/image_cdn_batch_downloader
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - database://*
  - https://*
  - sftp://*
  - object://*
  secret_access: optional
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
