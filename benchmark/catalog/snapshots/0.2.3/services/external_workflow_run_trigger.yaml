schema_version: 0.1.0
service_id: external_workflow_run_trigger
version: 1.0.0
display_name: External Workflow Run Trigger
category: ExternalWorkflowAdapter
capability:
  summary: Triggers a configured workflow in an external orchestrator, optionally
    waits for completion, and emits run reference plus trigger/execution status.
  operations:
  - Resolve a bound workflow orchestrator API resource.
  - Submit or trigger a target workflow id with optional run configuration.
  - Optionally observe the triggered run until a terminal state within the invocation
    timeout.
  - Emit a run reference and status containing submitted, terminal, success, and observed
    state fields.
  keywords:
  - external workflow trigger
  - orchestrator adapter
  - workflow run
  - dag trigger
  - wait for completion
  limitations:
  - Does not model dependency edges, parallel groups, pools, pool slots, schedules,
    or workflow retries.
  - Repeated invocations may create duplicate external workflow runs unless caller
    supplies idempotency controls.
  - Does not inspect or validate the business logic of the triggered workflow.
lifecycle:
  status: active
interface:
  inputs:
  - name: workflow_orchestrator
    description: Workflow orchestrator API resource used to trigger target workflows.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://workflow_orchestrator_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: run_reference
    description: Reference to the triggered external workflow run.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://external_workflow_run_reference/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: trigger_status
    description: Observable status for submission and optional completion observation.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://external_workflow_trigger_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: target_workflow_id
    description: Workflow identifier to trigger in the external orchestrator.
    type: string
    required: true
  - name: wait_for_completion
    description: Whether the service should observe the triggered run until terminal
      state.
    type: boolean
    required: false
  - name: run_config
    description: Optional structured run configuration or parameters for the target
      workflow.
    type: object
    required: false
  - name: success_states
    description: States treated as successful when waiting for completion.
    type: array
    required: false
  secrets: []
contracts:
- contract_id: external_workflow_target_required
  type: precondition
  applies_to: parameter
  target: target_workflow_id
  description: Target workflow id must be non-empty.
  expression: length(trim(target_workflow_id)) > 0
- contract_id: external_workflow_run_reference_schema
  type: json_schema
  applies_to: output
  target: run_reference
  description: Run reference identifies the triggered workflow run.
  schema_ref: schema://external_workflow_run_reference/v1
  expression: '{"type":"object","required":["target_workflow_id"],"properties":{"target_workflow_id":{"type":"string"},"run_id":{"type":["string","null"]},"run_url":{"type":["string","null"]}}}'
- contract_id: external_workflow_trigger_status_schema
  type: json_schema
  applies_to: output
  target: trigger_status
  description: Status exposes submission and optional completion outcome.
  schema_ref: schema://external_workflow_trigger_status/v1
  expression: '{"type":"object","required":["success","submitted","target_workflow_id","wait_for_completion","terminal"],"properties":{"success":{"type":"boolean"},"submitted":{"type":"boolean"},"target_workflow_id":{"type":"string"},"wait_for_completion":{"type":"boolean"},"terminal":{"type":"boolean"},"observed_state":{"type":["string","null"]},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: external_workflow_trigger_effect
  type: effect
  applies_to: service
  target: external_workflow_run_trigger
  description: On success, the target workflow trigger request was submitted and a
    run reference/status was emitted.
  expression: trigger_status.success == true implies trigger_status.submitted == true
    and run_reference.target_workflow_id == target_workflow_id
invocation:
  type: argo_workflow_template
  template_name: external-workflow-run-trigger-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.external_workflow_run_trigger
  implementation_ref: services/implementations/external_workflow_run_trigger
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - orchestrator://*
  - airflow://*
  - https://*
  secret_access: required
  retry_safe: false
  idempotency: non_idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit orchestrator credentials in outputs or logs.
  - Workflow pool constraints, parallelism, retries, and schedules remain orchestration-level
    configuration.
  idempotency_notes: Repeated invocations may trigger multiple external workflow runs
    unless the bound orchestrator and run_config provide an idempotency key.
  default_timeout_seconds: 1800
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
