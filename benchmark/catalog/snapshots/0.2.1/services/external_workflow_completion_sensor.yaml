schema_version: 0.1.0
service_id: external_workflow_completion_sensor
version: 1.0.0
display_name: External Workflow Completion Sensor
category: Sensor
capability:
  summary: Checks whether a configured external workflow run has reached a terminal
    success or failure state and emits an observable completion decision without mutating
    the external workflow.
  operations:
  - Resolve a bound workflow orchestrator or metadata API resource.
  - Locate an external workflow run by workflow identifier and optional execution
    selector.
  - Read the observed workflow state without triggering or modifying the workflow.
  - Compare the observed state with configured terminal, success, and failure states.
  keywords:
  - external workflow
  - workflow completion
  - sensor
  - readiness check
  - upstream dependency
  - orchestrator metadata
  limitations:
  - Does not implement polling cadence, timeout, dependency edges, retries, or schedules.
  - Does not trigger external workflows.
  - Requires workflow identifier and run-selection semantics to be supplied by workflow
    binding.
  - Does not validate or inspect artifacts produced by the external workflow.
lifecycle:
  status: active
interface:
  inputs:
  - name: workflow_orchestrator
    description: Workflow orchestrator or metadata API resource used to inspect the
      upstream workflow state.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://workflow_orchestrator_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: completion_decision
    description: Decision showing observed workflow state, terminal flag, succeeded
      flag, and diagnostics.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://external_workflow_completion_decision/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: check_status
    description: Observable status for the state check, including whether the check
      query succeeded.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://external_workflow_completion_check_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: external_workflow_id
    description: Identifier of the external workflow to inspect.
    type: string
    required: true
  - name: execution_selector
    description: Optional selector for the external workflow run, such as logical
      date, run id, or latest matching run.
    type: object
    required: false
  - name: terminal_states
    description: States treated as terminal observations.
    type: array
    required: true
  - name: success_states
    description: Subset of terminal states treated as successful.
    type: array
    required: true
  - name: failure_states
    description: States treated as failed or unsuccessful terminal outcomes.
    type: array
    required: false
  secrets:
  - name: workflow_orchestrator_credentials
    description: Credentials or token used by the bound orchestrator resource when
      required.
    required: false
contracts:
- contract_id: external_workflow_id_required
  type: precondition
  applies_to: parameter
  target: external_workflow_id
  description: External workflow id must be non-empty.
  expression: length(trim(external_workflow_id)) > 0
- contract_id: external_workflow_completion_decision_schema
  type: json_schema
  applies_to: output
  target: completion_decision
  description: Decision exposes observed state and completion outcome.
  schema_ref: schema://external_workflow_completion_decision/v1
  expression: '{"type":"object","required":["external_workflow_id","observed_state","terminal","succeeded"],"properties":{"external_workflow_id":{"type":"string"},"run_id":{"type":["string","null"]},"observed_state":{"type":["string","null"]},"terminal":{"type":"boolean"},"succeeded":{"type":"boolean"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: external_workflow_completion_status_schema
  type: json_schema
  applies_to: output
  target: check_status
  description: Status exposes sensor query execution outcome.
  schema_ref: schema://external_workflow_completion_check_status/v1
  expression: '{"type":"object","required":["success","query_attempted","external_workflow_id"],"properties":{"success":{"type":"boolean"},"query_attempted":{"type":"boolean"},"external_workflow_id":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: external_workflow_completion_read_only_effect
  type: effect
  applies_to: service
  target: external_workflow_completion_sensor
  description: The service reads orchestrator state and emits a decision without mutating
    workflows.
  expression: no_external_mutation
invocation:
  type: argo_workflow_template
  template_name: external-workflow-completion-sensor-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.external_workflow_completion_sensor
  implementation_ref: services/implementations/external_workflow_completion_sensor
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - orchestrator://*
  - airflow://*
  - https://*
  secret_access: required
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit orchestrator credentials in outputs or logs.
  - Polling interval, one-hour timeout, retries, and failure email hooks are workflow-level
    configuration.
  idempotency_notes: For a fixed external workflow state and selector, the same decision
    is emitted; the observed external state may change over time.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
