schema_version: 0.1.0
service_id: discrepancy_route_decider
version: 1.0.0
display_name: Discrepancy Route Decider
category: DomainAdapter
capability:
  summary: Routes reconciled partner records to clean publication or discrepancy review.
  operations:
  - Routes reconciled partner records to clean publication or discrepancy review.
  keywords:
  - discrepancy
  - route
  - decider
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: clean_records
    description: Reviewed clean records value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  - name: discrepancy_records
    description: Reviewed discrepancy records value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: route_decision
    description: Reviewed route decision value.
    channel: artifact
    data_type: json
    required: true
    cardinality: one
    sensitivity: internal
  - name: routing_status
    description: Reviewed routing status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: matched_route
    description: Configuration for matched route.
    type: string
    required: true
  - name: unresolved_route
    description: Configuration for unresolved route.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: discrepancy-route-decider
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.3
  command:
  - python
  - -m
  - prompt2serviceflow_services.discrepancy_route_decider
  implementation_ref: services/implementations/discrepancy_route_decider
  mock_supported: true
policies:
