schema_version: 0.1.0
service_id: graphql_json_operation_executor
version: 1.0.0
display_name: GraphQL JSON Operation Executor
category: DomainAdapter
capability:
  summary: Executes a configured GraphQL query or mutation against an HTTP/HTTPS GraphQL
    endpoint, optionally using bearer-token authentication and response projection,
    then emits the raw GraphQL JSON response, projected result data, and an observable
    operation status.
  operations:
  - Resolve a GraphQL endpoint from a bound external resource and/or endpoint parameter.
  - Submit a GraphQL POST request containing operation document, optional operation
    name, and JSON variables.
  - Optionally attach bearer-token authentication from an input token artifact or
    bound connection context.
  - Parse the response body as GraphQL JSON containing data and/or errors fields.
  keywords:
  - graphql
  - http api
  - json
  - mutation
  - query
  - bearer token
  - magento compatible
  - response projection
  limitations:
  - Does not schedule retries or manage dependency ordering.
  - Does not infer GraphQL documents or variables; callers must provide them.
  - Does not guarantee idempotency for mutations such as customer creation.
  - Does not implement Magento-specific business validation beyond caller-configured
    expected paths.
lifecycle:
  status: active
interface:
  inputs:
  - name: graphql_endpoint_resource
    description: External GraphQL HTTP API resource or connection configuration, such
      as a Magento GraphQL endpoint binding.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://graphql_endpoint_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  - name: bearer_token
    description: Optional bearer token artifact used when auth_mode is bearer_from_input;
      for example, a customer token generated by a prior GraphQL operation.
    channel: artifact
    data_type: string
    media_type: text/plain
    required: false
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: graphql_response_json
    description: Raw parsed GraphQL JSON response containing data and/or errors.
    channel: artifact
    data_type: json
    media_type: application/json
    schema_ref: schema://graphql_json_response/v1
    required: true
    cardinality: one
    sensitivity: confidential
  - name: projected_result
    description: Caller-configured projection of the GraphQL response, such as customer
      email, customer token, or customer information object.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://graphql_projected_result/v1
    required: true
    cardinality: one
    sensitivity: confidential
  - name: operation_status
    description: Observable status including HTTP status, GraphQL error state, operation
      type, projection outcome, and success flag.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://graphql_operation_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: endpoint_url
    description: HTTP or HTTPS GraphQL endpoint URL; may be omitted when supplied
      by graphql_endpoint_resource.
    type: string
    required: false
    pattern: ^https?://.+
  - name: operation_document
    description: GraphQL query or mutation document to execute.
    type: string
    required: true
  - name: operation_name
    description: Optional GraphQL operation name when the document contains multiple
      operations.
    type: string
    required: false
  - name: operation_type
    description: Declared GraphQL operation type for policy and mock validation.
    type: string
    required: true
    enum:
    - query
    - mutation
  - name: variables
    description: JSON object of GraphQL variables; sensitive values such as passwords
      should be supplied through secure workflow binding where available.
    type: object
    required: false
  - name: auth_mode
    description: Authentication behavior for the request.
    type: string
    required: false
    enum:
    - none
    - bearer_from_input
    - connection_default
  - name: projection_mappings
    description: Object mapping projected result field names to JSONPath-like expressions
      over the GraphQL response.
    type: object
    required: false
  - name: fail_on_graphql_errors
    description: Whether GraphQL errors in the response should mark the operation
      as failed.
    type: boolean
    required: false
  secrets: []
contracts:
- contract_id: graphql_endpoint_url_contract
  type: precondition
  applies_to: service
  target: graphql_json_operation_executor
  description: The resolved endpoint must be an HTTP or HTTPS URL.
  expression: resolved_endpoint(endpoint_url, graphql_endpoint_resource) matches '^https?://.+'
- contract_id: graphql_document_contract
  type: precondition
  applies_to: parameter
  target: operation_document
  description: The GraphQL document must be non-empty and compatible with the declared
    operation type.
  expression: length(trim(operation_document)) > 0 and lower(operation_document) contains
    operation_type
- contract_id: graphql_variables_schema
  type: json_schema
  applies_to: parameter
  target: variables
  description: Variables, when supplied, must be a JSON object.
  schema_ref: schema://graphql_variables/v1
  expression: '{"type":"object","additionalProperties":true}'
- contract_id: graphql_bearer_token_contract
  type: precondition
  applies_to: input
  target: bearer_token
  description: A bearer token artifact must be provided when auth_mode is bearer_from_input.
  expression: auth_mode != 'bearer_from_input' or length(trim(bearer_token)) > 0
- contract_id: graphql_response_schema
  type: json_schema
  applies_to: output
  target: graphql_response_json
  description: GraphQL response is a JSON object with data and/or errors fields.
  schema_ref: schema://graphql_json_response/v1
  expression: '{"type":"object","anyOf":[{"required":["data"]},{"required":["errors"]}],"properties":{"data":{"type":["object","null"]},"errors":{"type":"array","items":{"type":"object"}}}}'
- contract_id: graphql_projected_result_schema
  type: json_schema
  applies_to: output
  target: projected_result
  description: Projected result is a JSON object containing caller-configured fields
    extracted from the GraphQL response.
  schema_ref: schema://graphql_projected_result/v1
  expression: '{"type":"object","additionalProperties":true}'
- contract_id: graphql_operation_status_schema
  type: json_schema
  applies_to: output
  target: operation_status
  description: Status exposes request, parse, GraphQL error, and projection outcomes
    for downstream validation.
  schema_ref: schema://graphql_operation_status/v1
  expression: '{"type":"object","required":["success","operation_type","http_status_code","json_parse_success","graphql_errors_present"],"properties":{"success":{"type":"boolean"},"operation_type":{"type":"string","enum":["query","mutation"]},"operation_name":{"type":["string","null"]},"http_status_code":{"type":["integer","null"]},"json_parse_success":{"type":"boolean"},"graphql_errors_present":{"type":"boolean"},"projected_fields":{"type":"array","items":{"type":"string"}},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: graphql_operation_effect_contract
  type: effect
  applies_to: service
  target: graphql_json_operation_executor
  description: On success, the service parsed the response as JSON, emitted the raw
    response and projected result, and either observed no GraphQL errors or was configured
    not to fail on them.
  expression: operation_status.success == true implies exists(graphql_response_json)
    and exists(projected_result) and operation_status.json_parse_success == true
invocation:
  type: argo_workflow_template
  template_name: graphql-json-operation-executor-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.graphql_json_operation_executor
  implementation_ref: services/implementations/graphql_json_operation_executor
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - https://*
  - http://*
  secret_access: optional
  retry_safe: false
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  - confidential
  - pii
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log bearer tokens, customer passwords, or raw personal customer data.
  - Caller must bind an approved GraphQL endpoint resource.
  - Workflow-level retries remain outside the service catalogue.
  idempotency_notes: GraphQL queries are generally retry-safe for stable sources.
    Mutations are only retry-safe when the upstream GraphQL operation implements idempotency
    or conflict handling; customer creation may create duplicates or fail on duplicate
    email.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
