schema_version: 0.1.0
service_id: disruption_risk_detector
version: 1.0.0
display_name: Disruption Risk Detector
category: ScoringService
capability:
  summary: Detects supply-chain disruption risk from harmonized supply state.
  operations:
  - Detects supply-chain disruption risk from harmonized supply state.
  keywords:
  - disruption
  - risk
  - detector
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: supply_state
    description: Reviewed supply state value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: disruption_risk
    description: Reviewed disruption risk value.
    channel: artifact
    data_type: json
    required: true
    cardinality: one
    sensitivity: internal
  - name: risk_status
    description: Reviewed risk status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: risk_profile
    description: Configuration for risk profile.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: disruption-risk-detector
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.3
  command:
  - python
  - -m
  - prompt2serviceflow_services.disruption_risk_detector
  implementation_ref: services/implementations/disruption_risk_detector
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
  - validation-batch-04:curated-extension
  notes:
  - Curated from sparse Validation-20 batch 04 descriptions; bindings retain inference confidence.
