schema_version: 0.1.0
service_id: fraud_risk_threshold_route_decider
version: 1.0.0
display_name: Fraud Risk Threshold Route Decider
category: ScoringService
capability:
  summary: Compares a fraud risk score with a configured threshold and emits an observable
    routing decision for manual review or auto approval without performing workflow
    branching.
  operations:
  - Read a fraud risk score artifact.
  - Validate threshold is in [0,1].
  - Compare score to threshold using the configured high-risk rule.
  - Emit route label and booleans for downstream orchestration binding.
  keywords:
  - fraud detection
  - routing decision
  - risk threshold
  - branch decision
  - triage
  limitations:
  - Does not execute branch edges or choose Argo tasks directly.
  - Does not recompute risk scores.
  - Does not submit transactions to review or payment systems.
lifecycle:
  status: active
interface:
  inputs:
  - name: risk_score
    description: Risk score artifact produced by an upstream fraud risk analyzer.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://fraud_transaction_risk_score/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: routing_decision
    description: Decision indicating whether transactions should be routed to manual
      review or auto approval.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://fraud_transaction_routing_decision/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: risk_threshold
    description: Score threshold above which the route is manual review.
    type: number
    required: true
    minimum: 0.0
    maximum: 1.0
  - name: manual_review_route_label
    description: Route label emitted for high-risk transactions.
    type: string
    required: false
  - name: auto_approval_route_label
    description: Route label emitted for low-risk transactions.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: fraud_route_threshold_range
  type: precondition
  applies_to: parameter
  target: risk_threshold
  description: Risk threshold must be within [0,1].
  expression: 0 <= risk_threshold <= 1
- contract_id: fraud_route_input_score_range
  type: precondition
  applies_to: input
  target: risk_score
  description: Input score must be numeric and within [0,1].
  expression: 0 <= risk_score.score <= 1
- contract_id: fraud_routing_decision_schema
  type: json_schema
  applies_to: output
  target: routing_decision
  description: Routing decision exposes threshold comparison and branch booleans.
  schema_ref: schema://fraud_transaction_routing_decision/v1
  expression: '{"type":"object","required":["score","risk_threshold","route","manual_review","auto_approve"],"properties":{"score":{"type":"number","minimum":0,"maximum":1},"risk_threshold":{"type":"number","minimum":0,"maximum":1},"route":{"type":"string"},"manual_review":{"type":"boolean"},"auto_approve":{"type":"boolean"},"reason":{"type":"string"}}}'
- contract_id: fraud_route_decider_effect
  type: effect
  applies_to: service
  target: fraud_risk_threshold_route_decider
  description: Manual-review route is selected exactly when score is greater than
    the configured threshold.
  expression: routing_decision.manual_review == (risk_score.score > risk_threshold)
    and routing_decision.auto_approve == (risk_score.score <= risk_threshold)
invocation:
  type: argo_workflow_template
  template_name: fraud-risk-threshold-route-decider-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.fraud_risk_threshold_route_decider
  implementation_ref: services/implementations/fraud_risk_threshold_route_decider
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Branch routing and merge behavior remain workflow-level orchestration.
  - Do not encode secrets or customer identifiers in route labels.
  idempotency_notes: Same input score and threshold produce the same routing decision.
  default_timeout_seconds: 60
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
