schema_version: 0.1.0
service_id: runtime_parameter_allowed_values_validator
version: 1.0.0
display_name: Runtime Parameter Allowed Values Validator
category: QualityCheck
capability:
  summary: Validates supplied runtime parameters against caller-provided required,
    allowed-value, and pattern rules, then emits a validation decision/status.
  operations:
  - Read runtime parameter values from the workflow binding.
  - Evaluate configured validation rules for required presence, allowed values, and
    optional regex patterns.
  - Emit a deterministic validation decision with invalid parameter names and diagnostics.
  keywords:
  - parameter validation
  - runtime config
  - allowed values
  - quality check
  - deployment color
  limitations:
  - Does not resolve workflow templates or secrets.
  - Does not branch; downstream routing remains orchestration.
  - Does not validate domain data artifacts.
lifecycle:
  status: active
interface:
  inputs:
  - name: runtime_parameters
    description: Runtime parameter object to validate, such as {"color":"blue"}.
    channel: parameter
    data_type: object
    media_type: application/json
    schema_ref: schema://runtime_parameter_values/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: validation_decision
    description: Decision/status showing whether all parameter rules passed and listing
      diagnostics.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://runtime_parameter_validation_decision/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: validation_rules
    description: Object mapping parameter names to required/allowed_values/pattern
      validation rules.
    type: object
    required: true
  secrets: []
contracts:
- contract_id: runtime_parameter_rules_non_empty
  type: precondition
  applies_to: parameter
  target: validation_rules
  description: At least one validation rule must be supplied.
  expression: validation_rules != null and length(keys(validation_rules)) > 0
- contract_id: runtime_parameter_validation_decision_schema
  type: json_schema
  applies_to: output
  target: validation_decision
  description: Validation decision exposes pass/fail and parameter-level diagnostics.
  schema_ref: schema://runtime_parameter_validation_decision/v1
  expression: '{"type":"object","required":["valid","checked_parameters","invalid_parameters","errors"],"properties":{"valid":{"type":"boolean"},"checked_parameters":{"type":"array","items":{"type":"string"}},"invalid_parameters":{"type":"array","items":{"type":"string"}},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: runtime_parameter_validation_effect
  type: effect
  applies_to: service
  target: runtime_parameter_allowed_values_validator
  description: The service emits valid=true only when every configured parameter rule
    is satisfied.
  expression: validation_decision.valid == true iff length(validation_decision.invalid_parameters)
    == 0
invocation:
  type: argo_workflow_template
  template_name: runtime-parameter-allowed-values-validator-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.runtime_parameter_allowed_values_validator
  implementation_ref: services/implementations/runtime_parameter_allowed_values_validator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log sensitive parameter values if callers include them in runtime_parameters.
  idempotency_notes: Same parameters and validation rules produce the same decision.
  default_timeout_seconds: 60
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: generated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: candidate
  source_refs:
