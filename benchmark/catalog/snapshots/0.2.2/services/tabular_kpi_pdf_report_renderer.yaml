    description: Configuration for report title.
    type: string
    required: true
  - name: output_path
    description: Configuration for output path.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: tabular-kpi-pdf-report-renderer
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.0
  command:
  - python
  - -m
