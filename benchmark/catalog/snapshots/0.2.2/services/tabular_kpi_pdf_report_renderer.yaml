    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: pdf_report
    description: Reviewed pdf report value.
    channel: artifact
    data_type: binary
    required: true
    cardinality: one
    sensitivity: internal
  - name: render_status
    description: Reviewed render status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
