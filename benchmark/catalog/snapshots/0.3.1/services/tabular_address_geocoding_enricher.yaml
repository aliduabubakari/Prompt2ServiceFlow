schema_version: 0.1.0
service_id: tabular_address_geocoding_enricher
version: 1.0.0
display_name: Tabular Address Geocoding Enricher
category: Reconciler
capability:
  summary: Enriches structured tabular JSON records by geocoding values from a configured
    address column through a bound geocoding API resource, adding latitude/longitude
    fields and emitting geocoding status.
  operations:
  - Read structured tabular JSON records and column metadata.
  - Extract address values from the configured address column.
  - Resolve a bound geocoding API resource and authentication context.
  - Submit geocoding requests for address values and parse returned coordinates and
    provider diagnostics.
  keywords:
  - geocoding
  - address reconciliation
  - latitude
  - longitude
  - tabular json
  - HERE compatible
  - urban planning
  limitations:
  - Does not infer the address column; caller must configure it.
  - Does not compute spatial distances; use a geospatial distance extender separately.
  - External geocoding results may vary as provider reference data changes.
  - Does not manage workflow retries, mounts, container networks, or dependency ordering.
lifecycle:
  status: active
interface:
  inputs:
  - name: structured_json
    description: Structured tabular JSON containing facility records and an address
      column to geocode.
    channel: artifact
    data_type: json
    media_type: application/json
    schema_ref: schema://structured_tabular_json/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: geocoding_api_resource
    description: Bound HTTP geocoding API resource, such as a HERE-compatible geocoding
      endpoint with authentication binding.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://geocoding_api_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: geocoded_json
    description: Structured tabular JSON enriched with latitude and longitude columns
      plus bounded geocoding metadata.
    channel: artifact
    data_type: json
    media_type: application/json
    schema_ref: schema://geocoded_tabular_json/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: geocoding_status
    description: Observable status with rows processed, rows geocoded, failures, provider
      id, output URI, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://tabular_geocoding_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: address_column
    description: Input column containing address text to geocode.
    type: string
    required: true
  - name: latitude_column
    description: Output column name for latitude values.
    type: string
    required: false
  - name: longitude_column
    description: Output column name for longitude values.
    type: string
    required: false
  - name: geocoder_id
    description: Logical geocoder binding identifier, for example geocodingHere.
    type: string
    required: true
  - name: dataset_id
    description: Optional dataset identifier propagated into output metadata.
    type: string
    required: false
  - name: output_path
    description: Deterministic output artifact path or name for the geocoded JSON.
    type: string
    required: true
  secrets:
  - name: geocoding_api_token
    description: API token used by the bound geocoding provider when required by the
      resource binding.
    required: true
    environment_variable: HERE_API_TOKEN
contracts:
- contract_id: tabular_geocoding_input_schema
  type: json_schema
  applies_to: input
  target: structured_json
  description: Input must contain tabular rows and columns, including the configured
    address column.
  schema_ref: schema://structured_tabular_json/v1
  expression: '{"type":"object","required":["columns","rows"],"properties":{"columns":{"type":"array","items":{"type":"string"}},"rows":{"type":"array","items":{"type":"object"}},"row_count":{"type":"integer","minimum":0}}}
    and address_column in structured_json.columns'
- contract_id: tabular_geocoding_provider_contract
  type: precondition
  applies_to: service
  target: tabular_address_geocoding_enricher
  description: Geocoder identifier and address column must be non-empty before requests
    are attempted.
  expression: length(trim(geocoder_id)) > 0 and length(trim(address_column)) > 0
- contract_id: geocoded_tabular_json_schema
  type: json_schema
  applies_to: output
  target: geocoded_json
  description: Output preserves tabular rows and includes configured latitude and
    longitude columns.
  schema_ref: schema://geocoded_tabular_json/v1
  expression: '{"type":"object","required":["columns","rows"],"properties":{"columns":{"type":"array","items":{"type":"string"}},"rows":{"type":"array","items":{"type":"object"}},"row_count":{"type":"integer","minimum":0},"geocoding":{"type":"object"}}}'
- contract_id: tabular_geocoding_status_schema
  type: json_schema
  applies_to: output
  target: geocoding_status
  description: Status exposes geocoding effect for workflow validation.
  schema_ref: schema://tabular_geocoding_status/v1
  expression: '{"type":"object","required":["success","geocoder_id","rows_processed","rows_geocoded","rows_failed","output_uri"],"properties":{"success":{"type":"boolean"},"geocoder_id":{"type":"string"},"rows_processed":{"type":"integer","minimum":0},"rows_geocoded":{"type":"integer","minimum":0},"rows_failed":{"type":"integer","minimum":0},"output_uri":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: tabular_geocoding_effect
  type: effect
  applies_to: service
  target: tabular_address_geocoding_enricher
  description: On success, a geocoded JSON artifact exists and every processed row
    is either geocoded or reported as failed/skipped in status.
  expression: geocoding_status.success == true implies exists(geocoded_json) and geocoding_status.rows_processed
    >= geocoding_status.rows_geocoded
invocation:
  type: argo_workflow_template
  template_name: tabular-address-geocoding-enricher-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.tabular_address_geocoding_enricher
  implementation_ref: services/implementations/tabular_address_geocoding_enricher
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - https://*.hereapi.com/*
  - geocoding://*
  secret_access: required
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  - confidential
  - pii
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit API tokens, full addresses, or raw provider responses in status outputs.
  - Bind only approved geocoding API resources and configured address columns.
  - Workflow retry policy and container networking are orchestration/runtime concerns.
  idempotency_notes: For fixed input records and stable provider data, output is repeatable;
    provider reference data and rate-limit behavior may change over time.
  default_timeout_seconds: 600
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
