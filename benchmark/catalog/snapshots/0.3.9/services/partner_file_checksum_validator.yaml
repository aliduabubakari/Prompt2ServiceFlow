schema_version: 0.1.0
service_id: partner_file_checksum_validator
version: 1.0.0
display_name: Partner File Checksum Validator
category: QualityCheck
capability:
  summary: Validates an arrived partner file against an expected checksum record.
  operations:
  - Validates an arrived partner file against an expected checksum record.
  keywords:
  - partner
  - file
  - checksum
  - validator
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: partner_file
    description: Reviewed partner file value.
    channel: artifact
    data_type: csv
    required: true
    cardinality: one
    sensitivity: internal
  - name: checksum_record
    description: Reviewed checksum record value.
    channel: artifact
    data_type: object
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: verified_partner_file
    description: Reviewed verified partner file value.
    channel: artifact
    data_type: csv
    required: true
    cardinality: one
    sensitivity: internal
  - name: checksum_status
    description: Reviewed checksum status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: algorithm
    description: Configuration for algorithm.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: partner-file-checksum-validator
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.1
  command:
  - python
  - -m
  - prompt2serviceflow_services.partner_file_checksum_validator
  implementation_ref: services/implementations/partner_file_checksum_validator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
  - validation-batch-02:curated-extension
  notes:
  - Curated from sparse Validation-20 batch 02 descriptions; bindings retain inference confidence.
