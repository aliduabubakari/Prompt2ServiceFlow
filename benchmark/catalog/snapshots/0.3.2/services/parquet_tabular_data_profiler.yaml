schema_version: 0.1.0
service_id: parquet_tabular_data_profiler
version: 1.0.0
display_name: Parquet Tabular Data Profiler
category: DataProfiler
capability:
  summary: Profiles a tabular Parquet dataset and emits bounded exploration statistics
    plus profiling status.
  operations:
  - Read and parse a Parquet tabular dataset.
  - Compute row count, column list, null counts, inferred types, uniqueness summaries,
    and configurable distribution metrics.
  - Write a bounded profile report artifact.
  - Emit profiling status for downstream validation.
  keywords:
  - parquet
  - data profiling
  - exploratory data analysis
  - tabular data
  - data quality
  limitations:
  - Does not mutate the input dataset.
  - Does not clean or score data-quality thresholds.
  - Profile output should avoid raw values unless explicitly permitted.
lifecycle:
  status: active
interface:
  inputs:
  - name: source_parquet
    description: Parquet dataset to profile.
    channel: artifact
    data_type: parquet
    media_type: application/vnd.apache.parquet
    schema_ref: schema://tabular_parquet_dataset/v1
    required: true
    cardinality: one
    sensitivity: pii
  outputs:
  - name: profile_report
    description: Bounded profile report containing row count, columns, null counts,
      type summaries, and configured metrics.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://tabular_profile_report/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: profile_status
    description: Observable profiling status with success flag, rows profiled, columns
      profiled, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://tabular_profile_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: profile_rules
    description: Optional profiling configuration such as included columns, metric
      list, and sample policy.
    type: object
    required: false
  - name: include_value_samples
    description: Whether bounded sample values may be included in the profile report.
    type: boolean
    required: false
  - name: output_path
    description: Optional deterministic output path for the profile report.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: parquet_profiler_input_readable
  type: precondition
  applies_to: input
  target: source_parquet
  description: Input must be readable and parseable as Parquet.
  expression: readable(source_parquet) and parquet_parseable(source_parquet)
- contract_id: tabular_profile_report_schema
  type: json_schema
  applies_to: output
  target: profile_report
  description: Profile report contains bounded tabular statistics.
  schema_ref: schema://tabular_profile_report/v1
  expression: '{"type":"object","required":["row_count","columns","metrics"],"properties":{"row_count":{"type":"integer","minimum":0},"columns":{"type":"array","items":{"type":"string"}},"metrics":{"type":"object"}}}'
- contract_id: parquet_profiler_effect
  type: effect
  applies_to: service
  target: parquet_tabular_data_profiler
  description: The service only reads the input artifact and writes profile outputs.
  expression: no_external_mutation and profile_status.success == true implies exists(profile_report)
invocation:
  type: argo_workflow_template
  template_name: parquet-tabular-data-profiler-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.parquet_tabular_data_profiler
  implementation_ref: services/implementations/parquet_tabular_data_profiler
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - pii
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit raw customer PII in profile reports unless explicitly configured.
  - Profile reports should prefer counts, aggregates, and column names.
  idempotency_notes: Same Parquet input and profile parameters produce the same bounded
    profile report.
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: generated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: candidate
  source_refs:
