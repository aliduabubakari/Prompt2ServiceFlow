schema_version: 0.1.0
service_id: parquet_document_data_profiler
version: 1.0.0
display_name: Parquet Document Data Profiler
category: DataProfiler
capability:
  summary: Profiles a Parquet document dataset and emits exploration statistics plus
    profiling status.
  operations:
  - Read a Parquet document dataset artifact.
  - Compute row count, column list, null counts, text length summaries, and optional
    keyword/sample-safe statistics.
  - Write a bounded profile report artifact.
  - Emit profiling status for downstream validation.
  keywords:
  - parquet
  - data profiling
  - exploration statistics
  - documents
  - text processing
  limitations:
  - Does not mutate input data.
  - Does not perform cleansing or validation decisions.
  - Profile output must avoid raw document text unless explicitly configured.
lifecycle:
  status: active
interface:
  inputs:
  - name: document_parquet
    description: Raw document Parquet dataset to profile.
    channel: artifact
    data_type: parquet
    media_type: application/vnd.apache.parquet
    schema_ref: schema://document_parquet_dataset/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: profile_report
    description: Bounded exploration statistics for the input dataset.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://document_profile_report/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: profile_status
    description: Observable status for profiling execution.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://document_profile_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: text_column
    description: Document text column to profile for text-specific metrics.
    type: string
    required: false
  - name: include_value_samples
    description: Whether bounded sample values may be included in the profile report.
    type: boolean
    required: false
  - name: output_path
    description: Optional deterministic profile report output path.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: parquet_document_profiler_input_readable
  type: precondition
  applies_to: input
  target: document_parquet
  description: Input Parquet artifact must be readable and parseable.
  expression: readable(document_parquet) and parquet_parseable(document_parquet)
- contract_id: document_profile_report_schema
  type: json_schema
  applies_to: output
  target: profile_report
  description: Profile report contains columns, row count, and metric summaries.
  schema_ref: schema://document_profile_report/v1
  expression: '{"type":"object","required":["row_count","columns","metrics"],"properties":{"row_count":{"type":"integer","minimum":0},"columns":{"type":"array","items":{"type":"string"}},"metrics":{"type":"object"}}}'
- contract_id: document_profiler_effect
  type: effect
  applies_to: service
  target: parquet_document_data_profiler
  description: The service only reads the input artifact and writes profile outputs.
  expression: no_external_mutation and profile_status.success == true implies exists(profile_report)
invocation:
  type: argo_workflow_template
  template_name: parquet-document-data-profiler-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.parquet_document_data_profiler
  implementation_ref: services/implementations/parquet_document_data_profiler
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Avoid logging or emitting full document text in profile outputs.
  idempotency_notes: Same input Parquet and profiling parameters produce the same
    bounded profile report.
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: generated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-13T17:25:39.645986+00:00'
  review_status: candidate
  source_refs:
