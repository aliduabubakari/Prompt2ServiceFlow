  implementation_ref: services/implementations/google_dataform_workflow_invocation_creator
  mock_supported: true
policies:
  network_access: required
  allowed_network_targets:
  - https://dataform.googleapis.com/*
  secret_access: required
  retry_safe: false
  idempotency: non_idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not emit GCP credentials in outputs or logs.
  - Callers should avoid retrying blindly because duplicate workflow invocations may
    be created.
  idempotency_notes: Repeated invocations may start multiple Dataform workflow runs
    from the same compilation result.
  default_timeout_seconds: 180
