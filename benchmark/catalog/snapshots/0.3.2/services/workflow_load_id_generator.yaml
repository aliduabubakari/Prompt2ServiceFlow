  implementation_ref: services/implementations/workflow_load_id_generator
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not encode secrets or connection details into generated identifiers.
  idempotency_notes: Deterministic hash is idempotent for stable runtime context;
