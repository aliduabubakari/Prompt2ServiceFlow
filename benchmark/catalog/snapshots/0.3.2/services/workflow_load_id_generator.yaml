schema_version: 0.1.0
service_id: workflow_load_id_generator
version: 1.0.0
display_name: Workflow Load ID Generator
category: Transformer
capability:
  summary: Generates a non-empty workflow load/session identifier from runtime context
    or a configured generation strategy and emits the identifier plus generation status.
  operations:
  - Read optional runtime context such as workflow id, logical date, or run id.
  - Generate a load identifier using a configured strategy such as deterministic hash,
    timestamp-derived id, or UUID.
  - Emit the load identifier as a parameter artifact for downstream metadata services.
  - Emit observable generation status for mock and workflow validation.
  keywords:
  - load id
  - session id
  - workflow metadata
  - identifier generation
  - runtime context
  limitations:
  - Does not register the identifier in any external metadata system.
  - Does not manage workflow scheduling or retries.
  - Idempotency depends on the selected generation strategy and supplied runtime context.
lifecycle:
  status: active
interface:
  inputs:
  - name: runtime_context
    description: Optional workflow runtime context used to derive the identifier deterministically
      when configured.
    channel: parameter
    data_type: object
    media_type: application/json
    schema_ref: schema://workflow_runtime_context/v1
    required: false
    cardinality: one
    sensitivity: internal
  outputs:
  - name: load_id
    description: Generated non-empty load/session identifier.
    channel: parameter
    data_type: string
    media_type: text/plain
    schema_ref: schema://workflow_load_id/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: generation_status
    description: Status describing generation strategy, success flag, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://workflow_load_id_generation_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: generation_strategy
    description: Identifier generation strategy.
    type: string
    required: true
    enum:
    - deterministic_hash
    - timestamp
    - uuid
  - name: prefix
    description: Optional string prefix to prepend to generated identifiers.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: workflow_load_id_non_empty
  type: json_schema
  applies_to: output
  target: load_id
  description: Generated load id must be a non-empty string.
  schema_ref: schema://workflow_load_id/v1
  expression: '{"type":"string","minLength":1}'
- contract_id: workflow_load_id_status_schema
  type: json_schema
  applies_to: output
  target: generation_status
  description: Status exposes generation outcome.
  schema_ref: schema://workflow_load_id_generation_status/v1
  expression: '{"type":"object","required":["success","generation_strategy","load_id_present"],"properties":{"success":{"type":"boolean"},"generation_strategy":{"type":"string"},"load_id_present":{"type":"boolean"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: workflow_load_id_generation_effect
  type: effect
  applies_to: service
  target: workflow_load_id_generator
  description: On success, a non-empty load_id is emitted and load_id_present is true.
  expression: generation_status.success == true implies length(load_id) > 0 and generation_status.load_id_present
    == true
invocation:
  type: argo_workflow_template
  template_name: workflow-load-id-generator-v1
