schema_version: 0.1.0
service_id: external_workflow_task_completion_sensor
version: 1.0.0
display_name: External Workflow Task Completion Sensor
category: Sensor
capability:
  summary: Checks whether a configured external workflow task/run has reached an expected
    terminal or success state for a selected logical execution and emits a completion
    decision.
  operations:
  - Resolve a bound workflow orchestrator or metadata API resource.
  - Locate a workflow run/task instance by workflow id, task id, and optional logical-date
    offset or selector.
  - Read the observed state without mutating the external workflow.
  - Emit a completion decision and diagnostics.
  keywords:
  - external task sensor
  - workflow completion
  - readiness check
  - orchestrator metadata
  - prior run
  limitations:
  - Does not implement polling cadence, timeout, retries, or dependency edges.
  - Requires a bound orchestrator metadata/API resource.
  - Does not trigger workflows; use the workflow trigger adapter separately.
lifecycle:
  status: active
interface:
  inputs:
  - name: workflow_orchestrator
    description: Workflow orchestrator metadata/API resource used to inspect external
      workflow task state.
    channel: external_resource
    data_type: object
    media_type: application/json
    schema_ref: schema://workflow_orchestrator_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: completion_decision
    description: Decision showing observed task state and whether it satisfies configured
      success criteria.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://external_workflow_task_completion_decision/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: external_workflow_id
    description: External workflow identifier to inspect.
    type: string
    required: true
  - name: external_step_id
    description: External step/task identifier to inspect.
    type: string
    required: true
  - name: execution_selector
    description: Optional selector such as execution_delta, logical date, or run id.
    type: object
    required: false
  - name: terminal_states
    description: States treated as terminal for the check.
    type: array
    required: true
  - name: success_states
    description: Subset of states treated as successful.
    type: array
    required: false
  secrets: []
contracts:
- contract_id: external_task_identity_required
  type: precondition
  applies_to: service
  target: external_workflow_task_completion_sensor
  description: External workflow and step identifiers must be non-empty.
  expression: length(trim(external_workflow_id)) > 0 and length(trim(external_step_id))
    > 0
- contract_id: external_task_completion_decision_schema
  type: json_schema
  applies_to: output
  target: completion_decision
  description: Decision exposes observed state, terminal flag, and success flag.
  schema_ref: schema://external_workflow_task_completion_decision/v1
  expression: '{"type":"object","required":["external_workflow_id","external_step_id","observed_state","terminal","succeeded"],"properties":{"external_workflow_id":{"type":"string"},"external_step_id":{"type":"string"},"observed_state":{"type":["string","null"]},"terminal":{"type":"boolean"},"succeeded":{"type":"boolean"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: external_task_sensor_effect
  type: effect
  applies_to: service
  target: external_workflow_task_completion_sensor
  description: The service reads orchestrator state and emits terminal/succeeded decisions
    without mutating workflows.
  expression: no_external_mutation
