  implementation_ref: services/implementations/regional_sales_currency_usd_converter
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  - confidential
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log raw sales rows or confidential revenue values.
  - Exchange-rate inputs must be versioned or otherwise bound deterministically for
    reproducible results.
  idempotency_notes: Same input CSV, exchange-rate table, and parameters produce the
    same converted CSV.
  default_timeout_seconds: 300
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
