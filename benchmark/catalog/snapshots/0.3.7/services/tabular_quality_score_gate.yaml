schema_version: 0.1.0
service_id: tabular_quality_score_gate
version: 1.0.0
display_name: Tabular Quality Score Gate
category: QualityCheck
capability:
  summary: Calculates configurable completeness and validity metrics for a tabular
    dataset and emits a quality decision with an overall score and route label.
  operations:
  - Read ingested tabular metadata and the referenced dataset.
  - Calculate completeness metrics.
  - Calculate validity metrics using configured rules when provided.
  - Compute an overall quality score using configured weights or defaults.
  keywords:
  - data quality
  - completeness
  - validity
  - score
  - routing decision
  - quality gate
  limitations:
  - Does not perform orchestration branching itself.
  - Business validity rules must be supplied by the caller or limited default checks
    are used.
  - Does not load or quarantine data.
lifecycle:
  status: active
interface:
  inputs:
  - name: ingested_data_object
    description: Metadata and reference for the tabular dataset to score.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://tabular_ingest_metadata/v1
    required: true
    cardinality: one
    sensitivity: pii
  outputs:
  - name: quality_decision
    description: Decision object containing quality metrics, overall score, threshold
      comparison, and route label.
    channel: artifact
    data_type: decision
    media_type: application/json
    schema_ref: schema://tabular_quality_decision/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: pass_threshold
    description: Minimum overall score required for the pass route.
    type: number
    required: true
    minimum: 0.0
    maximum: 100.0
  - name: validity_rules
    description: Optional object describing column-level validity rules.
    type: object
    required: false
  secrets: []
contracts:
- contract_id: quality_gate_input_metadata_contract
  type: precondition
  applies_to: input
  target: ingested_data_object
  description: Input must include a source URI and non-negative record count.
  schema_ref: schema://tabular_ingest_metadata/v1
  expression: exists(source_uri) and record_count >= 0
- contract_id: quality_decision_schema
  type: json_schema
  applies_to: output
  target: quality_decision
  description: Decision output exposes deterministic scoring and pass/fail route.
  schema_ref: schema://tabular_quality_decision/v1
  expression: '{"type":"object","required":["overall_score","pass_threshold","passed","route","metrics"],"properties":{"overall_score":{"type":"number","minimum":0,"maximum":100},"pass_threshold":{"type":"number","minimum":0,"maximum":100},"passed":{"type":"boolean"},"route":{"type":"string","enum":["pass","quarantine"]},"metrics":{"type":"object"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: quality_gate_decision_effect
  type: effect
  applies_to: service
  target: tabular_quality_score_gate
  description: The service emits route='pass' exactly when overall_score is greater
    than or equal to pass_threshold.
  expression: quality_decision.route == 'pass' iff quality_decision.overall_score
    >= pass_threshold
invocation:
  type: argo_workflow_template
  template_name: tabular-quality-score-gate-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.tabular_quality_score_gate
  implementation_ref: services/implementations/tabular_quality_score_gate
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - pii
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Quality diagnostics should avoid including raw PII values.
  idempotency_notes: For the same dataset and scoring rules, the same decision is
    produced.
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
