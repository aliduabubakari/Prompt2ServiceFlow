schema_version: 0.1.0
service_id: claim_risk_route_decider
version: 1.0.0
display_name: Claim Risk Route Decider
category: DomainAdapter
capability:
  summary: Routes claim risk scores to manual adjudication or auto approval.
  operations:
  - Routes claim risk scores to manual adjudication or auto approval.
  keywords:
  - claim
  - risk
  - route
  - decider
  limitations:
  - Does not infer omitted domain policy, credentials, or target configuration.
lifecycle:
  status: active
interface:
  inputs:
  - name: risk_scores
    description: Reviewed risk scores value.
    channel: artifact
    data_type: table
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: claim_route_decision
    description: Reviewed claim route decision value.
    channel: artifact
    data_type: json
    required: true
    cardinality: one
    sensitivity: internal
  - name: routing_status
    description: Reviewed routing status value.
    channel: artifact
    data_type: status
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: risk_threshold
    description: Configuration for risk threshold.
    type: number
    required: true
  - name: manual_route
    description: Configuration for manual route.
    type: string
    required: true
  - name: auto_route
    description: Configuration for auto route.
    type: string
    required: true
  secrets: []
contracts: []
invocation:
  type: argo_workflow_template
  template_name: claim-risk-route-decider
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.2.2
  command:
  - python
  - -m
  - prompt2serviceflow_services.claim_risk_route_decider
  implementation_ref: services/implementations/claim_risk_route_decider
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  default_timeout_seconds: 180
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
provenance:
  origin: curated
  owner: Prompt2ServiceFlow
  created_at: '2026-06-25T00:00:00+00:00'
  review_status: reviewed
  source_refs:
  - validation-batch-03:curated-extension
  notes:
