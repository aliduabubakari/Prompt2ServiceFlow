schema_version: 0.1.0
service_id: parquet_document_clean_standardizer
version: 1.0.0
display_name: Parquet Document Clean Standardizer
category: Transformer
capability:
  summary: Cleans and standardizes document text fields in a Parquet dataset and writes
    a cleaned Parquet artifact.
  operations:
  - Read raw document records from Parquet.
  - Apply configured text normalization rules such as lowercasing, whitespace cleanup,
    punctuation handling, stopword removal, or null filtering.
  - Preserve or map configured metadata columns.
  - Write cleaned document data to a Parquet artifact and emit transform status.
  keywords:
  - parquet
  - documents
  - text cleaning
  - standardization
  - transformer
  limitations:
  - Does not generate documents or extract keyword metrics.
  - Cleaning behavior is governed by caller-supplied rules or implementation defaults.
  - Does not validate downstream business rules.
lifecycle:
  status: active
interface:
  inputs:
  - name: raw_document_parquet
    description: Raw document Parquet dataset.
    channel: artifact
    data_type: parquet
    media_type: application/vnd.apache.parquet
    schema_ref: schema://document_parquet_dataset/v1
    required: true
    cardinality: one
    sensitivity: internal
  outputs:
  - name: cleaned_document_parquet
    description: Cleaned and standardized document dataset in Parquet format.
    channel: artifact
    data_type: parquet
    media_type: application/vnd.apache.parquet
    schema_ref: schema://cleaned_document_parquet_dataset/v1
    required: true
    cardinality: one
    sensitivity: internal
  - name: transform_status
    description: Observable cleaning status with row counts, output URI, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://document_cleaning_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: text_column
    description: Input document text column to clean.
    type: string
    required: true
  - name: output_path
    description: Deterministic cleaned Parquet output path.
    type: string
    required: true
  - name: cleaning_rules
    description: Declarative text cleaning and standardization rules.
    type: object
    required: false
  secrets: []
contracts:
- contract_id: document_cleaner_input_readable
  type: precondition
  applies_to: input
  target: raw_document_parquet
  description: Input must be readable Parquet and contain the configured text column.
  expression: readable(raw_document_parquet) and parquet_parseable(raw_document_parquet)
    and text_column in columns(raw_document_parquet)
- contract_id: document_cleaning_status_schema
  type: json_schema
  applies_to: output
  target: transform_status
  description: Status exposes cleaning outcome.
  schema_ref: schema://document_cleaning_status/v1
  expression: '{"type":"object","required":["success","rows_read","rows_written","output_uri"],"properties":{"success":{"type":"boolean"},"rows_read":{"type":"integer","minimum":0},"rows_written":{"type":"integer","minimum":0},"output_uri":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: document_cleaner_effect
  type: effect
  applies_to: service
  target: parquet_document_clean_standardizer
  description: On success, cleaned Parquet exists and rows written are reported.
  expression: transform_status.success == true implies exists(cleaned_document_parquet)
invocation:
  type: argo_workflow_template
  template_name: parquet-document-clean-standardizer-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.parquet_document_clean_standardizer
  implementation_ref: services/implementations/parquet_document_clean_standardizer
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log full document text; emit counts and bounded diagnostics.
  idempotency_notes: Same input Parquet and cleaning_rules produce the same cleaned
    output.
  default_timeout_seconds: 300
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
