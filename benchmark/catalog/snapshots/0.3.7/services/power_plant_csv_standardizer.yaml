schema_version: 0.1.0
service_id: power_plant_csv_standardizer
version: 1.0.0
display_name: Power Plant CSV Standardizer
category: Transformer
capability:
  summary: Cleans and normalizes raw power-plant CSV data into a staged canonical
    CSV using configured plant type and column mappings.
  operations:
  - Read a raw power-plant CSV artifact.
  - Apply caller-supplied column mapping and normalization rules.
  - Attach configured plant type where needed.
  - Write a cleaned canonical CSV artifact and transformation status.
  keywords:
  - power plant
  - csv
  - cleaning
  - normalization
  - nuclear
  - thermal
  - government data
  limitations:
  - Does not download source files.
  - Does not load PostgreSQL tables.
  - Canonical columns and cleaning rules must be supplied by parameters because source
    schemas may vary.
lifecycle:
  status: active
interface:
  inputs:
  - name: raw_power_plant_csv
    description: Raw nuclear or thermal power-plant CSV file.
    channel: artifact
    data_type: csv
    media_type: text/csv
    schema_ref: schema://raw_power_plant_csv/v1
    required: true
    cardinality: one
    sensitivity: public
  outputs:
  - name: clean_power_plant_csv
    description: Cleaned canonical power-plant CSV artifact.
    channel: artifact
    data_type: csv
    media_type: text/csv
    schema_ref: schema://clean_power_plant_csv/v1
    required: true
    cardinality: one
    sensitivity: public
  - name: transform_status
    description: Status with row counts, columns produced, and diagnostics.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://csv_transform_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: plant_type
    description: Logical plant type for the input file.
    type: string
    required: true
    enum:
    - nuclear
    - thermal
  - name: column_mapping
    description: Mapping from source columns to canonical output columns.
    type: object
    required: true
  - name: output_path
    description: Deterministic output artifact path or name.
    type: string
    required: true
  secrets: []
contracts:
- contract_id: power_plant_csv_readable
  type: precondition
  applies_to: input
  target: raw_power_plant_csv
  description: Input CSV must be readable and parseable with a header row.
  expression: readable(raw_power_plant_csv) and csv_parseable(raw_power_plant_csv)
- contract_id: power_plant_clean_csv_schema
  type: tabular_schema
  applies_to: output
  target: clean_power_plant_csv
  description: Cleaned CSV must contain configured canonical columns.
  schema_ref: schema://clean_power_plant_csv/v1
  expression: columns(clean_power_plant_csv) contains all values(column_mapping)
- contract_id: power_plant_transform_status_schema
  type: json_schema
  applies_to: output
  target: transform_status
  description: Status exposes deterministic transform outcome.
  schema_ref: schema://csv_transform_status/v1
  expression: '{"type":"object","required":["success","rows_read","rows_written","output_uri"],"properties":{"success":{"type":"boolean"},"rows_read":{"type":"integer","minimum":0},"rows_written":{"type":"integer","minimum":0},"output_uri":{"type":"string"},"errors":{"type":"array","items":{"type":"string"}}}}'
invocation:
  type: argo_workflow_template
  template_name: power-plant-csv-standardizer-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.power_plant_csv_standardizer
  implementation_ref: services/implementations/power_plant_csv_standardizer
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: idempotent
  data_sensitivity:
  - public
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Do not log full row contents; emit counts and bounded diagnostics.
  idempotency_notes: Same input CSV and mapping parameters produce the same cleaned
    CSV.
  default_timeout_seconds: 300
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
