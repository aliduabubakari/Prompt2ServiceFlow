schema_version: 0.1.0
service_id: temporary_resource_cleanup
version: 1.0.0
display_name: Temporary Resource Cleanup
category: Maintenance
capability:
  summary: Removes or confirms removal of configured temporary files, directories,
    or resource references and emits cleanup status.
  operations:
  - Read configured cleanup target list.
  - Delete eligible temporary files or directories when present.
  - Ignore or report missing targets according to policy.
  - Emit cleanup status with counts and errors.
  keywords:
  - cleanup
  - temporary files
  - maintenance
  - status
  limitations:
  - Only acts on explicitly configured targets or workspace-scoped temporary resources.
  - Does not clean arbitrary infrastructure resources without binding.
  - Does not model workflow merge behavior.
lifecycle:
  status: active
interface:
  inputs: []
  outputs:
  - name: cleanup_status
    description: Observable status describing cleanup action, targets processed, and
      errors.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://cleanup_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: targets
    description: Array of file paths, directories, or resource identifiers eligible
      for cleanup.
    type: array
    required: false
  - name: ignore_missing
    description: Whether missing cleanup targets should be treated as successful no-ops.
    type: boolean
    required: false
  secrets: []
contracts:
- contract_id: cleanup_targets_contract
  type: precondition
  applies_to: parameter
  target: targets
  description: If provided, cleanup targets must be explicit non-empty strings.
  expression: targets == null or all(length(t) > 0 for t in targets)
- contract_id: cleanup_status_schema
  type: json_schema
  applies_to: output
  target: cleanup_status
  description: Cleanup status exposes observable maintenance effect.
  schema_ref: schema://cleanup_status/v1
  expression: '{"type":"object","required":["success","targets_processed","targets_deleted"],"properties":{"success":{"type":"boolean"},"targets_processed":{"type":"integer","minimum":0},"targets_deleted":{"type":"integer","minimum":0},"missing_targets":{"type":"array","items":{"type":"string"}},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: cleanup_effect_contract
  type: effect
  applies_to: service
  target: temporary_resource_cleanup
  description: On success, all configured targets were deleted or acknowledged according
    to ignore_missing policy.
  expression: cleanup_status.success == true implies cleanup_status.targets_processed
    >= cleanup_status.targets_deleted
invocation:
  type: argo_workflow_template
  template_name: temporary-resource-cleanup-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.temporary_resource_cleanup
  implementation_ref: services/implementations/temporary_resource_cleanup
  mock_supported: true
policies:
  network_access: forbidden
  allowed_network_targets: []
  secret_access: forbidden
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Cleanup must be restricted to workflow-bound temporary targets to avoid destructive
    broad deletes.
  idempotency_notes: Idempotent when ignore_missing is true; otherwise reruns may
    fail on already-deleted targets.
  default_timeout_seconds: 120
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
