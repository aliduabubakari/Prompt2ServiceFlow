schema_version: 0.1.0
service_id: dataset_quarantine_zone_writer
version: 1.0.0
display_name: Dataset Quarantine Zone Writer
category: Loader
capability:
  summary: Copies or moves a tabular dataset to a configured quarantine storage location
    and emits a quarantine status for downstream validation.
  operations:
  - Read a dataset reference from an input data object.
  - Write or move the dataset to a configured quarantine zone.
  - Attach optional quarantine reason and quality-decision metadata.
  - Emit status with destination reference and action taken.
  keywords:
  - quarantine
  - data quality
  - rejected data
  - storage writer
  - status
  limitations:
  - Requires a bound quarantine destination.
  - Does not send alerts directly.
  - Does not determine quality scores.
lifecycle:
  status: active
interface:
  inputs:
  - name: ingested_data_object
    description: Metadata and reference for the dataset to quarantine.
    channel: artifact
    data_type: object
    media_type: application/json
    schema_ref: schema://tabular_ingest_metadata/v1
    required: true
    cardinality: one
    sensitivity: pii
  - name: quarantine_destination
    description: Storage resource or directory used as the quarantine zone.
    channel: external_resource
    data_type: object
    schema_ref: schema://storage_destination_resource/v1
    required: true
    cardinality: one
    sensitivity: confidential
  outputs:
  - name: quarantine_status
    description: Observable status showing whether quarantine succeeded, destination
      URI, record count, and action taken.
    channel: artifact
    data_type: status
    media_type: application/json
    schema_ref: schema://dataset_quarantine_status/v1
    required: true
    cardinality: one
    sensitivity: internal
  parameters:
  - name: action
    description: Whether to copy or move the source dataset into quarantine.
    type: string
    required: false
    enum:
    - copy
    - move
  - name: reason
    description: Human-readable quarantine reason or quality-rule summary.
    type: string
    required: false
  secrets: []
contracts:
- contract_id: quarantine_status_schema
  type: json_schema
  applies_to: output
  target: quarantine_status
  description: Quarantine status exposes destination and completion details.
  schema_ref: schema://dataset_quarantine_status/v1
  expression: '{"type":"object","required":["success","action","destination_uri","records_quarantined"],"properties":{"success":{"type":"boolean"},"action":{"type":"string","enum":["copy","move"]},"destination_uri":{"type":"string"},"records_quarantined":{"type":"integer","minimum":0},"reason":{"type":["string","null"]},"errors":{"type":"array","items":{"type":"string"}}}}'
- contract_id: quarantine_effect_contract
  type: effect
  applies_to: service
  target: dataset_quarantine_zone_writer
  description: On success, the dataset is present in the configured quarantine destination
    and status.success is true.
  expression: quarantine_status.success == true implies exists(quarantine_status.destination_uri)
invocation:
  type: argo_workflow_template
  template_name: dataset-quarantine-zone-writer-v1
  template_entrypoint: main
  image: prompt2serviceflow/runtime:0.1.0
  command:
  - python
  - -m
  - prompt2serviceflow_services.dataset_quarantine_zone_writer
  implementation_ref: services/implementations/dataset_quarantine_zone_writer
  mock_supported: true
policies:
  network_access: optional
  allowed_network_targets:
  - storage://*
  - file://*
  secret_access: optional
  retry_safe: true
  idempotency: conditionally_idempotent
  data_sensitivity:
  - pii
  - confidential
  - internal
  resources:
    cpu: 250m
    memory: 256Mi
    gpu: 0
  governance_notes:
  - Quarantined datasets may contain low-quality PII and should be access-controlled.
  - Status should not include raw record contents.
  idempotency_notes: Idempotency depends on destination naming and overwrite policy;
    deterministic destination paths are retry-safe.
  default_timeout_seconds: 240
compatibility:
  runtime:
    target: argo-workflows
    minimum_version: 3.5.0
  supported_architectures:
  - amd64
  - arm64
  incompatible_services: []
